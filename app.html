// Inline suggestions under the field: tap the empty field to see recent numbers, or start typing (e.g. 081) to see only the
// saved ones that start with it. Numbers are saved automatically after every successful purchase.
function bpAttachSuggest(type, inputId, onPick){
  const input = document.getElementById(inputId);
  if(!input || input._sugg) return;
  input._sugg = true;
  const holder = input.closest('.bps-input') || input.parentNode;
  const panel = document.createElement('div');
  panel.className = 'bps-sugg'; panel.hidden = true; panel.setAttribute('role','listbox');
  holder.parentNode.insertBefore(panel, holder.nextSibling);
  let hideTimer = null;
  const numeric = (type === 'phone' || type === 'card' || type === 'meter');
  const hl = (text, typed)=>{      // highlight the part the person has typed
    const t = String(text); const n = String(typed||'');
    return (n && t.toLowerCase().startsWith(n.toLowerCase())) ? `<mark>${escapeHtml(t.slice(0,n.length))}</mark>${escapeHtml(t.slice(n.length))}` : escapeHtml(t);
  };
  const draw = ()=>{
    const raw = input.value.trim();
    const typed = bpBenNorm(type, raw);
    const all = bpBenList(type);
    let matches = !raw ? all : all.filter(b=>{
      const v = bpBenNorm(type, b.value);
      if(v.startsWith(typed) || String(b.value).toLowerCase().startsWith(raw.toLowerCase())) return true;
      return !numeric && raw.length >= 2 && (b.label||'').toLowerCase().includes(raw.toLowerCase());   // names too, for meters/cards/betting
    });
    matches = matches.filter(b=>bpBenNorm(type, b.value) !== typed).slice(0, 8);   // nothing to suggest once it is fully typed
    if(!matches.length){ panel.hidden = true; panel.innerHTML = ''; return; }
    panel.innerHTML = `<div class="bps-sugg-h">${raw ? 'Matching saved' : 'Recently used'}</div>` + matches.map(b=>
      `<button type="button" class="bps-sugg-item" role="option" data-v="${escAttr(b.value)}"><span>${hl(b.value, typed || raw)}</span>${b.label?`<small>${escapeHtml(b.label)}</small>`:''}</button>`).join('');
    panel.hidden = false;
    panel.querySelectorAll('.bps-sugg-item').forEach(btn=>{
      btn.addEventListener('pointerdown', e=> e.preventDefault());         // keep the keyboard / focus while tapping
      btn.addEventListener('click', ()=>{
        input.value = btn.dataset.v;
        input.dispatchEvent(new Event('input', { bubbles:true }));          // updates the form exactly like typing would
        panel.hidden = true; panel.innerHTML = '';
        if(onPick) onPick(btn.dataset.v);
      });
    });
  };
  input.addEventListener('focus', ()=>{ clearTimeout(hideTimer); draw(); });
  input.addEventListener('input', draw);
  input.addEventListener('blur', ()=>{ hideTimer = setTimeout(()=>{ panel.hidden = true; }, 180); });
}
function bpBindBen(type, inputId, onPick){
  bpAttachSuggest(type, inputId, onPick);
  bpBenSync();
  // Phone fields start with the most recently used number, so nobody has to retype it.
  const first = document.getElementById(inputId);
  if(type==='phone' && first && !first.value && billForm && !billForm._phonePrefilled){
    const last = bpBenList('phone')[0];
    if(last){ billForm._phonePrefilled = true; first.value = last.value; first.dispatchEvent(new Event('input', { bubbles:true })); if(onPick) onPick(last.value); }
  }
  document.querySelectorAll(`[data-ben-chip="${type}"]`).forEach(btn=>btn.addEventListener('click', ()=>{
    const input = document.getElementById(inputId);
    if(input){ input.value = btn.dataset.v; input.dispatchEvent(new Event('input', { bubbles:true })); }
    if(onPick) onPick(btn.dataset.v);
  }));
  const link = document.querySelector(`[data-ben="${type}"]`); if(!link) return;
  link.addEventListener('click', (e)=>{
    e.preventDefault();
    const draw = ()=>{
      const list = bpBenList(type);
      const box = document.getElementById('bps-ben'); if(box) box.remove();
      const ov = document.createElement('div'); ov.className = 'bps-ben-overlay'; ov.id = 'bps-ben';
      ov.innerHTML = `<div class="bps-ben-box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><b style="font-size:19px;">Saved beneficiaries</b><button class="bps-x" id="bps-ben-close">✕</button></div>
        ${list.length ? list.map(b=>`<div class="bps-ben-item"><button class="pick" data-pick="${escAttr(b.value)}">${escapeHtml(b.value)}${b.label?`<span style="display:block;color:#9C9AC0;font-size:13px;font-weight:600;">${escapeHtml(b.label)}</span>`:''}</button><button class="rm" data-rm="${escAttr(b.value)}" aria-label="Remove">🗑</button></div>`).join('') : '<div class="bps-empty">Nothing saved yet. Numbers you buy for are saved here automatically.</div>'}
      </div>`;
      document.body.appendChild(ov);
      ov.addEventListener('click', (ev)=>{ if(ev.target === ov) ov.remove(); });
      document.getElementById('bps-ben-close').addEventListener('click', ()=>ov.remove());
      ov.querySelectorAll('[data-pick]').forEach(btn=>btn.addEventListener('click', ()=>{
        const input = document.getElementById(inputId);
        if(input){ input.value = btn.dataset.pick; input.dispatchEvent(new Event('input', { bubbles:true })); }
        ov.remove(); if(onPick) onPick(btn.dataset.pick);
      }));
      ov.querySelectorAll('[data-rm]').forEach(btn=>btn.addEventListener('click', ()=>{ bpBenRemove(type, btn.dataset.rm); draw(); }));
    };
    draw();
  });
}

/* ---------------- Plan helpers (live Bigisub data) ---------------- */
// Finds a data size like "20MB" / "1.5GB" whichever way Bigisub splits it:
// all in one field, number and unit in separate fields, or inside the plan name.
function bigisubDataSize(p){
  const full = /(\d+(?:[.,]\d+)?)\s*(TB|GB|MB|KB|G|M)(?![A-Za-z])/i;
  const fields = ['size','plan_size','data_size','plan_volume','volume','data_volume','plan_name','name','product_name','title','label','plan','data','datasize','description','variation_name','variation_code','code'];
  const vals = fields.map(k=>p && p[k]).filter(v=>v!==undefined && v!==null && String(v).trim()!=='').map(v=>String(v).trim());
  const unitOf = u=>{ u=u.toUpperCase(); return u==='G' ? 'GB' : u==='M' ? 'MB' : u; };
  // 1. a size written out anywhere ("2.5GB", "Smile 10GB", "smile-5gb") — a 0 is ignored, so a
  //    numeric field that says 0 falls through to the plan's title/description below.
  for(const v of vals){ const m = v.match(full); if(m){ const n = parseFloat(m[1].replace(',','.')); if(n > 0) return fmtDataAmount(n, unitOf(m[2])); } }
  // 2. decimals written with a hyphen in codes, like "smile-2-5gb"
  for(const v of vals){ const m = v.match(/(\d+)[-_](\d+)\s*(gb|mb)(?![a-z])/i); if(m) return fmtDataAmount(parseFloat(m[1]+'.'+m[2]), m[3].toUpperCase()); }
  // 3. number and unit in separate fields (size:"MB", plan_volume:"20")
  const num = vals.map(v=>v.match(/^(\d+(?:\.\d+)?)$/)).find(m=>m && parseFloat(m[1]) > 0);
  const unit = vals.map(v=>v.match(/^(KB|MB|GB|TB)$/i)).find(Boolean);
  if(num && unit) return fmtDataAmount(parseFloat(num[1]), unit[1].toUpperCase());
  // 4. a bare number: a low price per unit means MB, otherwise GB
  if(num){ const n = parseFloat(num[1]); const price = bigisubPlanPrice(p); return n + ((price > 0 && price/n < 20) ? 'MB' : 'GB'); }
  return '';   // nothing usable found — the caller shows the plan's name instead (never "0GB")
}
function fmtDataAmount(n, u){
  if(u==='MB' && n>=1024){ n = n/1024; u='GB'; }
  return (Math.round(n*100)/100) + u;
}
function bigisubPlanLabel(p){
  if(!p) return '';
  if(p.plantype != null || p.plan_volume != null || p.size != null){
    const size = bigisubDataSize(p); const validity = bigisubFirst(p, ['validity','plan_validity','duration']);
    if(size) return validity ? `${size} - ${validity}` : size;
  }
  const direct = bigisubFirst(p, ['product_name','name','plan_name','variation_name','plan','title','label','description']);
  if(direct) return String(direct);
  const code = bigisubFirst(p, ['variation_code','code']);
  if(code) return String(code).replace(/[-_]/g,' ');
  return 'Plan ' + (p.id!==undefined ? p.id : '');
}

// "1 day[WHAT'SAPP]" → duration "1 day" on the first line, the tag underneath.
function bpValidityParts(v){
  v = String(v == null ? '' : v).trim();
  const i = v.indexOf('[');
  if(i < 0) return { dur: v, tag: '' };
  return { dur: v.slice(0, i).trim(), tag: v.slice(i + 1).replace(/\]\s*$/, '').trim() };
}
function bpValidityHtml(v){
  const { dur, tag } = bpValidityParts(v);
  return `<div class="vl"><div class="vl-top">${BP_ICONS.clock}<span>${escapeHtml(dur)}</span></div>${tag ? `<div class="vl-tag">${escapeHtml(tag)}</div>` : ''}</div>`;
}
function bpDataBadge(type){
  const t = String(type||'').toUpperCase(); const c = BP_TYPE_COLORS[t] || { bg:'#33307A', fg:'#A9A6FF' };
  return t ? `<span class="bps-badge" style="background:${c.bg};color:${c.fg}">${escapeHtml(t)}</span>` : '';
}

// Smile / Spectranet plan text: the plan's own name first; the size (only if the name doesn't
// already say it) and the validity go underneath. A size of 0 is never shown.
function bpIspTitle(p){
  const direct = bigisubFirst(p, ['name','product_name','plan_name','title','label','variation_name','description']);
  if(direct && !/^\d+(\.\d+)?$/.test(String(direct).trim())) return String(direct).trim();
  const size = bigisubDataSize(p); if(size) return size;
  const code = bigisubFirst(p, ['variation_code','code']); if(code) return String(code).replace(/[-_]+/g,' ').trim();
  return 'Plan #' + (p && p.id !== undefined ? p.id : '');
}
function bpIspSub(p, title){
  const bits = []; const size = bigisubDataSize(p);
  if(size && !String(title).toUpperCase().replace(/\s/g,'').includes(size.toUpperCase())) bits.push(size);
  const v = bigisubFirst(p, ['validity','plan_validity','duration']); if(v) bits.push(v);
  return bits.join(' · ');
}

/* ---------------- HISTORY / REQUERY ---------------- */
// Loads once per screen visit — does NOT auto-retry on failure (see
// bindBillHistoryEvents). It used to: every failed load reset
// billHistoryLoading back to false and re-rendered, which re-triggered
// this exact same auto-load condition again, immediately — an invisible
// infinite retry loop that LOOKED like "stuck on Loading forever" since
// each failed attempt flickered back to the loading state too fast to
// ever see the real error. Now a failure is remembered (billHistoryError)
// and shown plainly instead, with a manual Retry button.
async function bpLoadHistory(){
  billHistoryLoading = true; billHistoryError = null; refreshMain();
  try{ const r = await callBigisub('list_transactions', {}); billHistory = r.transactions || []; billTopups = r.topups || []; }
  catch(e){ billHistoryError = e.message || 'Something went wrong.'; }
  billHistoryLoading = false; billHistoryLoaded = true; refreshMain();
}
// Purchases and wallet funding in one list, newest first.
function bpHistoryRows(){
  const f = billTopups.map(t=>Object.assign({}, t, { _funding:true }));
  return billHistory.concat(f).sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));

(function(){
  const NATIVE = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  const MONEY = /(price|cost|amount|paid|salary|discount|counted|(^|-)rate$)/i;
  const fmt = (v)=>{
    v = String(v==null?'':v).replace(/[^0-9.]/g,'');
    const i = v.indexOf('.');
    let int = i<0 ? v : v.slice(0,i), dec = i<0 ? null : v.slice(i+1).replace(/\./g,'');
    int = int.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return dec===null ? int : int + '.' + dec;
  };
  function enhance(el){
    if(el._money) return; el._money = true;
    try{ el.type = 'text'; }catch(_e){}
    el.setAttribute('inputmode','decimal'); el.setAttribute('autocomplete','off');
    Object.defineProperty(el, 'value', { configurable:true,
      get(){ return NATIVE.get.call(el).replace(/,/g,''); },
      set(v){ NATIVE.set.call(el, fmt(v)); } });
    NATIVE.set.call(el, fmt(NATIVE.get.call(el)));
    el.addEventListener('input', ()=>{
      const raw = NATIVE.get.call(el), pos = el.selectionStart == null ? raw.length : el.selectionStart;
      const digitsBefore = raw.slice(0,pos).replace(/,/g,'').length, f = fmt(raw);
      if(f !== raw){

        let c = 0, k = 0; for(; k<f.length && c<digitsBefore; k++){ if(f[k] !== ',') c++; }
        try{ el.setSelectionRange(k,k); }catch(_e){}
      }
    });
  }
  function scan(root){
    (root.querySelectorAll ? root.querySelectorAll('input[type="number"]') : []).forEach(el=>{ if(el.id && MONEY.test(el.id) && !/qty|reorder|pct|guest/i.test(el.id)) enhance(el); });
  }
  const start = ()=>{ scan(document); new MutationObserver(ms=>{ ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1){ if(n.matches && n.matches('input[type="number"]') && n.id && MONEY.test(n.id) && !/qty|reorder|pct|guest/i.test(n.id)) enhance(n); scan(n); } })); }).observe(document.body, { childList:true, subtree:true }); };

})();

  }

    const lines = []; R.sc.pins.forEach(pn=>{ chunk(typeof pn==='object' ? JSON.stringify(pn) : String(pn), 24).forEach(c=>lines.push(c)); });

// Token / units / PINs a purchase carries (electricity token, result-checker PINs …).
function bphSecrets(tx){
  const body = (tx && tx.bigisub_response) || {};
  const d = (body && body.data && typeof body.data === 'object') ? body.data : (body || {});
  const pinsRaw = tx.pins || d.pins || null;
  return { token: String(tx.token || d.token || '').trim(), units: String(tx.units || d.units || '').trim(),
           pins: Array.isArray(pinsRaw) ? pinsRaw : (pinsRaw ? [pinsRaw] : []), providerTid: String(d.transaction_id || d.tranx_id || '').trim() };
}
// ONE receipt: everything the details sheet and the shared/downloaded image show comes from here.
function bphReceiptData(tx){
  const m = bphModel(tx);
  const sc = bphSecrets(tx);
  const body = (tx && tx.bigisub_response) || {};
  const d = (body && body.data && typeof body.data === 'object') ? body.data : (body || {});
  let by = (typeof billTxMadeByName === 'function') ? billTxMadeByName(tx) : null;
  if(!by && String(tx.id||'').startsWith('success-')){ const u = currentUser(); by = u ? ((u.firstName||'') + ' ' + (u.lastName||'')).trim() : ''; }
  const ref = String(d.reference || tx.reference || tx.id || '').replace(/^success-/, '');
  const rows = [
    ['Recipient', tx.recipient, true],
    ['Transaction type', m.service, false],
    ['Units', sc.units, false],
    ['Payment method', 'ZeeShop Bill Wallet', false],
    ['Transaction date', tx.created_at ? fmtDateTimeFull(tx.created_at) : '', false],
    ['Reference', ref, true],
    ['Transaction ID', sc.providerTid, true],
    ['Processed by', by, false],
  ].filter(r=>r[1]!==undefined && r[1]!==null && String(r[1]).trim()!=='');
  return { m, sc, tone:m.tone, label:m.label, title:m.service, amountText:bphAmount(m), rows };
}

const otpFnUrl = () => `${SITE_CONTENT_URL}/functions/v1/send-termii-otp`;
const otpState = { loading: false, error: null, retryAfter: 0 };

function setOtpState(patch, onState) {
  Object.assign(otpState, patch);
  if (typeof onState === 'function') { try { onState({ ...otpState }); } catch (_e) {} }
}

async function callOtpFn(payload) {
  if (!navigator.onLine) return { success: false, error: 'You are offline. Connect to the internet to get a code.' };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch(otpFnUrl(), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SITE_CONTENT_ANON_KEY,
        'Authorization': 'Bearer ' + SITE_CONTENT_ANON_KEY,   // works before sign-in (signup / recovery)
      },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
    });
    const data = await res.json().catch(() => null);
    if (!data || typeof data.success !== 'boolean') return { success: false, error: 'Unexpected reply from the server. Please try again.' };
    return data;
  } catch (e) {
    return { success: false, error: e && e.name === 'AbortError' ? 'The request took too long. Please try again.' : "Couldn't reach the server. Check your internet connection and try again." };
  } finally {
    clearTimeout(timer);
  }
}

/** Ask the server to email a 6-digit code. Returns { success, error?, retry_after? }. */
async function sendOtp(userEmail, onState, purpose) {
  const email = String(userEmail || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    const error = 'Please enter a valid email address.';
    setOtpState({ loading: false, error }, onState);
    return { success: false, error };
  }
  if (otpState.loading) return { success: false, error: 'Please wait…' };
  setOtpState({ loading: true, error: null }, onState);
  const out = await callOtpFn({ action: 'send', email, purpose: purpose || 'signup' });
  setOtpState({ loading: false, error: out.success ? null : out.error, retryAfter: out.retry_after || 0 }, onState);
  return out;
}

/** Check the code the user typed. Returns { success, error? }. */
async function verifyOtp(userEmail, code, onState) {
  const email = String(userEmail || '').trim().toLowerCase();
  const clean = String(code || '').replace(/\D/g, '');
  if (clean.length !== 6) {
    const error = 'Enter the 6-digit code.';
    setOtpState({ loading: false, error }, onState);
    return { success: false, error };
  }
  if (otpState.loading) return { success: false, error: 'Please wait…' };
  setOtpState({ loading: true, error: null }, onState);
  const out = await callOtpFn({ action: 'verify', email, code: clean });
  setOtpState({ loading: false, error: out.success ? null : out.error }, onState);
  return out;
}

      }else{
        b.innerHTML = `${msgHtml()}
          <p class="subtle" style="margin:0 0 12px;">We sent a 6-digit code to <b>${escapeHtml(email)}</b>. It expires in 10 minutes.</p>
          <div class="field"><label>Verification code</label><input id="zs-otp-code" class="zs-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" ${busy?'disabled':''}></div>
          <button class="btn btn-primary" id="zs-otp-verify" ${busy?'disabled':''} style="margin-bottom:10px;">${btnLabel('Verify OTP','Verifying…')}</button>
          <div style="display:flex;justify-content:space-between;gap:10px;">
            <a href="#" id="zs-otp-resend" style="color:var(--marigold-dark);font-weight:800;${(busy||cooldown)?'opacity:.5;pointer-events:none;':''}">${cooldown ? `Resend in ${cooldown}s` : 'Resend code'}</a>
            <a href="#" id="zs-otp-change" style="color:var(--text-dim);font-weight:700;">Change email</a>
          </div>`;
        const code = $('#zs-otp-code');
        code.addEventListener('input', ()=>{ code.value = code.value.replace(/\D/g,'').slice(0,6); });
        code.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doVerify(); } });
        $('#zs-otp-verify').addEventListener('click', doVerify);
        $('#zs-otp-resend').addEventListener('click', e=>{ e.preventDefault(); doSend(); });
        $('#zs-otp-change').addEventListener('click', e=>{ e.preventDefault(); step = 1; err = ''; ok = ''; paint(); });
        if(!busy) code.focus();
      }
    }

    async function doSend(){
      if(busy) return;
      const field = $('#zs-otp-email');
      if(field) email = field.value.trim();            // always trimmed before it is sent
      busy = true; err = ''; ok = ''; paint();
      const r = await sendOtp(email, null, opts.purpose);
      busy = false;
      if(r.success){ step = 2; ok = 'Code sent ✅ Check your inbox (and spam folder).'; startCooldown(r.retry_after || 60); }
      else { err = r.error || 'Could not send the code.'; if(r.retry_after && r.retry_after <= 120) startCooldown(r.retry_after); }
      paint();
    }
    async function doVerify(){
      if(busy) return;
      const code = ($('#zs-otp-code') || {}).value || '';
      busy = true; err = ''; ok = ''; paint();
      const r = await verifyOtp(email, code);
      busy = false;
      if(r.success){
        ok = 'Email verified ✅'; paint(); toast('Email verified ✅');
        try{ if(typeof opts.onVerified === 'function') await opts.onVerified(email); }catch(_e){}
        setTimeout(()=> finish(true), 700);
        return;
      }
      err = r.error || 'Incorrect code.'; paint();
    }
    paint();
  });
}

// Make the helpers reachable from anywhere (inline handlers, console, other scripts).
window.sendOtp = sendOtp;
window.verifyOtp = verifyOtp;
window.openEmailOtpDialog = openEmailOtpDialog;

// Explicit auth options (rather than relying on library defaults) so the
// session that staff/owner get at login is reliably cached and kept fresh —
// this is what lets sync push/pull keep working across app restarts without
// anyone having to sign in again. detectSessionInUrl is TRUE specifically to
// support Google OAuth (signInWithOAuth) — it's what lets the client pick up
// the session Supabase hands back after the Google redirect lands on this
// same page. It's a no-op on a normal page load with no OAuth params in the URL.
window.sb = window.supabase.createClient(SITE_CONTENT_URL, SITE_CONTENT_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
initGoogleRedirectListener(); // must run after window.sb exists — see its definition for why
async function fetchSiteContent(section){
  const res = await fetch(`${SITE_CONTENT_URL}/rest/v1/site_content?section=eq.${section}&select=*`, {
    headers: { 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    cache: 'no-store'
  });
  if(!res.ok) throw new Error('Request failed: '+res.status);
  const rows = await res.json();
  return rows[0] || null;
}

function bindContactUsEvents(){
  const box = document.getElementById('site-content-box');
  fetchSiteContent('contact_us').then(row=>{
    if(!row){ box.innerHTML = `<div class="card"><p class="subtle">This business hasn't added contact details yet.</p></div>`; return; }
    const lines = [];
    if(row.phone) lines.push(`<div class="t2">${ICON_PHONE} <a href="tel:${escAttr(row.phone)}">${escapeHtml(row.phone)}</a></div>`);
    if(row.whatsapp) lines.push(`<div class="t2">${ICON_CHAT} <a href="https://wa.me/${row.whatsapp.replace(/[^\d]/g,'')}" target="_blank">WhatsApp: ${escapeHtml(row.whatsapp)}</a></div>`);
    if(row.email) lines.push(`<div class="t2">${ICON_MAIL} <a href="mailto:${escAttr(row.email)}">${escapeHtml(row.email)}</a></div>`);
    box.innerHTML = `<div class="card">
      <h2 style="margin:0 0 10px;color:var(--ink-text);">${escapeHtml(row.heading||'Contact Us')}</h2>
      ${row.body?`<p style="white-space:pre-wrap;line-height:1.6;margin:0 0 14px;">${escapeHtml(row.body)}</p>`:''}
      ${lines.join('')}
    </div>`;
  }).catch(()=>{
    box.innerHTML = `<div class="card"><p class="subtle">Couldn't load this right now. Check your internet connection and try again.</p></div>`;
  });
}
/* ============================================================

const FAQ_GROUPS = [
  { category: "Getting Started", items: [
    { q:"How do I create my business account?", a:"Tap Create One Free on the login screen, fill in your business and owner details, then verify your email. You can reset your password later using an emailed code, so there's no code you need to keep safe to get back in." },
    { q:"Can I install ZeeShop on my phone like a normal app?", a:"Yes. On Android (Chrome), open the browser menu and tap Install app or Add to Home Screen. On iPhone (Safari), tap Share, then Add to Home Screen, and open ZeeShop from that icon. Installed this way it opens full-screen and works offline — and on iPhone it's also required for push notifications." },
    { q:"I forgot my password — what do I do?", a:"Tap Forgot Password on the login screen and enter your username or email. We'll send a 6-digit code to the email on your account — enter it to set a new password. Because your email is locked for security (see Account Security below), the code can only ever go to the address you signed up with. If your account has no email on file, you'll need to create a new account." },
    { q:"How do multiple staff use the same device?", a:"Each staff member gets their own PIN. After the business owner logs in once, everyone unlocks their own profile with their PIN from the user-select screen — no need to log in with a password every time." },
    { q:"How do I add a new staff member?", a:"Go to More → Staff → Generate Join Code. Share the code with them; they open ZeeShop on their device, tap Join Business, and enter it. The code expires after a set number of minutes." },
    { q:"A staff member already has an account — how do they sign in on a second phone?", a:"On the new phone, tap Join Business and enter the business's Connect Code (from the Owner's Staff screen) — the app recognizes it's a reconnect and asks for their phone number and PIN instead of name details. This signs them into their existing account — it does not create a new one, so their sales history and activity stay attached to them." },
    { q:"What is the Connect Code?", a:"A permanent code (unlike the Join Code, it doesn't expire) that lets an existing staff member sign into a second device. Find or reset it under More → Staff → Staff Connect Code — only the Owner can see or regenerate it. Resetting it doesn't sign anyone out; it just retires the old code." },
    { q:"What's the difference between Master, Staff, Viewer, and Super Admin?", a:"Master is the owner with full access. Staff have specific permissions you assign (sell, add goods, record cash, etc). Viewer can only look, not act. Super Admin is a staff member you've trusted to manage specific shops on your behalf." },
    { q:"Can I use ZeeShop in another language?", a:"Yes — tap the language switcher at the bottom of the Login or Create Account screen. It supports English, Spanish, French, Arabic, Portuguese, Chinese, and Hindi, and remembers your choice on that device from then on." },
    { q:"How do I tell another shop owner about ZeeShop?", a:"Go to More → Share This App. It opens your phone's share sheet so you can send it straight to WhatsApp, SMS, email, or anywhere else." },
  ]},
  { category: "Shops & Business Setup", items: [
    { q:"Can I run more than one shop from one account?", a:"Yes. Tap the ＋ next to the shop switcher at the top to add another shop, then use the dropdown to switch between them anytime." },
    { q:"I have more than one shop — can I see which one is doing best?", a:"Yes — go to More → Compare Shops (only visible to the Owner, once you have 2 or more real shops). It ranks them side by side by revenue, profit, and sales count for Today, 7 Days, 30 Days, or This Month." },
    { q:"How do I edit a shop's name or address?", a:"Go to Settings — the Shop section lets you edit the current shop's name, address, and receipt text. Switch shops first using the dropdown at the top if you want to edit a different one." },
    { q:"How do I change my Business Type?", a:"Go to Settings → Business Type. This changes which fields show up when you add Goods — e.g. Clothing shows sizes, Spare Parts shows compatible vehicle, Hotel/Lodging unlocks the Lodging module." },
    { q:"Can I change my business's currency, country, or language later?", a:"Currency and country are set once at signup and can't be changed from within the app — contact support if you genuinely need this changed. Language is different: use the language switcher on the Login or Create Account screen anytime to change it, in English, Spanish, French, Arabic, Portuguese, Chinese, or Hindi. Right now that covers Login, Create Account, the Home screen, New Sale, and the More menu — the rest of the app still shows in English." },
    { q:"Where do I add my business registration number (like a CAC number)?", a:"Go to Settings → Registration Number. This is optional and purely for your own records — it doesn't currently appear on receipts automatically." },
    { q:"What is a Warehouse, and how do I set one up?", a:"A warehouse holds stock separately from your selling floor — for produced, imported, or bulk goods before they're moved out to a shop. Go to More → Warehouse → Create Warehouse. It gets its own stock tracking with expiry and low-stock alerts, same as any shop, but you can't ring up a sale directly from it — it's for holding stock, not selling." },
    { q:"How do I move stock from the warehouse to a shop?", a:"Go to More → Warehouse → Move to a Shop. Pick the item, how much to move, and which shop it's going to. The oldest stock moves first automatically, and the cost price and expiry date travel with it — it's not treated as a fresh, disconnected batch at the other end." },
    { q:"Does a warehouse count toward my plan's shop limit?", a:"Yes — a warehouse counts the same as any other shop toward your Free/Pro/Boss plan limit." },
    { q:"Can staff access the warehouse?", a:"Any staff member with the \"Can Add Goods\" permission can view and move stock in an existing warehouse. Only the Owner can create a new one." },
    { q:"How do I set up VAT or another tax?", a:"Go to Settings → Tax. Set the tax's name (VAT, GST, whatever applies where you are) and its percentage — it's then applied automatically wherever tax is calculated on a sale." },
    { q:"What is Dark Mode?", a:"A dark, lower-animation display style — easier on the eyes at night and lighter on battery. Toggle it under Settings → Dark Mode." },
    { q:"What is Auto-Renewal?", a:"When it's on, your Pro or Boss plan renews itself automatically using your saved payment method, so you don't have to remember to upgrade again each month or year. Turn it on when you upgrade, or off anytime from Settings — turning it off doesn't cancel your current plan, it just stops it from renewing when it expires." },
  ]},
  { category: "Sales & Goods", items: [
    { q:"How do I record a sale?", a:"Go to New Sale from the bottom nav, tap items to add them to the cart, then tap Charge to complete it. Stock is deducted automatically from the oldest batch first." },
    { q:"How do I add stock for an item I already sell?", a:"Go to Goods, tap the item, then tap Add Stock. If you bought it from a supplier, you can log it from Suppliers → tap the supplier → Log a Restock instead, which also tracks what you owe them." },
    { q:"Can I scan a barcode?", a:"Yes, three ways. Add a barcode to an item when creating it in Goods — tap Scan there to capture it with your camera, or type it in by hand. During a sale, tap Scan next to the search box to add an item straight to the cart with your camera, or type/paste the number into the search box. A dedicated USB/Bluetooth barcode scanner also works — it types the code in like a keyboard, and pressing Enter after a scan adds the matching item to the cart automatically." },
    { q:"How do sizes/colors (variants) work?", a:"For business types like Clothing & Fashion or Shoes & Bags, adding a Good lets you set up variants (e.g. sizes S/M/L) each with their own stock count, under one item." },
    { q:"What happens to stock that's about to expire?", a:"Goods flags batches expiring within 7 days. You can start a 30% Auction discount on that batch straight from the item page to move it before it goes to waste." },
    { q:"How do I give a customer group a different price?", a:"Set up Customer Groups under Customers, then add a group price when creating or editing a Good. Anyone in that group is charged that price automatically at sale time." },
    { q:"A customer returned an item — how do I process that?", a:"Open the sale from History or the customer's record, and tap Return Item(s). Choose the quantity being returned — the sale total, any balance owed, and your stock count all update automatically." },
    { q:"I made a mistake on a sale — can I cancel it?", a:"Yes, void it from the sale's detail view. A voided sale is kept for your records but no longer counts toward totals or stock." },
  ]},
  { category: "Hotel / Lodging", items: [
    { q:"How do I track food, drinks, or meat stock?", a:"The same way as any other item — through Goods. Batches with expiry dates work well for perishables like meat, drinks, and cooked food, and you'll get a low-stock or expiring alert automatically." },
    { q:"How do I set up my hotel's rooms?", a:"Set your Business Type to \"Hotel / Lodging\" in Settings, then go to More → Lodging → ＋ Add Room. Give each room a name/number, type, and rate per night." },
    { q:"How do I check a guest in?", a:"Go to More → Lodging, tap an Available room, then ＋ Check In Guest. Guest name and rate are required — everything else (ID, address, next of kin, plate number) is optional." },
    { q:"Why does the app ask for a guest's ID, next of kin, or plate number?", a:"These are optional fields meant to help with guest safety and security record-keeping. You can leave any of them blank if you don't collect that information." },
    { q:"Do ID, next-of-kin, and plate number show on the guest's receipt?", a:"No. Those details stay in your internal room record only. The shared receipt only shows the stay dates, room, and payment — never those security details." },
    { q:"How do I record a guest's payment or check them out?", a:"Tap the occupied room, then Record Payment to log any amount paid, or Check Out Guest once their stay is done. You'll get a warning first if they still have a balance." },
  ]},
  { category: "Customers & Credit", items: [
    { q:"How do I sell to a customer on credit?", a:"During a sale, choose the customer (or add a walk-in), and enter a smaller Amount Paid than the total. The rest is tracked as credit under More → Credit Ledger with a due date." },
    { q:"How do I see who owes me money?", a:"Go to More → Credit Ledger. It lists every unpaid or partly-paid sale with balances and due dates, and lets you send WhatsApp or SMS payment reminders — these open your own phone's WhatsApp/SMS app with the message pre-filled for you to send, nothing is sent automatically." },
  ]},
  { category: "Suppliers & Expenses", items: [
    { q:"What's the difference between Goods and Suppliers?", a:"Goods is your shelf inventory — what you have to sell, in batches with cost, price, and expiry. Suppliers tracks who you buy stock from and what you still owe them, separate from your sales and profit reports." },
    { q:"How do I know what I owe suppliers?", a:"Go to More → Suppliers. Each supplier shows what you owe them, and you can mark purchases as paid as you settle them." },
    { q:"How do I record business expenses like rent or transport?", a:"Go to More → Expenses and log the amount, category, and description. These are subtracted from your gross profit in Profit Reports to show real net profit." },
  ]},
  { category: "Staff & Payroll", items: [
    { q:"Can staff see everything I see?", a:"No. Staff permissions are set individually under More → Staff — you control what each person can do, like recording sales, adding goods, or handling cash. Changes take effect on their device as soon as it's next online." },
    { q:"How does a staff member reset their password?", a:"Staff don't have a password to reset — only a PIN. If they still know their current PIN, they can change it themselves under More → Privacy & Security → Change My PIN. If they've genuinely forgotten it, there's no self-service recovery — the Owner needs to go to More → Staff → tap their name → Reset PIN, then tell them the new one." },
    { q:"How do I change my own PIN?", a:"Go to More → Privacy & Security → Change My PIN. You'll need to know your current PIN to get in first — this is for when you just want a different one, not for when you're locked out." },
    { q:"Can staff request their name be changed?", a:"Yes — under My Profile, staff can submit a name change request, which shows up for the Owner to approve or deny under Staff. Nothing changes until the Owner approves it." },
    { q:"How do I record salary payments or employment letters?", a:"Go to More → Staff, tap a staff member, and you'll find options to log salary payments and generate employment/offer letters tied to their record." },
    { q:"Can I update a staff member's salary or terms later?", a:"Yes — open their Employment Record and edit it. The previous terms are automatically saved to that record's history, along with who changed it and an optional reason, so nothing about past terms is lost." },
    { q:"What is \"Record-Only\" staff?", a:"People you want to keep employment records for (like salary history) without giving them a login or access to the app itself." },
  ]},
  { category: "Reports & Receipts", items: [
    { q:"How do I see my profit, not just my revenue?", a:"Go to More → Profit Reports. It shows revenue, cost of goods sold, and expenses together so you see real profit, not just what came in." },
    { q:"How do I share a receipt with a customer or guest?", a:"Open the sale or booking, tap Share Receipt, and your phone's share sheet opens with the receipt image attached — pick WhatsApp, email, or any app you like. You can also Download it as a PNG." },
    { q:"How do I print a receipt?", a:"Open the receipt and tap Print on Bluetooth Printer to send it straight to a connected thermal receipt printer — no extra app needed. This needs a Bluetooth (not classic-Bluetooth) thermal printer, and only works on Android with Chrome, since iPhone's Safari doesn't support printer connections at all. On iPhone, or without a compatible printer, Download or Share the receipt instead (it saves as an image) and print it from your gallery, files app, or whatever app you shared it to." },
    { q:"Can I customize the text at the bottom of receipts?", a:"Yes — go to Settings and edit the Receipt Footer and Receipt Terms fields for the current shop. They appear on every sales and lodging receipt from that shop." },
    { q:"Can I put my logo on receipts?", a:"Yes — go to Settings → Business Logo to upload one. It'll appear on every receipt you generate from then on, across all your devices." },
    { q:"How do I close out my day?", a:"Go to More → Close Day (or Close My Shift for staff). It totals the day's sales and cash so you can confirm everything matches before locking it in. You can also leave a note for whoever opens next — handy for handing off between shifts." },
    { q:"What is the Audit Log?", a:"A running history of key actions across your business — restocks, payments, staff changes, check-ins — visible to the Master account under More → Audit Log." },
    { q:"What are Notes for?", a:"A place to jot down anything worth remembering for your shop — a supplier's contact, a reminder, anything. Go to More → Notes. Marking a note as a handover note also surfaces it as a banner on the Home screen for the next person who logs in, until they dismiss it." },
    { q:"Who can see, edit and delete my notes?", a:"A new note is Private by default — only you and the Boss can see it, and you can edit or delete it any time. If you tick \"Show this to the next person who logs in\" the note becomes shared: you get a warning first, and after 7 days you can no longer edit or delete it. Only the person who wrote a note can edit it. The Boss can delete any note, but only once it is 30 days old — until then the Delete button shows a lock and the date it unlocks." },
  ]},
  { category: "Home Screen", items: [
    { q:"What's the \"Today's Snapshot\" section on my Home screen?", a:"A horizontally-scrollable row of today's key numbers — Wallet Balance, Sales Today, Today's Profit (or Cash In for staff), Expenses Today, and Credit Given Today — calculated entirely from your own device. Expenses and Credit Given are only shown to the Owner." },
    { q:"What's the Wallet Balance card for?", a:"It's your Bill Payments wallet balance, shown right on Home so you always know if you can make a bill payments sale. If it's empty or not yet funded, it shows ₦0 with a Fund Wallet button so the feature stays easy to find." },
    { q:"How do I hide one of the numbers on my Home screen from view?", a:"Tap the eye icon on that card — each card (Wallet Balance, Sales, Profit, Expenses, Credit) has its own independent toggle, so you can mask just the ones you don't want visible, for example if someone's looking over your shoulder. It stays masked as you move around the app, and resets to visible again the next time you log in." },
    { q:"What are the Airtime, Data, Electricity and More tiles on Home?", a:"Shortcuts straight into Bill Payments. Airtime, Data, and Electricity jump directly to that purchase screen; More opens the full Bill Payments hub for everything else — Cable TV, Betting, Result Checker PINs, Internet (ISP), and Transaction History." },
    { q:"Where did the New Sale and Close Day buttons on Home go?", a:"New Sale still has its own tab in the bottom navigation — always one tap away. Close Day moved into More → Close Day (or Close My Shift for staff), keeping the Home screen focused on today's numbers and bill payments." },
    { q:"What's \"Recent Activity\" on my Home screen?", a:"A live feed of what your staff have been doing — sales, restocks, edits — across every device, not just the one you're holding. Only the Owner sees this." },
    { q:"What does the small dot next to the bell icon mean?", a:"It shows your sync status at a glance: green means everything's up to date, amber means changes are waiting to reach the cloud (normal if you've just gone offline), and red means something's stuck and worth checking your connection for." },
    { q:"Is there a built-in calculator?", a:"Yes — go to More → Calculator for quick math without leaving the app." },
  ]},
  { category: "Notifications & Data", items: [
    { q:"What do the alerts on the bell icon mean?", a:"The bell shows counts for stock expiring soon, low/out-of-stock items, and credit sales that are overdue or due soon — tap it to jump straight to the relevant screen. These come from In-app Alerts & Warnings; if you turn that switch off in More → Messages from ZeeShop → Notification settings, the bell count and the alert cards on Home are hidden." },
    { q:"Can I turn notifications on or off?", a:"Yes. Go to More → Messages from ZeeShop → Notification settings. There are two separate switches: Push Notifications (banners on your phone, even when ZeeShop is closed) and In-app Alerts & Warnings (low stock, expiring goods, overdue credit). Both are on by default for everyone who signs in, and they stay on until you switch them off yourself — your choice is saved to your account, so it's remembered after you sign out or change phones." },
    { q:"What are \"Messages from ZeeShop\"?", a:"Announcements and updates sent to you by the ZeeShop team. Open them from More → Messages from ZeeShop. They're saved there even if push notifications are off or you missed the banner, so you can always read them later." },
    { q:"What does the red dot on More mean?", a:"You have an unread message from ZeeShop. The dot shows on the More icon at the bottom and next to Messages from ZeeShop inside More. It disappears as soon as you open your messages — on all your devices, not just the one you're holding." },
    { q:"What's the difference between the two notification switches?", a:"Push Notifications controls banners sent to your phone's lock screen and status bar by ZeeShop. In-app Alerts & Warnings controls the low-stock, expiring-goods, and overdue-credit warnings inside the app. The Owner's choice for In-app Alerts applies to the whole business; a staff member's choice only changes what they see themselves." },
    { q:"Do my staff get notifications too?", a:"Yes — everyone who signs in, Owner, staff, or viewer, gets messages and (once allowed on their phone) push notifications. Each person controls their own Push switch. If several people share one phone, notifications go to whoever last opened ZeeShop on it." },
    { q:"Why am I not getting push notifications?", a:"Check these in order: (1) More → Messages from ZeeShop → Notification settings — is Push Notifications on? (2) Did you tap Allow when your phone or browser asked? If it says Blocked, allow notifications for ZeeShop in your phone or browser settings, then tap Check again. (3) On iPhone, ZeeShop must be added to your Home Screen first. (4) Make sure your phone isn't in a battery-saver mode that blocks notifications. You'll always still see the message under More → Messages from ZeeShop." },
    { q:"Is my data backed up anywhere?", a:"Yes. Whenever your device is online, everything syncs to the cloud automatically in the background — you don't need to do anything for this to happen. It also works fully offline; anything you do while offline is saved on your device and syncs the moment you're back online." },
    { q:"How do I export my data?", a:"Go to More → Privacy & Security → Export Data to download your business data as a spreadsheet." },
    { q:"How do I delete my business account?", a:"Go to More → Privacy & Security → Delete Business. This locks everyone (including you) out of the account immediately, and your data is permanently deleted within 30 days, per GDPR. This can't be undone once the 30 days pass — contact support right away if you tap it by mistake." },
    { q:"Why does the app say my account is suspended or scheduled for deletion?", a:"You'll see a lock screen explaining which one it is and why. A suspension means it's been paused — contact support to find out why. A scheduled deletion means someone on the account requested it — contact support immediately if that wasn't intentional." },
  ]},
  { category: "Account Security", items: [
    { q:"Can I change my email address?", a:"Not from inside the app. For your protection, the email on your account is locked and can only be changed by ZeeShop Support (a Super Admin) after they confirm it's really you. Please contact admin through More → Contact Us, and be ready to verify your business and account details." },
    { q:"Why is my email locked?", a:"Your email is where password-reset and Payment PIN codes are sent. If someone got into your account on an unlocked phone and could swap the email, they could take it over completely. Locking it means a stolen session alone can't do that. You'll also be notified at your current email if someone tries to change your phone number." },

let openFaqKey = null;
let faqSearchQuery = '';
function screenFAQ(){
  const q = faqSearchQuery.trim().toLowerCase();
  const searching = q.length > 0;
  // While actively searching, matches are shown fully expanded — the whole
  // point of searching is to skip tapping through categories one at a time,
  // so still requiring a tap per result would defeat it.
  const groups = FAQ_GROUPS.map(group => ({
    category: group.category,
    items: group.items.filter(item => !searching || item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q))
  })).filter(group => group.items.length > 0);

  return `
    ${subHeader("Help / FAQ")}
    <div class="field" style="margin-bottom:4px;">
      <input id="faq-search" placeholder="Search — e.g. \\"receipt\\", \\"credit\\", \\"staff\\"" value="${escAttr(faqSearchQuery)}">
    </div>
    <p class="subtle" style="margin-bottom:14px;">${searching ? `${groups.reduce((a,g)=>a+g.items.length,0)} result(s)` : 'Tap a question to see the answer.'}</p>
    ${groups.length===0 ? `<div class="empty"><div class="ic">${ICON_SEARCH}</div><b>No matches</b>Try a different word, or browse by scrolling — nothing here mentions "${escapeHtml(faqSearchQuery)}".</div>` : ''}
    ${groups.map((group)=>{
      const gi = FAQ_GROUPS.findIndex(g=>g.category===group.category);
      return `
      <div class="section-head"><h3>${escapeHtml(group.category)}</h3></div>
      ${group.items.map((item)=>{
        const ii = FAQ_GROUPS[gi].items.indexOf(item);
        const key = gi+'-'+ii;
        const expanded = searching || openFaqKey===key;
        return `<div class="card" data-faq-toggle="${key}" style="cursor:pointer;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div class="t1" style="font-weight:700;">${escapeHtml(item.q)}</div>
            ${!searching ? `<div style="flex-shrink:0;color:var(--text-dim);">${expanded?'−':'+'}</div>` : ''}
          </div>
          ${expanded?`<p class="subtle" style="margin-top:10px;line-height:1.5;">${escapeHtml(item.a)}</p>`:''}
        </div>`;
      }).join('')}
    `;}).join('')}
    <div class="section-head"><h3>Still stuck?</h3></div>
    <p class="subtle">Use the thumbs-down button wherever you're chatting with support to send feedback, or reach out to whoever set up your ZeeShop account.</p>
  `;
}
function bindFAQEvents(){
  document.querySelectorAll('[data-faq-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    if(faqSearchQuery.trim()) return; // while searching, everything's already expanded — nothing to toggle
    const key = el.dataset.faqToggle;
    openFaqKey = openFaqKey===key ? null : key;
    refreshMain();
  }));
  const searchInput = document.getElementById('faq-search');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      faqSearchQuery = searchInput.value;
      const cursorPos = searchInput.selectionStart;
      refreshMain();
      // refreshMain rebuilds the input from scratch — restore focus and
      // cursor position so typing doesn't get interrupted on every keystroke.
      const freshInput = document.getElementById('faq-search');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }
    });
  }
}
/* ============================================================
   WAREHOUSE — a warehouse is just a shop with isWarehouse:true,
   so it gets full batch/expiry tracking, low-stock alerts, and sync
   for free (same Goods system every shop already uses). The one
   genuinely new mechanic here is Stock Transfer: moving real
   quantity from a warehouse to a shop, carrying cost price and
   expiry over rather than creating a disconnected duplicate record.
   ============================================================ */
function screenWarehouse(){
  const warehouses = state.shops.filter(s=>s.isWarehouse);
  const activeWh = currentShop()?.isWarehouse ? currentShop() : warehouses[0];
  if(!activeWh){
    if(!isMaster()){
      return `${subHeader("Warehouse")}<div class="empty"><div class="ic">${ICON_BOX}</div><b>No warehouse set up yet</b>Ask your Owner to set one up — once they do, you'll be able to record and move stock here.</div>`;
    }
    return `${subHeader("Warehouse")}
      <div class="empty"><div class="ic">${ICON_BOX}</div><b>No warehouse set up yet</b>A warehouse holds stock separately from your shops, so you can record what's produced or imported before it's moved out to sell.</div>
      <button class="btn btn-primary" id="create-warehouse-btn" style="width:100%;margin-top:14px;">＋ Create Warehouse</button>`;
  }

  const goods = state.goods.filter(g=>g.shopId===activeWh.id && isGoodActive(g));
  const withStock = goods.filter(g=>totalStock(g)>0);
  const lowStock = goods.filter(g=>{ const s=totalStock(g); return s>0 && s<=(g.reorderLevel||5); }).length;
  const shops = state.shops.filter(s=>!s.isWarehouse);

  return `
    ${subHeader("Warehouse")}
    ${warehouses.length>1?`
      <div class="field"><label>Viewing</label>
        <select id="wh-picker">${warehouses.map(w=>`<option value="${w.id}" ${w.id===activeWh.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}</select>
      </div>`:''}
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-box"><div class="lbl">Items in Stock</div><div class="val">${withStock.length}</div></div>
      <div class="stat-box"><div class="lbl">Running Low</div><div class="val">${lowStock}</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <button class="btn btn-dark" style="flex:1;" data-goto="goods">＋ Record Stock</button>
      <button class="btn btn-outline" style="flex:1;" id="transfer-stock-btn" ${shops.length===0?'disabled':''}>↗ Move to a Shop</button>
    </div>
    <a href="#" data-goto="audit" style="display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--marigold-dark);margin:-6px 0 14px;">View Stock Activity (what came in, what moved out) →</a>
    ${shops.length===0?`<p class="subtle" style="margin:-6px 0 14px;">Add a real shop (not a warehouse) before you can move stock out.</p>`:''}
    ${withStock.length===0?`<div class="empty"><div class="ic">${ICON_INBOX_EMPTY}</div><b>Nothing in stock yet</b>Tap Record Stock to log what's arrived.</div>`:
    withStock.map(g=>`
      <div class="list-row">
        <div class="thumb">${g.emoji||'🛍️'}</div>
        <div class="info"><div class="t1">${escapeHtml(g.name)}</div><div class="t2">${totalStock(g)} in stock</div></div>
      </div>`).join('')}
  `;
}

  const picker = document.getElementById('wh-picker');
  if(picker) picker.addEventListener('change', ()=>{ state.currentShopId = picker.value; save(); render(); });
  const transferBtn = document.getElementById('transfer-stock-btn');
  if(transferBtn) transferBtn.addEventListener('click', openStockTransferModal);

function openStockTransferModal(){
  const warehouse = currentShop();
  const goods = state.goods.filter(g=>g.shopId===warehouse.id && isGoodActive(g) && totalStock(g)>0);
  const shops = state.shops.filter(s=>!s.isWarehouse);
  if(goods.length===0){ toast('Nothing in stock here to move.'); return; }
  openSheet(`
    <div class="sheet-head"><h3>Move Stock to a Shop</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:14px;">From ${escapeHtml(warehouse.name)}. Oldest stock moves first automatically.</p>
    <div class="field"><label>Item</label>
      <select id="st-good">${goods.map(g=>`<option value="${g.id}">${escapeHtml(g.name)} (${totalStock(g)} available)</option>`).join('')}</select>
    </div>

    <div class="field"><label>To Shop</label>
      <select id="st-dest">${shops.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select>
    </div>
    <button class="btn btn-primary" id="st-submit">Move Stock</button>
  `);
  document.getElementById('st-submit').addEventListener('click', submitStockTransfer);
}
function submitStockTransfer(){
  const warehouse = currentShop();
  const goodId = document.getElementById('st-good').value;
  const qty = Number(document.getElementById('st-qty').value||0);
  const destShopId = document.getElementById('st-dest').value;
  const g = state.goods.find(x=>x.id===goodId);
  if(!g){ toast('Item not found.'); return; }
  const available = totalStock(g);
  if(qty<=0 || qty>available){ toast(`Enter a quantity between 1 and ${available}.`); return; }
  const hiddenDest = state.goods.find(x=>x.shopId===destShopId && x.name.toLowerCase()===g.name.toLowerCase());
  if(hiddenDest && !isGoodActive(hiddenDest)){ toast(`${g.name} is hidden at the destination shop. Reactivate it there first, so the stock isn't moved into an item nobody can see.`); return; }

  // Deduct FEFO across the warehouse's batches — same pattern used at sale
  // time, so a transfer behaves exactly like stock actually leaving.
  let remaining = qty;
  const sourceBatches = g.batches.filter(b=>b.qtyRemaining>0).sort(batchFIFO);
  const movedFrom = []; // {batch, qtyTaken, costPrice, expiryDate}
  for(const b of sourceBatches){
    if(remaining<=0) break;
    const take = Math.min(b.qtyRemaining, remaining);
    b.qtyRemaining -= take;
    remaining -= take;
    movedFrom.push({ costPrice: b.costPrice, expiryDate: b.expiryDate, qty: take, batchId: b.id, qtyRemaining: b.qtyRemaining });
  }
  movedFrom.forEach(m=> enqueueSync('good_batches','update', { id: m.batchId, qty_remaining: m.qtyRemaining }));

  // At the destination, find a matching good by name (goods are per-shop,
  // so the same product needs its own record there) — reuse it if it
  // already exists, or create it fresh, carrying over price/cost so it's
  // not a disconnected duplicate the Boss has to manually keep in sync.
  let destGood = state.goods.find(x=>x.shopId===destShopId && x.name.toLowerCase()===g.name.toLowerCase());
  if(!destGood){
    destGood = { id: uid('good'), shopId: destShopId, name: g.name, basePrice: g.basePrice, costPrice: g.costPrice,
      emoji: g.emoji||'🛍️', groupPrices: [], barcode: g.barcode||null, reorderLevel: g.reorderLevel||5,
      hasVariants: false, batches: [] };
    state.goods.push(destGood);
    syncGoodInsert(destGood);
  }
  // One destination batch per source batch moved, so expiry dates and cost
  // prices stay accurate rather than averaging them into a single blob.
  movedFrom.forEach(m=>{
    const newBatch = { id: uid('batch'), qtyRemaining: m.qty, expiryDate: m.expiryDate, costPrice: m.costPrice,
      batchNo: 'XFER-'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null };
    destGood.batches.push(newBatch);
    enqueueSync('good_batches','insert', {
      id: newBatch.id, good_id: destGood.id, batch_no: newBatch.batchNo, qty_remaining: newBatch.qtyRemaining,
      expiry_date: newBatch.expiryDate, cost_price: newBatch.costPrice,
      auction_active: false, auction_price: null, auction_discount: null
    });
  });

  const destShop = state.shops.find(s=>s.id===destShopId);
  logAudit('stock_transfer', `Moved ${qty} x ${g.name} from ${warehouse.name} to ${destShop.name}`);
  toast(`Moved ${qty} x ${g.name} to ${destShop.name} ✅`);
  closeSheet(); render();
}

      state.supplierPurchases.push({ id: purchaseId, businessId: business().id, supplierId, shopId: state.currentShopId,
        goodId, itemName, qty, costPrice: cost, totalAmount: total, paidAmount: Math.min(paid,total),
        balance: Math.max(0, total-paid), date: todayISO(), createdByUserId: state.sessionUserId, createdAt: new Date().toISOString() });
      enqueueSync('supplier_purchases','insert', {
        id: purchaseId, business_id: business().id, supplier_id: supplierId, shop_id: state.currentShopId,
        good_id: goodId, item_name: itemName, qty, cost_price: cost, total_amount: total,
        paid_amount: Math.min(paid,total), balance: Math.max(0, total-paid), date: todayISO(),
        created_by_user_id: state.sessionUserId
      });
      logAudit('supplier_restock', `Restocked ${qty} × ${itemName} from ${name} (${fmtMoney(total)})`);
      toast('Supplier and stock added ✅');
    } else {
      toast('Supplier saved ✅');
    }
    closeSheet(); render();
  });
}
function openSupplierDetail(supplierId){
  const sup = state.suppliers.find(x=>x.id===supplierId);
  const purchases = state.supplierPurchases.filter(p=>p.supplierId===supplierId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const owed = supplierBalance(supplierId);
  openSheet(`
    <div class="sheet-head"><h3>${escapeHtml(sup.name)}</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div class="stat-box accent" style="margin-bottom:14px;"><div class="lbl">You Owe This Supplier</div><div class="val">${fmtMoney(owed)}</div></div>
    <div class="contact-btns" style="margin-bottom:14px;">
      <a href="tel:${toTelHref(sup.phone, sup.country)}">${ICON_PHONE} Call</a>
      <a href="https://wa.me/${toIntlDigits(sup.phone, sup.country)}" target="_blank">WhatsApp</a>
      ${isMaster()?`<button data-delete-supplier="${sup.id}">Delete</button>`:''}
    </div>
    <button class="btn btn-primary" id="log-restock-btn" style="width:100%;margin-bottom:14px;">＋ Log a Restock</button>
    <div class="section-head"><h3>Purchase History</h3></div>
    ${purchases.length===0?`<p class="subtle">No purchases logged yet.</p>`:purchases.map(p=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <div><b>${escapeHtml(p.itemName)}</b><div class="t2">${p.qty} × ${fmtMoney(p.costPrice)} · ${fmtDate(p.date)}</div></div>
          <div style="text-align:right;"><b>${fmtMoney(p.totalAmount)}</b></div>
        </div>
        ${p.balance>0?`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <span class="pill pill-red">${fmtMoney(p.balance)} owed</span>
          <button class="btn btn-sm btn-outline" data-pay-supplier="${p.id}">Mark Paid</button>
        </div>`:`<div style="margin-top:8px;"><span class="pill pill-green">Fully Paid</span></div>`}
      </div>`).join('')}
  `);
  document.getElementById('log-restock-btn').addEventListener('click', ()=>openLogRestockModal(supplierId));
  document.querySelectorAll('[data-delete-supplier]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!await appConfirm('Delete this supplier? Their purchase history will be kept but unlinked.')) return;
    state.suppliers = state.suppliers.filter(x=>x.id!==b.dataset.deleteSupplier);
    toast('Supplier deleted'); closeSheet(); render();
  }));
  document.querySelectorAll('[data-pay-supplier]').forEach(b=>b.addEventListener('click', async ()=>{
    const p = state.supplierPurchases.find(x=>x.id===b.dataset.paySupplier);
    const amt = Number(await appPrompt(`Amount paid (balance ${fmtMoney(p.balance)}):`, p.balance) || 0);
    if(amt<=0) return;
    p.paidAmount += amt;
    p.balance = Math.max(0, p.totalAmount - p.paidAmount);
    // Same shape as the customer credit-payment bug fixed earlier — this
    // stayed local-only, so a payment logged to one supplier here on one
    // device would still show as owed on every other device.
    enqueueSync('supplier_purchases','update', { id: p.id, paid_amount: p.paidAmount, balance: p.balance });
    logAudit('supplier_payment', `Paid ${fmtMoney(amt)} to ${sup.name}`);
    toast('Payment recorded ✅'); openSupplierDetail(supplierId);
  }));
}
function openLogRestockModal(supplierId){
  const goods = state.goods.filter(g=>g.shopId===state.currentShopId && !g.hasVariants && isGoodActive(g));
  openSheet(`
    <div class="sheet-head"><h3>Log a Restock</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:10px;">For items with sizes/colors, add stock to a specific variant from Goods → tap the item → Add Stock instead.</p>
    <div class="field"><label>Item</label>
      <select id="rs-item">
        <option value="__new__">＋ New item (not in Goods yet)</option>
        ${goods.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}
      </select>
    </div>
    <div class="field" id="rs-newname-field"><label>New Item Name</label><input id="rs-newname" placeholder="e.g. Brake Pad Set"></div>
    <div class="field" id="rs-sellprice-field"><label>Selling Price <span class="subtle">(for this new item)</span></label><input id="rs-sellprice" type="number" min="0"></div>
    <div class="row2">
      <div class="field"><label>Quantity Bought</label><input id="rs-qty" type="number" min="1" value="1"></div>
      <div class="field"><label>Cost Price (per unit)</label><input id="rs-cost" type="number" min="0"></div>
    </div>
    <div class="field"><label>Expiry Date <span class="subtle">(optional)</span></label><input id="rs-expiry" type="date"></div>
    <div class="row2">
      <div class="field"><label>Amount Paid Now</label><input id="rs-paid" type="number" min="0" value="0"></div>
      <div class="field"><label style="opacity:0;">.</label><p class="t2" style="padding-top:10px;">Rest goes to "owed"</p></div>
    </div>
    <button class="btn btn-primary" id="save-restock-btn">Save Restock</button>
  `);
  const itemSel = document.getElementById('rs-item');
  const toggleNewFields = ()=>{
    const isNew = itemSel.value==='__new__';
    document.getElementById('rs-newname-field').classList.toggle('hidden', !isNew);
    document.getElementById('rs-sellprice-field').classList.toggle('hidden', !isNew);
  };
  itemSel.addEventListener('change', toggleNewFields);
  toggleNewFields();
  document.getElementById('save-restock-btn').addEventListener('click', ()=>{
    const qty = Number(document.getElementById('rs-qty').value||0);
    const cost = Number(document.getElementById('rs-cost').value||0);
    const paid = Number(document.getElementById('rs-paid').value||0);
    const expiry = document.getElementById('rs-expiry').value || '2099-12-31';
    if(qty<=0 || cost<=0){ toast('Enter a valid quantity and cost price.'); return; }
    let goodId, itemName;
    if(itemSel.value==='__new__'){
      const name = document.getElementById('rs-newname').value.trim();
      const sellPrice = Number(document.getElementById('rs-sellprice').value||0);
      if(!name || sellPrice<=0){ toast('New items need a name and a selling price.'); return; }
      const g = { id: uid('good'), shopId: state.currentShopId, name, basePrice:sellPrice, costPrice:cost,
        emoji:'🛍️', groupPrices:[], barcode:null, reorderLevel:5,
        batches:[{id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost, batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null}] };
      state.goods.push(g);
      syncGoodInsert(g);
      goodId = g.id; itemName = name;
    } else {
      const g = state.goods.find(x=>x.id===itemSel.value);
      const newBatch = { id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost,
        batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null };
      g.batches.push(newBatch);
      g.costPrice = cost; // reflect latest purchase cost going forward
      enqueueSync('good_batches','insert', {
        id: newBatch.id, good_id: g.id, batch_no: newBatch.batchNo, qty_remaining: newBatch.qtyRemaining,
        expiry_date: newBatch.expiryDate, cost_price: newBatch.costPrice,
        auction_active: newBatch.auctionActive, auction_price: newBatch.auctionPrice, auction_discount: newBatch.auctionDiscount
      });
      enqueueSync('goods','update', { id: g.id, cost_price: g.costPrice });
      goodId = g.id; itemName = g.name;
    }
    const total = qty*cost;
    const purchaseId = uid('sp');
    state.supplierPurchases.push({ id: purchaseId, businessId: business().id, supplierId, shopId: state.currentShopId,
      goodId, itemName, qty, costPrice: cost, totalAmount: total, paidAmount: Math.min(paid,total),
      balance: Math.max(0, total-paid), date: todayISO(), createdByUserId: state.sessionUserId, createdAt: new Date().toISOString() });
    enqueueSync('supplier_purchases','insert', {
      id: purchaseId, business_id: business().id, supplier_id: supplierId, shop_id: state.currentShopId,
      good_id: goodId, item_name: itemName, qty, cost_price: cost, total_amount: total,
      paid_amount: Math.min(paid,total), balance: Math.max(0, total-paid), date: todayISO(),
      created_by_user_id: state.sessionUserId
    });
    logAudit('supplier_restock', `Restocked ${qty} × ${itemName} from supplier (${fmtMoney(total)})`);
    toast('Restock logged and stock added ✅'); closeSheet(); render();
  });
}


/* ============================================================
   BARCODE / QR SCANNER — camera-based, via html5-qrcode (CDN).
   100% client-side: no server calls, no API key, nothing billed.
   ============================================================ */
let _scannerInstance = null;
function openBarcodeScanner(onResult){
  if(typeof Html5Qrcode === 'undefined'){
    toast("Scanner didn't load — check your connection and try again.");
    return;
  }
  openSheet(`
    <div class="sheet-head"><h3>${ICON_SEARCH} Scan Barcode</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:10px;">Point the camera at the barcode or QR code on the item.</p>
    <div id="scanner-viewport" style="width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:260px;"></div>
    <p class="subtle" id="scanner-status" style="margin-top:10px;text-align:center;">Starting camera…</p>
    <div class="field" style="margin-top:14px;">
      <label>Or type the code manually</label>
      <div style="display:flex;gap:8px;">
        <input id="scanner-manual" placeholder="Type barcode" style="flex:1;">
        <button class="btn btn-outline btn-sm" id="scanner-manual-go">Use</button>
      </div>
    </div>
  `);
  const finish = (code)=>{
    stopScanner();
    closeSheet();
    onResult(code);
  };
  const manualGo = document.getElementById('scanner-manual-go');
  const manualInput = document.getElementById('scanner-manual');
  if(manualGo) manualGo.addEventListener('click', ()=>{
    const v = manualInput.value.trim();
    if(v) finish(v);
  });
  const statusEl = document.getElementById('scanner-status');
  _scannerInstance = new Html5Qrcode('scanner-viewport');
  _scannerInstance.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText)=>{ finish(decodedText); },
    ()=>{ /* per-frame scan miss — expected constantly while aiming, ignore */ }
  ).catch(()=>{
    if(statusEl) statusEl.textContent = "Couldn't access the camera — check permissions, or type the code below instead.";
  });
}
function stopScanner(){
  if(_scannerInstance){
    try{ _scannerInstance.stop().then(()=>_scannerInstance.clear()).catch(()=>{}); }catch(e){}
    _scannerInstance = null;
  }
}

function openSheet(html){
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id='active-overlay';
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) closeSheet(); });
  const x = document.getElementById('sheet-close');
  if(x) x.addEventListener('click', closeSheet);
  bindPasswordToggles();
}
function closeSheet(){
  stopScanner();
  const ov = document.getElementById('active-overlay');
  if(ov) ov.remove();
}

/* ============================================================
   INIT — seed a little demo data on very first run for master, for UX
   ============================================================ */
render();

// Mobile browsers (Chrome Custom Tabs especially) very often restore a
// backgrounded tab from the back-forward cache (bfcache) instead of doing
// a real reload — meaning none of the JS above re-runs, and whatever was
// on screen (and any in-flight timer, like a toast's auto-dismiss) is
// frozen exactly as it was and can reappear looking "stuck." That's how a
// leftover "Welcome back, X!" toast can end up hovering over the login
// screen on reopen even though nobody is actually logged in — it's a
// real toast from a previous session that never got cleaned up, not a
// fresh (and wrong) greeting. On a genuine bfcache restore, clear any
// stray toast and force a full re-render from current state so the
// screen always reflects reality rather than a frozen snapshot.
window.addEventListener('pageshow', (event)=>{
  if(!event.persisted) return;
  const staleToast = document.getElementById('toast');
  if(staleToast) staleToast.remove();
  render();
});

// Retry any audit log entries that failed to push last time — on
// reconnect, periodically, and once now in case some are left over from
// a previous session that ended before they could go out.
window.addEventListener('online', flushAuditPushQueue);
setInterval(flushAuditPushQueue, 30000);
flushAuditPushQueue();
