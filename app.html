function getContactPhone(person){ return person.phone || ''; }
function getContactEmail(person){ return person.email || person.contactEmail || ''; }

function openEmploymentLetterModal(userId){
  const u = personById(userId);
  const rec = employmentRecordFor(userId);
  if(!u || !rec) return;
  openSheet(`
    <div class="sheet-head"><h3>${rec.employmentType==='apprentice'?'Apprenticeship Agreement':'Employment Letter'}</h3><button class="close-x" id="sheet-close">✕</button></div>
    <div class="card">
      <div class="t1" style="margin-bottom:10px;">Contact Info for ${u.firstName}</div>
      <div class="field"><label>Phone</label><input id="el-phone" value="${escAttr(getContactPhone(u))}" placeholder="0802 730 0375 or +234..."></div>
      <div class="field" style="margin-bottom:8px;"><label>Email</label><input id="el-email" type="email" value="${escAttr(getContactEmail(u))}"></div>
      <button class="btn btn-outline btn-sm" id="save-contact-btn">Save Contact Info</button>
    </div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;margin:14px 0;">
      <canvas id="letter-canvas" style="max-width:100%;height:auto;display:block;"></canvas>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:6px;">
      <button class="btn btn-primary" id="share-letter-img" style="flex:1;">📤 Share</button>
      <button class="btn btn-outline" id="download-letter-img" style="flex:1;">⬇️ Download</button>
    </div>
    <p class="subtle" style="margin-bottom:14px;">Share opens your phone's share sheet with the document image — pick WhatsApp, Email, or any app there.</p>
  `);
  const canvas = document.getElementById('letter-canvas');
  drawEmploymentLetterToCanvas(canvas, u, rec);

  document.getElementById('save-contact-btn').addEventListener('click', ()=>{
    const phoneRaw = document.getElementById('el-phone').value.trim();
    const email = document.getElementById('el-email').value.trim();
    u.phone = phoneRaw ? '+'+toIntlDigits(phoneRaw) : '';
    if(state.recordOnlyStaff.includes(u)) u.email = email; else u.contactEmail = email;
    logAudit('contact_updated', `Updated contact info for ${u.firstName} ${u.lastName}`);
    toast('Contact info saved ✅');
    openEmploymentLetterModal(userId);
  });
  const markSent = (type)=>{ logAudit('letter_sent', `${rec.employmentType==='apprentice'?'Agreement':'Letter'} sent to ${u.firstName} ${u.lastName} via ${type}`); };
  document.getElementById('share-letter-img').addEventListener('click', ()=>{
    canvas.toBlob(async blob=>{
      if(!blob){ toast('Could not generate the document image.'); return; }
      const file = new File([blob], `${rec.employmentType==='apprentice'?'agreement':'letter'}-${u.firstName}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title: business().name}); markSent('image share'); }
        catch(e){ /* user cancelled — not an error */ }
      } else {
        toast("This browser can't share images directly — tap Download, then attach the file manually.");
      }
    }, 'image/png');
  });
  document.getElementById('download-letter-img').addEventListener('click', ()=>{
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${rec.employmentType==='apprentice'?'agreement':'letter'}-${u.firstName}.png`; a.click();
      URL.revokeObjectURL(url);
      markSent('download');
    }, 'image/png');
  });
}

function employmentLetterBodyLines(u, rec){
  const fullName = u.firstName+' '+u.lastName;
  const bizName = business().name;
  const isApprentice = rec.employmentType==='apprentice';
  const lines = [];
  lines.push(`Date: ${fmtDate(todayISO())}`);
  lines.push('');
  lines.push(`To: ${fullName}`);
  lines.push('');
  lines.push(isApprentice ? `RE: APPRENTICESHIP AGREEMENT` : `RE: LETTER OF EMPLOYMENT`);
  lines.push('');
  if(isApprentice){
    lines.push(`This letter confirms that ${fullName} began an apprenticeship with ${bizName} on ${fmtDate(rec.resumptionDate)}.`);
    if(rec.salaryFrequency!=='none' && rec.salaryAmount>0){
      lines.push(`During the apprenticeship, an upkeep/allowance of ${fmtMoneyCanvas(rec.salaryAmount)} (${rec.salaryFrequency}) applies.`);
    }
    if(rec.settlementDate){
      lines.push(`The expected settlement (freedom) date is ${fmtDate(rec.settlementDate)}.`);
    }
    if(rec.settlementTerms){
      lines.push(`Settlement terms: ${rec.settlementTerms}.`);
    }
  } else {
    lines.push(`This letter confirms that ${fullName} resumed work with ${bizName} on ${fmtDate(rec.resumptionDate)}.`);
    if(rec.salaryFrequency!=='none' && rec.salaryAmount>0){
      lines.push(`Salary: ${fmtMoneyCanvas(rec.salaryAmount)} (${rec.salaryFrequency}).`);
    } else {
      lines.push(`This role does not carry a fixed salary.`);
    }
  }
  if(rec.notes){ lines.push(''); lines.push(`Additional notes: ${rec.notes}`); }
  lines.push('');
  lines.push(`This document was generated from ${bizName}'s records and reflects the information on file as of the date above.`);
  return lines;
}
function layoutAndDrawLetter(u, rec, ctx){
  const W = 380, PAD = 26;
  const bodyLines = employmentLetterBodyLines(u, rec);
  let y = 34;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  const shop = currentShop();
  if(shop && shop.address){ T(shop.address, W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14; }
  y += 10;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;

  bodyLines.forEach(line=>{
    if(line===''){ y += 8; return; }
    const isHeading = line.startsWith('RE:');
    const wrapped = wrapPlainText(canvasSafeText(line), 46);
    wrapped.forEach(w=>{
      T(w, PAD, 'left', isHeading ? '700 12.5px Arial,Helvetica,sans-serif' : '400 12px Arial,Helvetica,sans-serif', isHeading ? '#12213B' : '#242B38');
      y += isHeading ? 18 : 17;
    });
  });
  y += 20;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;
  T('_____________________', PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('For ' + business().name, PAD, 'left', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  y += 30;
  return y;
}
function drawEmploymentLetterToCanvas(canvas, u, rec){
  const W = 380, scale = 2;
  const h = layoutAndDrawLetter(u, rec, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawLetter(u, rec, ctx);
}

function offerLetterBodyLines(offer){
  const fullName = offer.firstName+' '+offer.lastName;
  const bizName = business().name;
  const isApprentice = offer.employmentType==='apprentice';
  const lines = [];
  lines.push(`Date: ${fmtDate(todayISO())}`);
  lines.push('');
  lines.push(`To: ${fullName}`);
  lines.push('');
  lines.push(isApprentice ? `RE: OFFER OF APPRENTICESHIP — ${offer.role}` : `RE: OFFER OF EMPLOYMENT — ${offer.role}`);
  lines.push('');
  lines.push(`We are pleased to inform you that you have been selected for the position of ${offer.role} at ${bizName}.`);
  lines.push('');
  lines.push(`Kindly resume duty on ${fmtDate(offer.resumptionDate)}.`);
  if(offer.salaryFrequency!=='none' && offer.salaryAmount>0){
    lines.push(isApprentice
      ? `Your upkeep/allowance will be ${fmtMoneyCanvas(offer.salaryAmount)} (${offer.salaryFrequency}).`
      : `Your salary will be ${fmtMoneyCanvas(offer.salaryAmount)} (${offer.salaryFrequency}).`);
  }
  if(offer.settlementTerms){ lines.push(`Settlement terms (on completion): ${offer.settlementTerms}.`); }
  if(offer.notes){ lines.push(''); lines.push(offer.notes); }
  lines.push('');
  lines.push(`Please confirm your acceptance by contacting us before your resumption date.`);
  lines.push('');
  lines.push(`We look forward to having you on our team.`);
  return lines;
}
function layoutAndDrawOfferLetter(offer, ctx){
  const W = 380, PAD = 26;
  const bodyLines = offerLetterBodyLines(offer);
  let y = 34;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  const shop = currentShop();
  if(shop && shop.address){ T(shop.address, W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14; }
  y += 10;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;

  bodyLines.forEach(line=>{
    if(line===''){ y += 8; return; }
    const isHeading = line.startsWith('RE:');
    const wrapped = wrapPlainText(canvasSafeText(line), 46);
    wrapped.forEach(w=>{
      T(w, PAD, 'left', isHeading ? '700 12.5px Arial,Helvetica,sans-serif' : '400 12px Arial,Helvetica,sans-serif', isHeading ? '#12213B' : '#242B38');
      y += isHeading ? 18 : 17;
    });
  });
  y += 20;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;
  T('_____________________', PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('For ' + business().name, PAD, 'left', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  y += 30;
  return y;
}
function drawOfferLetterToCanvas(canvas, offer){
  const W = 380, scale = 2;
  const h = layoutAndDrawOfferLetter(offer, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawOfferLetter(offer, ctx);
}

function bindStaffEvents(){

const FLW_PUBLIC_KEY = 'FLWPUBK-5125776fe796c3160589ef913919a973-X';

async function fetchPricingForBusiness(){
  const b = business();
  const bizCurrency = (b && b.currency) || 'USD';
  const currency = ['NGN','GHS','GBP','EUR'].includes(bizCurrency) ? bizCurrency : 'USD';
  const CURRENCY_SYMBOLS = { NGN:'₦', GHS:'GH₵', GBP:'£', EUR:'€', USD:'$' };
  try{
    const res = await fetch(`${SITE_CONTENT_URL}/rest/v1/pricing?currency=eq.${currency}&select=*`, {
      headers: { 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY }
    });
    if(!res.ok) return null;
    const rows = await res.json();
    const get = (plan, interval) => {
      const row = rows.find(r=>r.plan===plan && r.interval===interval);
      return row ? row.amount : 0;
    };
    const symbol = CURRENCY_SYMBOLS[currency] || currency;
    return {
      currency, symbol,
      proMonthly: get('pro','monthly'), proYearly: get('pro','yearly'),
      bossMonthly: get('boss','monthly'), bossYearly: get('boss','yearly')
    };
  }catch(e){ return null; }
}

function launchCheckout(plan, interval, amount, currency){
  if(!navigator.onLine){ toast('You need an internet connection to upgrade your plan.'); return; }
  const u = currentUser();
  const txRef = 'zed_' + uid('txn');
  FlutterwaveCheckout({
    public_key: FLW_PUBLIC_KEY,
    tx_ref: txRef,
    amount: amount,
    currency: currency,
    payment_options: 'card',
    customer: {
      email: (u && u.email) || 'customer@zed.app',
      name: (u ? (u.firstName+' '+(u.lastName||'')) : 'Zed Customer')
    },
    customizations: {
      title: 'Zed ' + (plan==='pro' ? 'Pro' : 'Boss'),
      description: (plan==='pro'?'Pro':'Boss') + ' plan — ' + interval + ' billing'
    },
    callback: function(response){
      if(response && (response.status === 'successful' || response.status === 'completed')){
        verifyAndApplyPayment(response.transaction_id, plan, interval, amount, currency);
      } else {
        toast('Payment was not completed.');
      }
    },
    onclose: function(){ /* user closed the checkout without paying — no action needed */ }
  });
}

async function verifyAndApplyPayment(transactionId, plan, interval, amount, currency){
  toast('Confirming payment…');
  try{
    const { data: sessionData } = await window.sb.auth.getSession();
    const token = sessionData.session ? sessionData.session.access_token : null;
    if(!token){
      toast('Payment received, but you need to log in online once to activate the plan — please log in again with internet on.');
      return;
    }
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/verify-payment`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ transaction_id: transactionId, plan, interval, expected_amount: amount, expected_currency: currency })
    });
    const result = await res.json();
    if(result.verified){
      business().subscriptionPlan = plan;
      business().subscriptionExpiresAt = result.expires_at;
      logAudit('subscription','Upgraded to '+plan+' ('+interval+')');
      closeSheet();
      render();
      toast('Payment confirmed — you\'re now on the '+(plan==='pro'?'Pro':'Boss')+' plan!');
    } else {
      toast('Payment could not be verified: '+(result.error||'please contact support.'));
    }
  }catch(e){
    toast('Could not confirm payment — if you were charged, please contact support.');
  }
}
function exportCSV(){
  const rows = [['Sale ID','Date','Customer','Subtotal','Paid','Balance','Status','Sold By']];
  state.sales.filter(s=>s.shopId===state.currentShopId).forEach(s=>{
    const cust = state.customers.find(c=>c.id===s.customerId);
    const seller = state.users.find(u=>u.id===s.soldByUserId);
    rows.push([s.id, s.date, cust?cust.fullName:'Walk-in', s.subtotal, s.paidAmount, s.balance, s.status, seller?seller.firstName:'']);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='dukapro_sales_export.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Export downloaded ✅');
}

/* ============================================================
   SALES HISTORY — browse past sales, void a mistaken sale,
   or process a partial/full return.
   ============================================================ */
let historyFilter = 'all'; // all | sale | credit | voided | supplier | expense
let historyDateFilter = '';
let __lastHistoryEvents = [];
function screenHistory(){
  const shopId = state.currentShopId;
  const events = [];

  state.sales.filter(s=>s.shopId===shopId).forEach(s=>{
    const cust = s.customerId ? state.customers.find(c=>c.id===s.customerId) : null;
    const buyerName = cust ? cust.fullName : (s.walkInName || 'Walk-in customer');
    const isVoided = s.status==='voided';
    const type = isVoided ? 'voided' : (s.status==='paid' ? 'sale' : 'credit');
    events.push({
      type, sourceId: s.id, date: s.date, sortAt: s.createdAt,
      title: buyerName, subtitle: `#${s.id.slice(-6).toUpperCase()} · Sale`,
      amount: s.subtotal, pill: isVoided?`<span class="pill pill-gray">VOIDED</span>`:s.status==='paid'?`<span class="pill pill-green">Paid</span>`:`<span class="pill pill-red">${s.status}</span>`,
      onClick: ()=>openSaleDetail(s.id), dim: isVoided
    });
  });

  state.supplierPurchases.filter(p=>p.shopId===shopId).forEach(p=>{
    const sup = state.suppliers.find(x=>x.id===p.supplierId);
    events.push({
      type:'supplier', sourceId: p.id, date: p.date, sortAt: p.createdAt,
      title: sup ? sup.name : 'Unknown supplier', subtitle: `${p.itemName} × ${p.qty} · Restock`,
      amount: p.totalAmount, pill: p.balance>0?`<span class="pill pill-red">Owe ${fmtMoney(p.balance)}</span>`:`<span class="pill pill-green">Paid</span>`,
      onClick: sup ? (()=>openSupplierDetail(sup.id)) : null
    });
  });

  state.expenses.filter(e=>e.shopId===shopId).forEach(e=>{
    events.push({
      type:'expense', sourceId: e.id, date: e.date, sortAt: e.date,
      title: e.description || e.category, subtitle: `${e.category} · Expense`,
      amount: e.amount, pill: `<span class="pill pill-gray">Expense</span>`, onClick: null
    });
  });

  let filtered = events;
  if(historyFilter!=='all') filtered = filtered.filter(e=>e.type===historyFilter);
  if(historyDateFilter) filtered = filtered.filter(e=>e.date===historyDateFilter);
  filtered.sort((a,b)=>new Date(b.sortAt)-new Date(a.sortAt));
  filtered = filtered.slice(0,150);
  __lastHistoryEvents = filtered;

  const filterOptions = [
    {id:'all', label:'All'}, {id:'sale', label:'Sales'}, {id:'credit', label:'Credit'},
    {id:'voided', label:'Voided'}, {id:'supplier', label:'Supplier'}, {id:'expense', label:'Expenses'}
  ];
  const typeIcon = {sale:'🧾', credit:'📒', voided:'🚫', supplier:'🚚', expense:'💸'};

  return `
    ${subHeader("History")}
    <div class="field">
      <label>Search by Date</label>
      <div style="display:flex;gap:8px;">
        <input type="date" id="history-date-search" value="${historyDateFilter}" style="flex:1;">
        ${historyDateFilter?`<button class="btn btn-outline btn-sm" id="clear-history-date">Clear</button>`:''}
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
      ${filterOptions.map(f=>`<button class="btn btn-sm ${historyFilter===f.id?'btn-dark':'btn-outline'}" data-hfilter="${f.id}">${f.label}</button>`).join('')}
    </div>
    ${filtered.length>0?`<button class="btn btn-outline btn-sm" id="share-history-btn" style="margin-bottom:12px;">📤 Share This List (${filtered.length})</button>`:''}
    ${filtered.length===0? `<div class="empty"><div class="ic">🧾</div><b>Nothing here</b>Try a different filter or date.</div>` :
    filtered.map((e,i)=>`
      <div class="card" ${e.onClick?`data-hist-idx="${i}" style="cursor:pointer;${e.dim?'opacity:0.55;':''}"`:`style="${e.dim?'opacity:0.55;':''}"`}>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="display:flex;gap:10px;align-items:flex-start;">
            <div style="font-size:17px;">${typeIcon[e.type]}</div>
            <div>
              <div class="t1">${escapeHtml(e.title)}</div>
              <div class="t2">${e.subtitle} · ${fmtDate(e.date)}</div>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <b>${fmtMoney(e.amount)}</b><br>${e.pill}
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;">
          <button data-share-hist-idx="${i}" style="background:none;border:none;color:var(--marigold-dark);font-size:12px;font-weight:700;padding:2px 0;">📤 Share</button>
        </div>
      </div>`).join('')}
  `;
}

  const dateInput = document.getElementById('history-date-search');

/* ============================================================
   SHARE HISTORY — generates a shareable summary image of
   whatever's currently filtered/dated in the History screen.
   ============================================================ */
const HISTORY_TYPE_LABELS = {sale:'SALE', credit:'CREDIT', voided:'VOIDED', supplier:'SUPPLIER', expense:'EXPENSE'};
function openHistoryShareModal(){
  const filterOptions = [
    {id:'all', label:'All'}, {id:'sale', label:'Sales'}, {id:'credit', label:'Credit'},
    {id:'voided', label:'Voided'}, {id:'supplier', label:'Supplier'}, {id:'expense', label:'Expenses'}
  ];
  const filterLabel = (filterOptions.find(f=>f.id===historyFilter)||{}).label || 'All';
  const dateLabel = historyDateFilter ? fmtDate(historyDateFilter) : 'All Time';
  openSheet(`
    <div class="sheet-head"><h3>Share History</h3><button class="close-x" id="sheet-close">✕</button></div>
    <p class="subtle" style="margin-bottom:14px;">Shows the ${filterLabel} filter, ${dateLabel} — same as what's currently on screen. <b>Share</b> sends each item below as its own separate image (up to 10 at a time). <b>Download</b> saves one combined summary picture instead.</p>
    <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;margin-bottom:14px;">
      <canvas id="history-canvas" style="max-width:100%;height:auto;display:block;"></canvas>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="share-history-img" style="flex:1;">📤 Share</button>
      <button class="btn btn-outline" id="download-history-img" style="flex:1;">⬇️ Download</button>
    </div>
  `);
  const canvas = document.getElementById('history-canvas');
  drawHistoryToCanvas(canvas, filterLabel, dateLabel);
  const MAX_SHARE_ITEMS = 10;
  document.getElementById('share-history-img').addEventListener('click', async ()=>{
    const events = __lastHistoryEvents;
    if(events.length===0){ toast('Nothing to share.'); return; }
    if(events.length > MAX_SHARE_ITEMS){
      toast(`That's ${events.length} items — narrow your filter or date to ${MAX_SHARE_ITEMS} or fewer to share them individually.`);
      return;
    }
    const shareBtn = document.getElementById('share-history-img');
    shareBtn.disabled = true; shareBtn.textContent = 'Preparing…';
    try{
      const files = await buildIndividualHistoryFiles(events);
      if(files.length===0){ toast('Could not generate the images.'); return; }
      if(navigator.canShare && navigator.canShare({files})){
        try{ await navigator.share({files, title: business().name+' — History'}); logAudit('history_shared', `Shared ${files.length} item(s) individually (${filterLabel}, ${dateLabel})`); }
        catch(e){ /* user cancelled — not an error */ }
      } else {
        toast("This browser can't share multiple images at once — try Download for a single summary instead.");
      }
    } finally {
      shareBtn.disabled = false; shareBtn.textContent = '📤 Share';
    }
  });
  document.getElementById('download-history-img').addEventListener('click', ()=>{
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`history-${todayISO()}.png`; a.click();
      URL.revokeObjectURL(url);
      logAudit('history_downloaded', `Downloaded history (${filterLabel}, ${dateLabel})`);
    }, 'image/png');
  });
}
function layoutAndDrawHistory(filterLabel, dateLabel, ctx){
  const W = 380, PAD = 22;
  const MAX_ROWS = 60;
  const events = __lastHistoryEvents.slice(0, MAX_ROWS);
  const truncated = __lastHistoryEvents.length > MAX_ROWS;
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  T(currentShop() ? currentShop().name : '', W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14;
  T('History — '+filterLabel+' · '+dateLabel, W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 18;
  L(PAD, y, W-PAD, y); y += 20;

  events.forEach(e=>{
    const tag = '['+(HISTORY_TYPE_LABELS[e.type]||'')+']';
    T(tag, PAD, 'left', '700 9px Arial,Helvetica,sans-serif', '#9AA0AB');
    const nameWrapped = wrapPlainText(canvasSafeText(e.title), 28);
    T(nameWrapped[0]||'', PAD+38, 'left', '400 12px Arial,Helvetica,sans-serif', e.dim?'#B0B0B0':'#242B38');
    T(fmtMoneyCanvas(e.amount), W-PAD, 'right', '700 12px Arial,Helvetica,sans-serif', e.dim?'#B0B0B0':'#242B38');
    y += 15;
    T(canvasSafeText(e.subtitle)+' · '+fmtDate(e.date), PAD+38, 'left', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    y += 18;
  });
  if(truncated){
    T(`+ ${__lastHistoryEvents.length - MAX_ROWS} more not shown — see full history in the app`, PAD, 'left', 'italic 400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    y += 18;
  }
  L(PAD, y, W-PAD, y); y += 20;

  // Per-type subtotals (voided sales excluded — they don't count toward money totals)
  const totals = {};
  __lastHistoryEvents.forEach(e=>{
    if(e.type==='voided') return;
    totals[e.type] = (totals[e.type]||0) + e.amount;
  });
  T('SUMMARY', PAD, 'left', '700 10px Arial,Helvetica,sans-serif', '#9AA0AB'); y += 16;
  Object.keys(HISTORY_TYPE_LABELS).forEach(type=>{
    if(type==='voided' || !totals[type]) return;
    T(HISTORY_TYPE_LABELS[type], PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#242B38');
    T(fmtMoneyCanvas(totals[type]), W-PAD, 'right', '700 11.5px Arial,Helvetica,sans-serif', '#12213B');
    y += 17;
  });
  y += 10;
  T('Generated '+fmtDate(todayISO()), W/2, 'center', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
  y += 20;
  return y;
}
function drawHistoryToCanvas(canvas, filterLabel, dateLabel){
  const W = 380, scale = 2;
  const h = layoutAndDrawHistory(filterLabel, dateLabel, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawHistory(filterLabel, dateLabel, ctx);
}

// A simple standalone card for entry types that don't have their own full
// document format (supplier restocks, expenses) — used when sharing one by one.
function layoutAndDrawSingleCard(event, ctx){
  const W = 380, PAD = 24;
  let y = 32;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };
  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 18;
  T('['+(HISTORY_TYPE_LABELS[event.type]||'')+']', W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 18;
  L(PAD, y, W-PAD, y); y += 22;
  wrapPlainText(canvasSafeText(event.title), 40).forEach(line=>{
    T(line, PAD, 'left', '700 14px Arial,Helvetica,sans-serif', '#12213B'); y += 19;
  });
  wrapPlainText(canvasSafeText(event.subtitle), 44).forEach(line=>{
    T(line, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 15;
  });
  T(fmtDate(event.date), PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 20;
  L(PAD, y, W-PAD, y); y += 24;
  T('AMOUNT', PAD, 'left', '700 10px Arial,Helvetica,sans-serif', '#9AA0AB');
  T(fmtMoneyCanvas(event.amount), W-PAD, 'right', '800 15px Arial,Helvetica,sans-serif', '#12213B');
  y += 24;
  return y;
}
function drawSingleCardToCanvas(canvas, event){
  const W = 380, scale = 2;
  const h = layoutAndDrawSingleCard(event, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawSingleCard(event, ctx);
}
// Builds one File (image) per history entry — real receipts for sales/credit/
// voided sales, simple cards for everything else — so sharing sends each
// transaction as its own message/attachment instead of one bundled image.
// Draws a single history entry to a canvas — a real receipt for sales/credit/
// voided sales, or a simple card for supplier/expense entries. Shared by both
// the per-entry Share button and the "share whole list individually" action.
async function drawHistoryItemToCanvas(canvas, e){
  if(e.type==='sale' || e.type==='credit' || e.type==='voided'){
    const s = state.sales.find(x=>x.id===e.sourceId);
    if(s){
      const shop = state.shops.find(x=>x.id===s.shopId);
      const cust = s.customerId ? state.customers.find(c=>c.id===s.customerId) : null;
      const seller = state.users.find(u=>u.id===s.soldByUserId);
      await drawReceiptToCanvas(canvas, s, shop, cust, seller);
      return;
    }
  }
  drawSingleCardToCanvas(canvas, e);
}
async function buildIndividualHistoryFiles(events){
  const files = [];
  for(const e of events){
    const canvas = document.createElement('canvas');
    await drawHistoryItemToCanvas(canvas, e);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(blob) files.push(new File([blob], `${e.type}-${(e.sourceId||'').slice(-6)}.png`, {type:'image/png'}));
  }
  return files;
}
// Tap-to-share for one entry in the History list, no batch limit — this is
// the direct "tap any item and share just that one" action.
function openShareHistoryItemModal(idx){
  const e = __lastHistoryEvents[idx];

  openSheet(`
    <div class="sheet-head"><h3>Share</h3><button class="close-x" id="sheet-close">✕</button></div>

    </div>
  `);
  const canvas = document.getElementById('hist-item-canvas');
  drawHistoryItemToCanvas(canvas, e);
  document.getElementById('share-hist-item-img').addEventListener('click', ()=>{
    canvas.toBlob(async blob=>{
      if(!blob){ toast('Could not generate the image.'); return; }
      const file = new File([blob], `${e.type}-${(e.sourceId||'').slice(-6)}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title: business().name}); logAudit('history_item_shared', `Shared ${e.type} entry: ${e.title}`); }
        catch(err){ /* user cancelled — not an error */ }
      } else {
        toast("This browser can't share images directly — tap Download, then attach the file manually.");
      }
    }, 'image/png');

function voidSale(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!(isMaster() || (isStaff() && canDo('canVoidReturn') && s.soldByUserId===state.sessionUserId))){
    toast("You don't have permission to void this sale."); return;
  }
  const reason = prompt('Why are you voiding this sale? (e.g. entered by mistake)');
  if(reason===null) return;
  if(!confirm('This restores all items to stock and removes the sale from your totals. Continue?')) return;
  s.items.forEach(it=>{
    const remaining = it.qty - (it.returnedQty||0);
    if(remaining<=0) return;
    const g = state.goods.find(x=>x.id===it.goodId);
    if(!g) return;
    if(it.variantId){
      const v = (g.variants||[]).find(x=>x.id===it.variantId);
      if(v) v.qty += remaining;
    } else {
      const batch = g.batches.find(b=>b.id===it.batchId) || g.batches[0];
      if(batch) batch.qtyRemaining += remaining;
    }
  });
  s.status = 'voided';
  s.voidReason = reason;
  s.voidedAt = new Date().toISOString();
  s.voidedBy = state.sessionUserId;
  logAudit('sale_voided', `Voided sale #${s.id.slice(-6).toUpperCase()} (${fmtMoney(s.subtotal)}): ${reason||'no reason given'}`);
  toast('Sale voided ✅'); closeSheet(); render();
}
function openReturnModal(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!(isMaster() || (isStaff() && canDo('canVoidReturn') && s.soldByUserId===state.sessionUserId))){
    toast("You don't have permission to return items from this sale."); return;
  }
  openSheet(`
    <div class="sheet-head"><h3>Process Return</h3><button class="close-x" id="sheet-close">✕</button></div>
    <p class="subtle" style="margin-bottom:14px;">Set how many of each item are being returned. Stock is restored and the sale total is reduced automatically.</p>
    ${s.items.map((it,idx)=>{
      const g = state.goods.find(x=>x.id===it.goodId);
      const maxReturn = it.qty - (it.returnedQty||0);
      const itemLabel = g ? (it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name) : '(deleted item)';
      return `<div class="field">
        <label>${itemLabel} <span class="subtle">(bought ${it.qty}${it.returnedQty?', '+it.returnedQty+' already returned':''})</span></label>
        <input type="number" min="0" max="${maxReturn}" value="0" id="ret-qty-${idx}" ${maxReturn<=0?'disabled':''}>
      </div>`;
    }).join('')}
    <button class="btn btn-danger" id="confirm-return">Confirm Return</button>
  `);
  document.getElementById('confirm-return').addEventListener('click', ()=>{
    let refundTotal = 0;
    let anyReturned = false;
    s.items.forEach((it,idx)=>{
      const input = document.getElementById('ret-qty-'+idx);
      const qty = input ? Number(input.value||0) : 0;
      const maxReturn = it.qty - (it.returnedQty||0);
      if(qty<=0) return;
      if(qty>maxReturn){ toast('Return quantity too high for one item.'); return; }
      anyReturned = true;
      it.returnedQty = (it.returnedQty||0) + qty;
      refundTotal += qty * it.priceUsed;
      const g = state.goods.find(x=>x.id===it.goodId);
      if(g){
        if(it.variantId){
          const v = (g.variants||[]).find(x=>x.id===it.variantId);
          if(v) v.qty += qty;
        } else {
          const batch = g.batches.find(b=>b.id===it.batchId) || g.batches[0];
          if(batch) batch.qtyRemaining += qty;
        }
      }
    });
    if(!anyReturned){ toast('Enter a quantity to return for at least one item.'); return; }
    s.subtotal = Math.max(0, s.subtotal - refundTotal);
    s.paidAmount = Math.min(s.paidAmount, s.subtotal);
    s.balance = Math.max(0, s.subtotal - s.paidAmount);
    if(s.balance<=0) s.status='paid'; else if(s.paidAmount>0) s.status='partial'; else s.status='credit';
    logAudit('sale_return', `Returned items worth ${fmtMoney(refundTotal)} from sale #${s.id.slice(-6).toUpperCase()}`);
    toast('Return processed ✅'); closeSheet(); render();
  });
}

/* ============================================================
   LODGING — rooms & guest bookings (Hotel / Lodging business type)
   Food, drinks and meat stock are tracked through the normal Goods
   module (batches + expiry dates), same as Restaurant/Bar/Butchery shops.
   This module adds the one thing Goods can't: rooms and who's in them.

/* ---- lodging receipt: same canvas-receipt style as sales, security details left out ---- */
function layoutAndDrawLodgingReceipt(b, r, shop, seller, ctx, logoImg){
  const W = 380, PAD = 22;
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  if(logoImg){
    const logoSize = 50;
    if(ctx) ctx.drawImage(logoImg, PAD, y-20, logoSize, logoSize);
  }
  T(shop.name, W/2, 'center', '800 17px Arial,Helvetica,sans-serif', '#12213B'); y += 18;
  T('LODGING RECEIPT', W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 15;
  T(shop.address, W/2, 'center', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  if(shop.address) y += 14;
  if(shop.phone || shop.email){ T([shop.phone,shop.email].filter(Boolean).join('  ·  '), W/2, 'center'); y += 14; }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T('Receipt #'+b.id.slice(-6).toUpperCase(), PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#242B38');
  T(fmtDate(todayISO()), W-PAD, 'right', '400 12px Arial,Helvetica,sans-serif'); y += 17;
  T('Checked in by: '+seller.firstName+' '+seller.lastName, PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('Booking ID: '+b.id, PAD, 'left', '400 9px Arial,Helvetica,sans-serif', '#B0B5BD'); y += 13;
  T('Guest: '+b.guestName, PAD, 'left', '700 12.5px Arial,Helvetica,sans-serif', '#12213B');
  if(b.guestPhone){ y += 15; T(b.guestPhone, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); }
  y += 14;
  L(PAD, y, W-PAD, y); y += 20;

  T('Room', PAD, 'left', '700 9.5px Arial,Helvetica,sans-serif', '#9AA0AB');
  T('DETAILS', W-PAD, 'right', '700 9.5px Arial,Helvetica,sans-serif', '#9AA0AB');
  y += 16;
  T(r.name+(r.roomType?' ('+r.roomType+')':''), PAD, 'left', '400 12.5px Arial,Helvetica,sans-serif', '#242B38');
  T(fmtMoneyCanvas(b.ratePerNight)+'/night', W-PAD, 'right'); y += 20;
  T('Check-in', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(fmtDate(b.checkIn), W-PAD, 'right'); y += 16;
  T(b.status==='active'?'Expected Check-out':'Check-out', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(fmtDate(b.checkOut), W-PAD, 'right'); y += 16;
  T('Nights', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(String(b.nights), W-PAD, 'right'); y += 18;
  L(PAD, y, W-PAD, y); y += 22;

  T('TOTAL', PAD, 'left', '800 15px Arial,Helvetica,sans-serif', '#12213B');
  T(fmtMoneyCanvas(b.totalAmount), W-PAD, 'right'); y += 20;
  T('PAID', PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#2E7D32');
  T(fmtMoneyCanvas(b.paidAmount), W-PAD, 'right'); y += 18;
  if(b.balance>0){
    T('BALANCE DUE', PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#C0392B');
    T(fmtMoneyCanvas(b.balance), W-PAD, 'right'); y += 18;
  } else {
    T('PAID IN FULL', PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#2E7D32'); y += 18;
  }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T(shop.receiptFooter||'Thank you for staying with us!', W/2, 'center', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  y += 16;
  y += 12; // bottom padding
  return y;
}
async function drawLodgingReceiptToCanvas(canvas, b, r, shop, seller){
  const logoImg = await getLogoImage();
  const W = 380, scale = 2;
  const h = layoutAndDrawLodgingReceipt(b, r, shop, seller, null, logoImg);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFF7EA'; ctx.fillRect(0,0,W,h);
  drawSecurityTint(ctx, W, h, shop.name.toUpperCase());
  layoutAndDrawLodgingReceipt(b, r, shop, seller, ctx, logoImg);
}

function openCheckInModal(roomId){

    <button class="btn btn-primary" id="save-checkin-btn">Check In Guest</button>
  `);

    const guestName = document.getElementById('ci-name').value.trim();
    const guestPhone = document.getElementById('ci-phone').value.trim();
    const checkIn = document.getElementById('ci-in').value || inDate;
    const checkOut = document.getElementById('ci-out').value || outDate;
    const rate = Number(document.getElementById('ci-rate').value||0);
    const paid = Number(document.getElementById('ci-paid').value||0);
    const idType = document.getElementById('ci-idtype').value;
    const idNumber = document.getElementById('ci-idnumber').value.trim();
    const address = document.getElementById('ci-address').value.trim();
    const comingFrom = document.getElementById('ci-comingfrom').value.trim();
    const kinName = document.getElementById('ci-kinname').value.trim();
    const kinPhone = document.getElementById('ci-kinphone').value.trim();

    const numGuests = Number(document.getElementById('ci-numguests').value||1);

    <div class="field hidden" id="sup-sellprice-field"><label>Selling Price <span class="subtle">(for this new item)</span></label><input id="sup-sellprice" type="number" min="0"></div>
    <div class="row2">
      <div class="field"><label>Quantity Bought</label><input id="sup-qty" type="number" min="0" value="0"></div>
      <div class="field"><label>Cost Price (per unit)</label><input id="sup-cost" type="number" min="0"></div>
    </div>
    <div class="field"><label>Expiry Date <span class="subtle">(optional)</span></label><input id="sup-expiry" type="date"></div>
    <div class="field"><label>Amount Paid Now</label><input id="sup-paid" type="number" min="0" value="0"></div>
    <p class="subtle" id="sup-owed-preview" style="margin-top:-8px;margin-bottom:14px;"></p>

    <button class="btn btn-primary" id="save-supplier-btn">Save Supplier</button>
  `);
  const itemSel = document.getElementById('sup-item');
  const toggleNewFields = ()=>{
    const isNew = itemSel.value==='__new__';
    document.getElementById('sup-newname-field').classList.toggle('hidden', !isNew);
    document.getElementById('sup-sellprice-field').classList.toggle('hidden', !isNew);
  };
  itemSel.addEventListener('change', toggleNewFields);
  toggleNewFields();
  const updateOwedPreview = ()=>{
    const qty = Number(document.getElementById('sup-qty').value||0);
    const cost = Number(document.getElementById('sup-cost').value||0);
    const paid = Number(document.getElementById('sup-paid').value||0);
    const total = qty*cost;
    const owed = Math.max(0, total-paid);
    document.getElementById('sup-owed-preview').textContent = total>0 ? `Total ${fmtMoney(total)} — you'll owe ${fmtMoney(owed)} after this payment.` : '';
  };
  ['sup-qty','sup-cost','sup-paid'].forEach(id=>document.getElementById(id).addEventListener('input', updateOwedPreview));

  document.getElementById('save-supplier-btn').addEventListener('click', ()=>{
    const name = document.getElementById('sup-name').value.trim();
    if(!name){ toast('Name is required.'); return; }
    const country = document.getElementById('sup-country').value;
    const phoneRaw = document.getElementById('sup-phone').value.trim();
    const supplierId = uid('sup');
    state.suppliers.push({ id: supplierId, businessId: business().id, name, country,
      phone: phoneRaw ? '+'+toIntlDigits(phoneRaw, country) : '',
      suppliesWhat: document.getElementById('sup-supplies').value.trim(),
      notes: document.getElementById('sup-notes').value.trim(), createdByUserId: state.sessionUserId });
    logAudit('supplier_added', 'Added supplier '+name);

    // Optional first purchase, entered right in this same form.
    const qty = Number(document.getElementById('sup-qty').value||0);
    const cost = Number(document.getElementById('sup-cost').value||0);
    if(itemSel.value && qty>0 && cost>0){
      const paid = Number(document.getElementById('sup-paid').value||0);
      const expiry = document.getElementById('sup-expiry').value || '2099-12-31';
      let goodId, itemName;
      if(itemSel.value==='__new__'){
        const gName = document.getElementById('sup-newname').value.trim();
        const sellPrice = Number(document.getElementById('sup-sellprice').value||0);
        if(!gName || sellPrice<=0){ toast('New items need a name and selling price — supplier saved, but goods were not added.'); closeSheet(); render(); return; }
        const g = { id: uid('good'), shopId: state.currentShopId, name:gName, basePrice:sellPrice, costPrice:cost,
          emoji:'🛍️', groupPrices:[], barcode:null, reorderLevel:5,
          batches:[{id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost, batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null}] };
        state.goods.push(g);
        goodId = g.id; itemName = gName;
      } else {
        const g = state.goods.find(x=>x.id===itemSel.value);
        g.batches.push({ id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost,
          batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null });
        g.costPrice = cost;
        goodId = g.id; itemName = g.name;
      }
      const total = qty*cost;
      state.supplierPurchases.push({ id: uid('sp'), businessId: business().id, supplierId, shopId: state.currentShopId,
        goodId, itemName, qty, costPrice: cost, totalAmount: total, paidAmount: Math.min(paid,total),
        balance: Math.max(0, total-paid), date: todayISO(), createdByUserId: state.sessionUserId, createdAt: new Date().toISOString() });
      logAudit('supplier_restock', `Restocked ${qty} × ${itemName} from ${name} (${fmtMoney(total)})`);
      toast('Supplier and stock added ✅');
    } else {
      toast('Supplier saved ✅');
    }
    closeSheet(); render();
  });
}
function openSupplierDetail(supplierId){
  const sup = state.suppliers.find(x=>x.id===supplierId);
  const purchases = state.supplierPurchases.filter(p=>p.supplierId===supplierId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const owed = supplierBalance(supplierId);
  openSheet(`
    <div class="sheet-head"><h3>${escapeHtml(sup.name)}</h3><button class="close-x" id="sheet-close">✕</button></div>
    <div class="stat-box accent" style="margin-bottom:14px;"><div class="lbl">You Owe This Supplier</div><div class="val">${fmtMoney(owed)}</div></div>
    <div class="contact-btns" style="margin-bottom:14px;">
      <a href="tel:${toTelHref(sup.phone, sup.country)}">📞 Call</a>
      <a href="https://wa.me/${toIntlDigits(sup.phone, sup.country)}" target="_blank">WhatsApp</a>
      ${isMaster()?`<button data-delete-supplier="${sup.id}">Delete</button>`:''}
    </div>
    <button class="btn btn-primary" id="log-restock-btn" style="width:100%;margin-bottom:14px;">＋ Log a Restock</button>
    <div class="section-head"><h3>Purchase History</h3></div>
    ${purchases.length===0?`<p class="subtle">No purchases logged yet.</p>`:purchases.map(p=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <div><b>${escapeHtml(p.itemName)}</b><div class="t2">${p.qty} × ${fmtMoney(p.costPrice)} · ${fmtDate(p.date)}</div></div>
          <div style="text-align:right;"><b>${fmtMoney(p.totalAmount)}</b></div>
        </div>
        ${p.balance>0?`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <span class="pill pill-red">${fmtMoney(p.balance)} owed</span>
          <button class="btn btn-sm btn-outline" data-pay-supplier="${p.id}">Mark Paid</button>
        </div>`:`<div style="margin-top:8px;"><span class="pill pill-green">Fully Paid</span></div>`}
      </div>`).join('')}
  `);
  document.getElementById('log-restock-btn').addEventListener('click', ()=>openLogRestockModal(supplierId));
  document.querySelectorAll('[data-delete-supplier]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this supplier? Their purchase history will be kept but unlinked.')) return;
    state.suppliers = state.suppliers.filter(x=>x.id!==b.dataset.deleteSupplier);
    toast('Supplier deleted'); closeSheet(); render();
  }));
  document.querySelectorAll('[data-pay-supplier]').forEach(b=>b.addEventListener('click', ()=>{
    const p = state.supplierPurchases.find(x=>x.id===b.dataset.paySupplier);
    const amt = Number(prompt(`Amount paid (balance ${fmtMoney(p.balance)}):`, p.balance) || 0);
    if(amt<=0) return;
    p.paidAmount += amt;
    p.balance = Math.max(0, p.totalAmount - p.paidAmount);
    logAudit('supplier_payment', `Paid ${fmtMoney(amt)} to ${sup.name}`);
    toast('Payment recorded ✅'); openSupplierDetail(supplierId);
  }));
}
function openLogRestockModal(supplierId){
  const goods = state.goods.filter(g=>g.shopId===state.currentShopId && !g.hasVariants);
  openSheet(`
    <div class="sheet-head"><h3>Log a Restock</h3><button class="close-x" id="sheet-close">✕</button></div>
    <p class="subtle" style="margin-bottom:10px;">For items with sizes/colors, add stock to a specific variant from Goods → tap the item → Add Stock instead.</p>
    <div class="field"><label>Item</label>
      <select id="rs-item">
        <option value="__new__">＋ New item (not in Goods yet)</option>
        ${goods.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}
      </select>
    </div>
    <div class="field" id="rs-newname-field"><label>New Item Name</label><input id="rs-newname" placeholder="e.g. Brake Pad Set"></div>
    <div class="field" id="rs-sellprice-field"><label>Selling Price <span class="subtle">(for this new item)</span></label><input id="rs-sellprice" type="number" min="0"></div>
    <div class="row2">
      <div class="field"><label>Quantity Bought</label><input id="rs-qty" type="number" min="1" value="1"></div>
      <div class="field"><label>Cost Price (per unit)</label><input id="rs-cost" type="number" min="0"></div>
    </div>
    <div class="field"><label>Expiry Date <span class="subtle">(optional)</span></label><input id="rs-expiry" type="date"></div>
    <div class="row2">
      <div class="field"><label>Amount Paid Now</label><input id="rs-paid" type="number" min="0" value="0"></div>
      <div class="field"><label style="opacity:0;">.</label><p class="t2" style="padding-top:10px;">Rest goes to "owed"</p></div>
    </div>
    <button class="btn btn-primary" id="save-restock-btn">Save Restock</button>
  `);
  const itemSel = document.getElementById('rs-item');
  const toggleNewFields = ()=>{
    const isNew = itemSel.value==='__new__';
    document.getElementById('rs-newname-field').classList.toggle('hidden', !isNew);
    document.getElementById('rs-sellprice-field').classList.toggle('hidden', !isNew);
  };
  itemSel.addEventListener('change', toggleNewFields);
  toggleNewFields();
  document.getElementById('save-restock-btn').addEventListener('click', ()=>{
    const qty = Number(document.getElementById('rs-qty').value||0);
    const cost = Number(document.getElementById('rs-cost').value||0);
    const paid = Number(document.getElementById('rs-paid').value||0);
    const expiry = document.getElementById('rs-expiry').value || '2099-12-31';
    if(qty<=0 || cost<=0){ toast('Enter a valid quantity and cost price.'); return; }
    let goodId, itemName;
    if(itemSel.value==='__new__'){
      const name = document.getElementById('rs-newname').value.trim();
      const sellPrice = Number(document.getElementById('rs-sellprice').value||0);
      if(!name || sellPrice<=0){ toast('New items need a name and a selling price.'); return; }
      const g = { id: uid('good'), shopId: state.currentShopId, name, basePrice:sellPrice, costPrice:cost,
        emoji:'🛍️', groupPrices:[], barcode:null, reorderLevel:5,
        batches:[{id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost, batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null}] };
      state.goods.push(g);
      goodId = g.id; itemName = name;
    } else {
      const g = state.goods.find(x=>x.id===itemSel.value);
      g.batches.push({ id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost,
        batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null });
      g.costPrice = cost; // reflect latest purchase cost going forward
      goodId = g.id; itemName = g.name;
    }
    const total = qty*cost;
    state.supplierPurchases.push({ id: uid('sp'), businessId: business().id, supplierId, shopId: state.currentShopId,
      goodId, itemName, qty, costPrice: cost, totalAmount: total, paidAmount: Math.min(paid,total),
      balance: Math.max(0, total-paid), date: todayISO(), createdByUserId: state.sessionUserId, createdAt: new Date().toISOString() });
    logAudit('supplier_restock', `Restocked ${qty} × ${itemName} from supplier (${fmtMoney(total)})`);
    toast('Restock logged and stock added ✅'); closeSheet(); render();
  });
}

function openSheet(html){
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id='active-overlay';
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) closeSheet(); });
  const x = document.getElementById('sheet-close');
  if(x) x.addEventListener('click', closeSheet);
  bindPasswordToggles();
}
function closeSheet(){
  const ov = document.getElementById('active-overlay');
  if(ov) ov.remove();
}
