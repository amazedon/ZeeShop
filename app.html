function bindProfileEvents(){
  // Locked email: tapping the field (or the button) takes the person to Contact Us; the field itself shows a small pop-up first.
  const emailWrap = document.getElementById('pf-email-wrap');
  if(emailWrap){
    const goContact = ()=>{ if(typeof nzClose==='function') nzClose('nz-email-lock'); route='contact-us'; render(); };
    const cbtn = document.getElementById('pf-email-contact'); if(cbtn) cbtn.addEventListener('click', goContact);
    const fld = document.getElementById('pf-email');
    if(fld){
      const hit = document.createElement('div'); hit.style.cssText = 'position:absolute;inset:0;cursor:pointer;';
      fld.parentNode.insertBefore(hit, fld.nextSibling); fld.parentNode.style.position = 'relative';
      hit.style.top = fld.offsetTop+'px'; hit.style.height = fld.offsetHeight+'px'; hit.style.bottom = 'auto';
      hit.addEventListener('click', ()=>{
        const ov = nzOverlay('nz-email-lock', `<div class="nz-head"><h3>Email is locked 🔒</h3><button class="nz-x" aria-label="Close" id="nz-el-x">✕</button></div>
          <p style="font-size:14.5px;line-height:1.5;margin:0 0 16px;color:var(--text);">Please contact admin to change your email address.</p>
          <button class="btn btn-primary" id="nz-el-go">Contact Us</button>`);
        if(!ov) return;
        document.getElementById('nz-el-x').addEventListener('click', ()=>nzClose('nz-email-lock'));
        document.getElementById('nz-el-go').addEventListener('click', goContact);
      });
    }
  }
  const saveBtn = document.getElementById('save-profile-btn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const u = currentUser();
    // Confirm current credentials before touching anything. This is the
    // fix for a real gap: previously, anyone with a live session — even a
    // briefly unlocked or stolen phone — could change the email/phone on
    // file with zero friction, which then silently hijacks password-reset
    // recovery too (it goes to whatever email is on file NOW). Requiring
    // the current password/PIN here means a stolen session alone isn't
    // enough anymore.
    const confirmCred = document.getElementById('pf-confirm-cred').value;
    const credOk = u.role==='master'
      ? hash(confirmCred) === u.passwordHash
      : hash(confirmCred) === u.pinHash;
    if(!confirmCred || !credOk){
      toast(u.role==='master' ? 'Current password is incorrect.' : 'Current PIN is incorrect.');
      return;
    }
    const oldPhone = u.phone, oldEmail = u.email, oldUsername = u.username;
    if(u.role==='master'){
      const fn = document.getElementById('pf-fn').value.trim();
      const ln = document.getElementById('pf-ln').value.trim();
      if(!fn){ toast('First name is required.'); return; }
      u.firstName = fn; u.lastName = ln;
      const newUsername = document.getElementById('pf-username').value.trim();
      if(!newUsername){ toast('Username is required.'); return; }
      if(newUsername.toLowerCase() !== u.username.toLowerCase() &&
         state.users.some(x=>x.id!==u.id && x.username.toLowerCase()===newUsername.toLowerCase())){
        toast('That username is already taken.'); return;
      }
      u.username = newUsername;
    }
    const phoneRaw = document.getElementById('pf-phone').value.trim();
    const newPhone = phoneRaw ? '+'+toIntlDigits(phoneRaw) : '';
    const emailField = document.getElementById('pf-email');
    const newEmail = u.email;   // locked: the email can never be changed from inside the app (only a Super Admin can)
    // Notify the OLD email BEFORE applying the change locally or queuing
    // it to the server — the notify function looks up whatever email is
    // on file right now, so this ordering is what makes sure it reaches
    // the address someone is trying to move away from, not the new one.
    if(newPhone !== oldPhone) notifyContactChange('phone', newPhone);
    if(newEmail !== oldEmail) notifyContactChange('email', newEmail);
    u.phone = newPhone;
    u.email = newEmail;
    // None of this used to sync — a name, username, phone, or email change
    // stayed on whichever device made it, invisible everywhere else
    // (including the person's own second device, and anyone looking them
    // up by name elsewhere in the app).
    enqueueSettings('app_users', {
      id: u.id, username: u.username, first_name: u.firstName, last_name: u.lastName,
      phone: u.phone
    });
    // Specific old → new audit entries for the sensitive fields, instead of
    // one generic "profile updated" line that told you nothing if you ever
    // needed to investigate a dispute over who changed what and when.
    if(oldUsername !== u.username) logAudit('username_changed', `Changed username from @${oldUsername} to @${u.username}`);
    if(oldPhone !== u.phone) logAudit('phone_changed', `Changed phone from ${oldPhone||'(none)'} to ${u.phone||'(none)'}`);
    if(oldEmail !== u.email) logAudit('email_changed', `Changed email from ${oldEmail||'(none)'} to ${u.email||'(none)'}`);
    document.getElementById('pf-confirm-cred').value = '';
    toast('Profile updated ✅'); render();
  });
  const reqNameBtn = document.getElementById('request-name-btn');
  if(reqNameBtn) reqNameBtn.addEventListener('click', async ()=>{
    const u = currentUser();
    const fn = document.getElementById('pf-req-fn').value.trim();
    const ln = document.getElementById('pf-req-ln').value.trim();
    if(!fn){ toast('First name is required.'); return; }
    if(fn===u.firstName && ln===u.lastName){ toast("That's already your current name."); return; }
    // This one matters more than most local-only bugs: the whole point of
    // this feature is for the OWNER to see the request, and the Owner is
    // very rarely on the same device as the staff member submitting it. A
    // request that never syncs is a request the Owner can never actually see.
    try{
      await callManageNameChangeRequest('request', u.id, fn, ln);
      u.nameChangeRequest = { firstName: fn, lastName: ln, requestedAt: new Date().toISOString() };
      logAudit('name_change_requested', `${u.firstName} ${u.lastName} requested to be renamed to ${fn} ${ln}`);
      toast('Request sent to your Owner ✅'); render();
    }catch(e){
      toast("Couldn't send the request: " + e.message);
    }
  });
  const cancelReqBtn = document.getElementById('cancel-name-request-btn');
  if(cancelReqBtn) cancelReqBtn.addEventListener('click', async ()=>{
    const u = currentUser();
    try{
      await callManageNameChangeRequest('cancel', u.id);
      delete u.nameChangeRequest;
      toast('Request cancelled'); render();
    }catch(e){
      toast("Couldn't cancel: " + e.message);
    }
  });
  const savePassBtn = document.getElementById('save-password-btn');
  if(savePassBtn) savePassBtn.addEventListener('click', async ()=>{
    const hasExistingPassword = !!currentUser().passwordHash;
    let currentPass = '';
    if(hasExistingPassword){
      currentPass = document.getElementById('pf-currentpass').value;
      if(hash(currentPass) !== currentUser().passwordHash){ toast('Current password is incorrect.'); return; }
    }
    const p1 = document.getElementById('pf-newpass').value;
    const p2 = document.getElementById('pf-newpass2').value;
    if(p1.length<6){ toast('Password must be at least 6 characters.'); return; }
    if(p1!==p2){ toast("Passwords don't match."); return; }
    if(currentUser().role === 'master'){
      // The real login (Supabase Auth) must accept the new password BEFORE we save it on this phone.
      savePassBtn.disabled = true; const prevLabel = savePassBtn.textContent; savePassBtn.textContent = 'Saving…';
      const okAuth = await updateAuthPasswordStrict(currentPass, p1);
      savePassBtn.disabled = false; savePassBtn.textContent = prevLabel;
      if(!okAuth){ toast("Couldn't save your new password on the server. Check your internet connection and try again — your old password still works."); return; }
    }
    currentUser().passwordHash = hash(p1);
    if(currentUser().role === 'master') notifyContactChange('password', null);
    enqueueSync('app_users','update', { id: currentUser().id, password_hash: currentUser().passwordHash });
    logAudit(hasExistingPassword?'password_changed':'password_set', hasExistingPassword?'Changed own password':'Set a password (was Google-only)');
    toast(hasExistingPassword?'Password updated ✅':'Password set ✅ — you can now log in with email + password too.');
    const currentPassEl = document.getElementById('pf-currentpass');
    if(currentPassEl) currentPassEl.value='';
    document.getElementById('pf-newpass').value=''; document.getElementById('pf-newpass2').value='';
    render();
  });
  const savePinBtn = document.getElementById('save-pin-btn');
  if(savePinBtn) savePinBtn.addEventListener('click', async ()=>{
    const currentPin = document.getElementById('pf-currentpin').value;
    if(hash(currentPin) !== currentUser().pinHash){ toast('Current PIN is incorrect.'); return; }
    const p1 = document.getElementById('pf-newpin').value;
    const p2 = document.getElementById('pf-newpin2').value;
    if(!/^\d{4,6}$/.test(p1)){ toast('PIN must be 4-6 digits.'); return; }
    if(p1!==p2){ toast("PINs don't match."); return; }
    // Pushed straight to the server and awaited — see the admin-side Reset
    // PIN handler for why: the old enqueueSync approach could silently
    // never reach the server, so changing your own PIN only ever took
    // effect on the device you changed it from.
    try{
      const result = await callResetStaffPin(currentUser().id, p1);
      currentUser().pinHash = result.pin_hash; currentUser().pinLength = result.pin_length;
      logAudit('pin_changed', 'Changed own PIN');
      toast('PIN updated ✅ — takes effect immediately, everywhere.');
      document.getElementById('pf-currentpin').value='';
      document.getElementById('pf-newpin').value=''; document.getElementById('pf-newpin2').value='';
    }catch(e){
      toast("Couldn't update the PIN: " + e.message);
    }
  });
}

      // applied to whichever device the Owner happened to be using when
      // they set them. A receipt printed from a different device (or a
      // staff member's phone) would use blank/default values instead of
      // the real, configured business identity.

async function fetchPricingForBusiness(){
  const b = business();
  // Use the business's actual currency directly — this previously only
  // recognized 4 of the app's 17 supported currencies (same bug already
  // found and fixed in process-auto-renewals.ts) and silently forced
  // everyone else into USD pricing, which could show a completely
  // different price than what that business actually pays. The "no
  // price row" case below already handles a currency with nothing
  // configured — no separate whitelist needed on top of that.
  const currency = (b && b.currency) || 'USD';
  try{
    const res = await fetch(`${SITE_CONTENT_URL}/rest/v1/pricing?currency=eq.${currency}&select=*`, {
      headers: { 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
      cache: 'no-store'
    });
    if(!res.ok) return null;
    const rows = await res.json();
    const get = (plan, interval) => {
      const row = rows.find(r=>r.plan===plan && r.interval===interval);
      return row ? row.amount : 0;
    };
    const symbol = CCY[currency] || currency;
    return {
      currency, symbol,
      proMonthly: get('pro','monthly'), proYearly: get('pro','yearly'),
      bossMonthly: get('boss','monthly'), bossYearly: get('boss','yearly')
    };
  }catch(e){ return null; }
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);

// Exact moment a note was written: "25 October 2026 · 5:39 PM".
function fmtNoteStamp(iso){
  const d = new Date(iso);
  if(!iso || isNaN(d.getTime())) return '';
  const date = d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  const time = d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
  return `${date} · ${time}`;
}
// ---- Note rules ----
// Private note (isPrivate): its writer can edit/delete any time; only the writer and the Boss can see it.
// Shared note (handover, or any note from before this rule): its writer can edit/delete only for the first 7 days.
// The Boss can never edit someone else's note, and can delete any note only once it is 30 days old.
const NOTE_AUTHOR_DAYS = 7, NOTE_BOSS_DAYS = 30;
function noteDate(n, plusDays){ const d = new Date(Date.parse(n.createdAt||'') + plusDays*86400000); return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }); }
function noteRights(n){
  const age = Date.parse(n.createdAt||'') ? (Date.now() - Date.parse(n.createdAt)) / 86400000 : 0;
  const mine = n.authorUserId === state.sessionUserId, boss = isMaster(), priv = !!n.isPrivate;
  const authorOpen = mine && (priv || age < NOTE_AUTHOR_DAYS);
  const bossOpen = boss && age >= NOTE_BOSS_DAYS;
  return {
    mine, boss, priv, age,
    canEdit: authorOpen,
    canDelete: authorOpen || bossOpen,
    editMsg: !mine ? 'Only the person who wrote this note can edit it.' : `This note is shared, so it can't be edited after ${NOTE_AUTHOR_DAYS} days.`,
    deleteMsg: mine && !priv && !bossOpen ? `This note is shared, so it can't be deleted after ${NOTE_AUTHOR_DAYS} days.${boss ? ' As Boss you can delete it on ' + noteDate(n, NOTE_BOSS_DAYS) + '.' : ''}`
      : boss ? `This note can't be deleted until it is ${NOTE_BOSS_DAYS} days old — on ${noteDate(n, NOTE_BOSS_DAYS)}.`
      : 'Only the person who wrote this note can delete it.'
  };
}
function noteVisibleToMe(n){ return !n.isPrivate || n.authorUserId === state.sessionUserId || isMaster(); }
function noteWasEdited(n){
  const c = Date.parse(n.createdAt || ''), u = Date.parse(n.updatedAt || '');
  return !!(c && u && u - c > 60000);   // more than a minute after it was written
}

        ${rt.mine && !n.isPrivate ? `<div>${rt.canEdit ? `You can edit or delete this note until ${escapeHtml(noteDate(n, NOTE_AUTHOR_DAYS))}` : 'Locked — shared notes can’t be edited or deleted after 7 days'}</div>` : ''}
        ${rt.boss && !rt.canDelete ? `<div>The Boss can delete this note from ${escapeHtml(noteDate(n, NOTE_BOSS_DAYS))}</div>` : ''}

    </div>`;
}
function bindNoteViewEvents(){
  const id = activeNoteId;
  const btn = document.getElementById('nv-menu-btn');
  if(btn) btn.addEventListener('click', e=>{ e.stopPropagation(); noteMenuOpen = !noteMenuOpen; render(); });
  if(!window._nvOutside){
    window._nvOutside = (e)=>{
      if(route !== 'note-view' || !noteMenuOpen) return;
      if(e.target.closest && (e.target.closest('#nv-menu') || e.target.closest('#nv-menu-btn'))) return;
      noteMenuOpen = false; render();     // tap anywhere else closes the menu
    };
    document.addEventListener('click', window._nvOutside);
  }
  const ed = document.getElementById('nv-edit');
  if(ed) ed.addEventListener('click', ()=>{
    noteMenuOpen = false; render();
    const n = state.shopNotes.find(x=>x.id===id);
    if(n && !noteRights(n).canEdit){ toast(noteRights(n).editMsg); return; }
    openEditNoteModal(id);
  });
  const sh = document.getElementById('nv-share');
  if(sh) sh.addEventListener('click', ()=>{ noteMenuOpen = false; render(); openShareNoteModal(id); });
  const del = document.getElementById('nv-delete');
  if(del) del.addEventListener('click', async ()=>{ noteMenuOpen = false; if(await deleteNote(id)){ route = 'notes'; render(); } else render(); });
}
function noteShareText(n, author){
  const parts = [n.title, '', n.text || '', '', `— ${author?author.firstName+' '+author.lastName:'Unknown'}, ${fmtNoteStamp(n.createdAt)}`];
  return parts.join('\n');
}
function openShareNoteModal(noteId){
  const n = state.shopNotes.find(x=>x.id===noteId);
  if(!n) return;
  const author = state.users.find(u=>u.id===n.authorUserId);
  const shareText = noteShareText(n, author);
  openSheet(`
    <div class="sheet-head"><h3>Share Note</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div class="card" style="max-height:340px;overflow-y:auto;">
      <div class="t1" style="margin-bottom:8px;">${escapeHtml(n.title)}</div>
      <p style="white-space:pre-wrap;font-size:13.5px;color:var(--text);line-height:1.5;">${escapeHtml(n.text)}</p>
    </div>
    <p class="subtle" style="margin:10px 0 14px;">Shared as plain text — the recipient gets a normal, readable message, not a squeezed-down image.</p>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="share-note-text" style="flex:1;">${ICON_EXPORT} Share</button>
      <button class="btn btn-outline" id="copy-note-text" style="flex:1;">${ICON_CLIPBOARD} Copy Text</button>
    </div>
  `);
  document.getElementById('share-note-text').addEventListener('click', async ()=>{
    if(navigator.share){

      catch(e){ /* user cancelled — not an error */ }
    } else {
      try{ await navigator.clipboard.writeText(shareText); toast('Sharing not supported here — copied to clipboard instead ✅'); }
      catch(e){ toast("Couldn't share or copy on this browser."); }

  document.getElementById('copy-note-text').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(shareText); toast('Copied ✅ — paste it into WhatsApp, Email, anywhere.'); }

function openEditNoteModal(id){

  openSheet(`
    <div class="sheet-head"><h3>Edit Note</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div class="field"><label>Title</label><input id="note-title" value="${escAttr(n.title)}"></div>
    <div class="field"><label>Details</label><textarea id="note-text" rows="6">${escapeHtml(n.text)}</textarea></div>
    ${n.isPrivate ? `<p class="subtle" style="font-size:12.5px;margin:0 0 16px;">🔒 Private — only you and the Boss can see this note.</p>` : `
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px;">
      <input type="checkbox" id="note-handover" ${n.isHandover?'checked':''}> ${ICON_PIN} Show this to the next person who logs in (handover note)
    </label>
    <p class="subtle" style="font-size:12.5px;margin:0 0 16px;">This note is shared — you can edit it until ${escapeHtml(noteDate(n, NOTE_AUTHOR_DAYS))}, after that it is locked.</p>`}
    <button class="btn btn-primary" id="save-note-btn">Save Changes</button>
  `);
  document.getElementById('save-note-btn').addEventListener('click', ()=>saveNoteFromForm(id));
}
async function saveNoteFromForm(existingId){
  const title = document.getElementById('note-title').value.trim();
  const text = document.getElementById('note-text').value.trim();
  const hcEl = document.getElementById('note-handover');
  if(!title){ toast('Please give this note a title.'); return; }
  if(existingId){
    const n = state.shopNotes.find(x=>x.id===existingId);
    if(!n || !noteRights(n).canEdit){ toast(n ? noteRights(n).editMsg : 'Note not found.'); closeSheet(); render(); return; }
    const isHandover = hcEl ? hcEl.checked : !!n.isHandover;
    n.title = title; n.text = text; n.isHandover = isHandover; n.updatedAt = new Date().toISOString();
    enqueueSync('shop_notes','update', { id: n.id, title: n.title, text: n.text, is_handover: n.isHandover, updated_at: n.updatedAt });
    logAudit('note_edited', 'Edited note: '+title);
    toast('Note updated ✅');
  } else {
    const isHandover = !!(hcEl && hcEl.checked);
    const isPrivate = !isHandover;   // not shared with the next person = private
    if(!isPrivate && !await appConfirm("Everyone in the shop will see this note.\n\nAfter 7 days you will NOT be able to edit or delete it.\n\nSave it?")) return;
    const noteId = uid('note');
    state.shopNotes.push({ id: noteId, businessId: business().id, shopId: state.currentShopId,
      authorUserId: state.sessionUserId, title, text, isHandover, isPrivate, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    enqueueSync('shop_notes','insert', {
      id: noteId, business_id: business().id, shop_id: state.currentShopId,
      author_user_id: state.sessionUserId, title, text, is_handover: isHandover, is_private: isPrivate
    });
    logAudit('note_added', 'Added note: '+title);
    toast('Note saved ✅');
  }
  closeSheet(); render();
}
async function deleteNote(id){
  const nn = state.shopNotes.find(x=>x.id===id);
  if(nn && !noteRights(nn).canDelete){ toast(noteRights(nn).deleteMsg); return false; }
  if(!await appConfirm('Delete this note? This cannot be undone.')) return false;
  state.shopNotes = state.shopNotes.filter(x=>x.id!==id);
  enqueueSync('shop_notes','delete', { id });
  logAudit('note_deleted', 'Deleted a note');
  toast('Note deleted');
  render();
  return true;
}

/* ============================================================
   SALES HISTORY — browse past sales, void a mistaken sale,
   or process a partial/full return.
   ============================================================ */
let historyFilter = 'all'; // all | sale | credit | voided | supplier | expense
let historyDateFilter = '';
let __lastHistoryEvents = [];
function screenHistory(){
  const shopId = state.currentShopId;
  const events = [];

  state.sales.filter(s=>s.shopId===shopId).forEach(s=>{
    const cust = s.customerId ? state.customers.find(c=>c.id===s.customerId) : null;
    const buyerName = cust ? cust.fullName : (s.walkInName || 'Walk-in customer');
    const isVoided = s.status==='voided';
    const type = isVoided ? 'voided' : (s.status==='paid' ? 'sale' : 'credit');
    events.push({
      type, sourceId: s.id, date: s.date, sortAt: s.createdAt,
      title: buyerName, subtitle: `#${s.id.slice(-6).toUpperCase()} · Sale`,
      amount: s.subtotal, pill: isVoided?`<span class="pill pill-gray">VOIDED</span>`:s.status==='paid'?`<span class="pill pill-green">Paid</span>`:`<span class="pill pill-red">${s.status}</span>`,
      onClick: ()=>openSaleDetail(s.id), dim: isVoided
    });
  });

  state.supplierPurchases.filter(p=>p.shopId===shopId).forEach(p=>{
    const sup = state.suppliers.find(x=>x.id===p.supplierId);
    events.push({
      type:'supplier', sourceId: p.id, date: p.date, sortAt: p.createdAt,
      title: sup ? sup.name : 'Unknown supplier', subtitle: `${p.itemName} × ${p.qty} · Restock`,
      amount: p.totalAmount, pill: p.balance>0?`<span class="pill pill-red">Owe ${fmtMoney(p.balance)}</span>`:`<span class="pill pill-green">Paid</span>`,
      onClick: sup ? (()=>openSupplierDetail(sup.id)) : null
    });
  });

  state.expenses.filter(e=>e.shopId===shopId).forEach(e=>{
    events.push({
      type:'expense', sourceId: e.id, date: e.date, sortAt: e.date,
      title: e.description || e.category, subtitle: `${e.category} · Expense`,
      amount: e.amount, pill: `<span class="pill pill-gray">Expense</span>`, onClick: null
    });
  });

  state.stockAdjustments.filter(a=>a.shopId===shopId).forEach(a=>{
    const adjuster = state.users.find(u=>u.id===a.adjustedByUserId);
    events.push({
      type:'adjustment', sourceId: a.id, date: a.adjustedAt.slice(0,10), sortAt: a.adjustedAt,
      title: a.goodName, subtitle: `${a.oldQty} → ${a.newQty} · Correction${adjuster?' by '+adjuster.firstName:''}${a.reason?' — '+a.reason:''}`,
      amount: null, pill: a.difference<0?`<span class="pill pill-red">${a.difference}</span>`:`<span class="pill pill-green">+${a.difference}</span>`,
      onClick: null
    });
  });

  let filtered = events;
  if(historyFilter!=='all') filtered = filtered.filter(e=>e.type===historyFilter);
  if(historyDateFilter) filtered = filtered.filter(e=>e.date===historyDateFilter);
  filtered.sort((a,b)=>new Date(b.sortAt)-new Date(a.sortAt));
  filtered = filtered.slice(0,150);
  __lastHistoryEvents = filtered;

  const filterOptions = [
    {id:'all', label:'All'}, {id:'sale', label:'Sales'}, {id:'credit', label:'Credit'},
    {id:'voided', label:'Voided'}, {id:'supplier', label:'Supplier'}, {id:'expense', label:t('more_expenses')},
    {id:'adjustment', label:'Corrections'}
  ];
  const typeIcon = {sale:ICON_RECEIPT, credit:ICON_NOTEBOOK, voided:ICON_BAN, supplier:ICON_TRUCK, expense:ICON_CASH, adjustment:ICON_HASH};

  return `
    ${subHeader("History")}
    <div class="field">
      <label>Search by Date</label>
      <div style="display:flex;gap:8px;">
        <input type="date" id="history-date-search" value="${historyDateFilter}" style="flex:1;">
        ${historyDateFilter?`<button class="btn btn-outline btn-sm" id="clear-history-date">Clear</button>`:''}
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
      ${filterOptions.map(f=>`<button class="btn btn-sm ${historyFilter===f.id?'btn-dark':'btn-outline'}" data-hfilter="${f.id}">${f.label}</button>`).join('')}
    </div>
    ${filtered.length>0?`<button class="btn btn-outline btn-sm" id="share-history-btn" style="margin-bottom:12px;">${ICON_EXPORT} Share This List (${filtered.length})</button>`:''}
    ${filtered.length===0? `<div class="empty"><div class="ic">${ICON_RECEIPT}</div><b>Nothing here</b>Try a different filter or date.</div>` :
    filtered.map((e,i)=>`
      <div class="card" ${e.onClick?`data-hist-idx="${i}" style="cursor:pointer;${e.dim?'opacity:0.55;':''}"`:`style="${e.dim?'opacity:0.55;':''}"`}>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="display:flex;gap:10px;align-items:flex-start;">
            <div style="font-size:17px;">${typeIcon[e.type]}</div>
            <div>
              <div class="t1">${escapeHtml(e.title)}</div>
              <div class="t2">${e.subtitle} · ${fmtDate(e.date)}</div>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            ${e.amount!=null?`<b>${fmtMoney(e.amount)}</b><br>`:''}${e.pill}
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;">
          <button data-share-hist-idx="${i}" style="background:none;border:none;color:var(--marigold-dark);font-size:12px;font-weight:700;padding:2px 0;">${ICON_EXPORT} Share</button>
        </div>
      </div>`).join('')}
  `;
}
function bindHistoryEvents(){
  document.querySelectorAll('[data-hfilter]').forEach(b=>b.addEventListener('click', ()=>{ historyFilter=b.dataset.hfilter; refreshMain(); }));
  const dateInput = document.getElementById('history-date-search');
  if(dateInput) dateInput.addEventListener('change', e=>{ historyDateFilter = e.target.value; refreshMain(); });
  const clearDate = document.getElementById('clear-history-date');

  const shareBtn = document.getElementById('share-history-btn');

  document.querySelectorAll('[data-share-hist-idx]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      openShareHistoryItemModal(Number(el.dataset.shareHistIdx));
    });
  });
}

/* ============================================================
   SHARE HISTORY — generates a shareable summary image of
   whatever's currently filtered/dated in the History screen.
   ============================================================ */
const HISTORY_TYPE_LABELS = {sale:'SALE', credit:'CREDIT', voided:'VOIDED', supplier:'SUPPLIER', expense:'EXPENSE', adjustment:'CORRECTION'};
function openHistoryShareModal(){
  const filterOptions = [
    {id:'all', label:'All'}, {id:'sale', label:'Sales'}, {id:'credit', label:'Credit'},
    {id:'voided', label:'Voided'}, {id:'supplier', label:'Supplier'}, {id:'expense', label:t('more_expenses')},
    {id:'adjustment', label:'Corrections'}
  ];
  const filterLabel = (filterOptions.find(f=>f.id===historyFilter)||{}).label || 'All';
  const dateLabel = historyDateFilter ? fmtDate(historyDateFilter) : 'All Time';
  openSheet(`
    <div class="sheet-head"><h3>Share History</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:14px;">Shows the ${filterLabel} filter, ${dateLabel} — same as what's currently on screen. <b>Share</b> sends each item below as its own separate image (up to 10 at a time). <b>Download</b> saves one combined summary picture instead.</p>
    <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;margin-bottom:14px;">
      <canvas id="history-canvas" style="max-width:100%;height:auto;display:block;"></canvas>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="share-history-img" style="flex:1;">${ICON_EXPORT} Share</button>
      <button class="btn btn-outline" id="download-history-img" style="flex:1;">⬇️ Download</button>
    </div>
  `);
  const canvas = document.getElementById('history-canvas');
  drawHistoryToCanvas(canvas, filterLabel, dateLabel);
  const MAX_SHARE_ITEMS = 10;
  document.getElementById('share-history-img').addEventListener('click', async ()=>{
    const events = __lastHistoryEvents;
    if(events.length===0){ toast('Nothing to share.'); return; }
    if(events.length > MAX_SHARE_ITEMS){
      toast(`That's ${events.length} items — narrow your filter or date to ${MAX_SHARE_ITEMS} or fewer to share them individually.`);
      return;
    }
    const shareBtn = document.getElementById('share-history-img');
    shareBtn.disabled = true; shareBtn.textContent = 'Preparing…';
    try{
      const files = await buildIndividualHistoryFiles(events);
      if(files.length===0){ toast('Could not generate the images.'); return; }
      if(navigator.canShare && navigator.canShare({files})){
        try{ await navigator.share({files, title: business().name+' — History'}); logAudit('history_shared', `Shared ${files.length} item(s) individually (${filterLabel}, ${dateLabel})`); }
        catch(e){ /* user cancelled — not an error */ }
      } else {
        toast("This browser can't share multiple images at once — try Download for a single summary instead.");
      }
    } finally {
      shareBtn.disabled = false; shareBtn.textContent = '${ICON_EXPORT} Share';
    }
  });
  document.getElementById('download-history-img').addEventListener('click', ()=>{
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`history-${todayISO()}.png`; a.click();
      URL.revokeObjectURL(url);
      logAudit('history_downloaded', `Downloaded history (${filterLabel}, ${dateLabel})`);
    }, 'image/png');
  });
}
function layoutAndDrawHistory(filterLabel, dateLabel, ctx){
  const W = 380, PAD = 22;
  const MAX_ROWS = 60;
  const events = __lastHistoryEvents.slice(0, MAX_ROWS);
  const truncated = __lastHistoryEvents.length > MAX_ROWS;
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  T(currentShop() ? currentShop().name : '', W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14;
  T('History — '+filterLabel+' · '+dateLabel, W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 18;
  L(PAD, y, W-PAD, y); y += 20;

  events.forEach(e=>{
    const tag = '['+(HISTORY_TYPE_LABELS[e.type]||'')+']';
    T(tag, PAD, 'left', '700 9px Arial,Helvetica,sans-serif', '#9AA0AB');
    const nameWrapped = wrapPlainText(canvasSafeText(e.title), 28);
    T(nameWrapped[0]||'', PAD+38, 'left', '400 12px Arial,Helvetica,sans-serif', e.dim?'#B0B0B0':'#242B38');
    if(e.amount!=null) T(fmtMoneyCanvas(e.amount), W-PAD, 'right', '700 12px Arial,Helvetica,sans-serif', e.dim?'#B0B0B0':'#242B38');
    y += 15;
    T(canvasSafeText(e.subtitle)+' · '+fmtDate(e.date), PAD+38, 'left', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    y += 18;
  });
  if(truncated){
    T(`+ ${__lastHistoryEvents.length - MAX_ROWS} more not shown — see full history in the app`, PAD, 'left', 'italic 400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    y += 18;
  }
  L(PAD, y, W-PAD, y); y += 20;

  // Per-type subtotals (voided sales excluded — they don't count toward money totals)
  const totals = {};
  __lastHistoryEvents.forEach(e=>{
    if(e.type==='voided') return;

function drawHistoryToCanvas(canvas, filterLabel, dateLabel){
  const W = 380, scale = 2;
  const h = layoutAndDrawHistory(filterLabel, dateLabel, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawHistory(filterLabel, dateLabel, ctx);
}

// A simple standalone card for entry types that don't have their own full
// document format (supplier restocks, expenses) — used when sharing one by one.
function layoutAndDrawSingleCard(event, ctx){
  const W = 380, PAD = 24;
  let y = 32;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };
  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 18;
  T('['+(HISTORY_TYPE_LABELS[event.type]||'')+']', W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 18;
  L(PAD, y, W-PAD, y); y += 22;
  wrapPlainText(canvasSafeText(event.title), 40).forEach(line=>{
    T(line, PAD, 'left', '700 14px Arial,Helvetica,sans-serif', '#12213B'); y += 19;
  });
  wrapPlainText(canvasSafeText(event.subtitle), 44).forEach(line=>{
    T(line, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 15;
  });
  T(fmtDate(event.date), PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 20;
  L(PAD, y, W-PAD, y); y += 24;
  if(event.amount!=null){
    T('AMOUNT', PAD, 'left', '700 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    T(fmtMoneyCanvas(event.amount), W-PAD, 'right', '800 15px Arial,Helvetica,sans-serif', '#12213B');
    y += 24;
  }
  return y;
}
function drawSingleCardToCanvas(canvas, event){
  const W = 380, scale = 2;
  const h = layoutAndDrawSingleCard(event, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawSingleCard(event, ctx);
}
// Builds one File (image) per history entry — real receipts for sales/credit/
// voided sales, simple cards for everything else — so sharing sends each
// transaction as its own message/attachment instead of one bundled image.
// Draws a single history entry to a canvas — a real receipt for sales/credit/
// voided sales, or a simple card for supplier/expense entries. Shared by both
// the per-entry Share button and the "share whole list individually" action.
async function drawHistoryItemToCanvas(canvas, e){
  if(e.type==='sale' || e.type==='credit' || e.type==='voided'){
    const s = state.sales.find(x=>x.id===e.sourceId);
    if(s){
      const shop = state.shops.find(x=>x.id===s.shopId);
      const cust = s.customerId ? state.customers.find(c=>c.id===s.customerId) : null;
      const seller = state.users.find(u=>u.id===s.soldByUserId);
      await drawReceiptToCanvas(canvas, s, shop, cust, seller);
      return;
    }
  }
  drawSingleCardToCanvas(canvas, e);
}
async function buildIndividualHistoryFiles(events){
  const files = [];
  for(const e of events){
    const canvas = document.createElement('canvas');
    await drawHistoryItemToCanvas(canvas, e);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(blob) files.push(new File([blob], `${e.type}-${(e.sourceId||'').slice(-6)}.png`, {type:'image/png'}));
  }
  return files;
}
// Tap-to-share for one entry in the History list, no batch limit — this is
// the direct "tap any item and share just that one" action.
function openShareHistoryItemModal(idx){
  const e = __lastHistoryEvents[idx];
  if(!e){ toast('Could not find that entry.'); return; }
  openSheet(`
    <div class="sheet-head"><h3>Share</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;margin-bottom:14px;">
      <canvas id="hist-item-canvas" style="max-width:100%;height:auto;display:block;"></canvas>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="share-hist-item-img" style="flex:1;">${ICON_EXPORT} Share</button>
      <button class="btn btn-outline" id="download-hist-item-img" style="flex:1;">⬇️ Download</button>
    </div>
  `);
  const canvas = document.getElementById('hist-item-canvas');
  drawHistoryItemToCanvas(canvas, e).catch(err=>console.warn('Receipt draw failed:', err));
  document.getElementById('share-hist-item-img').addEventListener('click', ()=>{
    canvas.toBlob(async blob=>{
      if(!blob){ toast('Could not generate the image.'); return; }
      const file = new File([blob], `${e.type}-${(e.sourceId||'').slice(-6)}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title: business().name}); logAudit('history_item_shared', `Shared ${e.type} entry: ${e.title}`); }
        catch(err){ /* user cancelled — not an error */ }
      } else {
        toast("This browser can't share images directly — tap Download, then attach the file manually.");
      }
    }, 'image/png');
  });
  document.getElementById('download-hist-item-img').addEventListener('click', ()=>{
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${e.type}-${(e.sourceId||'').slice(-6)}.png`; a.click();
      URL.revokeObjectURL(url);
      logAudit('history_item_downloaded', `Downloaded ${e.type} entry: ${e.title}`);
    }, 'image/png');
  });
}

async function voidSale(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!(isMaster() || (isStaff() && canDo('canVoidReturn') && s.soldByUserId===state.sessionUserId))){
    toast("You don't have permission to void this sale."); return;
  }
  const reason = await appPrompt('Why are you voiding this sale? (e.g. entered by mistake)');
  if(reason===null) return;
  if(!await appConfirm('This restores all items to stock and removes the sale from your totals. Continue?')) return;
  s.items.forEach(it=>{
    const remaining = it.qty - (it.returnedQty||0);
    if(remaining<=0) return;
    const g = state.goods.find(x=>x.id===it.goodId);
    if(!g) return;
    if(it.variantId){
      const v = (g.variants||[]).find(x=>x.id===it.variantId);
      if(v){ v.qty += remaining; enqueueSync('good_variants','update', { id: v.id, qty: v.qty }); }
    } else {
      const batch = g.batches.find(b=>b.id===it.batchId) || g.batches[0];
      if(batch){ batch.qtyRemaining += remaining; enqueueSync('good_batches','update', { id: batch.id, qty_remaining: batch.qtyRemaining }); }
    }
  });
  s.status = 'voided';
  s.voidReason = reason;
  s.voidedAt = new Date().toISOString();
  s.voidedBy = state.sessionUserId;
  enqueueSync('sales','update', { id: s.id, status: 'voided', balance: s.balance });
  logAudit('sale_voided', `Voided sale #${s.id.slice(-6).toUpperCase()} (${fmtMoney(s.subtotal)}): ${reason||'no reason given'}`);
  toast('Sale voided ✅'); closeSheet(); render();
}
function openReturnModal(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!(isMaster() || (isStaff() && canDo('canVoidReturn') && s.soldByUserId===state.sessionUserId))){
    toast("You don't have permission to return items from this sale."); return;
  }
  openSheet(`
    <div class="sheet-head"><h3>Process Return</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:14px;">Set how many of each item are being returned. Stock is restored and the sale total is reduced automatically.</p>
    ${s.items.map((it,idx)=>{
      const g = state.goods.find(x=>x.id===it.goodId);
      const maxReturn = it.qty - (it.returnedQty||0);
      const itemLabel = g ? (it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name) : '(deleted item)';
      return `<div class="field">
        <label>${itemLabel} <span class="subtle">(bought ${it.qty}${it.returnedQty?', '+it.returnedQty+' already returned':''})</span></label>
        <input type="number" min="0" max="${maxReturn}" value="0" id="ret-qty-${idx}" ${maxReturn<=0?'disabled':''}>
      </div>`;
    }).join('')}
    <button class="btn btn-danger" id="confirm-return">Confirm Return</button>
  `);
  document.getElementById('confirm-return').addEventListener('click', ()=>{
    let refundTotal = 0;
    let anyReturned = false;
    const restockedBatches = {}; // batchId -> goodId, for syncing the restock
    const restockedVariants = {}; // variantId -> goodId
    s.items.forEach((it,idx)=>{
      const input = document.getElementById('ret-qty-'+idx);
      const qty = input ? Number(input.value||0) : 0;
      const maxReturn = it.qty - (it.returnedQty||0);
      if(qty<=0) return;
      if(qty>maxReturn){ toast('Return quantity too high for one item.'); return; }
      anyReturned = true;
      it.returnedQty = (it.returnedQty||0) + qty;
      refundTotal += qty * it.priceUsed;
      const g = state.goods.find(x=>x.id===it.goodId);
      if(g){
        if(it.variantId){
          const v = (g.variants||[]).find(x=>x.id===it.variantId);
          if(v){ v.qty += qty; restockedVariants[v.id] = g.id; }
        } else {
          const batch = g.batches.find(b=>b.id===it.batchId) || g.batches[0];
          if(batch){ batch.qtyRemaining += qty; restockedBatches[batch.id] = g.id; }
        }
      }
    });
    if(!anyReturned){ toast('Enter a quantity to return for at least one item.'); return; }
    s.subtotal = Math.max(0, s.subtotal - refundTotal);
    s.paidAmount = Math.min(s.paidAmount, s.subtotal);
    s.balance = Math.max(0, s.subtotal - s.paidAmount);
    if(s.balance<=0) s.status='paid'; else if(s.paidAmount>0) s.status='partial'; else s.status='credit';
    // This whole block used to only update local state — a return processed
    // on one device never reached another (the sale kept showing its old
    // total, and restocked quantities never came back into the shared count).
    enqueueSync('sales','update', { id: s.id, subtotal: s.subtotal, paid_amount: s.paidAmount, balance: s.balance, status: s.status });
    s.items.forEach((it,idx)=>{
      const input = document.getElementById('ret-qty-'+idx);
      const qty = input ? Number(input.value||0) : 0;
      if(qty>0 && it.saleItemId) enqueueSync('sale_items','update', { id: it.saleItemId, returned_qty: it.returnedQty });
    });
    Object.keys(restockedBatches).forEach(batchId=>{
      const g = state.goods.find(x=>x.id===restockedBatches[batchId]);
      const b = g && g.batches.find(x=>x.id===batchId);
      if(b) enqueueSync('good_batches','update', { id: b.id, qty_remaining: b.qtyRemaining });
    });
    Object.keys(restockedVariants).forEach(variantId=>{
      const g = state.goods.find(x=>x.id===restockedVariants[variantId]);
      const v = g && g.variants.find(x=>x.id===variantId);
      if(v) enqueueSync('good_variants','update', { id: v.id, qty: v.qty });
    });
    logAudit('sale_return', `Returned items worth ${fmtMoney(refundTotal)} from sale #${s.id.slice(-6).toUpperCase()}`);
    toast('Return processed ✅'); closeSheet(); render();
  });
}

  T(fmtDate(b.checkOut), W-PAD, 'right'); y += 16;
  T('Nights', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(String(b.nights), W-PAD, 'right'); y += 18;
  L(PAD, y, W-PAD, y); y += 22;

  T('TOTAL', PAD, 'left', '800 15px Arial,Helvetica,sans-serif', '#12213B');
  T(fmtMoneyCanvas(b.totalAmount), W-PAD, 'right'); y += 20;
  T('PAID', PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#2E7D32');
  T(fmtMoneyCanvas(b.paidAmount), W-PAD, 'right'); y += 18;
  if(b.balance>0){

  } else {
    T('PAID IN FULL', PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#2E7D32'); y += 18;
  }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T(shop.receiptFooter||'Thank you for staying with us!', W/2, 'center', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  y += 16;
  y += 12; // bottom padding
  return y;
}
async function drawLodgingReceiptToCanvas(canvas, b, r, shop, seller){
  const logoImg = await getLogoImage();
  const W = 380, scale = 2;
  const h = layoutAndDrawLodgingReceipt(b, r, shop, seller, null, logoImg);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFF7EA'; ctx.fillRect(0,0,W,h);
  drawSecurityTint(ctx, W, h, shop.name.toUpperCase());
  layoutAndDrawLodgingReceipt(b, r, shop, seller, ctx, logoImg);
}

/* ============================================================
   BILL PAYMENTS — VTU / bills powered by Bigisub (api.bigisub.ng)
   ============================================================
   Bigisub is called ONLY from the bigisub-proxy Supabase Edge Function —
   never from this file — because the Bigisub partner token and
   transaction PIN are shared platform-wide secrets that must never reach
   the browser. This file collects what the shop wants to buy, shows a
   cost breakdown (what leaves your Bill Wallet is simply Bigisub's own
   cost — no markup layer on this side), and posts that to the edge
   function, which does the actual
   Bigisub call, debits bill_wallet_balance, and logs the transaction.

   Cable TV, Electricity, Betting, and ISP-Smile are VERIFY-THEN-CHARGE
   flows: you confirm the customer's name/account first, then charge.
   Betting's validation_reference is short-lived — fund is called right
   after validate, never delayed or cached across screens.

   Field names differ across services (Bigisub's API, not a bug here):
   pin vs pin_code, Customer vs Customer_name vs customer_name, etc. —
   see bigisub-proxy/index.ts for the full rundown.
   ============================================================ */
// BIGISUB_FN_URL intentionally NOT declared here as a top-level const —
// SITE_CONTENT_URL isn't defined until much later in this file (the
// Supabase client setup block), and a top-level const referencing it here
// would throw "Cannot access before initialization" the instant the page
// loads, before anything ever renders. Computed lazily inside
// callBigisub() below instead, where it's only ever evaluated well after
// the whole script — including that later block — has already run.
// Bigisub's documented network ids: 1 MTN, 2 GLO, 3 AIRTEL, 4 9MOBILE.
// (This list previously had 3 and 4 swapped, which could send an Airtel purchase as 9mobile.)
const BIGISUB_NETWORKS = [ {id:1,name:'MTN'}, {id:2,name:'GLO'}, {id:3,name:'AIRTEL'}, {id:4,name:'9MOBILE'} ];
// The data-plan list carries each plan's network id AND name, so use it to double-check the ids above
// and correct them if Bigisub's live ids ever differ from its documentation.
function bpSyncNetworkIds(plans){
  const norm = x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace('ETISALAT','9MOBILE');
  (plans||[]).forEach(p=>{
    const nm = norm(p && (p.network_name || p.networkName)); const id = Number(p && p.network);
    if(!nm || !Number.isFinite(id)) return;
    const hit = BIGISUB_NETWORKS.find(n=>norm(n.name)===nm);
    if(hit && hit.id !== id){ console.warn('Network id corrected from live data:', hit.name, hit.id, '→', id); hit.id = id; }
  });
}

// Bigisub dashboard if a purchase comes back "wrong network".

// all 8 confirm buttons below. This is deliberately state (checked when
// rendering each button), not just an imperative btn.disabled=true set at
// click time — because render() fully rebuilds the #app DOM on every call,
// including from the background sync engine (see pullSync in

function billGetClientRef(){

// Records which locally-logged-in user made a Bill Payments/VTU purchase,
// keyed by the client_ref sent with that purchase. The remote history
// (list_transactions) is expected to echo that same reference back per
// transaction — see billTxMadeByName() — so the receipt can later show
// "Processed by <name>" for anything bought from this device.
function billRecordTxAttribution(clientRef){
  const u = currentUser();
  if(!u) return;
  state.billTxAttribution[clientRef] = { name: (u.firstName+' '+u.lastName).trim(), userId: u.id };
  save();
}
// Resolves who made a given transaction, for the receipt: prefers a name
// the backend itself returns (if it ever does), otherwise falls back to
// this device's local attribution map matched by reference/client_ref.
// Transactions made before this feature existed (or from another device)
// simply won't have a match, and the receipt just omits the line.
function billTxMadeByName(tx){
  if(tx.initiated_by_name) return tx.initiated_by_name;
  const ref = tx.client_ref || tx.client_reference || tx.tx_ref || tx.reference || tx.id;
  const rec = ref && state.billTxAttribution[ref];
  return rec ? rec.name : null;
}

// The wallet, bills and funding talk to the server as the signed-in Supabase user. A phone can be unlocked with the
// local password/PIN while that online sign-in is missing (expired, cleared, or done in a different browser), and
// then the wallet will not load until the person signs in again. Instead of sending them to Chrome, ask for the
// password once, here, and sign in again.
let reconnectPromise = null;
async function reconnectOnline(){
  const u = currentUser();
  if(!u || !u.email || !navigator.onLine || !window.sb) return null;
  const pass = await appPrompt('Please enter your password to reconnect your account online.', '', { password:true, okText:'Reconnect', cancelText:'Not now' });
  if(!pass) return null;
  try{
    const { data, error } = await window.sb.auth.signInWithPassword({ email: u.email, password: pass });
    if(error || !data || !data.session){ toast('Wrong password — could not reconnect.'); return null; }
    toast('Reconnected ✅');
    return data.session.access_token;
  }catch(e){ return null; }
}
async function bigisubAuthToken(){
  const { data } = await window.sb.auth.getSession();
  if(data && data.session) return data.session.access_token;
  if(!reconnectPromise) reconnectPromise = reconnectOnline().finally(()=>{ reconnectPromise = null; });
  return await reconnectPromise;
}

async function callBigisub(action, params){
  if(!navigator.onLine) throw new Error('You need an internet connection for bill payments.');
  const token = await bigisubAuthToken();
  if(!token) throw new Error('Please log in online first (bill payments need a live connection).');
  // 30s ceiling so a hung connection can't leave a screen stuck forever,
  // and a raw browser "Failed to fetch" is translated into something a
  // person can act on. NOTE for purchases: a timeout doesn't prove the
  // purchase failed (the server may still have completed it), hence the
  // wording pointing at Transaction History instead of just "try again".
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 30000);
  let res;
  try{
    res = await fetch(`${SITE_CONTENT_URL}/functions/v1/bigisub-proxy`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ action, ...params }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError') throw new Error('The server took too long to respond. If you were making a purchase, check Transaction History before trying again.');
    throw new Error("Couldn't reach the server. Check your internet connection and try again.");
  }
  clearTimeout(timer);
  let result;
  try{ result = await res.json(); }catch(e){ throw new Error(`Unexpected response from server (${res.status}).`); }
  if(!res.ok || result.error) throw new Error(result.error || result.message || `Server error (${res.status}).`);
  return result;
}

// There is no business-side markup, flat fee, or price override anymore —
// this app charges each business exactly what Bigisub costs (the platform
// may add its own invisible cut server-side; that's never shown here).
// billCustomerPrice/billPreviewPrice are kept as pass-throughs, rather
// than deleted outright and every call site rewired, purely to keep this
// change small and low-risk — the server (computeSalePrice) is the only
// place that actually decides the real charge either way.
// One final total per purchase. Plan lists arrive from the server with
// `display_price` already holding that total, so nothing is added here —
// EXCEPT electricity, where the person types the amount: the server's flat
// amount (billSurcharge, from the wallet summary) is folded into the single
// total shown, never labelled or itemised.
let billFees = {};   // per-service fee rules from the server (set by Super Admin)
function billFeeFor(service, cost, qty){
  const f = billFees[service];
  if(!f || !f.enabled || !(Number(f.fee_value) > 0)) return Math.ceil(cost);
  if(f.fee_type === 'percent') return Math.ceil(cost * (1 + Number(f.fee_value)/100));
  const units = (service === 'result_checker' || service === 'isp_spectranet') ? Math.max(1, qty||1) : 1;
  return Math.ceil(cost + Number(f.fee_value) * units);
}
// Typed-amount services (airtime, electricity, betting) are priced here; plan lists arrive priced by the server.
function billPreviewPrice(pricingService, planKey, quantity, costPrice){
  return (pricingService === 'airtime' || pricingService === 'electricity' || pricingService === 'betting') && costPrice > 0
    ? billFeeFor(pricingService, costPrice, 1) : costPrice;
}
function billCustomerPrice(costPrice){ return costPrice; }
// Smallest amount each typed-amount service accepts.
const BILL_MIN = { airtime: 50, electricity: 500, betting: 1 };

function bigisubNormKey(k){ return String(k).toLowerCase().replace(/[^a-z0-9]/g,''); }
function bigisubFirst(obj, keys){
  if(!obj || typeof obj !== 'object') return null;
  const byNorm = {};
  for(const k of Object.keys(obj)) byNorm[bigisubNormKey(k)] = obj[k];
  for(const want of keys){
    const v = byNorm[bigisubNormKey(want)];
    if(v !== undefined && v !== null && typeof v !== 'object' && String(v).trim() !== '') return v;
  }
  return null;
}
function bigisubPlanDisabled(p){
  const v = p && p.plan_disabled;
  return v === true || v === 1 || String(v).toLowerCase() === 'true' || String(v) === '1';
}
function bigisubPlanPrice(p){
  const v = bigisubFirst(p, ['display_price','amount','price','plan_amount','plan_price','selling_price','cost','cost_price','api_price','user_price','reseller_price']);
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
// Bigisub lists the same provider under several spellings ("dstv" and
// "DSTV"). Everything is keyed on the lowercase form so they merge.
function bigisubCableProvider(p){
  const v = bigisubFirst(p, ['provider','cable_type','cable_name','cablename','cable','provider_name','biller','company']);
  return v == null ? v : String(v).trim().toLowerCase();
}
function bigisubCableName(key){
  const names = { dstv:'DStv', gotv:'GOtv', startimes:'StarTimes', showmax:'Showmax' };
  const k = String(key||'').toLowerCase();
  return names[k] || (k.charAt(0).toUpperCase()+k.slice(1));
}
// Each cable plan once: same provider + same product code (or name) + same price.
function bigisubDedupeCablePlans(plans){
  const seen = new Set(), out = [];
  for(const p of (plans||[])){
    if(bigisubPlanDisabled(p)) continue;
    const key = [bigisubCableProvider(p), String(p.variation_code || p.product_name || p.name || p.id).toLowerCase(), bigisubPlanPrice(p)].join('|');
    if(seen.has(key)) continue;
    seen.add(key); out.push(p);
  }
  return out;
}
// Verification responses: prefer the flat customer_name the server sends,
// but fall back to searching the raw upstream payload at any depth.
function bigisubDeepFindByKeys(obj, keys, depth){
  depth = depth || 0;
  if(!obj || typeof obj !== 'object' || depth > 6) return '';
  const direct = bigisubFirst(obj, keys);
  if(direct != null) return String(direct).trim();
  for(const v of Object.values(obj)){
    if(v && typeof v === 'object'){
      const f = bigisubDeepFindByKeys(v, keys, depth + 1);
      if(f) return f;
    }
  }
  return '';
}
function bigisubNameFromResponse(r){
  if(r && typeof r.customer_name === 'string' && r.customer_name.trim()) return r.customer_name.trim();
  return bigisubDeepFindByKeys(r && r.raw, ['customer_name','customername','customer','account_name','accountname','subscriber_name','subscriber','card_holder','cardholder','owner','full_name','fullname','client_name','name']);
}
// Bigisub sometimes answers HTTP 200 with a failure explained inside the
// body — surface THAT reason instead of a generic "couldn't verify".
function bigisubUpstreamMessage(raw){
  return bigisubDeepFindByKeys(raw, ['message','msg','error','detail','description']);
}

// Does NOT auto-retry on failure (see the two call sites that gate on
// billWalletError below) — it used to: a failed load left
// billWalletBalance at null with nothing else changed, and this function
// is triggered from the Home dashboard, which re-renders on almost any
// action anywhere in the app. Every one of those re-renders re-triggered
// this exact same auto-load condition again, immediately — a flood of
// simultaneous requests hammering the server (confirmed in Supabase's own
// logs: dozens of POSTs to bigisub-proxy in the same second, all failing
// with 502s from the server being overwhelmed) that looked to the person
// using the app like "Failed to fetch" and "throttling" on everything.
async function bpLoadWallet(){
  billLoading = true; billWalletError = null; refreshMain();
  try{
    const r = await callBigisub('my_wallet_summary', {});
    billWalletBalance = r.wallet_balance; billCurrency = r.currency || 'NGN';
    billPinSet = !!r.bill_pin_set; billPinStatusLoaded = true;
    if(r.bill_fees) billFees = r.bill_fees;
    if(r.psa_account_number){ billPsaAccountNumber = r.psa_account_number; billPsaBankName = r.psa_bank_name; if(r.psa_account_name) billPsaAccountName = r.psa_account_name; }
    bpCheckPendingSquad(false); // came back from the Squad checkout? confirm and credit
  }catch(e){ billWalletError = e.message || 'Something went wrong.'; }
  billLoading = false; refreshMain();
}

// Separate edge function, not part of bigisub-proxy — it's the same
// Termii email-OTP setup already used for password reset, just scoped to
// the Bill Payments PIN with its own table so codes can't cross flows.
async function billSendPinOtp(){
  if(billPinOtpSending) return;
  billPinOtpSending = true; refreshMain();
  try{
    const token = await bigisubAuthToken();
    if(!token) throw new Error('Please log in online first.');
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/send-bill-pin-otp`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey': SITE_CONTENT_ANON_KEY },
    });
    const result = await res.json();
    if(!res.ok || result.error) throw new Error(result.error || 'Could not send the code.');
    billPinOtpSent = true; billPinOtpMaskedEmail = result.sent_to || 'your email'; billPinOtpDraft = '';
    toast('Code sent ✅');
  }catch(e){ toast(e.message); }
  billPinOtpSending = false; refreshMain();
}

function bindBillPaymentsEvents(){
  if(billScreen==='hub'){
    if(billWalletBalance===null && !billLoading && !billWalletError) bpLoadWallet();
    const walletRetryBtn2 = document.getElementById('bp-wallet-retry-btn');
    if(walletRetryBtn2) walletRetryBtn2.addEventListener('click', ()=> bpLoadWallet());
    document.querySelectorAll('[data-bp-tile]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(billTileNavLock) return;
        billTileNavLock = true; setTimeout(()=>{ billTileNavLock = false; }, 400);
        billScreen = el.dataset.bpTile; billResetForm(); refreshMain();
      });
    });
    const goHist = document.querySelector('[data-bp-goto="history"]');
    if(goHist) goHist.addEventListener('click', ()=>{ billScreen='history'; billHistory=[]; billTopups=[]; billHistoryLoaded=false; billHistoryError=null; refreshMain(); });
    const bpEye = document.getElementById('bp-eye');
    if(bpEye) bpEye.addEventListener('click', ()=>{ toggleCardHidden('billwallet'); });
    const topupBtn = document.getElementById('bp-topup-btn');
    if(topupBtn) topupBtn.addEventListener('click', ()=>{ billScreen='topup'; refreshMain(); });
    const historyBtn = document.getElementById('bp-history-btn');
    if(historyBtn) historyBtn.addEventListener('click', ()=>{ billScreen='history'; billHistory=[]; billTopups=[]; billHistoryLoaded=false; billHistoryError=null; refreshMain(); });
    return;
  }
  const back = document.getElementById('bp-back');
  if(back) back.addEventListener('click', ()=>{ billScreen='hub'; refreshMain(); });
  if(billScreen==='topup') bindBillTopupEvents();
  if(billScreen==='airtime') bindBillAirtimeEvents();
  if(billScreen==='data') bindBillDataEvents();
  if(billScreen==='cable') bindBillCableEvents();
  if(billScreen==='electricity') bindBillElectricityEvents();
  if(billScreen==='betting') bindBillBettingEvents();
  if(billScreen==='resultchecker') bindBillResultCheckerEvents();
  if(billScreen==='isp') bindBillIspEvents();
  if(billScreen==='history') bindBillHistoryEvents();
  if(billScreen==='success') bindBillSuccessEvents();
  bindBpAlertEvents();
}

// ---- Card 2: pay now (card / bank / USSD / transfer) ----
async function callSquad(action, params, timeoutMs){
  if(!navigator.onLine) throw new Error('You need an internet connection to fund your wallet.');
  const token = await bigisubAuthToken();
  if(!token) throw new Error('Please log in online first.');
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 30000);
  let res;
  try{
    res = await fetch(`${SITE_CONTENT_URL}/functions/v1/squad-initiate`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ action, ...params }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError') throw new Error('The server took too long to respond. If you were paying or opening an account, wait a minute and check again.');
    throw new Error("Couldn't reach the server. Check your internet connection and try again.");
  }
  clearTimeout(timer);
  let result;
  try{ result = await res.json(); }catch(e){ throw new Error(`Unexpected response from server (${res.status}).`); }
  if(!res.ok || result.error) throw new Error(result.error || `Server error (${res.status}).`);
  return result;
}

// Coming back from the checkout (or tapping "I've paid"): ask the server to confirm and credit.
// Safe to call any number of times — the credit itself is idempotent on the server.
async function bpCheckPendingSquad(manual){
  let ref = null;
  try{ ref = new URL(location.href).searchParams.get('squad_ref'); }catch(_e){}
  if(!ref){ try{ ref = localStorage.getItem(SQUAD_PENDING_KEY); }catch(_e){} }
  if(!ref || window.__sqChecking) return;
  if(!manual && Date.now() - (window.__sqLast||0) < 20000) return;   // re-renders must not retrigger this
  window.__sqLast = Date.now(); window.__sqChecking = true;
  const clear = ()=>{
    try{ localStorage.removeItem(SQUAD_PENDING_KEY); }catch(_e){}
    try{ const u = new URL(location.href); if(u.searchParams.has('squad_ref')){ u.searchParams.delete('squad_ref'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch(_e){}
  };
  try{
    let r = null;
    for(let i=0;i<4;i++){                              // the confirmation usually lands within seconds
      r = await callSquad('verify', { reference: ref });
      const st = String(r.status||'').toLowerCase();
      if(st === 'success' || (st && st !== 'pending' && st !== 'abandoned')) break;
      await new Promise(res=>setTimeout(res, 2500));
    }
    const st = String((r && r.status)||'').toLowerCase();
    window.__sqLastStatus = st;
    if(st === 'success'){
      if(r.wallet_balance != null) billWalletBalance = r.wallet_balance;
      clear(); logAudit('bill_wallet_topup', `Funded bill wallet by card/bank payment (${ref})`);
      toast('Payment confirmed — your wallet has been credited ✅');
    }else if(st === 'failed'){
      clear(); toast("That payment wasn't completed. You have not been charged.");
    }else if(manual){
      toast("We haven't received confirmation yet. If you've paid, wait a minute and tap again.");
    }
  }catch(e){ if(manual) toast(e.message); }
  window.__sqChecking = false;
  const finalSt = String((window.__sqLastStatus)||'');
  if(manual || finalSt === 'success' || finalSt === 'failed'){ if(typeof refreshMain === 'function') refreshMain(); }
}

function bindBillTopupEvents(){
  if((billVa && billVa.account) && !billPsaPollTimer) bpStartPsaPolling();
  if(!billVaLoading && Date.now() - billVaLoadedAt > 60000) bpLoadVaStatus();

  // ---- accordion + "Good to know" ----

  const gtk = document.getElementById('bp-gtk');

  });

  // ---- dedicated account ----
  const vaOpen = document.getElementById('bp-va-open');
  if(vaOpen) vaOpen.addEventListener('click', ()=>{
    const cu = currentUser() || {};
    if(cu.role !== 'master') return toast('Only the business owner can open the dedicated account.');
    billVaError = ''; billVaOpen = true; refreshMain();
  });
  const vaCopy = document.getElementById('bp-va-copy');
  if(vaCopy) vaCopy.addEventListener('click', ()=>{ if(navigator.clipboard) navigator.clipboard.writeText(billVa.account.number); toast('Account number copied'); });
  const vaRefresh = document.getElementById('bp-va-refresh');
  if(vaRefresh) vaRefresh.addEventListener('click', ()=>bpSyncPsaWallet(true));

  if(billVaOpen){
    const track = (id, key, isCheck)=>{
      const el = document.getElementById(id); if(!el) return;
      const h = ()=>{ billVaDraft[key] = isCheck ? el.checked : el.value; };
      el.addEventListener('input', h); el.addEventListener('change', h);
    };
    track('bp-va-bvn','bvn'); track('bp-va-dob','dob'); track('bp-va-fn','fn'); track('bp-va-ln','ln');
    track('bp-va-phone','phone'); track('bp-va-email','email'); track('bp-va-consent','consent', true);

    const cancel = document.getElementById('bp-va-cancel');
    if(cancel) cancel.addEventListener('click', ()=>{ if(billVaBusy) return; bpResetVaForm(); refreshMain(); });
    const showErr = (m)=>{ const e = document.getElementById('bp-va-err'); if(e){ e.textContent = m; e.style.display = m ? '' : 'none'; } };
    const submit = document.getElementById('bp-va-submit');
    if(submit) submit.addEventListener('click', async ()=>{
      if(billVaBusy) return;
      const cu = currentUser() || {};
      const d = billVaDraft;
      const get = (id, key, fallback)=>{ const el = document.getElementById(id); return (el ? el.value : (d[key] !== null ? d[key] : fallback)) || ''; };
      const bvn = get('bp-va-bvn','bvn','').replace(/\s/g,'');
      const dob = get('bp-va-dob','dob','');
      const fn = get('bp-va-fn','fn',cu.firstName).trim(), ln = get('bp-va-ln','ln',cu.lastName).trim();
      const phone = get('bp-va-phone','phone',cu.phone).trim(), email = get('bp-va-email','email',cu.email).trim();
      const consentEl = document.getElementById('bp-va-consent'); const consent = consentEl ? consentEl.checked : !!d.consent;
      if(!/^\d{11}$/.test(bvn)) return showErr('Your BVN must be exactly 11 digits.');
      if(!dob) return showErr('Please enter your date of birth.');
      const dobDate = new Date(dob + 'T00:00:00'); const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear()-18);
      if(isNaN(dobDate) || dobDate > cutoff) return showErr('You must be 18 or older to open a dedicated account.');
      if(!fn || !ln) return showErr('Please enter your first and last name as on your BVN.');
      if(!/^\+?\d[\d\s-]{8,17}$/.test(phone)) return showErr('Please enter a valid phone number.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Please enter a valid email address.');
      if(!consent) return showErr('Please tick the box to agree before continuing.');
      showErr('');
      billVaBusy = true; billVaError = ''; refreshMain();
      try{
        const r = await callSquad('create_virtual_account', { bvn, dob, first_name: fn, last_name: ln, phone, email, consent: true }, 60000);
        billVa = Object.assign({}, billVa || {}, { account: r.account });
        billAcc = 'squad';                                 // show the new account number straight away
        bpResetVaForm();                                   // clears the BVN/DOB from memory
        logAudit('bill_wallet_squad_account', `Opened dedicated account ${r.account.number}`);
        toast('Your dedicated account is ready ✅');
        bpStartPsaPolling();
      }catch(e){
        billVaError = e.message || 'Something went wrong. Please try again.';
        billVaBusy = false;
        bpLoadVaStatus();                                  // refresh "attempts left" quietly
      }
      refreshMain();
    });
  }

  const psaSetupBtn = document.getElementById('bp-psa-setup');
  if(psaSetupBtn) psaSetupBtn.addEventListener('click', async ()=>{
    billPsaLoading = true; refreshMain();
    try{
      const r = await callBigisub('get_or_create_psa_account', {});
      billPsaAccountNumber = r.account_number; billPsaBankName = r.bank_name; if(r.account_name) billPsaAccountName = r.account_name;
      logAudit('bill_wallet_psa_setup', `Set up top-up account ${r.account_number}`);
      bpStartPsaPolling();
    }catch(e){ toast(e.message); }
    billPsaLoading = false; refreshMain();
  });
  const psaCopyBtn = document.getElementById('bp-psa-copy');
  if(psaCopyBtn) psaCopyBtn.addEventListener('click', ()=>{
    if(navigator.clipboard) navigator.clipboard.writeText(billPsaAccountNumber);
    toast('Account number copied');
  });
  const psaSyncBtn = document.getElementById('bp-psa-sync');
  if(psaSyncBtn) psaSyncBtn.addEventListener('click', ()=>bpSyncPsaWallet(true));

  // ---- Pay now ----
  const sqAmt = document.getElementById('bp-sq-amount');
  if(sqAmt) sqAmt.addEventListener('input', ()=>{ billSqAmount = sqAmt.value; bpSquadSchedulePreview(); });
  document.querySelectorAll('[data-sq-amt]').forEach(b=>b.addEventListener('click', ()=>{
    billSqAmount = b.dataset.sqAmt; if(sqAmt) sqAmt.value = billSqAmount; bpSquadSchedulePreview();
  }));
  const sqPay = document.getElementById('bp-sq-pay');
  if(sqPay) sqPay.addEventListener('click', async ()=>{
    if(billSqBusy) return;
    const amount = Number(billSqAmount||0);
    if(!(amount > 0)) return toast('Enter the amount you want to add.');
    billSqBusy = true; refreshMain();
    try{
      const r = await callSquad('initiate', { amount });
      try{ localStorage.setItem(SQUAD_PENDING_KEY, r.reference); }catch(_e){}
      window.location.href = r.checkout_url;           // hosted checkout; it returns here when done
      return;
    }catch(e){ toast(e.message); }
    billSqBusy = false; refreshMain();
  });
  const sqCheck = document.getElementById('bp-sq-check');
  if(sqCheck) sqCheck.addEventListener('click', ()=>bpCheckPendingSquad(true));
  bpCheckPendingSquad(false);
}

// Re-reads the wallet balance (sync_psa_wallet also catches any transfer
// whose notice was missed). A rise in balance means money just landed.
async function bpSyncPsaWallet(manual){
  if(billPsaSyncing) return;
  billPsaSyncing = true; if(manual) refreshMain();
  try{
    const before = Number(billWalletBalance || 0);
    const r = await callBigisub('my_wallet_summary', {});
    billWalletBalance = r.wallet_balance;
    if(r.warning && !window.__psaWarned){ window.__psaWarned = true; toast(r.warning); }
    const added = Number(r.wallet_balance || 0) - before;
    if(added > 0){
      logAudit('bill_wallet_topup', `Funded bill wallet with ${fmtMoney(added)}`);
      toast(`${fmtMoney(added)} added to your wallet ✅`);
    } else if(manual){
      toast('No new transfers yet.');
    }
  }catch(e){ if(manual) toast(e.message); }
  billPsaSyncing = false;
  if(manual || !(billVaOpen || (document.activeElement && document.activeElement.id === 'bp-sq-amount'))) refreshMain();
}
function bpStartPsaPolling(){
  bpStopPsaPolling(); // clear any previous timer first
  billPsaPollTimer = setInterval(()=>{
    if(!(billVa && billVa.account) || billScreen!=='topup'){ bpStopPsaPolling(); return; }
    if(billVaOpen) return;   // don't re-render under someone who is typing
    bpSyncPsaWallet(false);
  }, 8000);
}
window.addEventListener('load', ()=>{ try{ if(new URL(location.href).searchParams.get('squad_ref')){ billAcc = 'pay'; setTimeout(()=>{ bpCheckPendingSquad(false); }, 2500); } }catch(_e){} });
function bpStopPsaPolling(){
  if(billPsaPollTimer){ clearInterval(billPsaPollTimer); billPsaPollTimer=null; }
}

/* ---- Beneficiaries: numbers/IDs used before, saved on this device per business ---- */
function bpBenKey(type){ return 'zeeshop_ben_' + ((business() && business().id) || 'x') + '_' + type; }
function bpBenList(type){ try{ return JSON.parse(localStorage.getItem(bpBenKey(type)) || '[]'); }catch(_e){ return []; } }
// Phone numbers are always stored as 11-digit local numbers (+234 80… and 080… are the same person).
function bpBenNorm(type, v){
  let s = String(v||'').trim();
  if(type === 'phone'){
    let d = s.replace(/\D/g,'');
    if(d.startsWith('234')) d = '0' + d.slice(3);      // +234 81… (even half-typed) means 081…
    return d;
  }
  return s;
}
function bpBenSave(type, value, label){
  value = bpBenNorm(type, value); if(!value) return;
  const prev = bpBenList(type).find(b=>bpBenNorm(type, b.value) === value);
  const list = bpBenList(type).filter(b=>bpBenNorm(type, b.value) !== value);
  list.unshift({ value, label: label || (prev && prev.label) || '' });     // most recently used first
  try{ localStorage.setItem(bpBenKey(type), JSON.stringify(list.slice(0, 30))); }catch(_e){}
  // Also keep it on the server, so it is still there after logout / on another phone.
  callBigisub('ben_save', { type, value, label: label || (prev && prev.label) || '' }).catch(()=>{});
}
const BP_BEN_TYPES = ['phone','card','meter','bet','smile','spectranet'];
let bpBenSynced = false;
// Pull the saved numbers from the server (once per session) and merge them with this phone's list.
async function bpBenSync(){
  if(bpBenSynced || !navigator.onLine) return;
  bpBenSynced = true;
  try{
    const r = await callBigisub('ben_list', {});
    const items = (r && r.items) || [];
    let changed = false;
    BP_BEN_TYPES.forEach(t=>{
      const server = items.filter(i=>i.type===t).map(i=>({ value:i.value, label:i.label||'' }));
      const local = bpBenList(t);
      const seen = new Set(server.map(b=>bpBenNorm(t, b.value)));
      const localOnly = local.filter(b=>!seen.has(bpBenNorm(t, b.value)));
      const merged = server.concat(localOnly).slice(0, 30);
      if(JSON.stringify(merged) !== JSON.stringify(local)){ try{ localStorage.setItem(bpBenKey(t), JSON.stringify(merged)); changed = true; }catch(_e){} }
      localOnly.forEach(b=>callBigisub('ben_save', { type:t, value:b.value, label:b.label }).catch(()=>{}));   // numbers saved before the server copy existed
    });
    if(changed && route==='billpayments') refreshMain();
  }catch(_e){ bpBenSynced = false; }
}
function bpBenRemove(type, value){
  try{ localStorage.setItem(bpBenKey(type), JSON.stringify(bpBenList(type).filter(b=>b.value !== value))); }catch(_e){}
  callBigisub('ben_remove', { type, value }).catch(()=>{});
}

function bpBenLink(type){
  const recent = bpBenList(type).slice(0, 4);
  const chips = recent.length ? `<div class="bps-chips">${recent.map(b=>`<button type="button" class="bps-chip" data-ben-chip="${type}" data-v="${escAttr(b.value)}">${escapeHtml(b.value)}${b.label?`<small>${escapeHtml(b.label)}</small>`:''}</button>`).join('')}</div>` : '';
