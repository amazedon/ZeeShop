/**
 * Turns off auto-renewal and deactivates the saved card — called from
 * Settings. Deliberately deactivates rather than deletes the card row,
 * so auto_renewal_log entries keep working, but is_active:false means
 * process-auto-renewals will never charge it again unless they opt in fresh.
 */
const VAPID_PUBLIC_KEY = 'BOSZO0_OtfKUOFYiw2ppugzAlPDHpn7IlntESwoe4_eMe9QB5ijutQGTmgL6GTSvqC34XrE3OBYAe46EJtNJO7w';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

/**
 * Asks for notification permission and subscribes this device, saving
 * the subscription to Supabase so the alert/broadcast Edge Functions
 * can reach it later. Needs internet + a live session (same as any
 * other server-touching action) — silently no-ops without either.
 */
async function enablePushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    toast('Push notifications aren\'t supported on this browser.');
    return false;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ toast('Notifications permission was not granted.'); return false; }

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const { data: sessionData } = await window.sb.auth.getSession();
    if(!sessionData.session){ toast('Please log in online once first, then try again.'); return false; }

    const subJson = sub.toJSON();
    await fetch(`${SITE_CONTENT_URL}/rest/v1/push_subscriptions`, {
      method: 'POST',
      headers: {
        'Content-Type':'application/json', 'Authorization':'Bearer '+sessionData.session.access_token,
        'apikey': SITE_CONTENT_ANON_KEY, 'Prefer':'return=minimal,resolution=merge-duplicates'
      },
      body: JSON.stringify({
        business_id: business().id, user_id: state.sessionUserId,
        endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth_key: subJson.keys.auth, is_active: true
      })
    });
    business().pushEnabled = true;
    save();
    toast('Notifications enabled ✅');
    return true;
  }catch(e){
    toast('Could not enable notifications — please try again.');
    return false;
  }
}

async function disablePushNotifications(){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        const { data: sessionData } = await window.sb.auth.getSession();
        if(sessionData.session){
          await fetch(`${SITE_CONTENT_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
            method: 'DELETE',
            headers: { 'Authorization':'Bearer '+sessionData.session.access_token, 'apikey': SITE_CONTENT_ANON_KEY }
          }).catch(()=>{});
        }
        await sub.unsubscribe();
      }
    }
    business().pushEnabled = false;
    save(); render();
    toast('Notifications turned off.');
  }catch(e){
    toast('Could not turn off notifications — check your connection and try again.');
  }
}

async function disableAutoRenew(){

  try{

    if(!accessToken){ toast('You need internet and to be logged in online to change this.'); return; }
    const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+accessToken, 'apikey': SITE_CONTENT_ANON_KEY, 'Prefer':'return=minimal' };
    await fetch(`${SITE_CONTENT_URL}/rest/v1/saved_payment_methods?business_id=eq.${business().id}`, {

    });
    await fetch(`${SITE_CONTENT_URL}/rest/v1/businesses?id=eq.${business().id}`, {
      method: 'PATCH', headers, body: JSON.stringify({ auto_renew_enabled: false })
    });

    render();

async function verifyAndApplyPayment(transactionId, plan, interval, amount, currency){
  toast('Confirming payment…');
  try{
    const { data: sessionData } = await window.sb.auth.getSession();
    const token = sessionData.session ? sessionData.session.access_token : null;
    if(!token){
      toast('Payment received, but you need to log in online once to activate the plan — please log in again with internet on.');
      return;
    }
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/verify-payment`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ transaction_id: transactionId, plan, interval, expected_amount: amount, expected_currency: currency })
    });
    const result = await res.json();
    if(result.verified){
      business().subscriptionPlan = plan;
      business().subscriptionExpiresAt = result.expires_at;
      logAudit('subscription','Upgraded to '+plan+' ('+interval+')');
      closeSheet();
      render();
      toast('Payment confirmed — you\'re now on the '+(plan==='pro'?'Pro':'Boss')+' plan!');
      if(result.card_token){
        offerAutoRenewOptIn(result, plan, interval, token);
      }
    } else {
      toast('Payment could not be verified: '+(result.error||'please contact support.'));
    }
  }catch(e){
    toast('Could not confirm payment — if you were charged, please contact support.');
  }
}
function exportCSV(){
  const rows = [['Sale ID','Date','Customer','Subtotal','Paid','Balance','Status','Sold By']];
  state.sales.filter(s=>s.shopId===state.currentShopId).forEach(s=>{
    const cust = state.customers.find(c=>c.id===s.customerId);

    rows.push([s.id, s.date, cust?cust.fullName:'Walk-in', s.subtotal, s.paidAmount, s.balance, s.status, seller?seller.firstName:'']);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='zeeshop_sales_export.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Export downloaded ✅');
}

function saveNoteFromForm(existingId){
  const title = document.getElementById('note-title').value.trim();
  const text = document.getElementById('note-text').value.trim();
  const isHandover = document.getElementById('note-handover').checked;
  if(!title){ toast('Please give this note a title.'); return; }
  if(existingId){
    const n = state.shopNotes.find(x=>x.id===existingId);
    n.title = title; n.text = text; n.isHandover = isHandover; n.updatedAt = new Date().toISOString();
    enqueueSync('shop_notes','update', { id: n.id, title: n.title, text: n.text, is_handover: n.isHandover, updated_at: n.updatedAt });
    logAudit('note_edited', 'Edited note: '+title);
    toast('Note updated ✅');
  } else {
    const noteId = uid('note');
    state.shopNotes.push({ id: noteId, businessId: business().id, shopId: state.currentShopId,
      authorUserId: state.sessionUserId, title, text, isHandover, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    enqueueSync('shop_notes','insert', {
      id: noteId, business_id: business().id, shop_id: state.currentShopId,
      author_user_id: state.sessionUserId, title, text, is_handover: isHandover
    });
    logAudit('note_added', 'Added note: '+title);
    toast('Note saved ✅');
  }
  closeSheet(); render();
}
function deleteNote(id){
  if(!confirm('Delete this note? This cannot be undone.')) return;
  state.shopNotes = state.shopNotes.filter(x=>x.id!==id);
  enqueueSync('shop_notes','delete', { id });
  logAudit('note_deleted', 'Deleted a note');
  toast('Note deleted');
  render();
}

const HISTORY_TYPE_LABELS = {sale:'SALE', credit:'CREDIT', voided:'VOIDED', supplier:'SUPPLIER', expense:'EXPENSE', adjustment:'CORRECTION'};
function openHistoryShareModal(){

function layoutAndDrawHistory(filterLabel, dateLabel, ctx){
  const W = 380, PAD = 22;
  const MAX_ROWS = 60;
  const events = __lastHistoryEvents.slice(0, MAX_ROWS);
  const truncated = __lastHistoryEvents.length > MAX_ROWS;
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  T(currentShop() ? currentShop().name : '', W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14;
  T('History — '+filterLabel+' · '+dateLabel, W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 18;
  L(PAD, y, W-PAD, y); y += 20;

  events.forEach(e=>{
    const tag = '['+(HISTORY_TYPE_LABELS[e.type]||'')+']';
    T(tag, PAD, 'left', '700 9px Arial,Helvetica,sans-serif', '#9AA0AB');
    const nameWrapped = wrapPlainText(canvasSafeText(e.title), 28);
    T(nameWrapped[0]||'', PAD+38, 'left', '400 12px Arial,Helvetica,sans-serif', e.dim?'#B0B0B0':'#242B38');
    if(e.amount!=null) T(fmtMoneyCanvas(e.amount), W-PAD, 'right', '700 12px Arial,Helvetica,sans-serif', e.dim?'#B0B0B0':'#242B38');
    y += 15;
    T(canvasSafeText(e.subtitle)+' · '+fmtDate(e.date), PAD+38, 'left', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    y += 18;
  });
  if(truncated){
    T(`+ ${__lastHistoryEvents.length - MAX_ROWS} more not shown — see full history in the app`, PAD, 'left', 'italic 400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
    y += 18;
  }
  L(PAD, y, W-PAD, y); y += 20;

  // Per-type subtotals (voided sales excluded — they don't count toward money totals)
  const totals = {};
  __lastHistoryEvents.forEach(e=>{
    if(e.type==='voided') return;
    totals[e.type] = (totals[e.type]||0) + e.amount;
  });
  T('SUMMARY', PAD, 'left', '700 10px Arial,Helvetica,sans-serif', '#9AA0AB'); y += 16;
  Object.keys(HISTORY_TYPE_LABELS).forEach(type=>{
    if(type==='voided' || !totals[type]) return;
    T(HISTORY_TYPE_LABELS[type], PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#242B38');
    T(fmtMoneyCanvas(totals[type]), W-PAD, 'right', '700 11.5px Arial,Helvetica,sans-serif', '#12213B');
    y += 17;
  });
  y += 10;
  T('Generated '+fmtDate(todayISO()), W/2, 'center', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB');
  y += 20;
  return y;
}
function drawHistoryToCanvas(canvas, filterLabel, dateLabel){
  const W = 380, scale = 2;
  const h = layoutAndDrawHistory(filterLabel, dateLabel, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawHistory(filterLabel, dateLabel, ctx);
}

// A simple standalone card for entry types that don't have their own full

function layoutAndDrawSingleCard(event, ctx){

  T('['+(HISTORY_TYPE_LABELS[event.type]||'')+']', W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 18;

function drawSingleCardToCanvas(canvas, event){

// Builds one File (image) per history entry — real receipts for sales/credit/
// voided sales, simple cards for everything else — so sharing sends each
// transaction as its own message/attachment instead of one bundled image.
// Draws a single history entry to a canvas — a real receipt for sales/credit/
// voided sales, or a simple card for supplier/expense entries. Shared by both
// the per-entry Share button and the "share whole list individually" action.
async function drawHistoryItemToCanvas(canvas, e){
  if(e.type==='sale' || e.type==='credit' || e.type==='voided'){
    const s = state.sales.find(x=>x.id===e.sourceId);
    if(s){
      const shop = state.shops.find(x=>x.id===s.shopId);
      const cust = s.customerId ? state.customers.find(c=>c.id===s.customerId) : null;
      const seller = state.users.find(u=>u.id===s.soldByUserId);
      await drawReceiptToCanvas(canvas, s, shop, cust, seller);
      return;
    }
  }
  drawSingleCardToCanvas(canvas, e);
}
async function buildIndividualHistoryFiles(events){
  const files = [];
  for(const e of events){
    const canvas = document.createElement('canvas');
    await drawHistoryItemToCanvas(canvas, e);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(blob) files.push(new File([blob], `${e.type}-${(e.sourceId||'').slice(-6)}.png`, {type:'image/png'}));
  }
  return files;
}

function voidSale(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!(isMaster() || (isStaff() && canDo('canVoidReturn') && s.soldByUserId===state.sessionUserId))){
    toast("You don't have permission to void this sale."); return;
  }
  const reason = prompt('Why are you voiding this sale? (e.g. entered by mistake)');
  if(reason===null) return;
  if(!confirm('This restores all items to stock and removes the sale from your totals. Continue?')) return;
  s.items.forEach(it=>{
    const remaining = it.qty - (it.returnedQty||0);
    if(remaining<=0) return;
    const g = state.goods.find(x=>x.id===it.goodId);
    if(!g) return;
    if(it.variantId){
      const v = (g.variants||[]).find(x=>x.id===it.variantId);
      if(v){ v.qty += remaining; enqueueSync('good_variants','update', { id: v.id, qty: v.qty }); }
    } else {
      const batch = g.batches.find(b=>b.id===it.batchId) || g.batches[0];
      if(batch){ batch.qtyRemaining += remaining; enqueueSync('good_batches','update', { id: batch.id, qty_remaining: batch.qtyRemaining }); }
    }
  });
  s.status = 'voided';
  s.voidReason = reason;
  s.voidedAt = new Date().toISOString();
  s.voidedBy = state.sessionUserId;
  enqueueSync('sales','update', { id: s.id, status: 'voided', balance: s.balance });
  logAudit('sale_voided', `Voided sale #${s.id.slice(-6).toUpperCase()} (${fmtMoney(s.subtotal)}): ${reason||'no reason given'}`);
  toast('Sale voided ✅'); closeSheet(); render();
}
function openReturnModal(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!(isMaster() || (isStaff() && canDo('canVoidReturn') && s.soldByUserId===state.sessionUserId))){
    toast("You don't have permission to return items from this sale."); return;
  }
  openSheet(`
    <div class="sheet-head"><h3>Process Return</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:14px;">Set how many of each item are being returned. Stock is restored and the sale total is reduced automatically.</p>
    ${s.items.map((it,idx)=>{
      const g = state.goods.find(x=>x.id===it.goodId);
      const maxReturn = it.qty - (it.returnedQty||0);
      const itemLabel = g ? (it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name) : '(deleted item)';
      return `<div class="field">
        <label>${itemLabel} <span class="subtle">(bought ${it.qty}${it.returnedQty?', '+it.returnedQty+' already returned':''})</span></label>
        <input type="number" min="0" max="${maxReturn}" value="0" id="ret-qty-${idx}" ${maxReturn<=0?'disabled':''}>
      </div>`;
    }).join('')}
    <button class="btn btn-danger" id="confirm-return">Confirm Return</button>
  `);
  document.getElementById('confirm-return').addEventListener('click', ()=>{
    let refundTotal = 0;
    let anyReturned = false;
    const restockedBatches = {}; // batchId -> goodId, for syncing the restock
    const restockedVariants = {}; // variantId -> goodId
    s.items.forEach((it,idx)=>{
      const input = document.getElementById('ret-qty-'+idx);
      const qty = input ? Number(input.value||0) : 0;
      const maxReturn = it.qty - (it.returnedQty||0);
      if(qty<=0) return;
      if(qty>maxReturn){ toast('Return quantity too high for one item.'); return; }
      anyReturned = true;
      it.returnedQty = (it.returnedQty||0) + qty;
      refundTotal += qty * it.priceUsed;
      const g = state.goods.find(x=>x.id===it.goodId);
      if(g){
        if(it.variantId){
          const v = (g.variants||[]).find(x=>x.id===it.variantId);
          if(v){ v.qty += qty; restockedVariants[v.id] = g.id; }
        } else {
          const batch = g.batches.find(b=>b.id===it.batchId) || g.batches[0];
          if(batch){ batch.qtyRemaining += qty; restockedBatches[batch.id] = g.id; }
        }
      }
    });
    if(!anyReturned){ toast('Enter a quantity to return for at least one item.'); return; }
    s.subtotal = Math.max(0, s.subtotal - refundTotal);
    s.paidAmount = Math.min(s.paidAmount, s.subtotal);
    s.balance = Math.max(0, s.subtotal - s.paidAmount);
    if(s.balance<=0) s.status='paid'; else if(s.paidAmount>0) s.status='partial'; else s.status='credit';
    // This whole block used to only update local state — a return processed
    // on one device never reached another (the sale kept showing its old
    // total, and restocked quantities never came back into the shared count).
    enqueueSync('sales','update', { id: s.id, subtotal: s.subtotal, paid_amount: s.paidAmount, balance: s.balance, status: s.status });
    s.items.forEach((it,idx)=>{
      const input = document.getElementById('ret-qty-'+idx);
      const qty = input ? Number(input.value||0) : 0;
      if(qty>0 && it.saleItemId) enqueueSync('sale_items','update', { id: it.saleItemId, returned_qty: it.returnedQty });
    });
    Object.keys(restockedBatches).forEach(batchId=>{
      const g = state.goods.find(x=>x.id===restockedBatches[batchId]);
      const b = g && g.batches.find(x=>x.id===batchId);
      if(b) enqueueSync('good_batches','update', { id: b.id, qty_remaining: b.qtyRemaining });
    });
    Object.keys(restockedVariants).forEach(variantId=>{
      const g = state.goods.find(x=>x.id===restockedVariants[variantId]);
      const v = g && g.variants.find(x=>x.id===variantId);
      if(v) enqueueSync('good_variants','update', { id: v.id, qty: v.qty });
    });
    logAudit('sale_return', `Returned items worth ${fmtMoney(refundTotal)} from sale #${s.id.slice(-6).toUpperCase()}`);
    toast('Return processed ✅'); closeSheet(); render();
  });
}

/* ============================================================
   EXPENSES — rent, transport, wages, restock, etc. Subtracted
   from sales to give a truer profit picture.

  const total = expenses.reduce((a,e)=>a+e.amount,0);

  return `
    ${subHeader("Expenses")}
    <div class="stat-grid">

    ${expenses.length===0?`<div class="empty"><div class="ic">${ICON_CASH}</div><b>No expenses logged</b>Track rent, transport, wages, and restocking costs here.</div>`:
    expenses.map(e=>`
      <div class="list-row">
        <div class="thumb">${ICON_CASH}</div>

}

/* ============================================================
   LODGING — rooms & guest bookings (Hotel / Lodging business type)
   Food, drinks and meat stock are tracked through the normal Goods
   module (batches + expiry dates), same as Restaurant/Bar/Butchery shops.
   This module adds the one thing Goods can't: rooms and who's in them.
   ============================================================ */
/* ---- lodging receipt: same canvas-receipt style as sales, security details left out ---- */
function layoutAndDrawLodgingReceipt(b, r, shop, seller, ctx, logoImg){
  const W = 380, PAD = 22;
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  if(logoImg){
    const logoSize = 50;
    if(ctx) ctx.drawImage(logoImg, PAD, y-20, logoSize, logoSize);
  }
  T(shop.name, W/2, 'center', '800 17px Arial,Helvetica,sans-serif', '#12213B'); y += 18;
  T('LODGING RECEIPT', W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 15;
  T(shop.address, W/2, 'center', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  if(shop.address) y += 14;
  if(shop.phone || shop.email){ T([shop.phone,shop.email].filter(Boolean).join('  ·  '), W/2, 'center'); y += 14; }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T('Receipt #'+b.id.slice(-6).toUpperCase(), PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#242B38');
  T(fmtDate(todayISO()), W-PAD, 'right', '400 12px Arial,Helvetica,sans-serif'); y += 17;
  T('Checked in by: '+seller.firstName+' '+seller.lastName, PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('Booking ID: '+b.id, PAD, 'left', '400 9px Arial,Helvetica,sans-serif', '#B0B5BD'); y += 13;
  T('Guest: '+b.guestName, PAD, 'left', '700 12.5px Arial,Helvetica,sans-serif', '#12213B');
  if(b.guestPhone){ y += 15; T(b.guestPhone, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); }
  y += 14;
  L(PAD, y, W-PAD, y); y += 20;

  T('Room', PAD, 'left', '700 9.5px Arial,Helvetica,sans-serif', '#9AA0AB');
  T('DETAILS', W-PAD, 'right', '700 9.5px Arial,Helvetica,sans-serif', '#9AA0AB');
  y += 16;
  T(r.name+(r.roomType?' ('+r.roomType+')':''), PAD, 'left', '400 12.5px Arial,Helvetica,sans-serif', '#242B38');
  T(fmtMoneyCanvas(b.ratePerNight)+'/night', W-PAD, 'right'); y += 20;
  T('Check-in', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(fmtDate(b.checkIn), W-PAD, 'right'); y += 16;
  T(b.status==='active'?'Expected Check-out':'Check-out', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(fmtDate(b.checkOut), W-PAD, 'right'); y += 16;
  T('Nights', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  T(String(b.nights), W-PAD, 'right'); y += 18;
  L(PAD, y, W-PAD, y); y += 22;

  T('TOTAL', PAD, 'left', '800 15px Arial,Helvetica,sans-serif', '#12213B');
  T(fmtMoneyCanvas(b.totalAmount), W-PAD, 'right'); y += 20;
  T('PAID', PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#2E7D32');
  T(fmtMoneyCanvas(b.paidAmount), W-PAD, 'right'); y += 18;
  if(b.balance>0){
    T('BALANCE DUE', PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#C0392B');
    T(fmtMoneyCanvas(b.balance), W-PAD, 'right'); y += 18;
  } else {
    T('PAID IN FULL', PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#2E7D32'); y += 18;
  }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T(shop.receiptFooter||'Thank you for staying with us!', W/2, 'center', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  y += 16;
  y += 12; // bottom padding
  return y;
}
async function drawLodgingReceiptToCanvas(canvas, b, r, shop, seller){
  const logoImg = await getLogoImage();
  const W = 380, scale = 2;
  const h = layoutAndDrawLodgingReceipt(b, r, shop, seller, null, logoImg);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFF7EA'; ctx.fillRect(0,0,W,h);
  drawSecurityTint(ctx, W, h, shop.name.toUpperCase());
  layoutAndDrawLodgingReceipt(b, r, shop, seller, ctx, logoImg);
}
function openLodgingReceiptSheet(bookingId){
  const b = state.lodgingBookings.find(x=>x.id===bookingId);
  const r = state.rooms.find(x=>x.id===b.roomId);
  const shop = state.shops.find(x=>x.id===b.shopId);
  const seller = state.users.find(u=>u.id===b.createdByUserId) || currentUser();
  openSheet(`
    <div class="sheet-head"><h3>Lodging Receipt</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;margin-bottom:14px;">
      <canvas id="lodging-receipt-canvas" style="max-width:100%;height:auto;display:block;"></canvas>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:6px;">
      <button class="btn btn-primary" id="share-lodging-receipt" style="flex:1;">${ICON_EXPORT} Share Receipt</button>
      <button class="btn btn-outline" id="download-lodging-receipt" style="flex:1;">⬇️ Download</button>
    </div>
    <p class="subtle" style="margin-bottom:14px;">Share opens your phone's share sheet with the receipt image attached — pick WhatsApp, Email, or any app there. ID, next-of-kin and plate number are kept internal and are not shown on this receipt.</p>
  `);
  const canvas = document.getElementById('lodging-receipt-canvas');
  drawLodgingReceiptToCanvas(canvas, b, r, shop, seller);
  document.getElementById('share-lodging-receipt').addEventListener('click', ()=>{
    canvas.toBlob(async blob=>{
      if(!blob){ toast('Could not generate the receipt image.'); return; }
      const file = new File([blob], `lodging-receipt-${b.id.slice(-6)}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:'Lodging Receipt from '+shop.name}); logAudit('lodging_receipt_shared', `Shared receipt for ${b.guestName}`); }
        catch(e){ /* user cancelled the share sheet — not an error */ }
      } else {
        toast("This browser can't share images directly — tap Download, then attach the file manually.");
      }
    }, 'image/png');
  });
  document.getElementById('download-lodging-receipt').addEventListener('click', ()=>{
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`lodging-receipt-${b.id.slice(-6)}.png`; a.click();
      URL.revokeObjectURL(url);
      logAudit('lodging_receipt_downloaded', `Downloaded receipt for ${b.guestName}`);
    }, 'image/png');
  });
}
function roomsForShop(){ return state.rooms.filter(r=>r.shopId===state.currentShopId); }
function activeBookingForRoom(roomId){ return state.lodgingBookings.find(b=>b.roomId===roomId && b.status==='active'); }
function lodgingNights(checkIn, checkOut){
  const a = new Date(checkIn), b = new Date(checkOut);
  return Math.max(1, Math.round((b-a)/(1000*60*60*24)));
}
function screenLodging(){
  const rooms = roomsForShop();
  const bookings = state.lodgingBookings.filter(b=>b.shopId===state.currentShopId);
  const activeBookings = bookings.filter(b=>b.status==='active');
  const occupied = activeBookings.length;
  const owed = activeBookings.reduce((a,b)=>a+Math.max(0,b.totalAmount-b.paidAmount),0);
  return `
    ${subHeader("Lodging")}
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-box"><div class="lbl">Rooms Occupied</div><div class="val">${occupied} / ${rooms.length}</div></div>
      <div class="stat-box accent"><div class="lbl">Owed by Guests</div><div class="val">${fmtMoney(owed)}</div></div>
    </div>
    <button class="btn btn-primary" id="add-room-btn" style="width:100%;margin-bottom:14px;">＋ Add Room</button>
    ${rooms.length===0?`<div class="empty"><div class="ic">${ICON_BED}</div><b>No rooms yet</b>Add each room so you can check guests in and out.</div>`:
    rooms.map(r=>{
      const b = activeBookingForRoom(r.id);
      return `<div class="card" data-room-detail="${r.id}" style="cursor:pointer;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="t1">${escapeHtml(r.name)}</div>
            <div class="t2">${escapeHtml(r.roomType||'Room')} · ${fmtMoney(r.ratePerNight)}/night</div>
            ${b?`<div class="t2">Guest: ${escapeHtml(b.guestName)} · out ${fmtDate(b.checkOut)}</div>`:''}
          </div>
          ${b?(b.balance>0?`<span class="pill pill-red">Owes ${fmtMoney(b.balance)}</span>`:`<span class="pill pill-amber">Occupied</span>`):`<span class="pill pill-green">Available</span>`}
        </div>
      </div>`;
    }).join('')}
  `;
}

      idType, idNumber, address, comingFrom, kinName, kinPhone, plateNumber,
      numGuests: numGuests>0?numGuests:1, purpose,
      status:'active', createdByUserId: state.sessionUserId, createdAt: new Date().toISOString() });
    enqueueSync('lodging_bookings','insert', {

      guest_name: guestName, guest_phone: guestPhone, check_in: checkIn, check_out: checkOut,

      kin_name: kinName, kin_phone: kinPhone, plate_number: plateNumber,
      num_guests: numGuests>0?numGuests:1, purpose, created_by_user_id: state.sessionUserId
    });
    logAudit('lodging_checkin', `Checked in ${guestName} to ${r.name} (${nights} night(s), ${fmtMoney(total)})`);
    toast('Guest checked in ✅'); closeSheet(); render();

async function fetchSiteContent(section){
  const res = await fetch(`${SITE_CONTENT_URL}/rest/v1/site_content?section=eq.${section}&select=*`, {
    headers: { 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY }
  });
  if(!res.ok) throw new Error('Request failed: '+res.status);
  const rows = await res.json();
  return rows[0] || null;
}

let openFaqKey = null;
let faqSearchQuery = '';
function screenFAQ(){
  const q = faqSearchQuery.trim().toLowerCase();
  const searching = q.length > 0;
  // While actively searching, matches are shown fully expanded — the whole
  // point of searching is to skip tapping through categories one at a time,
  // so still requiring a tap per result would defeat it.
  const groups = FAQ_GROUPS.map(group => ({
    category: group.category,
    items: group.items.filter(item => !searching || item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q))
  })).filter(group => group.items.length > 0);

  return `
    ${subHeader("Help / FAQ")}
    <div class="field" style="margin-bottom:4px;">
      <input id="faq-search" placeholder="Search — e.g. \\"receipt\\", \\"credit\\", \\"staff\\"" value="${escAttr(faqSearchQuery)}">
    </div>
    <p class="subtle" style="margin-bottom:14px;">${searching ? `${groups.reduce((a,g)=>a+g.items.length,0)} result(s)` : 'Tap a question to see the answer.'}</p>
    ${groups.length===0 ? `<div class="empty"><div class="ic">${ICON_SEARCH}</div><b>No matches</b>Try a different word, or browse by scrolling — nothing here mentions "${escapeHtml(faqSearchQuery)}".</div>` : ''}
    ${groups.map((group)=>{
      const gi = FAQ_GROUPS.findIndex(g=>g.category===group.category);
      return `
      <div class="section-head"><h3>${escapeHtml(group.category)}</h3></div>
      ${group.items.map((item)=>{
        const ii = FAQ_GROUPS[gi].items.indexOf(item);
        const key = gi+'-'+ii;
        const expanded = searching || openFaqKey===key;
        return `<div class="card" data-faq-toggle="${key}" style="cursor:pointer;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div class="t1" style="font-weight:700;">${escapeHtml(item.q)}</div>
            ${!searching ? `<div style="flex-shrink:0;color:var(--text-dim);">${expanded?'−':'+'}</div>` : ''}
          </div>
          ${expanded?`<p class="subtle" style="margin-top:10px;line-height:1.5;">${escapeHtml(item.a)}</p>`:''}
        </div>`;
      }).join('')}
    `;}).join('')}
    <div class="section-head"><h3>Still stuck?</h3></div>
    <p class="subtle">Use the thumbs-down button wherever you're chatting with support to send feedback, or reach out to whoever set up your ZeeShop account.</p>
  `;
}
function bindFAQEvents(){
  document.querySelectorAll('[data-faq-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    if(faqSearchQuery.trim()) return; // while searching, everything's already expanded — nothing to toggle
    const key = el.dataset.faqToggle;
    openFaqKey = openFaqKey===key ? null : key;
    refreshMain();
  }));
  const searchInput = document.getElementById('faq-search');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      faqSearchQuery = searchInput.value;
      const cursorPos = searchInput.selectionStart;
      refreshMain();
      // refreshMain rebuilds the input from scratch — restore focus and
      // cursor position so typing doesn't get interrupted on every keystroke.
      const freshInput = document.getElementById('faq-search');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }
    });
  }
}

   genuinely new mechanic here is Stock Transfer: moving real
   quantity from a warehouse to a shop, carrying cost price and
   expiry over rather than creating a disconnected duplicate record.
   ============================================================ */
function screenWarehouse(){
  const warehouses = state.shops.filter(s=>s.isWarehouse);
  const activeWh = currentShop()?.isWarehouse ? currentShop() : warehouses[0];
  if(!activeWh){
    if(!isMaster()){
      return `${subHeader("Warehouse")}<div class="empty"><div class="ic">${ICON_BOX}</div><b>No warehouse set up yet</b>Ask your Owner to set one up — once they do, you'll be able to record and move stock here.</div>`;
    }
    return `${subHeader("Warehouse")}
      <div class="empty"><div class="ic">${ICON_BOX}</div><b>No warehouse set up yet</b>A warehouse holds stock separately from your shops, so you can record what's produced or imported before it's moved out to sell.</div>
      <button class="btn btn-primary" id="create-warehouse-btn" style="width:100%;margin-top:14px;">＋ Create Warehouse</button>`;
  }

  const goods = state.goods.filter(g=>g.shopId===activeWh.id);
  const withStock = goods.filter(g=>totalStock(g)>0);
  const lowStock = goods.filter(g=>{ const s=totalStock(g); return s>0 && s<=(g.reorderLevel||5); }).length;
  const shops = state.shops.filter(s=>!s.isWarehouse);

  return `
    ${subHeader("Warehouse")}
    ${warehouses.length>1?`
      <div class="field"><label>Viewing</label>
        <select id="wh-picker">${warehouses.map(w=>`<option value="${w.id}" ${w.id===activeWh.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}</select>
      </div>`:''}
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-box"><div class="lbl">Items in Stock</div><div class="val">${withStock.length}</div></div>
      <div class="stat-box"><div class="lbl">Running Low</div><div class="val">${lowStock}</div></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <button class="btn btn-dark" style="flex:1;" data-goto="goods">＋ Record Stock</button>
      <button class="btn btn-outline" style="flex:1;" id="transfer-stock-btn" ${shops.length===0?'disabled':''}>↗ Move to a Shop</button>
    </div>
    ${shops.length===0?`<p class="subtle" style="margin:-6px 0 14px;">Add a real shop (not a warehouse) before you can move stock out.</p>`:''}
    ${withStock.length===0?`<div class="empty"><div class="ic">${ICON_INBOX_EMPTY}</div><b>Nothing in stock yet</b>Tap Record Stock to log what's arrived.</div>`:
    withStock.map(g=>`
      <div class="list-row">
        <div class="thumb">${g.emoji||'🛍️'}</div>
        <div class="info"><div class="t1">${escapeHtml(g.name)}</div><div class="t2">${totalStock(g)} in stock</div></div>
      </div>`).join('')}
  `;
}

    </div>

function submitStockTransfer(){
  const warehouse = currentShop();
  const goodId = document.getElementById('st-good').value;
  const qty = Number(document.getElementById('st-qty').value||0);
  const destShopId = document.getElementById('st-dest').value;
  const g = state.goods.find(x=>x.id===goodId);
  if(!g){ toast('Item not found.'); return; }
  const available = totalStock(g);
  if(qty<=0 || qty>available){ toast(`Enter a quantity between 1 and ${available}.`); return; }

  // Deduct FEFO across the warehouse's batches — same pattern used at sale
  // time, so a transfer behaves exactly like stock actually leaving.
  let remaining = qty;
  const sourceBatches = g.batches.filter(b=>b.qtyRemaining>0).sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  const movedFrom = []; // {batch, qtyTaken, costPrice, expiryDate}
  for(const b of sourceBatches){
    if(remaining<=0) break;
    const take = Math.min(b.qtyRemaining, remaining);
    b.qtyRemaining -= take;
    remaining -= take;
    movedFrom.push({ costPrice: b.costPrice, expiryDate: b.expiryDate, qty: take, batchId: b.id, qtyRemaining: b.qtyRemaining });
  }
  movedFrom.forEach(m=> enqueueSync('good_batches','update', { id: m.batchId, qty_remaining: m.qtyRemaining }));

  // At the destination, find a matching good by name (goods are per-shop,
  // so the same product needs its own record there) — reuse it if it
  // already exists, or create it fresh, carrying over price/cost so it's
  // not a disconnected duplicate the Boss has to manually keep in sync.
  let destGood = state.goods.find(x=>x.shopId===destShopId && x.name.toLowerCase()===g.name.toLowerCase());
  if(!destGood){
    destGood = { id: uid('good'), shopId: destShopId, name: g.name, basePrice: g.basePrice, costPrice: g.costPrice,
      emoji: g.emoji||'🛍️', groupPrices: [], barcode: g.barcode||null, reorderLevel: g.reorderLevel||5,
      hasVariants: false, batches: [] };
    state.goods.push(destGood);
    syncGoodInsert(destGood);
  }
  // One destination batch per source batch moved, so expiry dates and cost
  // prices stay accurate rather than averaging them into a single blob.
  movedFrom.forEach(m=>{
    const newBatch = { id: uid('batch'), qtyRemaining: m.qty, expiryDate: m.expiryDate, costPrice: m.costPrice,
      batchNo: 'XFER-'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null };
    destGood.batches.push(newBatch);
    enqueueSync('good_batches','insert', {
      id: newBatch.id, good_id: destGood.id, batch_no: newBatch.batchNo, qty_remaining: newBatch.qtyRemaining,
      expiry_date: newBatch.expiryDate, cost_price: newBatch.costPrice,
      auction_active: false, auction_price: null, auction_discount: null
    });
  });

  const destShop = state.shops.find(s=>s.id===destShopId);
  logAudit('stock_transfer', `Moved ${qty} x ${g.name} from ${warehouse.name} to ${destShop.name}`);
  toast(`Moved ${qty} x ${g.name} to ${destShop.name} ✅`);
  closeSheet(); render();
}

  document.querySelectorAll('[data-pay-supplier]').forEach(b=>b.addEventListener('click', ()=>{
    const p = state.supplierPurchases.find(x=>x.id===b.dataset.paySupplier);
    const amt = Number(prompt(`Amount paid (balance ${fmtMoney(p.balance)}):`, p.balance) || 0);

    // stayed local-only, so a payment logged to one supplier here on one
    // device would still show as owed on every other device.
    enqueueSync('supplier_purchases','update', { id: p.id, paid_amount: p.paidAmount, balance: p.balance });

        auction_active: newBatch.auctionActive, auction_price: newBatch.auctionPrice, auction_discount: newBatch.auctionDiscount
      });
      enqueueSync('goods','update', { id: g.id, cost_price: g.costPrice });
      goodId = g.id; itemName = g.name;
    }
    const total = qty*cost;
    const purchaseId = uid('sp');
    state.supplierPurchases.push({ id: purchaseId, businessId: business().id, supplierId, shopId: state.currentShopId,
      goodId, itemName, qty, costPrice: cost, totalAmount: total, paidAmount: Math.min(paid,total),
      balance: Math.max(0, total-paid), date: todayISO(), createdByUserId: state.sessionUserId, createdAt: new Date().toISOString() });
    enqueueSync('supplier_purchases','insert', {
      id: purchaseId, business_id: business().id, supplier_id: supplierId, shop_id: state.currentShopId,
      good_id: goodId, item_name: itemName, qty, cost_price: cost, total_amount: total,
      paid_amount: Math.min(paid,total), balance: Math.max(0, total-paid), date: todayISO(),
      created_by_user_id: state.sessionUserId
    });
    logAudit('supplier_restock', `Restocked ${qty} × ${itemName} from supplier (${fmtMoney(total)})`);
    toast('Restock logged and stock added ✅'); closeSheet(); render();
  });
}

function openSheet(html){
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id='active-overlay';
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) closeSheet(); });
  const x = document.getElementById('sheet-close');
  if(x) x.addEventListener('click', closeSheet);
  bindPasswordToggles();
}
function closeSheet(){
  const ov = document.getElementById('active-overlay');
  if(ov) ov.remove();
}

/* ============================================================
   INIT — seed a little demo data on very first run for master, for UX
   ============================================================ */
render();
</script>
