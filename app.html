      if(!u.passwordHash || u.passwordHash !== hash(pass)){
        let verified = false;
        if(navigator.onLine && u.email){
          try{
            const { data: sd, error: se } = await window.sb.auth.signInWithPassword({ email: u.email, password: pass });
            if(!se && sd && sd.session){ verified = true; u.passwordHash = hash(pass); enqueueSync('app_users','update', { id: u.id, password_hash: u.passwordHash }); }
          }catch(_e){}
        }
        if(!verified){ toast(!navigator.onLine && !u.passwordHash ? 'Connect to the internet to unlock on this device.' : 'Wrong password.'); return; }
      }
      state.sessionUserId = u.id;
      if(!state.currentShopId && state.shops[0]) state.currentShopId = state.shops[0].id;
      logAudit('login','Master unlocked device');
      render();
      // The server decides who you are from the signed-in Supabase session, NOT from the profile picked on this screen.
      // If another person (a staff member who joined on this phone) signed in last, the boss would still be treated as
      // that staff member: wallet balance fails with "no permission for bill payments". Switch the session to the boss.
      ensureSessionFor(u, pass).then(ok=>{
        if(ok){
          try{ flushSyncQueue(); pullSync(); }catch(_e){}
          // Clear the old "no permission" failure and load the wallet again under the boss's session.
          billWalletError = null; billWalletBalance = null; billHistoryError = null;
          try{ if(!isViewer() && canDo('canBillPayments')) bpLoadWallet(); }catch(_e){}
        }
      });
    });
    const ppForgot = document.getElementById('pp-go-forgot');
    if(ppForgot) ppForgot.addEventListener('click', e=>{ e.preventDefault(); authMode='forgot'; forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError=''; render(); });
    return;
  }
  updatePinDots(u);
  document.querySelectorAll('#pinpad-grid button[data-k]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k=b.dataset.k;
      if(k==='del'){ pinBuffer = pinBuffer.slice(0,-1); }
      else if(k!=='' && pinBuffer.length < (u.pinLength||4)){ pinBuffer += k; }
      updatePinDots(u);
      if(pinBuffer.length === (u.pinLength||4)){ setTimeout(()=>submitPin(u),120); }
    });
  });
}
function updatePinDots(u){
  const dots = document.getElementById('pin-dots');
  if(!dots) return;
  const len = u.pinLength||4;
  dots.innerHTML = Array.from({length:len}).map((_,i)=>`<div class="pin-dot ${i<pinBuffer.length?'filled':''}"></div>`).join('');
}
function submitPin(u){
  if(hash(pinBuffer) === u.pinHash){
    state.pinAttempts[u.id] = {count:0, lockedUntil:0};
    state.sessionUserId = u.id;
    if(!state.currentShopId && state.shops[0]) state.currentShopId = state.shops[0].id;
    logAudit('login', u.firstName+' logged in via PIN');
    pendingPinUser=null;
    toast(`Welcome, ${u.firstName}!`);
    render();
  } else {
    const att = state.pinAttempts[u.id] || {count:0, lockedUntil:0};
    att.count = (att.count||0)+1;
    if(att.count>=5){ att.lockedUntil = Date.now()+15*60000; att.count=0; toast('Wrong PIN 5 times. Locked 15 min.'); }
    else toast(`Wrong PIN (${5-att.count} tries left)`);
    state.pinAttempts[u.id]=att; save();
    pinBuffer='';
    updatePinDots(u);
  }
}

/**
 * The NEW way a staff member can join — on a completely fresh device,
 * with just the join code and their name, no owner login required on
 * that device at all. Calls join-business (server-side), which creates
 * an invisible Supabase Auth account for them, then this function signs
 * that session in and pulls the whole business down locally.
 */
async function joinShopSubmit(){
  const code = document.getElementById('join-any-code-input').value.trim();
  const fn = document.getElementById('join-fn-input').value.trim();
  const ln = document.getElementById('join-ln-input').value.trim();
  const phone = document.getElementById('join-phone-input').value.trim();
  const pin = document.getElementById('join-pin-input').value.trim();
  if(!/^\d{6}$/.test(code)){ authError = 'Enter the 6-digit code from your manager.'; render(); return; }
  if(!fn){ authError = 'Please enter your first name.'; render(); return; }
  if(!/^\d{4,6}$/.test(pin)){ authError = 'Set a 4-6 digit PIN for this device.'; render(); return; }
  if(!navigator.onLine){ authError = 'You need internet the first time you join a shop.'; render(); return; }

  authError = '';
  const btn = document.getElementById('btn-join-shop');
  if(btn){ btn.disabled = true; btn.textContent = 'Joining…'; }

  try{
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/join-business`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ code, first_name: fn, last_name: ln, phone })
    });
    const result = await res.json();
    if(!res.ok || result.error){
      authError = result.error || 'Could not join — please check the code and try again.';
      if(btn){ btn.disabled = false; btn.textContent = 'Join Shop'; }
      render();
      return;
    }

    // Sign in with the invisible synthetic account — this is what lets
    // the sync engine (push AND pull) work on this device from now on.
    const { error: signInErr } = await window.sb.auth.signInWithPassword({
      email: result.auth_email, password: result.auth_password
    });
    if(signInErr){
      authError = 'Joined, but could not start your session — please try logging in again with internet on.';
      render();
      return;
    }

    // Set a local PIN so this device works offline day-to-day from here on —
    // collected as a real form field above, not a follow-up prompt() that
    // could be dismissed and silently leave someone with a PIN they were
    // never shown.

    // Bootstrap local state from what the server gave us.
    state.business = {
      id: result.business.id, name: result.business.name, country: result.business.country,
      currency: result.business.currency, subscriptionPlan: result.business.subscriptionPlan,
      subscriptionExpiresAt: result.business.subscriptionExpiresAt
    };
    (result.shops||[]).forEach(s=>{
      state.shops.push({ id:s.id, businessId:s.business_id, name:s.name, address:s.address||'', phone:s.phone||'', email:s.email||'' });
    });
    state.currentShopId = result.shops && result.shops[0] ? result.shops[0].id : null;

    const u = { ...result.user, pinHash: hash(pin), pinLength: pin.length };
    state.users.push(u);
    state.sessionUserId = u.id;

    // Save the PIN hash server-side too, so this same staff member can
    // reconnect on another device later via "I already have an account"
    // (see reconnectStaffDevice) without creating a duplicate.
    const { data: sessionData } = await window.sb.auth.getSession();
    if(sessionData.session){
      await fetch(`${SITE_CONTENT_URL}/rest/v1/app_users?id=eq.${u.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+sessionData.session.access_token, 'apikey': SITE_CONTENT_ANON_KEY, 'Prefer':'return=minimal' },
        body: JSON.stringify({ pin_hash: u.pinHash, pin_length: u.pinLength })
      }).catch(()=>{});
    }

    save();
    logAudit('staff_joined_remote', fn+' '+ln+' joined remotely as staff');
    toast('Welcome, '+fn+'! Pulling in your shop\'s data…');
    render();

    // Pull everything else (goods, customers, sales, etc.) down onto
    // this device now that a valid session exists.
    if(typeof pullSync === 'function') pullSync();
  }catch(e){
    authError = 'Could not join — check your connection and try again.';
    if(btn){ btn.disabled = false; btn.textContent = 'Join Shop'; }
    render();
  }
}

/*
 * For an EXISTING staff member adding a second (or replacement) device.
 * Unlike joinShopSubmit, this does NOT create a new account — it verifies
 * the business's permanent Connect Code + the staff's own phone + PIN
 * against their existing app_users row (server-side, in staff-device-login),
 * then re-authenticates that same account on this device.
 */
async function reconnectStaffDevice(){
  const code = document.getElementById('join-any-code-input').value.trim();
  const phone = document.getElementById('reconnect-phone-input').value.trim();
  const pin = document.getElementById('reconnect-pin-input').value.trim();
  if(!/^\d{8}$/.test(code)){ authError = 'Enter the 8-digit Connect Code from your Owner.'; render(); return; }
  if(!phone){ authError = 'Enter the phone number on your account.'; render(); return; }
  if(!/^\d{4,6}$/.test(pin)){ authError = 'Enter your 4-6 digit PIN.'; render(); return; }
  if(!navigator.onLine){ authError = 'You need internet to sign in on a new phone.'; render(); return; }

  authError = '';
  const btn = document.getElementById('btn-reconnect-shop');
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }

  try{
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/staff-device-login`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ connect_code: code, phone, pin })
    });
    const result = await res.json();
    if(!res.ok || result.error){
      authError = result.error || 'Could not sign in — please check your details and try again.';
      if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
      render();
      return;
    }

    const { error: signInErr } = await window.sb.auth.signInWithPassword({
      email: result.auth_email, password: result.auth_password
    });
    if(signInErr){
      authError = 'Verified, but could not start your session — please try again.';
      if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
      render();
      return;
    }

    // Bootstrap local state from the SAME account — reuses the existing
    // PIN hash rather than prompting for a new one, since the PIN they
    // just typed already matched it.
    if(result.business) state.business = { ...result.business };
    (result.shops||[]).forEach(s=>{
      if(!state.shops.some(x=>x.id===s.id)){
        state.shops.push({ id:s.id, businessId:s.business_id, name:s.name, address:s.address||'', phone:s.phone||'', email:s.email||'' });
      }
    });
    state.currentShopId = result.shops && result.shops[0] ? result.shops[0].id : null;

    if(!state.users.some(x=>x.id===result.user.id)){
      state.users.push(result.user);
    } else {
      // Refresh the existing local copy instead of leaving it untouched —
      // a staff member reconnecting is exactly the moment the server's
      // copy is freshest (permissions, name, active status), so this is
      // a free chance to correct any local copy that had gone stale from
      // a change made on another device.
      const idx = state.users.findIndex(x=>x.id===result.user.id);
      state.users[idx] = { ...state.users[idx], ...result.user };
    }
    state.sessionUserId = result.user.id;

    save();
    logAudit('staff_reconnected', result.user.firstName+' signed in on a new device');
    toast('Welcome back, '+result.user.firstName+'! Pulling in your shop\'s data…');
    render();

    if(typeof pullSync === 'function') pullSync();
  }catch(e){
    authError = 'Could not reach the server — check your connection and try again.';
    if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
    render();
  }
}

/* ============================================================
   MAIN SHELL: topbar + routed screen + bottom nav
   ============================================================ */
/* ============================================================
   ITEM SALES — the "Total Sold" box and the Item Sales History sheet
   - "Sold" is NET: units sold minus units returned. Voided sales are never counted.
   - Only the owner sees every cashier's sales; everyone else sees only the sales they made (enforced on the server;
     the on-device fallback applies the same rule).
   - Stock transfers / warehouse movements are NOT sales: they never create sale records, so they can never appear here.
   - The totals and the list come from the server when online (complete, whatever this phone holds), and from the sales
     stored on this device when offline (marked as possibly incomplete).
   ============================================================ */
const ITEM_SALES_PAGE = 50;
const SALES_RANGES = [['today','Today'], ['7d','7 Days'], ['30d','30 Days'], ['all','All']];
let itemSalesCache = {};      // gid -> { at, net }
let itemSalesView = null;     // the open history sheet's state
function canSeeSold(){ return isMaster() || canDo('canSell'); }
function fmtQty(n){ const x = Number(n) || 0; return (Math.round(x * 100) / 100).toLocaleString(); }
function sameName(a, b){ return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase(); }
function salesSince(range){
  const t = new Date(); const start = new Date(t.getFullYear(), t.getMonth(), t.getDate());          // local midnight
  if(range === 'today') return start.toISOString();
  if(range === '7d')    return new Date(start.getTime() - 6 * 864e5).toISOString();                   // today + the 6 days before
  if(range === '30d')   return new Date(start.getTime() - 29 * 864e5).toISOString();
  return null;
}
// The same product exists as a separate item in each shop/warehouse (transfers match by name), so "all locations"
// means every item with this name.
function itemGoodIds(g, loc){
  if(loc === 'this' || !g) return [g.id];
  const same = state.goods.filter(x => sameName(x.name, g.name));
  if(loc === 'all') return same.map(x => x.id);
  return same.filter(x => x.shopId === loc).map(x => x.id);
}
function itemLocations(g){
  const seen = new Set(), out = [];
  state.goods.forEach(x => {
    if(!sameName(x.name, g.name) || seen.has(x.shopId)) return;
    seen.add(x.shopId);
    const sh = state.shops.find(s => s.id === x.shopId);
    if(sh) out.push({ id: sh.id, name: sh.name, isWarehouse: !!sh.isWarehouse });
  });
  return out;
}
function saleTimeOf(sale){ return Date.parse(sale.createdAt || '') || Date.parse((sale.date || '') + 'T00:00:00') || 0; }
// Lines of past sales from what is stored on THIS device.
function localItemSalesLines(goodIds, sinceISO){
  const ids = new Set(goodIds), owner = isMaster(), me = state.sessionUserId;
  const since = sinceISO ? Date.parse(sinceISO) : null; const out = [];
  for(const sale of state.sales){
    if(!owner && sale.soldByUserId !== me) continue;
    const t = saleTimeOf(sale);
    if(since !== null && t < since) continue;
    for(const it of (sale.items || [])){
      if(!ids.has(it.goodId)) continue;
      const qty = Number(it.qty) || 0, unit = Number(it.priceUsed) || 0;
      out.push({ lineId: it.saleItemId || (sale.id + ':' + out.length), saleId: sale.id, soldAt: sale.createdAt || (sale.date ? sale.date + 'T00:00:00' : null),
        hasTime: !!sale.createdAt, shopId: sale.shopId, cashierId: sale.soldByUserId, qty, returned: Number(it.returnedQty) || 0, unitPrice: unit,
        lineAmount: qty * unit, variantLabel: it.variantLabel || '', status: sale.status, discount: Number(sale.discount) || 0, t });
    }
  }
  out.sort((a, b) => (b.t - a.t) || (a.lineId < b.lineId ? 1 : -1));
  return out;
}
function summarizeSaleLines(lines){
  let net = 0, gross = 0, returned = 0; const sales = new Set();
  for(const l of lines){ if(l.status === 'voided') continue; net += l.qty - l.returned; gross += l.qty; returned += l.returned; sales.add(l.saleId); }
  return { net, gross, returned, sales: sales.size };
}
async function itemSalesRpc(name, args){
  const token = await bigisubAuthToken();
  if(!token) throw new Error('not signed in');
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 15000);
  try{
    const res = await fetch(`${SITE_CONTENT_URL}/rest/v1/rpc/${name}`, {
      method: 'POST', cache: 'no-store', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(args),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
function mapServerSaleRow(r){
  return { lineId: r.line_id, saleId: r.sale_id, soldAt: r.sold_at, hasTime: true, shopId: r.shop_id, shopName: r.shop_name, isWarehouse: !!r.is_warehouse,
    cashierId: r.cashier_id, cashierName: r.cashier_name, qty: Number(r.qty) || 0, returned: Number(r.returned_qty) || 0, unitPrice: Number(r.unit_price) || 0,
    lineAmount: Number(r.line_amount) || 0, variantLabel: r.variant_label || '', status: r.sale_status, discount: Number(r.sale_discount) || 0, t: Date.parse(r.sold_at) || 0 };
}
// The small box on the item sheet: this device's number first, then the server's (complete) number.
function refreshSoldBox(gid){
  const put = (n) => { const el = document.getElementById('sold-val'), box = document.getElementById('sold-box'); if(el && box && box.dataset.gid === gid) el.textContent = fmtQty(n); };
  const hit = itemSalesCache[gid];
  if(hit && Date.now() - hit.at < 60000){ put(hit.net); return; }
  if(!navigator.onLine) return;
  itemSalesRpc('item_sales_summary', { p_good_ids: [gid], p_since: null }).then(rows => {
    const r = Array.isArray(rows) ? rows[0] : null; if(!r) return;
    itemSalesCache[gid] = { at: Date.now(), net: Number(r.net_units) || 0 };
    put(itemSalesCache[gid].net);
  }).catch(() => { /* keep this device's number */ });
}
function openItemSalesHistory(gid){
  const g = state.goods.find(x => x.id === gid); if(!g || !canSeeSold()) return;
  const locs = isMaster() ? itemLocations(g) : [];
  itemSalesView = { gid, loc: 'this', range: 'all', lines: [], done: false, loading: false, source: '', error: '', summary: null, localAll: [], req: 0 };
  const thisShop = state.shops.find(s => s.id === g.shopId);
  openSheet(`
    <div class="sheet-head"><h3>Item Sales History</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <button type="button" class="btn btn-outline btn-sm" id="is-back" style="margin-bottom:10px;">‹ Back to item</button>
    <div class="t1" style="margin-bottom:2px;">${escapeHtml(g.name)}</div>
    ${locs.length > 1 ? `<div class="field" style="margin:8px 0;"><label for="is-loc">Location</label><select id="is-loc">
        <option value="this">This location — ${escapeHtml(thisShop ? thisShop.name : '')}</option>
        <option value="all">All locations (${locs.length})</option>
        ${locs.filter(l => l.id !== g.shopId).map(l => `<option value="${l.id}">${escapeHtml(l.name)}${l.isWarehouse ? ' (warehouse)' : ''}</option>`).join('')}
      </select></div>` : `<div class="t2 subtle" style="margin-bottom:8px;">${escapeHtml(thisShop ? thisShop.name : '')}</div>`}
    <div id="is-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;"></div>
    <div id="is-summary" class="zs-note zs-note-info" style="margin-bottom:10px;"></div>
    <div id="is-note"></div>
    <div id="is-list"></div>
    <div id="is-more" style="margin-top:10px;"></div>
  `);
  document.getElementById('is-back').addEventListener('click', () => { itemSalesView = null; openGoodDetail(gid); });
  const sel = document.getElementById('is-loc');
  if(sel) sel.addEventListener('change', () => { itemSalesView.loc = sel.value; loadItemSales(true); });
  paintItemSales();
  loadItemSales(true);
}
async function loadItemSales(reset){
  const v = itemSalesView; if(!v) return;
  const g = state.goods.find(x => x.id === v.gid); if(!g) return;
  if(v.loading && !reset) return;
  const myReq = ++v.req; v.loading = true; v.error = '';
  if(reset){ v.lines = []; v.done = false; v.summary = null; v.source = ''; v.localAll = []; }
  paintItemSales();
  const ids = itemGoodIds(g, v.loc), since = salesSince(v.range);
  try{
    if(!navigator.onLine) throw new Error('offline');
    if(reset){
      const sum = await itemSalesRpc('item_sales_summary', { p_good_ids: ids, p_since: since });
      if(myReq !== v.req) return;
      const r = Array.isArray(sum) ? sum[0] : null;
      if(!r) throw new Error('no summary');
      v.summary = { net: Number(r.net_units) || 0, gross: Number(r.units_sold) || 0, returned: Number(r.units_returned) || 0, sales: Number(r.sales_count) || 0 };
    }
    const last = v.lines[v.lines.length - 1];
    const rows = await itemSalesRpc('item_sales_history', { p_good_ids: ids, p_since: since, p_limit: ITEM_SALES_PAGE,
      p_before_ts: last ? last.soldAt : null, p_before_id: last ? last.lineId : null });
    if(myReq !== v.req) return;
    v.source = 'server';
    v.lines.push(...(Array.isArray(rows) ? rows : []).map(mapServerSaleRow));
    v.done = !Array.isArray(rows) || rows.length < ITEM_SALES_PAGE;
  }catch(e){
    if(myReq !== v.req) return;
    if(reset){                                        // could not reach the server: use what this device holds
      v.source = 'local'; v.localAll = localItemSalesLines(ids, since);
      v.summary = summarizeSaleLines(v.localAll);
      v.lines = v.localAll.slice(0, ITEM_SALES_PAGE); v.done = v.localAll.length <= ITEM_SALES_PAGE;
    }else if(v.source === 'local'){
      v.lines.push(...v.localAll.slice(v.lines.length, v.lines.length + ITEM_SALES_PAGE)); v.done = v.lines.length >= v.localAll.length;
    }else{
      v.error = "Couldn't load more. Check your connection and try again.";
    }
  }finally{
    if(myReq === v.req){ v.loading = false; paintItemSales(); }
  }
}
function salePayLabel(status){
  if(status === 'paid') return ['Paid', 'pill-green'];
  if(status === 'partial') return ['Part payment', 'pill-amber'];
  if(status === 'credit') return ['Credit', 'pill-amber'];
  if(status === 'voided') return ['Voided', 'pill-gray'];
  return [String(status || '—'), 'pill-gray'];
}

/* ============================================================
   ADD STOCK / HIDE / REACTIVATE
   - Add Stock always creates a NEW batch (never edits an old one), so first-in-first-out stays correct and every
     delivery has its own cost and expiry.
   - Nothing is ever deleted. "Hide" (discontinue) is the only way an item leaves the selling list; sales history,
     receipts and returns keep working, and only the owner can hide or reactivate.
   ============================================================ */
function hideControlsHtml(g){
  if(isGoodActive(g)){
    return `<div class="section-head"><h3>Discontinue</h3></div>
      <p class="subtle" style="margin-bottom:8px;">Stopped selling this item? Hide it. It disappears from the selling list and stock alerts, but stays in past sales and receipts. Items are never deleted.</p>
      <button class="btn btn-outline" id="hide-good-btn">Hide / Discontinue Item</button>`;
  }
  return `<div class="section-head"><h3>Hidden item</h3></div>
    <button class="btn btn-primary" id="reactivate-good-btn">Reactivate Item</button>`;
}
function reactivateGood(gid){
  const g = state.goods.find(x=>x.id===gid);
  if(!g || !isMaster()) return;
  g.isActive = true; g.deactivatedAt = null; g.deactivationReason = '';
  enqueueSync('goods','update', { id: g.id, is_active: true, deactivated_at: null, deactivated_by: null, deactivation_reason: null });
  logAudit('item_reactivated', `${g.name} is active again`);
  toast(g.name + ' is active again ✅');
}
function openAddStockModal(gid){
  const g = state.goods.find(x=>x.id===gid);
  if(!g) return;
  if(!canDo('canAddGoods')){ toast("You don't have permission to add stock."); return; }
  if(!isGoodActive(g) && !isMaster()){ toast(`${g.name} is hidden. Ask the owner to reactivate it before adding stock.`); return; }
  const newest = [...g.batches].sort(batchFIFO).pop();
  const lastCost = (newest && newest.costPrice) || g.costPrice || '';
  openSheet(`
    <div class="sheet-head"><h3>Add Stock</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:12px;">${escapeHtml(g.name)} · ${totalStock(g)} in stock now</p>
    <div class="field"><label>Quantity received</label><input id="as-qty" type="number" inputmode="numeric" min="1" step="1" placeholder="e.g. 24"></div>
    <div class="field"><label>Cost price per unit <span class="subtle">(optional)</span></label><input id="as-cost" type="number" inputmode="decimal" min="0" value="${escAttr(lastCost)}"></div>
    <div class="field"><label>Expiry date <span class="subtle">(optional — leave blank if it doesn't expire)</span></label><input id="as-expiry" type="date"></div>
    ${!isGoodActive(g) ? `<div class="zs-note zs-note-amber" style="margin-bottom:12px;">This item is hidden. After adding stock you can choose to reactivate it.</div>` : ''}
    <div class="subtle" id="as-err" style="color:var(--red);min-height:18px;margin-bottom:6px;"></div>
    <button class="btn btn-primary" id="as-submit">Add Stock</button>
  `);
  document.getElementById('as-submit').addEventListener('click', async ()=>{
    const err = (m)=>{ document.getElementById('as-err').textContent = m; };
    const qty = Number(document.getElementById('as-qty').value);
    const costRaw = document.getElementById('as-cost').value;
    const cost = costRaw === '' ? null : Number(costRaw);
    const expiry = document.getElementById('as-expiry').value;
    if(!Number.isInteger(qty) || qty<1 || qty>1000000){ err('Enter a whole number of 1 or more.'); return; }
    if(cost!==null && (!Number.isFinite(cost) || cost<0)){ err('Enter a valid cost price, or leave it blank.'); return; }
    if(expiry && expiry < todayISO()){ err('That expiry date has already passed.'); return; }
    const batch = { id: uid('batch'), qtyRemaining: qty, expiryDate: expiry || '2099-12-31', costPrice: cost!==null ? cost : (g.costPrice||0),
      batchNo: 'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null, createdAt: new Date().toISOString() };
    g.batches.push(batch);
    enqueueSync('good_batches','insert', {
      id: batch.id, good_id: g.id, batch_no: batch.batchNo, qty_remaining: batch.qtyRemaining,
      expiry_date: batch.expiryDate, cost_price: batch.costPrice,
      auction_active: false, auction_price: null, auction_discount: null
    });
    if(cost!==null && cost!==g.costPrice){            // same rule the supplier restock uses: latest purchase cost going forward
      g.costPrice = cost;
      enqueueSync('goods','update', { id: g.id, cost_price: g.costPrice });
    }
    logAudit('stock_added', `Added ${qty} × ${g.name}${cost!==null?' at '+fmtMoney(cost):''}${expiry?' (expires '+expiry+')':''}`);
    closeSheet();
    if(!isGoodActive(g) && isMaster() && await appConfirm(`${g.name} is hidden. Reactivate it now so it can be sold?`)){ reactivateGood(g.id); }
    toast('Stock added ✅');
    render(); openGoodDetail(g.id);
  });
}
const HIDE_REASONS = ['Discontinued', 'Damaged', 'Recalled', 'Expired', 'Lost / missing', 'Other'];
function openHideGoodModal(gid){
  const g = state.goods.find(x=>x.id===gid);
  if(!g) return;
  if(!isMaster()){ toast('Only the owner can hide an item.'); return; }
  const stock = totalStock(g);
  openSheet(`
    <div class="sheet-head"><h3>Hide ${escapeHtml(g.name)}?</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:12px;">It will stop showing for sale, in search and scanning, and in stock alerts. Past sales and receipts keep it. You can reactivate it any time from the Hidden tab.</p>
    <div class="field"><label>Reason</label><select id="hg-reason">${HIDE_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
    ${stock>0 ? `<div class="zs-note zs-note-amber" style="margin-bottom:12px;"><b>${stock} unit(s) are still in stock.</b> Hiding writes them off: the count goes to 0 and each batch gets a permanent entry in the stock history, so the loss is on record. Sell them first if you can.</div>` : ''}
    <button class="btn btn-primary" id="hg-confirm">${stock>0 ? `Write off ${stock} &amp; Hide` : 'Hide Item'}</button>
    <button class="btn btn-outline" id="hg-cancel" style="margin-top:8px;">Cancel</button>
  `);
  document.getElementById('hg-cancel').addEventListener('click', closeSheet);
  document.getElementById('hg-confirm').addEventListener('click', ()=>{
    const reason = document.getElementById('hg-reason').value;
    const left = totalStock(g);
    if(left>0){
      (g.batches||[]).filter(b=>b.qtyRemaining>0).forEach(b=>{
        const oldQty = b.qtyRemaining; b.qtyRemaining = 0;
        enqueueSync('good_batches','update', { id: b.id, qty_remaining: 0 });
        const adj = { id: uid('adj'), businessId: business().id, shopId: g.shopId, goodId: g.id, goodName: g.name, batchId: b.id,
          oldQty, newQty: 0, difference: -oldQty, reason: 'Written off — '+reason, adjustedByUserId: state.sessionUserId, adjustedAt: new Date().toISOString() };
        state.stockAdjustments.unshift(adj);
        enqueueSync('stock_adjustments','insert', { id: adj.id, business_id: adj.businessId, shop_id: adj.shopId, good_id: adj.goodId, good_name: adj.goodName,
          batch_id: adj.batchId, old_qty: oldQty, new_qty: 0, difference: -oldQty, reason: adj.reason, adjusted_by_user_id: adj.adjustedByUserId });
      });
      (g.variants||[]).filter(v=>v.qty>0).forEach(v=>{ const was = v.qty; v.qty = 0; enqueueSync('good_variants','update', { id: v.id, qty: 0 }); logAudit('stock_written_off', `${g.name} (${v.label}): ${was} written off — ${reason}`); });
    }
    g.isActive = false; g.deactivatedAt = new Date().toISOString(); g.deactivationReason = reason;
    enqueueSync('goods','update', { id: g.id, is_active: false, deactivated_at: g.deactivatedAt, deactivated_by: state.sessionUserId, deactivation_reason: reason });
    logAudit('item_hidden', `${g.name} hidden (${reason})${left>0?` — ${left} unit(s) written off`:''}`);
    closeSheet(); toast(g.name + ' is hidden ✅'); render();
  });
}

function alertCounts(){
  const raw = alertCountsRaw();
  if(typeof inAppAlertsOn === 'function' && !inAppAlertsOn()) return Object.assign({}, raw, { expiring:0, dueSoon:0, overdue:0, lowStock:0 });
  return raw;
}
function alertCountsRaw(){
  const shopGoods = state.goods.filter(g=>g.shopId===state.currentShopId && isGoodActive(g));
  let expiring=0;
  shopGoods.forEach(g=> g.batches.forEach(b=>{
    if(b.qtyRemaining<=0) return;
    const d = daysBetween(todayISO(), b.expiryDate);
    if(d<=14) expiring++;
  }));
  const lowStock = shopGoods.filter(g=>{ const s=totalStock(g); return s>0 && s<=(g.reorderLevel||5); }).length;
  const openCredit = state.sales.filter(s=>s.shopId===state.currentShopId && s.status!=='paid' && s.status!=='voided' && s.dueDate);
  const overdue = openCredit.filter(s=>daysBetween(todayISO(), s.dueDate) < 0).length;
  const dueSoon = openCredit.filter(s=>{ const d=daysBetween(todayISO(), s.dueDate); return d>=0 && d<=2; }).length;
  return {expiring, dueSoon, overdue, lowStock};
}

/**
 * Keeps the owner's real Supabase Auth password in sync whenever they
 * change it locally from Settings. Only applies to the master/owner
 * account — staff PINs are purely local and were never part of Supabase
 * Auth to begin with.
 * Best-effort: if offline, or there's no live Supabase session at this
 * exact moment, this silently does nothing — the local password
 * still works fine, it just won't match what Supabase Auth has on file
 * until the owner next logs in online with the new password... but since
 * app.html's own login only ever checks the LOCAL hash (never Supabase's),
 * that mismatch is invisible day-to-day. It only matters for the admin
 * dashboard / super admin login, which uses Supabase Auth directly.
 */
// Changes the password in Supabase Auth and WAITS for the answer. The old helper below ignored every failure, so a
// password changed while offline/with an expired session was saved on the phone only — and the Super Admin page and
// every other device (which check Supabase Auth) then rejected the new password.
async function updateAuthPasswordStrict(currentPass, newPass){
  if(!window.sb || !navigator.onLine) return false;
  try{
    const { data } = await window.sb.auth.getSession();
    if(!data.session){
      const u = currentUser();
      if(!u || !u.email || !currentPass) return false;
      const r = await window.sb.auth.signInWithPassword({ email: u.email, password: currentPass });
      if(r.error || !r.data || !r.data.session) return false;
    }
    const { error } = await window.sb.auth.updateUser({ password: newPass });
    return !error;
  }catch(_e){ return false; }
}
async function syncPasswordToSupabaseAuth(newPassword){
  if(!window.sb) return;
  try{
    const { data } = await window.sb.auth.getSession();
    if(!data.session) return; // no live session right now — nothing to sync against
    await window.sb.auth.updateUser({ password: newPassword });
  }catch(e){ /* offline or Supabase error — local password change still stands */ }
}

/**
 * Queues a newly-created sale, plus its line items, for sync.
 */
function syncSaleInsert(sale){
  enqueueSync('sales','insert', {
    id: sale.id, shop_id: sale.shopId, customer_id: sale.customerId || null,
    walk_in_name: sale.walkInName, walk_in_phone: sale.walkInPhone, note: sale.note,
    items_subtotal: sale.itemsSubtotal, discount: sale.discount, tax_amount: sale.taxAmount,

    balance: sale.balance, due_date: sale.dueDate || null, status: sale.status,
    sold_by_user_id: sale.soldByUserId, receipt_sent: sale.receiptSent, date: sale.date,
    sold_at: sale.createdAt || new Date().toISOString()      // when it was MADE (a queued offline sale reaches the server later)
  });
  itemSalesCache = {};                                       // "Sold" totals are recomputed after a new sale
  sale.items.forEach(item=>{
    // The id is generated here and ALSO written back onto the local item
    // (not just the push payload) — without that, nothing later (like
    // processing a return) has any way to reference this specific
    // sale_items row again, since the server-side id was never known
    // locally to begin with.
    item.saleItemId = uid('saleitem');
    enqueueSync('sale_items','insert', {
      id: item.saleItemId, sale_id: sale.id, good_id: item.goodId, batch_id: item.batchId || null,
      variant_id: item.variantId || null, variant_label: item.variantLabel, qty: item.qty,

  });

/**
 * Returns the plan that should actually be enforced right now — this is
 * what makes an expiry date mean something. A business stays on its paid
 * plan as long as either:
 *   - subscriptionExpiresAt is null (a manual grant from the Super Admin
 *     panel, which never expires), or
 *   - subscriptionExpiresAt is still in the future
 * Once expired, this quietly falls back to 'free' for every limit check
 * below — no auto-charge happens, the business just loses paid features
 * until they renew from the Plans screen.
 */
/**
 * Shows nothing for Free plan businesses, or paid businesses with plenty
 * of time left. Shows a warning banner starting 5 days before expiry,
 * and a stronger one once it's actually expired (no auto-charge happens
 * either way — this is purely informational, prompting a manual renewal).
 */
function subscriptionReminderBanner(){
  const b = business();
  if(!b || b.subscriptionPlan === 'free' || !b.subscriptionPlan) return '';
  if(!b.subscriptionExpiresAt) return ''; // manual grant — never expires, nothing to remind about
  const expires = new Date(b.subscriptionExpiresAt);
  const now = new Date();
  const daysLeft = Math.ceil((expires - now) / (1000*60*60*24));
  const planName = b.subscriptionPlan === 'boss' ? 'Boss' : 'Pro';

  if(daysLeft <= 0){
    return `<div class="card" style="border-color:var(--red);background:var(--red-bg);margin-bottom:14px;cursor:pointer;" onclick="openPlansSheet()">
      <b style="color:var(--red);">Your ${planName} plan expired ${expires.toLocaleDateString()}</b>
      <div class="subtle">You're now on Freemium limits. Tap to renew.</div>
    </div>`;
  }
  if(daysLeft <= 5){
    return `<div class="card" style="border-color:var(--marigold-dark);background:#FFF7E8;margin-bottom:14px;cursor:pointer;" onclick="openPlansSheet()">
      <b style="color:var(--marigold-dark);">Your ${planName} plan expires in ${daysLeft} day${daysLeft===1?'':'s'}</b>
      <div class="subtle">Renews ${expires.toLocaleDateString()} — tap to renew now.</div>
    </div>`;
  }
  return '';
}

function effectivePlan(){
  const b = business();
  if(!b) return 'free';
  if(b.subscriptionPlan === 'free' || !b.subscriptionPlan) return 'free';
  if(!b.subscriptionExpiresAt) return b.subscriptionPlan; // manual grant — no expiry
  return new Date(b.subscriptionExpiresAt) > new Date() ? b.subscriptionPlan : 'free';
}

function planLimits(forPlan){
  const plan = forPlan || effectivePlan();
  if(plan==='boss') return { shops:Infinity, goods:Infinity, customers:Infinity, staff:Infinity };
  if(plan==='pro') return { shops:3, goods:1000, customers:Infinity, staff:5 };
  return { shops:2, goods:100, customers:50, staff:2 };
}
function planLabel(){
  const plan = effectivePlan();
  return plan==='boss' ? 'Boss' : plan==='pro' ? 'Pro' : 'Freemium';
}

// The "+" next to the shop switcher — purely for a real shop. No warehouse
// option here at all, since mixing that choice into this flow is exactly
// what caused the confusion: someone adding a normal shop shouldn't have to
// even think about warehouses. That decision now only exists in its own
// dedicated place — see createWarehouseFlow, reached only from More → Warehouse.
function handleAddShop(){
  const limits = planLimits();
  if(state.shops.length >= limits.shops){
    toast(`Your ${planLabel()} plan allows ${limits.shops} shop${limits.shops===1?'':'s'} (this includes any warehouses). Upgrade for more.`);
    return;
  }
  openSheet(`
    <div class="sheet-head"><h3>Add Shop</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div class="field"><label>Name</label><input id="as-name" placeholder="e.g. Main Shop, Ikeja Branch"></div>
    <button class="btn btn-primary" id="as-submit">Add</button>

// Reached only from More → Warehouse → Create Warehouse. Its own separate
// entry point, its own separate sheet — no shared form, no checkbox to
// second-guess, since a warehouse is a distinct kind of location, not an
// option tacked onto adding a shop.
function createWarehouseFlow(){
  const limits = planLimits();
  if(state.shops.length >= limits.shops){
    toast(`Your ${planLabel()} plan allows ${limits.shops} shop${limits.shops===1?'':'s'} (this includes any warehouses). Upgrade for more.`);
    return;

  openSheet(`

    <p class="subtle" style="margin-bottom:14px;">${ICON_BOX} For holding stock only — not for selling directly to customers.</p>

function saveNewLocation(isWarehouse){
  const name = document.getElementById('as-name').value.trim();
  if(!name){ toast('Please enter a name.'); return; }
  const s = {id:uid('shop'), businessId:business().id, name, address:'', phone:'', email:'',
    receiptFooter:'Thank you for your business!', receiptTerms:'Goods sold in good condition. No refund after payment.',
    auctionDiscountDefault:30, isWarehouse};

  });
  logAudit(isWarehouse?'warehouse_added':'shop_added', (isWarehouse?'Added warehouse: ':'Added shop: ')+name);
  closeSheet(); render();
}

// ---- Sliding pictures (posted from Super Admin → Banners) ----
let promoBanners = (()=>{ try{ return JSON.parse(localStorage.getItem('zeeshop_banners')||'[]'); }catch(_e){ return []; } })();
let promoFetchedAt = 0;
async function loadPromoBanners(){
  promoFetchedAt = Date.now(); // set first so re-renders can't start a second fetch
  try{
    const r = await fetch(`${SITE_CONTENT_URL}/rest/v1/banners?select=position,image_url,link_url&order=position.asc`, {
      headers: { apikey: SITE_CONTENT_ANON_KEY, Authorization: 'Bearer ' + SITE_CONTENT_ANON_KEY }, cache: 'no-store'
    });
    if(!r.ok) return;
    const fresh = await r.json();
    if(!Array.isArray(fresh)) return;
    if(JSON.stringify(fresh) !== JSON.stringify(promoBanners)){
      promoBanners = fresh;
      try{ localStorage.setItem('zeeshop_banners', JSON.stringify(fresh)); }catch(_e){}
      if(route==='dashboard') render();
    }
  }catch(_e){ /* offline: keep showing the saved pictures */ }
}
function promoSliderBlock(){
  if(!promoBanners.length) return '';
  const slides = promoBanners.map(b=>`
    <div class="promo-slide ${b.link_url?'has-link':''}" data-promo-link="${escapeHtml(b.link_url||'')}">
      <img src="${escapeHtml(b.image_url)}" alt="" draggable="false">
    </div>`).join('');
  const dots = promoBanners.length>1 ? promoBanners.map((_,i)=>`<span class="promo-dot ${i===0?'on':''}"></span>`).join('') : '';
  return `<div class="promo-slider" id="promo-slider"><div class="promo-track" id="promo-track">${slides}</div><div class="promo-dots">${dots}</div></div>`;
}
let promoIndex = 0;
function initPromoSlider(){
  const root = document.getElementById('promo-slider'); if(!root) return;
  const track = document.getElementById('promo-track');
  const slides = [...track.children]; const n = slides.length;
  const dots = [...root.querySelectorAll('.promo-dot')];
  let paused = false, startX = null, resumeT = null;
  const show = (k, animate)=>{
    promoIndex = ((k % n) + n) % n;
    track.style.transition = animate===false ? 'none' : '';
    track.style.transform = `translateX(-${promoIndex*100}%)`;
    dots.forEach((d,i)=>d.classList.toggle('on', i===promoIndex));
  };
  show(Math.min(promoIndex, n-1), false); // keep the position across screen refreshes
  if(window.__promoTimer) clearInterval(window.__promoTimer);
  window.__promoTimer = setInterval(()=>{
    if(!document.body.contains(root)){ clearInterval(window.__promoTimer); return; } // left the Home screen
    if(!paused && n>1) show(promoIndex+1);
  }, 4000);
  const pause = ()=>{ paused = true; clearTimeout(resumeT); };
  const resume = ()=>{ clearTimeout(resumeT); resumeT = setTimeout(()=>{ paused = false; }, 2500); };
  root.addEventListener('touchstart', e=>{ pause(); startX = e.touches[0].clientX; }, { passive:true });
  root.addEventListener('touchend', e=>{
    if(startX!==null){
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 40 && n>1) show(promoIndex + (dx<0 ? 1 : -1));
    }
    startX = null; resume();
  }, { passive:true });
  root.addEventListener('mouseenter', pause); root.addEventListener('mouseleave', resume);
  slides.forEach(sl=>sl.addEventListener('click', ()=>{
    const link = sl.dataset.promoLink;
    // Only secure web links open; a picture with no link does nothing.
    if(link && /^https:\/\//i.test(link)) window.open(link, '_blank', 'noopener,noreferrer');
  }));
}

// ---------- per-person preferences on this device ----------
const NOTIF_LS = 'zeeshop_notif_v2';
function npAll(){ try{ return JSON.parse(localStorage.getItem(NOTIF_LS)||'{}'); }catch(_e){ return {}; } }
function np(){
  const uid = state.sessionUserId;
  let legacyOff = false; try{ legacyOff = localStorage.getItem('zeeshop_push_optout') === '1'; }catch(_e){}
  return Object.assign({ push: !legacyOff, inapp: true, lastRead: null, serverKey: null, pending: {} }, (npAll()[uid]||{}));
}
function npSet(patch){
  const uid = state.sessionUserId; if(!uid) return;
  const all = npAll(); all[uid] = Object.assign(np(), patch);
  try{ localStorage.setItem(NOTIF_LS, JSON.stringify(all)); }catch(_e){}
}
function inAppAlertsOn(){ return np().inapp !== false; }
function laterOf(a, b){ const x = a?Date.parse(a):0, y = b?Date.parse(b):0; return (y>x ? b : a) || null; }

// ---------- server calls (register-push) ----------
async function pushApi(action, extra){
  const { data } = await window.sb.auth.getSession();
  const tok = data && data.session && data.session.access_token;
  if(!tok) throw new Error('no-session');
  const r = await fetch(`${SITE_CONTENT_URL}/functions/v1/register-push`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+tok, 'apikey': SITE_CONTENT_ANON_KEY },
    body: JSON.stringify(Object.assign({ action, app_user_id: state.sessionUserId }, extra||{}))
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.error) throw new Error(j.error || 'request failed');
  return j;
}

let annFetchedAt = 0;
function annUnreadCount(){
  const lr = np().lastRead; const t = lr ? Date.parse(lr) : 0;
  return annList.filter(a=>Date.parse(a.created_at) > t).length;

async function loadAnnouncements(){
  annFetchedAt = Date.now();
  let fresh = null;
  try{ const j = await pushApi('inbox'); if(Array.isArray(j.messages)) fresh = j.messages; }catch(_e){}
  if(!fresh){
    try{
      const { data } = await window.sb.auth.getSession();
      const tok = (data && data.session && data.session.access_token) || SITE_CONTENT_ANON_KEY;
      const r = await fetch(`${SITE_CONTENT_URL}/rest/v1/announcements?select=id,title,body,created_at&order=created_at.desc&limit=30`, {
        headers:{ apikey: SITE_CONTENT_ANON_KEY, Authorization:'Bearer '+tok }, cache:'no-store'
      });
      if(r.ok){ const j = await r.json(); if(Array.isArray(j)) fresh = j; }
    }catch(_e){ /* offline: keep what we have */ }
  }
  if(!fresh) return;
  const changed = JSON.stringify(fresh) !== JSON.stringify(annList);
  annList = fresh;
  try{ localStorage.setItem('zeeshop_ann_cache', JSON.stringify(fresh)); }catch(_e){}
  // First ever sync on this device: don't flag old history as unread — only messages from now on.
  if(!np().lastRead){ npSet({ lastRead: new Date().toISOString() }); pushApi('mark_read').catch(()=>{}); }
  if(changed) refreshNotifUI();
  if(ANN_POPUP && route==='dashboard') showUnseenAnnouncement();
}
function refreshNotifUI(){
  const n = annUnreadCount();
  document.querySelectorAll('[data-notif-dot]').forEach(el=>el.classList.toggle('on', n>0));
  document.querySelectorAll('[data-notif-count]').forEach(el=>{ el.textContent = n>9?'9+':String(n); el.classList.toggle('on', n>0); });
  const sub = document.querySelector('[data-inbox-sub]');
  if(sub) sub.textContent = annList.length ? annList[0].title : 'No messages yet';
}
function notifRelTime(iso){
  const mins = Math.floor((Date.now()-Date.parse(iso))/60000);
  if(isNaN(mins)) return '';
  if(mins < 1) return 'Just now'; if(mins < 60) return mins+'m ago';
  const h = Math.floor(mins/60); if(h < 24) return h+'h ago';
  const d = Math.floor(h/24); if(d < 7) return d+'d ago';
  return new Date(iso).toLocaleDateString();
}

// ---------- push state ----------
let pushDeviceState = null;        // 'on' | 'default' | 'denied' | 'off' | 'unsupported' | 'ios-install' | null
let pushEnsureRunning = false;
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function isStandalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function abToB64Url(buf){ const b = new Uint8Array(buf); let s=''; b.forEach(c=>s+=String.fromCharCode(c)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

async function subscribeThisDevice(interactive){
  if(!pushSupported()) return false;
  let permission = Notification.permission;
  if(permission !== 'granted'){
    if(!interactive) return false;
    permission = await Notification.requestPermission();
  }
  if(permission !== 'granted') return false;
  const reg = await navigator.serviceWorker.ready;
  // The SERVER's key is the source of truth, so rotating keys never needs an app.html edit.
  let key = np().serverKey || VAPID_PUBLIC_KEY;
  try{ const c = await pushApi('config'); if(c.vapid_public_key){ key = c.vapid_public_key; npSet({ serverKey: key }); } }catch(_e){}
  let sub = await reg.pushManager.getSubscription();
  // Auto-resubscribe: a subscription made with a different key can never be reached by the current server key.
  if(sub && sub.options && sub.options.applicationServerKey && abToB64Url(sub.options.applicationServerKey) !== key){
    try{ await sub.unsubscribe(); }catch(_e){}
    sub = null;
  }
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(key) });
  try{
    await pushApi('subscribe', { subscription: sub.toJSON(), vapid_key: key });
    const p = Object.assign({}, np().pending); delete p.push; npSet({ pending: p });
  }catch(_e){
    return false;       // permission is granted but the server could not be reached — retried when back online
  }
  return true;
}

async function ensurePushOn(){
  if(pushEnsureRunning) return;
  pushEnsureRunning = true;
  const before = pushDeviceState;
  try{
    if(isIOS() && !isStandalone()){ pushDeviceState = 'ios-install'; return; }
    if(!pushSupported()){ pushDeviceState = 'unsupported'; return; }
    if(!np().push){
      pushDeviceState = 'off';
      // This device may still hold the previous person's subscription (shared device): release it.
      try{
        const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
        if(sub){ const ep = sub.endpoint; await sub.unsubscribe(); pushApi('unsubscribe', { endpoint: ep }).catch(()=>{}); }
      }catch(_e){}
      return;
    }
    if(Notification.permission === 'denied'){ pushDeviceState = 'denied'; return; }
    if(Notification.permission === 'granted'){
      const ok = await subscribeThisDevice(false);
      pushDeviceState = ok ? 'on' : 'default';
      return;
    }
    pushDeviceState = 'default';     // not asked yet → the Home prompt card does the (tap-driven) ask
  }catch(_e){
    /* keep the previous state */
  }finally{
    pushEnsureRunning = false;
    if(pushDeviceState !== before) notifRefreshAll();
  }
}
async function turnPushOn(){
  if(isIOS() && !isStandalone()){ pushDeviceState = 'ios-install'; return false; }
  let ok = false;
  try{ ok = await subscribeThisDevice(true); }catch(_e){ ok = false; }
  if(Notification.permission === 'denied'){ pushDeviceState = 'denied'; }
  else if(ok){ npSet({ push:true }); pushDeviceState = 'on'; try{ localStorage.removeItem('zeeshop_push_optout'); }catch(_e){} }
  else if(Notification.permission === 'granted'){ npSet({ push:true, pending:Object.assign({}, np().pending, {push:true}) }); pushDeviceState = 'default'; }
  else pushDeviceState = 'default';
  return ok;
}
async function turnPushOff(){
  // The person chose this: it is stored on the server and respected on every sign-in until THEY turn it back on.
  npSet({ push:false });
  pushDeviceState = 'off';
  let endpoint = null;
  try{
    if(pushSupported()){
      const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
      if(sub){ endpoint = sub.endpoint; await sub.unsubscribe(); }
    }
  }catch(_e){}
  try{ await pushApi('unsubscribe', { endpoint }); const p = Object.assign({}, np().pending); delete p.push; npSet({ pending:p }); }
  catch(_e){ npSet({ pending: Object.assign({}, np().pending, { push:false }) }); }
}
async function setInAppAlerts(on){
  npSet({ inapp: !!on });
  try{ await pushApi('set_prefs', { inapp_alerts_enabled: !!on }); const p = Object.assign({}, np().pending); delete p.inapp; npSet({ pending:p }); }
  catch(_e){ npSet({ pending: Object.assign({}, np().pending, { inapp: !!on }) }); }
}

// ---------- boot (runs once after sign-in / person switch) ----------
let notifBootKey = null;
let pendingOpenMessages = (location.hash === '#messages');
async function notifBoot(){
  const uid = state.sessionUserId; if(!uid) return;
  if(pendingOpenMessages){
    pendingOpenMessages = false;
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(_e){}
    setTimeout(()=>{ if(route !== 'more'){ route = 'more'; render(); } openInbox(); }, 60);
  }
  const k = uid + ':' + Math.floor(Date.now()/(30*60*1000));
  if(notifBootKey === k) return;
  notifBootKey = k;
  try{
    // 1) send anything chosen while offline, 2) then adopt the server's saved choices
    const pend = np().pending || {};
    if(pend.push === false) await turnPushOff();
    if(typeof pend.inapp === 'boolean') await setInAppAlerts(pend.inapp);
    const s = await pushApi('get_state');
    const stillPending = np().pending || {};
    const patch = { serverKey: s.vapid_public_key || np().serverKey, lastRead: laterOf(np().lastRead, s.last_messages_read_at) };
    if(!('push' in stillPending)) patch.push = s.push_enabled !== false;
    if(!('inapp' in stillPending)) patch.inapp = s.inapp_alerts_enabled !== false;
    npSet(patch);
  }catch(_e){ /* offline or no session: local values keep working */ }
  loadAnnouncements();
  await ensurePushOn();
  notifRefreshAll();
}
function notifRefreshAll(){
  refreshNotifUI();
  const prompt = document.getElementById('nz-prompt-slot');
  if(prompt) prompt.innerHTML = notifPromptInner();
  const sheet = document.getElementById('nz-settings-body'); if(sheet) sheet.innerHTML = notifSettingsInner();
  const sum = document.getElementById('nz-settings-summary'); if(sum) sum.textContent = notifSummaryText();
  bindNotifPrompt(); bindNotifSettings();
  if(typeof bellCount === 'function'){ const b = document.getElementById('alerts-btn'); if(b) b.setAttribute('data-count', bellCount()); }
}

// ---------- Home prompt (only after sign-in; never on the login screen) ----------
let nzPromptHidden = false;
function notifPromptInner(){
  if(nzPromptHidden || !np().push) return '';

// One consolidated, horizontally-scrollable row of today's key money
// numbers, entirely computed on-device from today's local data — no
// server job, no push, no email, nothing sent anywhere. Order: Bill
// Wallet Balance, Sales Today, Today's Profit (or Cash In for non-master),
// Expenses Today, Credit Given Today. Each card carries its own
// independent eye toggle (see isCardHidden/toggleCardHidden).
function dailyDigestBlock(){
  const shopSalesToday = state.sales.filter(s=>s.shopId===state.currentShopId && s.date===todayISO() && s.status!=='voided');
  const todayTotal = shopSalesToday.reduce((a,s)=>a+s.subtotal,0);
  const todayCash = shopSalesToday.filter(s=>s.status!=='credit').reduce((a,s)=>a+s.paidAmount,0);
  const txCount = shopSalesToday.length;

  let profitToday = 0;
  if(isMaster()){
    const cogs = shopSalesToday.reduce((a,s)=> a + s.items.reduce((b,it)=>{
      const g = state.goods.find(x=>x.id===it.goodId);
      return b + (g?g.costPrice:0)*netQty(it);
    },0), 0);
    profitToday = todayTotal - cogs;
  }

  const showWallet = !isViewer() && canDo('canBillPayments');
  // Bill Wallet Balance is shown universally (to anyone with bill-payments
  // access) rather than being hidden when unfunded — an unconfigured or
  // zero-balance wallet just renders as ₦0 with a "Fund Wallet" prompt so
  // the feature stays discoverable instead of disappearing. "Fund Wallet" and
  // "History" are both always shown, whatever the balance or load state.
  const walletKnown = billWalletBalance !== null;
  const walletVal = walletKnown ? billWalletBalance : 0;

  const cards = [
    showWallet ? {
      id:'billwallet', label:'Wallet Balance',
      value: billWalletError ? '—' : fmtMoney(walletVal),
      footer: billWalletError
        ? `<div class="metric-actions"><button class="metric-action" data-wallet-retry>Retry</button><button class="metric-action" data-wallet-history>History</button></div>`
        : `<div class="metric-actions">
        <button class="metric-action" data-wallet-fund>Fund Wallet</button>
        <button class="metric-action" data-wallet-history>History</button>
      </div>`
    } : null,
    { id:'sales', label: t('dash_sales_today'), value: fmtMoney(todayTotal) },
    isMaster()
      ? { id:'profit', label: t('dash_profit_today'), value: fmtMoney(profitToday) }
      : { id:'cashin', label: t('dash_cash_in'), value: fmtMoney(todayCash) },
    isMaster() ? { id:'expenses', label:'Expenses Today', value: fmtMoney(state.expenses.filter(e=>e.shopId===state.currentShopId && e.date===todayISO()).reduce((a,e)=>a+e.amount,0)) } : null,
    isMaster() ? { id:'credit', label:'Credit Given Today', value: fmtMoney(shopSalesToday.filter(s=>s.status==='credit'||s.status==='partial').reduce((a,s)=>a+s.balance,0)) } : null,
  ].filter(Boolean);

  return `
    <div class="section-head"><h3>Today's Snapshot</h3></div>
    <div class="metric-scroll">
      ${cards.map(metricCardHTML).join('')}
    </div>
    <p class="subtle" style="margin:-6px 0 4px;">${txCount} sale(s) today</p>
  `;
}
function metricCardHTML(c){
  const hidden = isCardHidden(c.id);
  const meta = CARD_META[c.id] || { from:'#5A6472', to:'#8A93A3' };
  return `
    <div class="metric-card" style="background:linear-gradient(135deg, ${meta.from}, ${meta.to});">
      <div class="metric-top">
        <div class="lbl">${c.label}</div>
        <button class="eye-btn" data-eye-toggle="${c.id}" aria-label="${hidden?'Show':'Hide'} ${escAttr(c.label)}">${hidden?ICON_EYE:ICON_EYE_OFF}</button>
      </div>
      <div class="val">${hidden ? '••••••' : c.value}</div>
      ${c.footer||''}
    </div>`;
}

function staffActivityFeed(){

  if(entries.length===0) return '';
  return `

      return `<div class="list-row">

      </div>`;

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  if(days < 7) return days+'d ago';
  return fmtDate(iso.slice(0,10));
}

function lineKey(goodId, variantId){ return variantId ? goodId+'::'+variantId : goodId; }
function variantStock(g, variantId){ const v=(g.variants||[]).find(x=>x.id===variantId); return v ? Math.max(0,v.qty) : 0; }
function openVariantPickerModal(goodId){
  const g = state.goods.find(x=>x.id===goodId);
  openSheet(`
    <div class="sheet-head"><h3>${g.name} — Pick One</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    ${(g.variants||[]).map(v=>{

      return `<button class="list-row" data-pick-variant="${v.id}" style="width:100%;text-align:left;border:none;background:none;padding:12px 0;" ${stock<=0?'disabled':''}>

  `);
  document.querySelectorAll('[data-pick-variant]').forEach(b=>{

      const stock = variantStock(g, variantId);
      const existing = cart.find(c=>c.goodId===g.id && c.variantId===variantId);
      if(existing){
        if(existing.qty+1 > stock){ toast('Not enough stock.'); return; }
        existing.qty++;
      } else {
        cart.push({goodId:g.id, variantId, qty:1, note:''});

function activePrice(g){
  if(saleCustomerId){
    const c = state.customers.find(x=>x.id===saleCustomerId);
    if(c && c.groupId){
      const gp = (g.groupPrices||[]).find(p=>p.groupId===c.groupId);
      if(gp) return gp.price;
    }
  }
  const b = fifoBatch(g);
  return g.basePrice; // base price; auction price applied at cart line level via batch
}
function fifoBatch(g){
  const valid = g.batches.filter(b=>b.qtyRemaining>0 && !isExpired(b)).sort(batchFIFO);
  return valid[0];
}
function isExpired(b){ return daysBetween(todayISO(), b.expiryDate) < 0; }
function cartTotal(){
  return cart.reduce((sum,c)=>{
    const g = state.goods.find(x=>x.id===c.goodId);
    const batch = fifoBatch(g);
    const price = (batch && batch.auctionActive) ? batch.auctionPrice : activePrice(g);
    return sum + price*c.qty;
  },0);
}
function cartBreakdown(){
  const sub = cartTotal();
  const disc = Math.min(Number(saleDiscount||0), sub);
  const taxable = sub - disc;
  const taxPct = business()?.taxPercent || 0;
  const tax = taxPct>0 ? Math.round(taxable*taxPct/100) : 0;
  return { sub, disc, tax, taxPct, grand: taxable + tax };
}


function tryAddByBarcode(code){
  if(!code) return;
  const g = state.goods.find(x=>x.shopId===state.currentShopId && x.barcode===code);
  if(!g){ saleSearch = code; toast("No item matches that barcode — showing search results."); refreshMain(); return; }
  if(!isGoodActive(g)){ toast(g.name + ' is hidden (discontinued), so it can\'t be sold.'); return; }
  if(g.hasVariants){ openVariantPickerModal(g.id); return; }
  const stock = totalStock(g);
  const existing = cart.find(c=>c.goodId===g.id && !c.variantId);
  if(existing){
    if(existing.qty+1 > stock){ toast('Not enough stock.'); return; }
    existing.qty++;
  } else {
    if(stock<=0){ toast(g.name + ' is out of stock.'); return; }
    cart.push({goodId:g.id, variantId:null, qty:1, note:''});
  }
  toast(g.name + ' added ✅');
  refreshMain();
}

// Re-draws the page while someone is typing in a search box, then puts the cursor
// straight back so the keyboard stays open and typing is not interrupted.
function refreshMainKeepFocus(inputId){
  const old = document.getElementById(inputId);
  const pos = old ? old.selectionStart : null;
  refreshMain();
  const el = document.getElementById(inputId);
  if(!el) return;
  try{
    el.focus({preventScroll:true});
    const p = (pos==null) ? el.value.length : pos;
    el.setSelectionRange(p, p);
  }catch(e){}
}

function groupName(id){ const g=state.customerGroups.find(x=>x.id===id); return g?g.name:''; }

function confirmSale(){
  if(!canDo('canSell')){ toast('You no longer have permission to make sales.'); return; }
  if(cart.length===0){ toast('Add at least one item before completing the sale.'); return; }
  const bd = cartBreakdown();
  const total = bd.grand;
  let paid = total, due=null, status='paid';
  if(saleMode==='credit'){
    if(!canDo('canSellCredit')){ toast('You no longer have permission to sell on credit.'); return; }
    paid = Number(document.getElementById('ns-paid').value||0);
    due = document.getElementById('ns-due').value;
    status = paid>=total ? 'paid' : (paid>0?'partial':'credit');
    if(!saleCustomerId){ toast('Credit sales need a buyer selected above (not walk-in).'); return; }
  }
  const touchedBatches = {}; // batchId -> good_id (for syncing updated qty_remaining after deduction)
  const touchedVariants = {}; // variantId -> good_id
  const items = cart.map(c=>{
    const g = state.goods.find(x=>x.id===c.goodId);
    const price = activePrice(g);
    let batchId = null;
    let variantLabel = '';
    if(c.variantId){
      const v = (g.variants||[]).find(x=>x.id===c.variantId);
      if(v){ v.qty = Math.max(0, v.qty - c.qty); variantLabel = v.label; touchedVariants[v.id] = g.id; }
    } else {
      const batch = fifoBatch(g);
      const auctionPrice = (batch && batch.auctionActive) ? batch.auctionPrice : null;
      batchId = batch ? batch.id : null;
      // deduct FIFO
      let remainingQty = c.qty;
      for(const b of g.batches.sort((a,b2)=>new Date(a.expiryDate)-new Date(b2.expiryDate))){
        if(remainingQty<=0) break;
        if(b.qtyRemaining<=0 || isExpired(b)) continue;
        const take = Math.min(b.qtyRemaining, remainingQty);
        b.qtyRemaining -= take;
        remainingQty -= take;
        if(take > 0) touchedBatches[b.id] = g.id;
      }
      if(auctionPrice!=null) return {goodId:g.id, batchId, variantId:null, variantLabel:'', qty:c.qty, priceUsed:auctionPrice, note:c.note||''};
    }
    return {goodId:g.id, batchId, variantId:c.variantId||null, variantLabel, qty:c.qty, priceUsed:price, note:c.note||''};
  });
  const sale = {
    id: uid('sale'), shopId: state.currentShopId, customerId: saleCustomerId,
    walkInName: !saleCustomerId ? saleWalkInName : '', walkInPhone: !saleCustomerId ? saleWalkInPhone : '',
    note: saleNote, itemsSubtotal: bd.sub, discount: bd.disc, taxAmount: bd.tax, taxPct: bd.taxPct,
    date: todayISO(), subtotal: total, paidAmount: paid, balance: Math.max(0,total-paid),
    dueDate: due, status, soldByUserId: state.sessionUserId, receiptSent:false, items,
    createdAt: new Date().toISOString()
  };
  state.sales.push(sale);
  syncSaleInsert(sale);
  Object.keys(touchedBatches).forEach(batchId=>{
    const g = state.goods.find(x=>x.id===touchedBatches[batchId]);
    const b = g && g.batches.find(x=>x.id===batchId);
    if(b) enqueueSync('good_batches','update', { id: b.id, qty_remaining: b.qtyRemaining });
  });
  Object.keys(touchedVariants).forEach(variantId=>{
    const g = state.goods.find(x=>x.id===touchedVariants[variantId]);
    const v = g && g.variants.find(x=>x.id===variantId);
    if(v) enqueueSync('good_variants','update', { id: v.id, qty: v.qty });
  });
  logAudit('sale_created', `Sale ${fmtMoney(total)} (${status})`);
  cart=[]; saleCustomerId=null; saleMode='cash'; saleWalkInName=''; saleWalkInPhone=''; saleNote=''; saleDiscount=0;
  closeSheet();
  render(); // clears the completed sale off the New Sale screen so its button can't be tapped again
  toast('Sale saved ✅');
  openReceiptSheet(sale.id);
}

/* ============================================================
   BLUETOOTH THERMAL PRINTER — Web Bluetooth (BLE) + ESC/POS text
   printing. Free, no API key, entirely client-side.

   IMPORTANT LIMITS (can't be fixed in code, they're platform limits):
   - Web Bluetooth does not exist on iOS Safari at all — Apple blocks
     it. This only works on Android Chrome/Edge (and desktop Chrome).
   - Only works with printers that support Bluetooth LE (GATT). Many
     cheap thermal printers are classic-Bluetooth (SPP) only, which
     no browser can talk to — there is no browser-based fix for that,
     it would need a native app.
   - The service/characteristic UUIDs below are the common ones used
     by most generic 58mm/80mm BLE thermal printers sold online, but
     printer firmware varies. If a specific model doesn't connect,
     its UUID may need to be added to PRINTER_CANDIDATES below.
   ============================================================ */
const PRINTER_CANDIDATES = [
  { service: '000018f0-0000-1000-8000-00805f9b34fb', characteristic: '00002af1-0000-1000-8000-00805f9b34fb' },
  { service: '49535343-fe7d-4ae5-8fa9-9fafd205e455', characteristic: '49535343-8841-43f4-a8d4-ecbe34729bb3' },
  { service: '0000ffe0-0000-1000-8000-00805f9b34fb', characteristic: '0000ffe1-0000-1000-8000-00805f9b34fb' },
];
let btPrinterDevice = null;
let btPrinterCharacteristic = null;

function printerSupported(){ return !!navigator.bluetooth; }

async function connectPrinter(){
  if(!printerSupported()){
    toast("Bluetooth printing isn't available on this browser/device — it needs Android with Chrome.");
    return false;
  }
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: PRINTER_CANDIDATES.map(c=>c.service)
    });
    const server = await device.gatt.connect();
    let found = null;
    for(const cand of PRINTER_CANDIDATES){
      try{
        const service = await server.getPrimaryService(cand.service);
        const characteristic = await service.getCharacteristic(cand.characteristic);
        found = characteristic;
        break;
      }catch(e){ /* this candidate isn't offered by this printer — try the next one */ }
    }
    if(!found){
      toast("Connected, but couldn't find a printable service on this device — it may not be a supported thermal printer.");
      device.gatt.disconnect();
      return false;
    }
    device.addEventListener('gattserverdisconnected', ()=>{ btPrinterDevice=null; btPrinterCharacteristic=null; });
    btPrinterDevice = device;
    btPrinterCharacteristic = found;
    return true;
  }catch(e){
    if(e.name !== 'NotFoundError') toast("Couldn't connect to the printer: " + e.message);
    return false;
  }
}
async function ensurePrinterConnected(){
  if(btPrinterDevice && btPrinterDevice.gatt.connected && btPrinterCharacteristic) return true;
  return connectPrinter();
}
// Cheap thermal printer firmware is usually ASCII/CP437 only — strip the
// characters our receipts use that it can't reliably render.
function escposSafeText(t){
  return String(t||'')
    .replace(/₦/g, 'NGN ')
    .replace(/—/g, '-')
    .replace(/[^\x00-\x7E\n]/g, '');
}
async function printReceiptText(rawText){
  const ok = await ensurePrinterConnected();
  if(!ok) return false;
  const text = escposSafeText(rawText) + '\n\n\n\n'; // extra feed so it clears the cutter for hand-tearing
  const ESC_INIT = new Uint8Array([0x1B, 0x40]); // ESC @ — reset printer to defaults
  const body = new TextEncoder().encode(text);
  const bytes = new Uint8Array(ESC_INIT.length + body.length);
  bytes.set(ESC_INIT, 0); bytes.set(body, ESC_INIT.length);
  const CHUNK = 100; // small chunks — cheap BLE printers have tiny input buffers
  try{
    for(let i=0; i<bytes.length; i+=CHUNK){
      const chunk = bytes.slice(i, i+CHUNK);
      if(btPrinterCharacteristic.properties.writeWithoutResponse){
        await btPrinterCharacteristic.writeValueWithoutResponse(chunk);
      } else {
        await btPrinterCharacteristic.writeValue(chunk);
      }
      await new Promise(r=>setTimeout(r, 25)); // let the printer's buffer drain
    }
    return true;
  }catch(e){
    toast("Printing failed partway through: " + e.message);
    return false;
  }
}
