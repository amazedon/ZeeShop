/**
 * Returns the plan that should actually be enforced right now — this is
 * what makes an expiry date mean something. A business stays on its paid
 * plan as long as either:
 *   - subscriptionExpiresAt is null (a manual grant from the Super Admin
 *     panel, which never expires), or
 *   - subscriptionExpiresAt is still in the future
 * Once expired, this quietly falls back to 'free' for every limit check
 * below — no auto-charge happens, the business just loses paid features
 * until they renew from the Plans screen.
 */
/**
 * Shows nothing for Free plan businesses, or paid businesses with plenty
 * of time left. Shows a warning banner starting 5 days before expiry,
 * and a stronger one once it's actually expired (no auto-charge happens
 * either way — this is purely informational, prompting a manual renewal).
 */
function subscriptionReminderBanner(){
  const b = business();
  if(!b || b.subscriptionPlan === 'free' || !b.subscriptionPlan) return '';
  if(!b.subscriptionExpiresAt) return ''; // manual grant — never expires, nothing to remind about
  const expires = new Date(b.subscriptionExpiresAt);
  const now = new Date();
  const daysLeft = Math.ceil((expires - now) / (1000*60*60*24));
  const planName = b.subscriptionPlan === 'boss' ? 'Boss' : 'Pro';

  if(daysLeft <= 0){
    return `<div class="card" style="border-color:var(--red);background:var(--red-bg);margin-bottom:14px;cursor:pointer;" onclick="openPlansSheet()">
      <b style="color:var(--red);">Your ${planName} plan expired ${expires.toLocaleDateString()}</b>
      <div class="subtle">You're now on Freemium limits. Tap to renew.</div>
    </div>`;
  }
  if(daysLeft <= 5){
    return `<div class="card" style="border-color:var(--marigold-dark);background:#FFF7E8;margin-bottom:14px;cursor:pointer;" onclick="openPlansSheet()">
      <b style="color:var(--marigold-dark);">Your ${planName} plan expires in ${daysLeft} day${daysLeft===1?'':'s'}</b>
      <div class="subtle">Renews ${expires.toLocaleDateString()} — tap to renew now.</div>
    </div>`;
  }
  return '';
}

function effectivePlan(){
  const b = business();
  if(!b) return 'free';
  if(b.subscriptionPlan === 'free' || !b.subscriptionPlan) return 'free';
  if(!b.subscriptionExpiresAt) return b.subscriptionPlan; // manual grant — no expiry
  return new Date(b.subscriptionExpiresAt) > new Date() ? b.subscriptionPlan : 'free';
}

function planLimits(forPlan){
  const plan = forPlan || effectivePlan();
  if(plan==='boss') return { shops:Infinity, goods:Infinity, customers:Infinity, staff:Infinity };
  if(plan==='pro') return { shops:3, goods:1000, customers:Infinity, staff:5 };
  return { shops:2, goods:100, customers:50, staff:2 };
}
function planLabel(){
  const plan = effectivePlan();
  return plan==='boss' ? 'Boss' : plan==='pro' ? 'Pro' : 'Freemium';
}

function saveNewLocation(isWarehouse){
  const name = document.getElementById('as-name').value.trim();

  const s = {id:uid('shop'), businessId:business().id, name, address:'', phone:'', email:'',

    auctionDiscountDefault:30, isWarehouse};
  state.shops.push(s);
  state.currentShopId = s.id;
  enqueueSync('shops','insert', {
    id: s.id, business_id: s.businessId, name: s.name, address: s.address, phone: s.phone, email: s.email,
    receipt_footer: s.receiptFooter, receipt_terms: s.receiptTerms, auction_discount_default: s.auctionDiscountDefault,
    is_warehouse: s.isWarehouse
  });
  logAudit(isWarehouse?'warehouse_added':'shop_added', (isWarehouse?'Added warehouse: ':'Added shop: ')+name);
  closeSheet(); render();
}

// A slightly richer end-of-day-so-far snapshot for the owner, entirely
// computed on-device from today's local data — no server job, no push,
// no email, nothing sent anywhere. It's just today's numbers laid out.
function dailyDigestBlock(){
  const shopExpensesToday = state.expenses.filter(e=>e.shopId===state.currentShopId && e.date===todayISO());

// Recent staff activity — the owner's window into what's happening across
// every device, not just this one. Pulled from the audit log, which now

function staffActivityFeed(){
  const entries = state.auditLog
    .filter(l=>l.businessId===business()?.id)
    .slice()
    .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))
    .slice(0,6);

  return `
    <div class="section-head"><h3>Recent Activity</h3><a href="#" data-goto="audit" style="font-size:12px;color:var(--marigold-dark);font-weight:700;">View all</a></div>

      const actor = state.users.find(u=>u.id===l.userId);
      return `<div class="list-row">

        <div class="info"><div class="t1">${actor?actor.firstName+' '+(actor.lastName||''):'Someone'}</div><div class="t2">${escapeHtml(l.details||l.action)}</div></div>
        <div class="subtle" style="font-size:10.5px;flex-shrink:0;">${timeAgo(l.timestamp)}</div>
      </div>`;
    }).join('')}

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  if(days < 7) return days+'d ago';
  return fmtDate(iso.slice(0,10));
}
function bindDashboardEvents(){

function subHeader(title){

function totalStock(g){
  if(g.hasVariants) return (g.variants||[]).reduce((a,v)=>a+Math.max(0,v.qty),0);
  return g.batches.reduce((a,b)=>a+Math.max(0,b.qtyRemaining),0);
}
function netQty(it){ return Math.max(0, it.qty - (it.returnedQty||0)); }

function lineKey(goodId, variantId){ return variantId ? goodId+'::'+variantId : goodId; }
function variantStock(g, variantId){ const v=(g.variants||[]).find(x=>x.id===variantId); return v ? Math.max(0,v.qty) : 0; }
function openVariantPickerModal(goodId){
  const g = state.goods.find(x=>x.id===goodId);
  openSheet(`
    <div class="sheet-head"><h3>${g.name} — Pick One</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    ${(g.variants||[]).map(v=>{
      const stock = Math.max(0,v.qty);
      const inCartLine = cart.find(c=>c.goodId===g.id && c.variantId===v.id);
      return `<button class="list-row" data-pick-variant="${v.id}" style="width:100%;text-align:left;border:none;background:none;padding:12px 0;" ${stock<=0?'disabled':''}>
        <div class="thumb" style="${stock<=0?'opacity:0.4;':''}">${g.emoji||'🛍️'}</div>
        <div class="info"><div class="t1" style="${stock<=0?'color:var(--text-dim);':''}">${escapeHtml(v.label)}${inCartLine?` (${inCartLine.qty} in cart)`:''}</div>
        <div class="t2">${stock<=0?'Out of stock':stock+' in stock'}</div></div>
      </button>`;
    }).join('') || '<p class="subtle">No sizes/colors set up for this item yet.</p>'}
  `);
  document.querySelectorAll('[data-pick-variant]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const variantId = b.dataset.pickVariant;
      const stock = variantStock(g, variantId);
      const existing = cart.find(c=>c.goodId===g.id && c.variantId===variantId);
      if(existing){
        if(existing.qty+1 > stock){ toast('Not enough stock.'); return; }
        existing.qty++;
      } else {
        cart.push({goodId:g.id, variantId, qty:1, note:''});
      }
      closeSheet(); refreshMain();
    });
  });
}
function activePrice(g){
  if(saleCustomerId){
    const c = state.customers.find(x=>x.id===saleCustomerId);
    if(c && c.groupId){
      const gp = (g.groupPrices||[]).find(p=>p.groupId===c.groupId);
      if(gp) return gp.price;
    }
  }
  const b = fifoBatch(g);
  return g.basePrice; // base price; auction price applied at cart line level via batch
}
function fifoBatch(g){
  const valid = g.batches.filter(b=>b.qtyRemaining>0 && !isExpired(b)).sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  return valid[0];
}
function isExpired(b){ return daysBetween(todayISO(), b.expiryDate) < 0; }
function cartTotal(){
  return cart.reduce((sum,c)=>{
    const g = state.goods.find(x=>x.id===c.goodId);
    const batch = fifoBatch(g);
    const price = (batch && batch.auctionActive) ? batch.auctionPrice : activePrice(g);
    return sum + price*c.qty;
  },0);
}
function cartBreakdown(){
  const sub = cartTotal();
  const disc = Math.min(Number(saleDiscount||0), sub);
  const taxable = sub - disc;
  const taxPct = business()?.taxPercent || 0;
  const tax = taxPct>0 ? Math.round(taxable*taxPct/100) : 0;
  return { sub, disc, tax, taxPct, grand: taxable + tax };
}

function bindRouteEvents(){
  if(route==='dashboard'){ bindDashboardEvents(); }
  if(route==='sale'){
    const search = document.getElementById('sale-search');
    if(search) search.addEventListener('input', e=>{ saleSearch=e.target.value; refreshMain(); });
    const custSel = document.getElementById('ns-customer');
    if(custSel) custSel.addEventListener('change', e=>{
      const v = e.target.value;
      if(v===''){ saleCustomerId = null; openWalkInModal(); }
      else { saleCustomerId = v; saleWalkInName=''; saleWalkInPhone=''; refreshMain(); }
    });
    const ewb = document.getElementById('edit-walkin-btn');
    if(ewb) ewb.addEventListener('click', openWalkInModal);
    const noteInput = document.getElementById('ns-note');
    if(noteInput) noteInput.addEventListener('input', e=>{ saleNote = e.target.value; });
    const discInput = document.getElementById('ns-discount');
    if(discInput) discInput.addEventListener('change', e=>{ saleDiscount = Number(e.target.value||0); refreshMain(); });
    const mc = document.getElementById('mode-cash'); if(mc) mc.addEventListener('click', ()=>{ saleMode='cash'; refreshMain(); });
    const md = document.getElementById('mode-credit'); if(md) md.addEventListener('click', ()=>{ saleMode='credit'; refreshMain(); });
    document.querySelectorAll('[data-add-good]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const gid = b.dataset.addGood;
        const g = state.goods.find(x=>x.id===gid);
        if(g.hasVariants){ openVariantPickerModal(gid); return; }
        const stock = totalStock(g);
        const existing = cart.find(c=>c.goodId===gid && !c.variantId);
        if(existing){
          if(existing.qty+1 > stock){ toast('Not enough stock.'); return; }
          existing.qty++;
        } else {
          cart.push({goodId:gid, variantId:null, qty:1, note:''});
        }
        refreshMain();
      });
    });
    const parseKey = k=>{ const [goodId,variantId] = k.split('::'); return {goodId, variantId: variantId||null}; };
    document.querySelectorAll('[data-qty-inc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const {goodId,variantId} = parseKey(b.dataset.qtyInc);
        const g = state.goods.find(x=>x.id===goodId);
        const line = cart.find(c=>c.goodId===goodId && c.variantId===variantId);
        if(!line) return;
        const stock = variantId ? variantStock(g, variantId) : totalStock(g);
        if(line.qty+1 > stock){ toast('Not enough stock.'); return; }
        line.qty++; refreshMain();
      });
    });
    document.querySelectorAll('[data-qty-dec]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const {goodId,variantId} = parseKey(b.dataset.qtyDec);
        const line = cart.find(c=>c.goodId===goodId && c.variantId===variantId);
        if(!line) return;
        line.qty--;

    document.querySelectorAll('[data-remove-item]').forEach(b=>{

function confirmSale(){
  if(!canDo('canSell')){ toast('You no longer have permission to make sales.'); return; }
  if(cart.length===0){ toast('Add at least one item before completing the sale.'); return; }
  const bd = cartBreakdown();
  const total = bd.grand;
  let paid = total, due=null, status='paid';
  if(saleMode==='credit'){
    if(!canDo('canSellCredit')){ toast('You no longer have permission to sell on credit.'); return; }
    paid = Number(document.getElementById('ns-paid').value||0);
    due = document.getElementById('ns-due').value;
    status = paid>=total ? 'paid' : (paid>0?'partial':'credit');
    if(!saleCustomerId){ toast('Credit sales need a buyer selected above (not walk-in).'); return; }
  }
  const touchedBatches = {}; // batchId -> good_id (for syncing updated qty_remaining after deduction)
  const touchedVariants = {}; // variantId -> good_id
  const items = cart.map(c=>{
    const g = state.goods.find(x=>x.id===c.goodId);
    const price = activePrice(g);
    let batchId = null;
    let variantLabel = '';
    if(c.variantId){
      const v = (g.variants||[]).find(x=>x.id===c.variantId);
      if(v){ v.qty = Math.max(0, v.qty - c.qty); variantLabel = v.label; touchedVariants[v.id] = g.id; }
    } else {
      const batch = fifoBatch(g);
      const auctionPrice = (batch && batch.auctionActive) ? batch.auctionPrice : null;
      batchId = batch ? batch.id : null;
      // deduct FIFO
      let remainingQty = c.qty;
      for(const b of g.batches.sort((a,b2)=>new Date(a.expiryDate)-new Date(b2.expiryDate))){
        if(remainingQty<=0) break;
        if(b.qtyRemaining<=0 || isExpired(b)) continue;
        const take = Math.min(b.qtyRemaining, remainingQty);
        b.qtyRemaining -= take;
        remainingQty -= take;
        if(take > 0) touchedBatches[b.id] = g.id;
      }
      if(auctionPrice!=null) return {goodId:g.id, batchId, variantId:null, variantLabel:'', qty:c.qty, priceUsed:auctionPrice, note:c.note||''};
    }
    return {goodId:g.id, batchId, variantId:c.variantId||null, variantLabel, qty:c.qty, priceUsed:price, note:c.note||''};
  });
  const sale = {
    id: uid('sale'), shopId: state.currentShopId, customerId: saleCustomerId,
    walkInName: !saleCustomerId ? saleWalkInName : '', walkInPhone: !saleCustomerId ? saleWalkInPhone : '',
    note: saleNote, itemsSubtotal: bd.sub, discount: bd.disc, taxAmount: bd.tax, taxPct: bd.taxPct,
    date: todayISO(), subtotal: total, paidAmount: paid, balance: Math.max(0,total-paid),
    dueDate: due, status, soldByUserId: state.sessionUserId, receiptSent:false, items,
    createdAt: new Date().toISOString()
  };
  state.sales.push(sale);
  syncSaleInsert(sale);
  Object.keys(touchedBatches).forEach(batchId=>{
    const g = state.goods.find(x=>x.id===touchedBatches[batchId]);
    const b = g && g.batches.find(x=>x.id===batchId);
    if(b) enqueueSync('good_batches','update', { id: b.id, qty_remaining: b.qtyRemaining });
  });
  Object.keys(touchedVariants).forEach(variantId=>{
    const g = state.goods.find(x=>x.id===touchedVariants[variantId]);
    const v = g && g.variants.find(x=>x.id===variantId);
    if(v) enqueueSync('good_variants','update', { id: v.id, qty: v.qty });
  });
  logAudit('sale_created', `Sale ${fmtMoney(total)} (${status})`);
  cart=[]; saleCustomerId=null; saleMode='cash'; saleWalkInName=''; saleWalkInPhone=''; saleNote=''; saleDiscount=0;
  closeSheet();
  render(); // clears the completed sale off the New Sale screen so its button can't be tapped again
  toast('Sale saved ✅');
  openReceiptSheet(sale.id);
}

// A faint diagonal repeating watermark across the receipt background — a
// classic security-document technique, and embedding the receipt ID in it
// makes an altered/photocopied receipt visibly harder to pass off as clean.
function drawSecurityTint(ctx, W, H, text){
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = '#12213B';
  ctx.font = '700 10.5px Arial,Helvetica,sans-serif';
  ctx.textAlign = 'left';
  const textWidth = ctx.measureText(text).width;
  const stepX = textWidth + 22; // smallest gap that still keeps same-row copies from touching
  const stepY = 24; // tight row spacing so there's no clean blank strip anywhere on the page
  ctx.translate(W/2, H/2);
  ctx.rotate(-Math.PI/7);
  const cols = Math.ceil((W*2)/stepX) + 2;
  const rows = Math.ceil((H*2)/stepY) + 2;
  for(let r=-rows; r<=rows; r++){
    const rowOffset = (r % 2 === 0) ? 0 : stepX/2; // stagger alternate rows so the pattern fills in, brick-style
    for(let c=-cols; c<=cols; c++){
      ctx.fillText(text, c*stepX + rowOffset, r*stepY);
    }
  }
  ctx.restore();
}
function drawDashedLine(ctx,x1,y1,x2,y2){
  ctx.save(); ctx.strokeStyle='#E4E0D6'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
// Same canvas ₦-glyph rendering issue as receipts can also hit free-typed text
// (settlement terms, notes) if someone types the symbol themselves — so any text
// drawn on a canvas document should pass through this first.
function canvasSafeText(s){ return String(s||'').replace(/₦/g, 'NGN '); }
function wrapPlainText(text, maxChars){
  const words = text.split(' ');
  let lines = [], line = '';
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(test.length > maxChars && line){ lines.push(line); line = w; } else { line = test; }
  });
  if(line) lines.push(line);
  return lines;
}
// Draws the receipt (or just measures it, when ctx is null) using one shared layout
// pass. This guarantees the canvas is always exactly tall enough — no separate height
// formula to keep in sync, which is what caused content to be clipped before.
function layoutAndDrawReceipt(s, shop, cust, seller, ctx, logoImg){
  const W = 380, PAD = 22, LINE_H = 22, SN_W = 22;
  const noteLines = s.note ? wrapPlainText(canvasSafeText(s.note), 50) : [];
  const itemNoteLines = s.items.map(it => it.note ? wrapPlainText(canvasSafeText(it.note), 46) : []);
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  if(logoImg){
    const logoSize = 50;
    if(ctx) ctx.drawImage(logoImg, PAD, y-20, logoSize, logoSize);
  }
  T(shop.name, W/2, 'center', '800 17px Arial,Helvetica,sans-serif', '#12213B'); y += 18;
  if(business().businessType){
    T(business().businessType.toUpperCase(), W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 15;
  }
  T(shop.address, W/2, 'center', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  if(shop.address) y += 14;
  if(shop.phone || shop.email){ T([shop.phone,shop.email].filter(Boolean).join('  ·  '), W/2, 'center'); y += 14; }
  if(business().registrationNumber){ T('Reg. No: '+business().registrationNumber, W/2, 'center', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB'); y += 13; }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T('Receipt #'+s.id.slice(-6).toUpperCase(), PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#242B38');
  T(fmtDate(s.date), W-PAD, 'right', '400 12px Arial,Helvetica,sans-serif'); y += 17;
  T('Sold by: '+seller.firstName+' '+seller.lastName, PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('Txn ID: '+s.id, PAD, 'left', '400 9px Arial,Helvetica,sans-serif', '#B0B5BD'); y += 13;
  T('Buyer: '+(cust ? cust.fullName : (s.walkInName || 'Walk-in customer')), PAD, 'left', '700 12.5px Arial,Helvetica,sans-serif', '#12213B');
  const buyerPhone = cust ? cust.phoneE164 : s.walkInPhone;
  if(buyerPhone){ y += 15; T(buyerPhone, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); }
  y += 14;
  L(PAD, y, W-PAD, y); y += 18;

  s.items.forEach((it,idx)=>{
    const g = state.goods.find(x=>x.id===it.goodId);
    const itemLabel = it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name;
    T(`${itemLabel} × ${it.qty}`, PAD, 'left', '400 12.5px Arial,Helvetica,sans-serif', '#242B38');
    T(fmtMoneyCanvas(it.priceUsed*it.qty), W-PAD, 'right');
    y += LINE_H;
    if(itemNoteLines[idx].length){
      itemNoteLines[idx].forEach(line=>{ T(line, PAD, 'left', 'italic 400 10.5px Arial,Helvetica,sans-serif', '#8A8F99'); y += 13; });
    }
  });
  L(PAD, y, W-PAD, y); y += 22;

  if(noteLines.length){
    noteLines.forEach(line=>{ T(line, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#242B38'); y += 15; });
    y += 6;
    L(PAD, y, W-PAD, y); y += 20;
  }

  const hasBreakdown = (s.discount>0) || (s.taxAmount>0);
  if(hasBreakdown){
    T('Subtotal', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
    T(fmtMoneyCanvas(s.itemsSubtotal!=null?s.itemsSubtotal:s.subtotal), W-PAD, 'right'); y += 15;
    if(s.discount>0){
      T('Discount', PAD, 'left'); T('-'+fmtMoneyCanvas(s.discount), W-PAD, 'right'); y += 15;
    }
    if(s.taxAmount>0){
      T((business().taxName||'Tax')+' ('+s.taxPct+'%)', PAD, 'left'); T(fmtMoneyCanvas(s.taxAmount), W-PAD, 'right'); y += 15;
    }
    y += 4;
  }
  T('TOTAL', PAD, 'left', '800 15px Arial,Helvetica,sans-serif', '#12213B');
  T(fmtMoneyCanvas(s.subtotal), W-PAD, 'right'); y += 20;

  if(s.status!=='paid'){
    T('PAID', PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#2E7D32');
    T(fmtMoneyCanvas(s.paidAmount), W-PAD, 'right'); y += 18;
    T('BALANCE DUE '+fmtDate(s.dueDate), PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#C0392B');
    T(fmtMoneyCanvas(s.balance), W-PAD, 'right'); y += 18;
  }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T(shop.receiptFooter||'Thank you for your business!', W/2, 'center', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  y += 16;
  const terms = shop.receiptTerms!=null ? shop.receiptTerms : 'Goods sold in good condition. No refund after payment.';
  if(terms){
    wrapPlainText(canvasSafeText(terms), 56).forEach(line=>{
      T(line, W/2, 'center', 'italic 400 9.5px Arial,Helvetica,sans-serif', '#9AA0AB'); y += 12;
    });
  }
  y += 12; // bottom padding
  return y; // total height needed
}
async function drawReceiptToCanvas(canvas, s, shop, cust, seller){
  const logoImg = await getLogoImage();
  const W = 380, scale = 2;
  const h = layoutAndDrawReceipt(s, shop, cust, seller, null, logoImg); // measure pass — no drawing yet
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFF7EA'; ctx.fillRect(0,0,W,h);
  drawSecurityTint(ctx, W, h, shop.name.toUpperCase());
  layoutAndDrawReceipt(s, shop, cust, seller, ctx, logoImg); // real draw pass, now sized correctly
}
function receiptText(s,shop,cust){
  let t = `${shop.name}${business().businessType?' ('+business().businessType+')':''}\n${shop.address?shop.address+'\n':''}${business().registrationNumber?'Reg. No: '+business().registrationNumber+'\n':''}Receipt #${s.id.slice(-6).toUpperCase()} — ${fmtDate(s.date)}\nTxn ID: ${s.id}\nBuyer: ${cust?cust.fullName:(s.walkInName||'Walk-in customer')}\n`;
  s.items.forEach((it,idx)=>{ const g=state.goods.find(x=>x.id===it.goodId); const itemLabel = it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name; t+=`${idx+1}. ${itemLabel} x${it.qty} — ${fmtMoney(it.priceUsed*it.qty)}\n`; if(it.note) t+=`   (${it.note})\n`; });
  if(s.note) t += `${s.note}\n`;
  if((s.discount>0) || (s.taxAmount>0)){
    t += `Subtotal: ${fmtMoney(s.itemsSubtotal!=null?s.itemsSubtotal:s.subtotal)}\n`;
    if(s.discount>0) t += `Discount: -${fmtMoney(s.discount)}\n`;
    if(s.taxAmount>0) t += `${business().taxName||'Tax'} (${s.taxPct}%): ${fmtMoney(s.taxAmount)}\n`;
  }
  t += `Total: ${fmtMoney(s.subtotal)}\n`;
  if(s.status!=='paid') t += `Paid: ${fmtMoney(s.paidAmount)} | Balance: ${fmtMoney(s.balance)} due ${fmtDate(s.dueDate)}\n`;
  const terms = shop.receiptTerms!=null ? shop.receiptTerms : 'Goods sold in good condition. No refund after payment.';
  if(terms) t += `${terms}\n`;
  t += `- ${shop.name}`;
  return t;
}

        }

      else if(!pill && stock<=(g.reorderLevel||5)) pill = `<span class="pill pill-amber">LOW STOCK</span>`;

        : g.dimension && g.dimension.value ? `${escapeHtml(g.dimension.value)} ${escapeHtml(g.dimension.unit||'')} · ${stock} in stock`
        : `${stock} in stock${isMaster()?(' · cost '+fmtMoney(g.costPrice)):''}`;
      return `
      <div class="card" style="display:flex;gap:0;padding:0;overflow:hidden;">
        <div class="expiry-flag" style="${flag}"></div>
        <div style="padding:13px 14px;flex:1;display:flex;align-items:center;gap:12px;" data-good-detail="${g.id}">

            <div style="font-weight:800;">${fmtMoney(g.basePrice)}</div>
            ${pill}
          </div>
        </div>
      </div>`;
    }).join('')}
  `;
}

      ${rows.valid.length>8?`<div class="t2">...and ${rows.valid.length-8} more</div>`:''}
      ${rows.errors.length?`<p class="subtle" style="margin-top:8px;color:var(--red);">Skipped: ${rows.errors.join('; ')}</p>`:''}
      <button class="btn btn-primary" id="bulk-confirm-btn" style="margin-top:14px;">Add ${rows.valid.length} Item(s)</button>

          batches:[{id:uid('batch'), qtyRemaining:r.qty, expiryDate:r.expiry||'2099-12-31', costPrice:r.cost,
            batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null}]
        });
      });
      logAudit('bulk_goods_added', `Bulk-added ${rows.valid.length} items via CSV`);
      toast(`${rows.valid.length} item(s) added ✅`); closeSheet(); render();
    });
  });

function parseBulkCSV(raw){
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const valid = []; const errors = [];
  lines.forEach((line,i)=>{
    const parts = line.split(',').map(p=>p.trim());
    const [name, priceStr, costStr, qtyStr, expiry] = parts;
    const price = Number(priceStr), cost = Number(costStr||0), qty = Number(qtyStr);
    if(!name || !priceStr || !qtyStr || isNaN(price) || isNaN(qty) || price<=0 || qty<=0){
      errors.push(`line ${i+1}`); return;
    }
    valid.push({ name, price, cost: isNaN(cost)?0:cost, qty, expiry: expiry && /^\d{4}-\d{2}-\d{2}$/.test(expiry) ? expiry : null });
  });
  return { valid, errors };
}

function saveNewGood(profile){
  const limits = planLimits();
  if(state.goods.length >= limits.goods){
    toast(`Your ${planLabel()} plan allows up to ${limits.goods} goods. Upgrade for more.`);
    return;
  }
  const name = document.getElementById('ag-name').value.trim();
  const price = Number(document.getElementById('ag-price').value||0);
  const cost = Number(document.getElementById('ag-cost').value||0);
  const barcode = document.getElementById('ag-barcode')?.value.trim() || null;
  const reorderLevel = Number(document.getElementById('ag-reorder')?.value||5);
  const emoji = document.getElementById('ag-emoji').value;
  if(!name || price<=0){ toast('Please fill in name and selling price.'); return; }
  if(barcode && state.goods.some(x=>x.shopId===state.currentShopId && x.barcode===barcode)){ toast('That barcode is already used by another item.'); return; }

  if(profile==='variants'){
    syncPendingVariantsFromDOM();
    const validVariants = pendingVariants.filter(v=>v.size||v.color).map(v=>({
      id: uid('var'), size:v.size, color:v.color, qty: Math.max(0, v.qty),

    }));

      emoji, groupPrices:[], barcode, reorderLevel, hasVariants:true, variants: validVariants, batches:[] };
    state.goods.push(g);

    closeSheet(); toast('Item added ✅'); render(); return;
  }

  const expiry = document.getElementById('ag-expiry')?.value || '2099-12-31';
  const batch = document.getElementById('ag-batch')?.value || ('B'+Math.floor(Math.random()*9000+1000));
  const g = { id: uid('good'), shopId: state.currentShopId, name, basePrice:price, costPrice:cost,
    emoji, groupPrices:[], barcode, reorderLevel, hasVariants:false,
    batches:[{id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost, batchNo:batch, auctionActive:false, auctionPrice:null, auctionDiscount:null}] };

  }
  state.goods.push(g);
  syncGoodInsert(g);
  logAudit('good_added', 'Added '+qty+' x '+name);
  closeSheet(); toast('Item added ✅'); render();
}

/**
 * Queues a newly-created good, plus its batches or variants, for sync.
 * Called right after a good is added locally — mirrors the same
 * "local write first, sync catches up" pattern as everything else.
 */
function syncGoodInsert(g){
  enqueueSync('goods','insert', {
    id: g.id, shop_id: g.shopId, name: g.name, base_price: g.basePrice, cost_price: g.costPrice,
    barcode: g.barcode || null, reorder_level: g.reorderLevel, has_variants: g.hasVariants,
    spec: g.spec || null, spec_label: g.specLabel || null,
    dimension_value: g.dimension ? g.dimension.value : null, dimension_unit: g.dimension ? g.dimension.unit : null
  });
  (g.batches||[]).forEach(b=>{
    enqueueSync('good_batches','insert', {
      id: b.id, good_id: g.id, batch_no: b.batchNo, qty_remaining: b.qtyRemaining,
      expiry_date: b.expiryDate, cost_price: b.costPrice, auction_active: b.auctionActive,
      auction_price: b.auctionPrice, auction_discount: b.auctionDiscount
    });
  });
  (g.variants||[]).forEach(v=>{
    enqueueSync('good_variants','insert', {
      id: v.id, good_id: g.id, size: v.size || null, color: v.color || null, label: v.label, qty: v.qty
    });
  });
}

    g.variants.push(v);
    // Same missing-sync bug — a brand new variant never reached the server.
    enqueueSync('good_variants','insert', { id: v.id, good_id: g.id, size: v.size, color: v.color, qty: v.qty, label: v.label });
    logAudit('variant_added', `Added new variant to ${g.name}`);
    toast('Variant added ✅'); openGoodDetail(gid);
  });
}

/* ============================================================
   STOCK CORRECTION — for anything where the system's count and
   physical reality can honestly drift apart (cooked food yields
   being the main case, but useful for any manual recount). Every
   correction is a permanent, append-only record — see History and
   the Audit Log — there is no edit or delete path for one, by design.
   ============================================================ */
function openStockCorrectionModal(goodId, batchId){
  const g = state.goods.find(x=>x.id===goodId);
  const b = g.batches.find(x=>x.id===batchId);
  openSheet(`
    <div class="sheet-head"><h3>Correct Count</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:14px;">${escapeHtml(g.name)} — ${b.batchNo}</p>
    <div class="stat-box" style="margin-bottom:14px;"><div class="lbl">System Currently Says</div><div class="val">${b.qtyRemaining}</div></div>
    <div class="field"><label>What's actually there right now</label><input id="sc-actual" type="number" min="0" value="${b.qtyRemaining}"></div>
    <div id="sc-diff" class="subtle" style="margin:-6px 0 12px;"></div>
    <div class="field"><label>Reason <span class="subtle">(optional, but worth noting)</span></label><input id="sc-reason" placeholder="e.g. sold faster than the estimate, spillage"></div>
    <button class="btn btn-primary" id="sc-submit">Confirm Correction</button>
  `);
  const actualInput = document.getElementById('sc-actual');
  const diffLabel = document.getElementById('sc-diff');
  const updateDiff = ()=>{
    const actual = Number(actualInput.value||0);
    const diff = actual - b.qtyRemaining;
    diffLabel.textContent = diff===0 ? '' : diff>0 ? `This will increase stock by ${diff}.` : `This will reduce stock by ${Math.abs(diff)}.`;
    diffLabel.style.color = diff<0 ? 'var(--red)' : diff>0 ? 'var(--green)' : 'var(--text-dim)';
  };
  actualInput.addEventListener('input', updateDiff);
  updateDiff();
  document.getElementById('sc-submit').addEventListener('click', ()=>{
    const actual = Number(actualInput.value||0);
    if(actual<0){ toast('Count cannot be negative.'); return; }
    const oldQty = b.qtyRemaining;
    const diff = actual - oldQty;
    if(diff===0){ toast('No change to record.'); closeSheet(); return; }
    const reason = document.getElementById('sc-reason').value.trim();
    b.qtyRemaining = actual;
    enqueueSync('good_batches','update', { id: b.id, qty_remaining: b.qtyRemaining });

    const adjId = uid('adj');
    const adj = { id: adjId, businessId: business().id, shopId: g.shopId, goodId: g.id, goodName: g.name,
      batchId: b.id, oldQty, newQty: actual, difference: diff, reason,
      adjustedByUserId: state.sessionUserId, adjustedAt: new Date().toISOString() };
    state.stockAdjustments.unshift(adj);
    // Insert-only, on purpose — an adjustment record is never edited or
    // deleted once created, so the count history is trustworthy even if a
    // later correction turns out to also be wrong (that becomes its own
    // new record, not a rewrite of this one).
    enqueueSync('stock_adjustments','insert', {
      id: adjId, business_id: adj.businessId, shop_id: adj.shopId, good_id: adj.goodId, good_name: adj.goodName,
      batch_id: adj.batchId, old_qty: oldQty, new_qty: actual, difference: diff, reason,
      adjusted_by_user_id: adj.adjustedByUserId
    });
    logAudit('stock_corrected', `${g.name}: ${oldQty} → ${actual} (${diff>0?'+':''}${diff})${reason?' — '+reason:''}`);
    toast('Count corrected ✅'); closeSheet(); openGoodDetail(goodId);
  });
}

          </div>
        </div>
        <div class="contact-btns">
          <a href="https://wa.me/${toIntlDigits(cust?.whatsappNumber||cust?.phoneE164, cust?.country)}?text=${encodeURIComponent('Hello '+(cust?.fullName||'')+', your credit of '+fmtMoney(s.balance)+' is due '+fmtDate(s.dueDate)+'. - '+currentShop().name)}" target="_blank" data-remind="${s.id}">WhatsApp</a>
          <a href="sms:${toTelHref(cust?.phoneE164, cust?.country)}?body=${encodeURIComponent('Hello '+(cust?.fullName||'')+', your credit of '+fmtMoney(s.balance)+' is due '+fmtDate(s.dueDate)+'.')}" data-remind="${s.id}">SMS</a>
          <button data-mark-paid="${s.id}">Mark Paid</button>
        </div>
      </div>`;
    }).join('')}
  `;
}
function bindCreditEvents(){
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click', ()=>{ creditFilter=b.dataset.filter; refreshMain(); }));
  document.querySelectorAll('[data-remind]').forEach(a=>a.addEventListener('click', ()=>{
    const s = state.sales.find(x=>x.id===a.dataset.remind);
    const logId2 = uid('log');
    state.communicationLog.unshift({id:logId2,businessId:business().id,customerId:s.customerId,userId:state.sessionUserId,type:'reminder',timestamp:new Date().toISOString()});
    enqueueSync('communication_log','insert', {
      id: logId2, business_id: business().id, shop_id: s.shopId || null, customer_id: s.customerId || null,
      channel: 'reminder', message: ''
    });
    save();
  }));
  document.querySelectorAll('[data-mark-paid]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.sales.find(x=>x.id===b.dataset.markPaid);
    if(isStaff() && s.soldByUserId !== state.sessionUserId){ toast('Staff can only mark paid sales they made.'); return; }
    const amt = Number(prompt(`Amount received (balance ${fmtMoney(s.balance)}):`, s.balance) || 0);
    if(amt<=0) return;
    s.paidAmount += amt;
    s.balance = Math.max(0, s.subtotal - s.paidAmount);
    s.status = s.balance<=0 ? 'paid' : 'partial';
    // Previously local-only — a payment collected on one device never
    // reached another, so the customer could still show as owing money
    // (and risk being asked to pay again) everywhere except this device.
    enqueueSync('sales','update', { id: s.id, paid_amount: s.paidAmount, balance: s.balance, status: s.status });
    logAudit('credit_payment', fmtMoney(amt)+' received');
    toast('Payment recorded ✅');
    render();
  }));
}

/* ============================================================
   CALCULATOR — simple standalone calculator, sequential
   (left-to-right) evaluation like a standard pocket calculator,
   not full operator precedence. No eval() — everything here is
   plain arithmetic on numbers we control.
   ============================================================ */
let calcDisplay = '0';
let calcStored = null;
let calcOperator = null;
let calcWaitingForNext = false;
function calcInputDigit(d){
  if(calcWaitingForNext){ calcDisplay = d; calcWaitingForNext = false; }
  else { calcDisplay = calcDisplay==='0' ? d : calcDisplay + d; }
}
function calcInputDot(){
  if(calcWaitingForNext){ calcDisplay = '0.'; calcWaitingForNext = false; return; }
  if(!calcDisplay.includes('.')) calcDisplay += '.';
}
function calcApplyOp(a, b, op){
  if(op==='+') return a+b;
  if(op==='-') return a-b;
  if(op==='×') return a*b;
  if(op==='÷') return b===0 ? NaN : a/b;
  return b;
}
function calcSetOperator(op){
  const val = parseFloat(calcDisplay);
  if(calcOperator && !calcWaitingForNext){
    calcStored = calcApplyOp(calcStored, val, calcOperator);
    calcDisplay = Number.isNaN(calcStored) ? 'Error' : String(roundClean(calcStored));
  } else {
    calcStored = val;
  }
  calcOperator = op;
  calcWaitingForNext = true;
}
function calcEquals(){
  if(calcOperator==null) return;
  const val = parseFloat(calcDisplay);
  const result = calcApplyOp(calcStored, val, calcOperator);
  calcDisplay = Number.isNaN(result) ? 'Error' : String(roundClean(result));
  calcStored = null; calcOperator = null; calcWaitingForNext = true;
}
function calcClear(){ calcDisplay='0'; calcStored=null; calcOperator=null; calcWaitingForNext=false; }
function calcBackspace(){
  if(calcWaitingForNext) return;
  calcDisplay = calcDisplay.length>1 ? calcDisplay.slice(0,-1) : '0';
}
function calcPercent(){ calcDisplay = String(roundClean(parseFloat(calcDisplay)/100)); }
function calcToggleSign(){ calcDisplay = String(roundClean(parseFloat(calcDisplay) * -1)); }
function roundClean(n){ return Math.round(n*1e8)/1e8; }
function screenCalculator(){
  return `
    ${subHeader('Calculator')}
    <div class="card" style="padding:0;overflow:hidden;">
      <div style="background:var(--ink);color:#fff;padding:28px 20px;text-align:right;font-size:40px;font-weight:800;letter-spacing:-0.02em;word-break:break-all;" id="calc-display">${escapeHtml(calcDisplay)}</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);">
        <button class="calc-btn" data-calc="clear" style="grid-column:span 2;">C</button>
        <button class="calc-btn" data-calc="percent">%</button>
        <button class="calc-btn calc-op" data-calc="÷">÷</button>
        <button class="calc-btn" data-calc="7">7</button>
        <button class="calc-btn" data-calc="8">8</button>
        <button class="calc-btn" data-calc="9">9</button>
        <button class="calc-btn calc-op" data-calc="×">×</button>
        <button class="calc-btn" data-calc="4">4</button>
        <button class="calc-btn" data-calc="5">5</button>
        <button class="calc-btn" data-calc="6">6</button>
        <button class="calc-btn calc-op" data-calc="-">−</button>
        <button class="calc-btn" data-calc="1">1</button>
        <button class="calc-btn" data-calc="2">2</button>
        <button class="calc-btn" data-calc="3">3</button>
        <button class="calc-btn calc-op" data-calc="+">+</button>
        <button class="calc-btn" data-calc="sign">±</button>
        <button class="calc-btn" data-calc="0">0</button>
        <button class="calc-btn" data-calc=".">.</button>
        <button class="calc-btn calc-op" data-calc="=" style="background:var(--marigold);color:var(--ink-text);">=</button>
        <button class="calc-btn" data-calc="back" style="grid-column:span 4;">${ICON_CLOSE} Backspace</button>
      </div>
    </div>
  `;
}
function bindCalculatorEvents(){
  const disp = document.getElementById('calc-display');
  const refresh = ()=>{ if(disp) disp.textContent = calcDisplay; };
  document.querySelectorAll('[data-calc]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.dataset.calc;
      if(k==='clear') calcClear();
      else if(k==='back') calcBackspace();
      else if(k==='percent') calcPercent();
      else if(k==='sign') calcToggleSign();
      else if(k==='.') calcInputDot();
      else if(k==='=') calcEquals();
      else if(['+','-','×','÷'].includes(k)) calcSetOperator(k);
      else calcInputDigit(k);
      refresh();
    });
  });
}

let reportsRange = '7d'; // today | 7d | 30d | month
function getRangeDates(range){
  const today = new Date();
  let start;
  if(range==='today') start = new Date(today);
  else if(range==='30d'){ start = new Date(today); start.setDate(start.getDate()-29); }
  else if(range==='month') start = new Date(today.getFullYear(), today.getMonth(), 1);
  else { start = new Date(today); start.setDate(start.getDate()-6); } // 7d default
  const days = [];
  let d = new Date(start);
  while(d<=today){ days.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return days;
}
function screenReports(){
  const shopSales = state.sales.filter(s=>s.shopId===state.currentShopId && s.status!=='voided');
  const days = getRangeDates(reportsRange);
  const rangeSales = shopSales.filter(s=>days.includes(s.date));
  const rangeExpenses = state.expenses.filter(e=>e.shopId===state.currentShopId && days.includes(e.date));
  const totalExpenses = rangeExpenses.reduce((a,e)=>a+e.amount,0);

  const rows = days.map(day=>{
    const daySales = shopSales.filter(s=>s.date===day);
    const rev = daySales.reduce((a,s)=>a+s.subtotal,0);
    const cogs = daySales.reduce((a,s)=>a+s.items.reduce((b,it)=>{const g=state.goods.find(x=>x.id===it.goodId);return b+(g?g.costPrice:0)*netQty(it);},0),0);
    return {day, rev, profit: rev-cogs};
  });
  const totalRev = rows.reduce((a,r)=>a+r.rev,0);
  const grossProfit = rows.reduce((a,r)=>a+r.profit,0);
  const netProfit = grossProfit - totalExpenses;
  const maxVal = Math.max(1,...rows.map(r=>r.rev));

  const staffPerf = {};
  rangeSales.forEach(s=>{
    const key = s.soldByUserId;
    staffPerf[key] = staffPerf[key] || {total:0, count:0};
    staffPerf[key].total += s.subtotal;
    staffPerf[key].count++;

  const staffRows = Object.entries(staffPerf).map(([uid,d])=>{
    const u = state.users.find(x=>x.id===uid);
    return { name: u ? u.firstName+' '+u.lastName : 'Unknown', ...d };

  const rangeLabels = {today:'Today', '7d':'7 Days', '30d':'30 Days', month:'This Month'};
  return `
    ${subHeader("Profit Reports")}
    <div style="display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;">
      ${Object.keys(rangeLabels).map(r=>`<button class="btn btn-sm ${reportsRange===r?'btn-dark':'btn-outline'}" data-rrange="${r}">${rangeLabels[r]}</button>`).join('')}
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="lbl">${rangeLabels[reportsRange]} Revenue</div><div class="val">${fmtMoney(totalRev)}</div></div>
      <div class="stat-box accent"><div class="lbl">Net Profit</div><div class="val">${fmtMoney(netProfit)}</div></div>
    </div>
    ${totalExpenses>0?`<p class="subtle" style="margin-bottom:14px;">Gross profit ${fmtMoney(grossProfit)} minus ${fmtMoney(totalExpenses)} in expenses this period. <span data-goto="expenses" style="color:var(--marigold-dark);font-weight:700;text-decoration:underline;">View expenses</span></p>`:''}
    <div class="card">
      <div style="display:flex;align-items:flex-end;gap:${rows.length>14?'2px':'8px'};height:130px;overflow-x:${rows.length>20?'auto':'visible'};">
        ${rows.map(r=>`
          <div style="flex:${rows.length>20?'0 0 10px':'1'};display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;background:var(--paper-dim);border-radius:6px 6px 0 0;height:${Math.max(4,r.rev/maxVal*100)}px;position:relative;">
              <div style="position:absolute;bottom:0;left:0;right:0;background:var(--marigold);border-radius:6px 6px 0 0;height:${r.rev? (r.profit/r.rev*100) : 0}%;"></div>
            </div>
            ${rows.length<=14?`<div style="font-size:9.5px;color:var(--text-dim);">${new Date(r.day).toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)}</div>`:''}
          </div>`).join('')}
      </div>
      <div class="subtle" style="margin-top:8px;font-size:11px;">Bar = revenue · Marigold fill = gross profit share</div>
    </div>
    <div class="section-head"><h3>Top Items</h3></div>
    ${topItems(rangeSales).map(t=>`
      <div class="list-row"><div class="thumb">${t.emoji}</div>
        <div class="info"><div class="t1">${t.name}</div><div class="t2">${t.qty} sold</div></div>
        <div class="right"><b>${fmtMoney(t.rev)}</b></div>

    ${staffRows.length>1 || (staffRows.length===1) ? `
    <div class="section-head"><h3>Staff Performance</h3></div>
    ${staffRows.map(sr=>`
      <div class="list-row"><div class="thumb">${ICON_USER}</div>

  `;
}

function topItems(sales){
  const map = {};
  sales.forEach(s=>s.items.forEach(it=>{
    const g = state.goods.find(x=>x.id===it.goodId); if(!g) return;
    map[g.id] = map[g.id] || {name:g.name, emoji:g.emoji||'🛍️', qty:0, rev:0};
    map[g.id].qty += it.qty; map[g.id].rev += it.qty*it.priceUsed;
  }));
  return Object.values(map).sort((a,b)=>b.rev-a.rev).slice(0,5);
}

/* ============================================================
   EMPLOYMENT RECORDS — resumption date, salary, and (for
   apprentices/"nwa boi") a settlement/freedom date. Owner-only
   to create or edit. Editing never deletes anything: the
   original record and every prior version stay visible forever
   in the history log, so staff can trust their record can't be
   quietly rewritten. Salary payments are permanent once logged
   and automatically added to Expenses.
   ============================================================ */
const EMPLOYMENT_TYPES = [
  {id:'staff', label:'Salaried Staff'},
  {id:'apprentice', label:'Apprentice (Nwa Boi)'}
];
// Looks up a person by id whether they're a real app user or a record-only
// person (someone with no app access, tracked purely for employment records).
function personById(id){
  return state.users.find(x=>x.id===id) || state.recordOnlyStaff.find(x=>x.id===id);
}
function employmentRecordFor(userId){ return state.employmentRecords.find(r=>r.userId===userId); }
function salaryPaymentsFor(userId){ return state.salaryPayments.filter(p=>p.userId===userId).sort((a,b)=>new Date(b.date)-new Date(a.date)); }

function openEmploymentRecordModal(userId){
  const target = personById(userId);
  if(!target || !canManageThisUser(target)){ toast("You don't have permission to manage this account."); return; }
  const rec = employmentRecordFor(userId);
  if(!rec) openEmploymentSetupForm(userId);
  else renderEmploymentRecordView(userId);
}

function openEmploymentEditForm(userId){
  const u = personById(userId);
  if(!u || !canManageThisUser(u)){ toast("You don't have permission to manage this account."); return; }
  const rec = employmentRecordFor(userId);
  openSheet(`
    <div class="sheet-head"><h3>Edit Employment Record</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <p class="subtle" style="margin-bottom:14px;">The current values will be saved to this record's permanent history before your changes are applied — nothing gets erased.</p>
    <div class="field"><label>Employment Type</label>
      <select id="er-type">${EMPLOYMENT_TYPES.map(t=>`<option value="${t.id}" ${rec.employmentType===t.id?'selected':''}>${t.label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Date of Resumption</label><input id="er-resume" type="date" value="${rec.resumptionDate}"></div>
    <div class="row2">
      <div class="field"><label>Salary Amount</label><input id="er-salary" type="number" min="0" value="${rec.salaryAmount}"></div>
      <div class="field"><label>Frequency</label>
        <select id="er-freq">
          <option value="monthly" ${rec.salaryFrequency==='monthly'?'selected':''}>Monthly</option>
          <option value="weekly" ${rec.salaryFrequency==='weekly'?'selected':''}>Weekly</option>
          <option value="none" ${rec.salaryFrequency==='none'?'selected':''}>No fixed salary</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Settlement / Freedom Date</label><input id="er-settle-date" type="date" value="${rec.settlementDate||''}"></div>
    <div class="field"><label>Settlement Terms</label><textarea id="er-settle-terms" rows="2">${escapeHtml(rec.settlementTerms||'')}</textarea></div>
    <div class="field"><label>Notes</label><textarea id="er-notes" rows="2">${escapeHtml(rec.notes||'')}</textarea></div>
    <div class="field"><label>Reason for this change <span class="subtle">(recommended)</span></label><input id="er-change-reason" placeholder="e.g. Annual salary review"></div>
    <button class="btn btn-primary" id="save-er-edit-btn">Save Changes</button>
  `);
  document.getElementById('save-er-edit-btn').addEventListener('click', ()=>{
    const resume = document.getElementById('er-resume').value;
    if(!resume){ toast('Date of resumption is required.'); return; }
    const previousValues = {
      employmentType: rec.employmentType, resumptionDate: rec.resumptionDate, salaryAmount: rec.salaryAmount,
      salaryFrequency: rec.salaryFrequency, settlementDate: rec.settlementDate, settlementTerms: rec.settlementTerms, notes: rec.notes
    };
    const reason = document.getElementById('er-change-reason').value.trim();
    const historyId = uid('erhist');
    rec.history.push({ id: historyId, changedAt: new Date().toISOString(), changedBy: state.sessionUserId, previousValues, reason });
    rec.employmentType = document.getElementById('er-type').value;
    rec.resumptionDate = resume;
    rec.salaryAmount = Number(document.getElementById('er-salary').value||0);
    rec.salaryFrequency = document.getElementById('er-freq').value;
    rec.settlementDate = document.getElementById('er-settle-date').value || null;
    rec.settlementTerms = document.getElementById('er-settle-terms').value.trim();
    rec.notes = document.getElementById('er-notes').value.trim();
    // This whole amend flow — both the updated current terms AND the
    // amendment history entry — used to be entirely local-only. A salary
    // change made on one device never reached another; the audit trail of
    // "what it used to be" existed only on whichever device made the edit.
    enqueueSync('employment_records','update', {
      id: rec.id, employment_type: rec.employmentType, resumption_date: rec.resumptionDate,
      salary_amount: rec.salaryAmount, salary_frequency: rec.salaryFrequency,
      settlement_date: rec.settlementDate, settlement_terms: rec.settlementTerms, notes: rec.notes
    });
    enqueueSync('employment_record_history','insert', {
      id: historyId, employment_record_id: rec.id, business_id: business().id,
      changed_by_user_id: state.sessionUserId, previous_values: previousValues, reason
    });
    logAudit('employment_record_edited', `Edited employment record for ${u.firstName} ${u.lastName}${reason?': '+reason:''}`);
    toast('Record updated — previous version saved to history ✅'); closeSheet(); renderEmploymentRecordView(userId);
  });
}

function getContactPhone(person){ return person.phone || ''; }

  const u = personById(userId);

  if(!u || !rec) return;
  openSheet(`
    <div class="sheet-head"><h3>${rec.employmentType==='apprentice'?'Apprenticeship Agreement':'Employment Letter'}</h3><button class="close-x" id="sheet-close">${ICON_CLOSE}</button></div>
    <div class="card">

      <div class="field"><label>Phone</label><input id="el-phone" value="${escAttr(getContactPhone(u))}" placeholder="0802 730 0375 or +234..."></div>

    </div>

      <button class="btn btn-primary" id="share-letter-img" style="flex:1;">${ICON_EXPORT} Share</button>
      <button class="btn btn-outline" id="download-letter-img" style="flex:1;">⬇️ Download</button>
    </div>
    <p class="subtle" style="margin-bottom:14px;">Share opens your phone's share sheet with the document image — pick WhatsApp, Email, or any app there.</p>
  `);
  const canvas = document.getElementById('letter-canvas');
  drawEmploymentLetterToCanvas(canvas, u, rec);

  document.getElementById('save-contact-btn').addEventListener('click', ()=>{
    const phoneRaw = document.getElementById('el-phone').value.trim();
    const email = document.getElementById('el-email').value.trim();
    u.phone = phoneRaw ? '+'+toIntlDigits(phoneRaw) : '';
    if(state.recordOnlyStaff.includes(u)) u.email = email; else u.contactEmail = email;
    logAudit('contact_updated', `Updated contact info for ${u.firstName} ${u.lastName}`);
    toast('Contact info saved ✅');
    openEmploymentLetterModal(userId);
  });
  const markSent = (type)=>{ logAudit('letter_sent', `${rec.employmentType==='apprentice'?'Agreement':'Letter'} sent to ${u.firstName} ${u.lastName} via ${type}`); };
  document.getElementById('share-letter-img').addEventListener('click', ()=>{
    canvas.toBlob(async blob=>{
      if(!blob){ toast('Could not generate the document image.'); return; }
      const file = new File([blob], `${rec.employmentType==='apprentice'?'agreement':'letter'}-${u.firstName}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title: business().name}); markSent('image share'); }
        catch(e){ /* user cancelled — not an error */ }
      } else {
        toast("This browser can't share images directly — tap Download, then attach the file manually.");
      }
    }, 'image/png');
  });
  document.getElementById('download-letter-img').addEventListener('click', ()=>{
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${rec.employmentType==='apprentice'?'agreement':'letter'}-${u.firstName}.png`; a.click();
      URL.revokeObjectURL(url);
      markSent('download');
    }, 'image/png');
  });
}

function employmentLetterBodyLines(u, rec){
  const fullName = u.firstName+' '+u.lastName;
  const bizName = business().name;
  const isApprentice = rec.employmentType==='apprentice';
  const lines = [];
  lines.push(`Date: ${fmtDate(todayISO())}`);
  lines.push('');
  lines.push(`To: ${fullName}`);
  lines.push('');
  lines.push(isApprentice ? `RE: APPRENTICESHIP AGREEMENT` : `RE: LETTER OF EMPLOYMENT`);
  lines.push('');
  if(isApprentice){
    lines.push(`This letter confirms that ${fullName} began an apprenticeship with ${bizName} on ${fmtDate(rec.resumptionDate)}.`);
    if(rec.salaryFrequency!=='none' && rec.salaryAmount>0){
      lines.push(`During the apprenticeship, an upkeep/allowance of ${fmtMoneyCanvas(rec.salaryAmount)} (${rec.salaryFrequency}) applies.`);
    }
    if(rec.settlementDate){
      lines.push(`The expected settlement (freedom) date is ${fmtDate(rec.settlementDate)}.`);
    }
    if(rec.settlementTerms){
      lines.push(`Settlement terms: ${rec.settlementTerms}.`);
    }
  } else {
    lines.push(`This letter confirms that ${fullName} resumed work with ${bizName} on ${fmtDate(rec.resumptionDate)}.`);
    if(rec.salaryFrequency!=='none' && rec.salaryAmount>0){
      lines.push(`Salary: ${fmtMoneyCanvas(rec.salaryAmount)} (${rec.salaryFrequency}).`);
    } else {
      lines.push(`This role does not carry a fixed salary.`);
    }
  }
  if(rec.notes){ lines.push(''); lines.push(`Additional notes: ${rec.notes}`); }
  lines.push('');
  lines.push(`This document was generated from ${bizName}'s records and reflects the information on file as of the date above.`);
  return lines;
}
function layoutAndDrawLetter(u, rec, ctx){
  const W = 380, PAD = 26;
  const bodyLines = employmentLetterBodyLines(u, rec);
  let y = 34;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  const shop = currentShop();
  if(shop && shop.address){ T(shop.address, W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14; }
  y += 10;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;

  bodyLines.forEach(line=>{
    if(line===''){ y += 8; return; }
    const isHeading = line.startsWith('RE:');
    const wrapped = wrapPlainText(canvasSafeText(line), 46);
    wrapped.forEach(w=>{
      T(w, PAD, 'left', isHeading ? '700 12.5px Arial,Helvetica,sans-serif' : '400 12px Arial,Helvetica,sans-serif', isHeading ? '#12213B' : '#242B38');
      y += isHeading ? 18 : 17;
    });
  });
  y += 20;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;
  T('_____________________', PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('For ' + business().name, PAD, 'left', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  y += 30;
  return y;
}
function drawEmploymentLetterToCanvas(canvas, u, rec){
  const W = 380, scale = 2;
  const h = layoutAndDrawLetter(u, rec, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawLetter(u, rec, ctx);
}

function offerLetterBodyLines(offer){
  const fullName = offer.firstName+' '+offer.lastName;
  const bizName = business().name;
  const isApprentice = offer.employmentType==='apprentice';
  const lines = [];
  lines.push(`Date: ${fmtDate(todayISO())}`);
  lines.push('');
  lines.push(`To: ${fullName}`);
  lines.push('');
  lines.push(isApprentice ? `RE: OFFER OF APPRENTICESHIP — ${offer.role}` : `RE: OFFER OF EMPLOYMENT — ${offer.role}`);
  lines.push('');
  lines.push(`We are pleased to inform you that you have been selected for the position of ${offer.role} at ${bizName}.`);
  lines.push('');
  lines.push(`Kindly resume duty on ${fmtDate(offer.resumptionDate)}.`);
  if(offer.salaryFrequency!=='none' && offer.salaryAmount>0){
    lines.push(isApprentice
      ? `Your upkeep/allowance will be ${fmtMoneyCanvas(offer.salaryAmount)} (${offer.salaryFrequency}).`
      : `Your salary will be ${fmtMoneyCanvas(offer.salaryAmount)} (${offer.salaryFrequency}).`);
  }
  if(offer.settlementTerms){ lines.push(`Settlement terms (on completion): ${offer.settlementTerms}.`); }
  if(offer.notes){ lines.push(''); lines.push(offer.notes); }
  lines.push('');
  lines.push(`Please confirm your acceptance by contacting us before your resumption date.`);
  lines.push('');
  lines.push(`We look forward to having you on our team.`);
  return lines;
}
function layoutAndDrawOfferLetter(offer, ctx){
  const W = 380, PAD = 26;
  const bodyLines = offerLetterBodyLines(offer);
  let y = 34;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  T(business().name, W/2, 'center', '800 16px Arial,Helvetica,sans-serif', '#12213B'); y += 16;
  const shop = currentShop();
  if(shop && shop.address){ T(shop.address, W/2, 'center', '400 10.5px Arial,Helvetica,sans-serif', '#6B7280'); y += 14; }
  y += 10;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;

  bodyLines.forEach(line=>{
    if(line===''){ y += 8; return; }
    const isHeading = line.startsWith('RE:');
    const wrapped = wrapPlainText(canvasSafeText(line), 46);
    wrapped.forEach(w=>{
      T(w, PAD, 'left', isHeading ? '700 12.5px Arial,Helvetica,sans-serif' : '400 12px Arial,Helvetica,sans-serif', isHeading ? '#12213B' : '#242B38');
      y += isHeading ? 18 : 17;
    });
  });
  y += 20;
  if(ctx) drawDashedLine(ctx, PAD, y, W-PAD, y);
  y += 24;
  T('_____________________', PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('For ' + business().name, PAD, 'left', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  y += 30;
  return y;
}
function drawOfferLetterToCanvas(canvas, offer){
  const W = 380, scale = 2;
  const h = layoutAndDrawOfferLetter(offer, null);
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,W,h);
  layoutAndDrawOfferLetter(offer, ctx);
}

function bindStaffEvents(){
  const copyCode = document.getElementById('copy-connect-code');
  if(copyCode) copyCode.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(business().connectCode); toast('Code copied ✅'); }
    catch(e){ toast('Could not copy — code is '+business().connectCode); }
  });
  const resetCode = document.getElementById('reset-connect-code');
  if(resetCode) resetCode.addEventListener('click', async ()=>{
    const isReset = !!business().connectCode;
    if(isReset && !confirm('Generate a new code? The current code will stop working immediately. Staff already signed in on their devices are not affected.')) return;
    resetCode.disabled = true; resetCode.textContent = 'Generating…';
    try{
      const { data: sessionData } = await window.sb.auth.getSession();
      if(!sessionData.session){ toast('Please sign in again to do this.'); return; }
      const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/regenerate-connect-code`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+sessionData.session.access_token, 'apikey': SITE_CONTENT_ANON_KEY },
        body: JSON.stringify({ business_id: business().id })
      });
      const result = await res.json();
      if(!res.ok || result.error){ toast(result.error || 'Could not generate a code.'); return; }
      business().connectCode = result.connect_code;
      logAudit('connect_code_reset', 'Generated a new staff connect code');
      toast(isReset ? 'New code generated ✅' : 'Connect code created ✅');
      render();
    }catch(e){
      toast('Could not reach the server — check your connection.');
    }
  });
  document.querySelectorAll('[data-approve-name]').forEach(b=>b.addEventListener('click', ()=>{
    const u = state.users.find(x=>x.id===b.dataset.approveName);
    if(!canManageThisUser(u)){ toast("You don't have permission to manage this account."); return; }
    const req = u.nameChangeRequest;
    const oldName = u.firstName+' '+u.lastName;
    u.firstName = req.firstName; u.lastName = req.lastName;
    delete u.nameChangeRequest;
    enqueueSync('app_users','update', { id: u.id, first_name: u.firstName, last_name: u.lastName, name_change_request: null });
    logAudit('name_change_approved', `Renamed ${oldName} to ${u.firstName} ${u.lastName}`);
    toast('Name updated ✅'); render();
  }));
  document.querySelectorAll('[data-deny-name]').forEach(b=>b.addEventListener('click', ()=>{
    const u = state.users.find(x=>x.id===b.dataset.denyName);
    if(!canManageThisUser(u)){ toast("You don't have permission to manage this account."); return; }
    logAudit('name_change_denied', `Denied name change request from ${u.firstName} ${u.lastName}`);
    delete u.nameChangeRequest;
    enqueueSync('app_users','update', { id: u.id, name_change_request: null });
    toast('Request denied'); render();
  }));
  const gen = document.getElementById('gen-code');
  if(gen) gen.addEventListener('click', async ()=>{
    const limits = planLimits();
    // Two bugs here: this counted EVERY user ever created (including staff
    // who'd been "Removed" — a deactivation, not a delete, so they never
    // stopped counting), and it counted the Owner as one of the staff
    // slots — but the server-side limit that actually gets enforced only
    // ever counts active staff, never the owner. This local check could
    // block generating a code even when the server would have allowed it.
    const activeStaffCount = state.users.filter(x=>x.role==='staff' && x.isActive!==false).length;
    if(activeStaffCount >= limits.staff){
      toast(`Your ${planLabel()} plan allows up to ${limits.staff} staff. Upgrade for more, or remove someone who's no longer active.`);
      return;
    }
    if(!navigator.onLine){ toast('You need internet to generate a join code, so staff can use it on their own devices.'); return; }
    const { data: sessionData } = await window.sb.auth.getSession();
    const accessToken = sessionData.session ? sessionData.session.access_token : null;
    if(!accessToken){ toast('Please log in online at least once before generating staff join codes.'); return; }
    gen.disabled = true; gen.textContent = 'Generating…';
    try{
      const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/create-join-code`, {
        method: 'POST', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+accessToken, 'apikey': SITE_CONTENT_ANON_KEY }
      });
      const result = await res.json();
      if(!res.ok || result.error){ toast(result.error || 'Could not generate a join code.'); return; }
      state.joinCode = { code: result.code, expiresAt: new Date(result.expires_at).getTime() };
      logAudit('code_generated','Generated staff join code');
      render();
    }catch(e){
      toast('Could not generate a join code — check your connection and try again.');
    }finally{
      gen.disabled = false; gen.textContent = 'Generate Join Code';
    }
  });
  const offerBtn = document.getElementById('offer-letter-btn');
  if(offerBtn) offerBtn.addEventListener('click', openOfferLetterForm);
  document.querySelectorAll('[data-manage-perms]').forEach(b=>b.addEventListener('click', ()=>openStaffPermissionsModal(b.dataset.managePerms)));
  document.querySelectorAll('[data-employment-record]').forEach(b=>b.addEventListener('click', ()=>openEmploymentRecordModal(b.dataset.employmentRecord)));
  const addRecordOnlyBtn = document.getElementById('add-recordonly-btn');
  if(addRecordOnlyBtn) addRecordOnlyBtn.addEventListener('click', openAddRecordOnlyPersonModal);
  document.querySelectorAll('[data-toggle-recordonly-active]').forEach(b=>b.addEventListener('click', ()=>{
    const p = state.recordOnlyStaff.find(x=>x.id===b.dataset.toggleRecordonlyActive);
    p.isActive = p.isActive===false ? true : false;
    logAudit('recordonly_status', (p.isActive?'Marked active: ':'Marked as left: ')+p.firstName+' '+p.lastName);
    render();
  }));
  document.querySelectorAll('[data-delete-recordonly]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Remove this person? Since they have no employment record yet, this fully deletes them.')) return;
    const p = state.recordOnlyStaff.find(x=>x.id===b.dataset.deleteRecordonly);
    state.recordOnlyStaff = state.recordOnlyStaff.filter(x=>x.id!==b.dataset.deleteRecordonly);
    logAudit('recordonly_deleted', 'Removed '+p.firstName+' '+p.lastName+' (no app account)');
    toast('Removed'); render();
  }));
  document.querySelectorAll('[data-reset-pin]').forEach(b=>b.addEventListener('click', ()=>{
    const u = state.users.find(x=>x.id===b.dataset.resetPin);
    if(!canManageThisUser(u)){ toast("You don't have permission to manage this account."); return; }
    const pin = prompt('New 4-6 digit PIN for '+u.firstName+':');
    if(!pin || !/^\d{4,6}$/.test(pin)){ toast('PIN must be 4-6 digits.'); return; }
    u.pinHash = hash(pin); u.pinLength = pin.length;
    // This was local-only — the server's copy of pin_hash never changed, so
    // a staff member could still reconnect on a NEW device using their OLD
    // pin (since staff-device-login checks the server's value), and their
    // own existing device would fail with "incorrect PIN" on the new one
    // until it happened to pull the (never-sent) update — which would never
    // arrive, since nothing ever pushed it.
    enqueueSync('app_users','update', { id: u.id, pin_hash: u.pinHash, pin_length: u.pinLength });
    logAudit('pin_reset','Reset PIN for '+u.firstName);
    toast('PIN reset ✅ — their other devices will pick it up once online.'); save();
  }));
  document.querySelectorAll('[data-toggle-active]').forEach(b=>b.addEventListener('click', ()=>{
    const u = state.users.find(x=>x.id===b.dataset.toggleActive);
    if(!canManageThisUser(u)){ toast("You don't have permission to manage this account."); return; }
    u.isActive = u.isActive===false ? true : false;
    // This MUST reach the server, not just stay local — staff-device-login
    // checks is_active there before letting someone reconnect on a new
    // phone, so a staff member "removed" only on this device could still
    // sign in elsewhere if the server never found out they'd been deactivated.
    enqueueSync('app_users','update', { id: u.id, is_active: u.isActive });
    logAudit('staff_status', (u.isActive?'Reactivated ':'Deactivated ')+u.firstName);
    render();
  }));
}

function bindProfileEvents(){
  const saveBtn = document.getElementById('save-profile-btn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const u = currentUser();
    if(u.role==='master'){
      const fn = document.getElementById('pf-fn').value.trim();
      const ln = document.getElementById('pf-ln').value.trim();
      if(!fn){ toast('First name is required.'); return; }
      u.firstName = fn; u.lastName = ln;
      const newUsername = document.getElementById('pf-username').value.trim();
      if(!newUsername){ toast('Username is required.'); return; }
      if(newUsername.toLowerCase() !== u.username.toLowerCase() &&
         state.users.some(x=>x.id!==u.id && x.username.toLowerCase()===newUsername.toLowerCase())){
        toast('That username is already taken.'); return;
      }
      if(newUsername !== u.username){
        logAudit('username_changed', `Changed username from @${u.username} to @${newUsername}`);
        u.username = newUsername;
      }
    }
    const phoneRaw = document.getElementById('pf-phone').value.trim();
    u.phone = phoneRaw ? '+'+toIntlDigits(phoneRaw) : '';
    const emailField = document.getElementById('pf-email');
    if(emailField) u.email = emailField.value.trim();
    // None of this used to sync — a name, username, phone, or email change
    // stayed on whichever device made it, invisible everywhere else
    // (including the person's own second device, and anyone looking them
    // up by name elsewhere in the app).
    enqueueSync('app_users','update', {
      id: u.id, username: u.username, first_name: u.firstName, last_name: u.lastName,
      phone: u.phone, email: u.email
    });
    logAudit('profile_updated', 'Updated own profile');
    toast('Profile updated ✅'); render();
  });
  const reqNameBtn = document.getElementById('request-name-btn');
  if(reqNameBtn) reqNameBtn.addEventListener('click', ()=>{
    const u = currentUser();
    const fn = document.getElementById('pf-req-fn').value.trim();
    const ln = document.getElementById('pf-req-ln').value.trim();
    if(!fn){ toast('First name is required.'); return; }
    if(fn===u.firstName && ln===u.lastName){ toast("That's already your current name."); return; }
    u.nameChangeRequest = { firstName: fn, lastName: ln, requestedAt: new Date().toISOString() };
    // This one matters more than most local-only bugs: the whole point of
    // this feature is for the OWNER to see the request, and the Owner is
    // very rarely on the same device as the staff member submitting it. A
    // request that never syncs is a request the Owner can never actually see.
    enqueueSync('app_users','update', { id: u.id, name_change_request: u.nameChangeRequest });
    logAudit('name_change_requested', `${u.firstName} ${u.lastName} requested to be renamed to ${fn} ${ln}`);
    toast('Request sent to your Owner ✅'); render();
  });
  const cancelReqBtn = document.getElementById('cancel-name-request-btn');
  if(cancelReqBtn) cancelReqBtn.addEventListener('click', ()=>{
    const u = currentUser();
    delete u.nameChangeRequest;
    enqueueSync('app_users','update', { id: u.id, name_change_request: null });
    toast('Request cancelled'); render();
  });
  const savePassBtn = document.getElementById('save-password-btn');
  if(savePassBtn) savePassBtn.addEventListener('click', ()=>{
    const p1 = document.getElementById('pf-newpass').value;
    const p2 = document.getElementById('pf-newpass2').value;
    if(p1.length<6){ toast('Password must be at least 6 characters.'); return; }
    if(p1!==p2){ toast("Passwords don't match."); return; }
    currentUser().passwordHash = hash(p1);
    enqueueSync('app_users','update', { id: currentUser().id, password_hash: currentUser().passwordHash });
    logAudit('password_changed', 'Changed own password');
    if(currentUser().role === 'master') syncPasswordToSupabaseAuth(p1);
    toast('Password updated ✅');
    document.getElementById('pf-newpass').value=''; document.getElementById('pf-newpass2').value='';
  });
  const savePinBtn = document.getElementById('save-pin-btn');
  if(savePinBtn) savePinBtn.addEventListener('click', ()=>{
    const p1 = document.getElementById('pf-newpin').value;
    const p2 = document.getElementById('pf-newpin2').value;
    if(!/^\d{4,6}$/.test(p1)){ toast('PIN must be 4-6 digits.'); return; }
    if(p1!==p2){ toast("PINs don't match."); return; }
    currentUser().pinHash = hash(p1); currentUser().pinLength = p1.length;
    // Same bug as the admin-side Reset PIN: without this, changing your own
    // PIN only took effect on the device you changed it from. Your other
    // device would keep rejecting the new PIN, AND reconnecting on a brand
    // new device would still accept the OLD one, since the server never knew.
    enqueueSync('app_users','update', { id: currentUser().id, pin_hash: currentUser().pinHash, pin_length: currentUser().pinLength });
    logAudit('pin_changed', 'Changed own PIN');
    toast('PIN updated ✅');
    document.getElementById('pf-newpin').value=''; document.getElementById('pf-newpin2').value='';
  });
}

    if(!confirm('This will permanently delete your business and all its data within 30 days, per GDPR. You and your staff will be locked out immediately. Continue?')) return;
    // This used to only clear this one device's local storage — nothing
    // was actually requested from the server, so the business (and every
    // other device signed into it) kept working completely normally
    // despite the confirmation claiming deletion had been set in motion.
    if(!navigator.onLine){ toast("You're offline — connect to the internet to request deletion."); return; }
    del.disabled = true; del.textContent = 'Requesting…';
    try{
      const { data: sessionData } = await window.sb.auth.getSession();
      if(!sessionData.session){ toast('Please sign in again to do this.'); del.disabled=false; del.textContent='Delete Business'; return; }
      const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/request-account-deletion`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+sessionData.session.access_token, 'apikey': SITE_CONTENT_ANON_KEY },
        body: JSON.stringify({ business_id: business().id })
      });
      const result = await res.json();
      if(!res.ok || result.error){ toast(result.error || 'Could not request deletion.'); del.disabled=false; del.textContent='Delete Business'; return; }
      state.business.deletionRequestedAt = result.deletion_requested_at;
      state.business.isActive = false;
      save();
      render(); // the lockout screen (with the deletion-specific message) takes over from here
    }catch(e){
      toast('Could not reach the server — check your connection and try again.');
      del.disabled = false; del.textContent = 'Delete Business';
    }
  });
}

async function fetchPricingForBusiness(){
  const b = business();
  const bizCurrency = (b && b.currency) || 'USD';
  const currency = ['NGN','GHS','GBP','EUR'].includes(bizCurrency) ? bizCurrency : 'USD';
  const CURRENCY_SYMBOLS = { NGN:'₦', GHS:'GH₵', GBP:'£', EUR:'€', USD:'$' };
  try{
    const res = await fetch(`${SITE_CONTENT_URL}/rest/v1/pricing?currency=eq.${currency}&select=*`, {
      headers: { 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY }
    });
    if(!res.ok) return null;
    const rows = await res.json();
    const get = (plan, interval) => {
      const row = rows.find(r=>r.plan===plan && r.interval===interval);
      return row ? row.amount : 0;
    };
    const symbol = CURRENCY_SYMBOLS[currency] || currency;
    return {
      currency, symbol,
      proMonthly: get('pro','monthly'), proYearly: get('pro','yearly'),
      bossMonthly: get('boss','monthly'), bossYearly: get('boss','yearly')
    };
  }catch(e){ return null; }
}

  }
  return `<button class="btn btn-dark btn-sm" data-pay-plan="${plan}" data-pay-interval="${interval}" data-pay-amount="${amount}" data-pay-currency="${currency}">
    Pay ${symbol}${amount} / ${interval==='yearly'?'yr':'mo'}
  </button>`;
}

function launchCheckout(plan, interval, amount, currency){
  if(!navigator.onLine){ toast('You need an internet connection to upgrade your plan.'); return; }
  const u = currentUser();
  const txRef = 'zeeshop_' + uid('txn');
  FlutterwaveCheckout({
    public_key: FLW_PUBLIC_KEY,
    tx_ref: txRef,
    amount: amount,
    currency: currency,
    payment_options: 'card',
    meta: {
      business_id: business().id,
      plan: plan,
      interval: interval
    },
    customer: {
      email: (u && u.email) || 'customer@zeeshop.app',
      name: (u ? (u.firstName+' '+(u.lastName||'')) : 'ZeeShop Customer')
    },
    customizations: {
      title: 'ZeeShop ' + (plan==='pro' ? 'Pro' : 'Boss'),
      description: (plan==='pro'?'Pro':'Boss') + ' plan — ' + interval + ' billing'
    },
    callback: function(response){
      if(response && (response.status === 'successful' || response.status === 'completed')){
        verifyAndApplyPayment(response.transaction_id, plan, interval, amount, currency);
      } else {
        toast('Payment was not completed.');
      }
    },
    onclose: function(){ /* user closed the checkout without paying — no action needed */ }
  });
}

async function saveAutoRenewCard(result, plan, interval, accessToken){
  try{
    const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+accessToken, 'apikey': SITE_CONTENT_ANON_KEY, 'Prefer':'return=minimal,resolution=merge-duplicates' };
    await fetch(`${SITE_CONTENT_URL}/rest/v1/saved_payment_methods`, {
      method: 'POST', headers,
      body: JSON.stringify({
        business_id: business().id, flw_token: result.card_token, card_last4: result.card_last4,
        card_type: result.card_type, consent_given: true, consent_at: new Date().toISOString(), is_active: true
      })
    });
    await fetch(`${SITE_CONTENT_URL}/rest/v1/businesses?id=eq.${business().id}`, {
      method: 'PATCH', headers: { ...headers, 'Prefer':'return=minimal' },
