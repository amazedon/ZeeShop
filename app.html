<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ZeeShop — Your Shop, In Your Pocket</title>
<style>
:root{
  color-scheme: light;
  --ink:#12213B;
  --ink-text:#12213B;
  --ink-2:#1B2F52;
  --teal:#0F3D3E;
  --marigold:#F2A93B;
  --marigold-dark:#D98E1E;
  --paper:#FBFAF7;
  --paper-dim:#F1EEE6;
  --line:#E4E0D6;
  --text:#242B38;
  --text-dim:#6B7280;
  --green:#2E7D32;
  --green-bg:#E7F3E8;
  --red:#C0392B;
  --red-bg:#FBEAE8;
  --amber-bg:#FDF1DC;
  --radius:14px;
  --shadow:0 2px 10px rgba(18,33,59,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper);
  color:var(--text);
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.01em;color:var(--ink-text);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--marigold);color:var(--ink-text);}

/* ---------- layout shells ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none !important;}
.center-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:
    radial-gradient(circle at 15% 15%, rgba(242,169,59,0.16), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(15,61,62,0.14), transparent 45%),
    var(--ink);
}
.auth-card{
  width:100%;max-width:400px;background:var(--paper);border-radius:20px;
  padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.35);
  position:relative;overflow:hidden;
}
.auth-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--marigold),var(--teal));
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;background:var(--ink) url('/icon-192.png') center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:transparent;
  font-weight:900;font-size:18px;flex-shrink:0;
}
.brand-name{font-size:22px;font-weight:900;color:var(--ink-text);letter-spacing:-0.02em;}
.tagline{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;background:#fff;color:var(--text);outline:none;transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--marigold-dark);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:10px;border:none;font-weight:800;font-size:14.5px;
  transition:transform .08s, box-shadow .15s; letter-spacing:.01em;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--marigold);color:var(--ink-text);width:100%;box-shadow:0 6px 16px rgba(242,169,59,0.35);}
.btn-primary:hover{background:var(--marigold-dark);}
.btn-dark{background:var(--ink);color:#fff;width:100%;}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text);}
.btn-ghost{background:transparent;color:var(--ink-text);text-decoration:underline;padding:6px;font-weight:700;}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.calc-btn{
  background:var(--paper);border:none;padding:20px 0;font-size:20px;font-weight:700;
  color:var(--text);cursor:pointer;transition:background .1s;
}
.calc-btn:active{background:var(--paper-dim);}
.calc-op{background:var(--paper-dim);color:var(--marigold-dark);}
.link-row{text-align:center;margin-top:16px;font-size:13.5px;color:var(--text-dim);}
.err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;font-weight:600;}

/* ---------- user select / pin ---------- */
.userselect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0;}
.user-tile{
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
}
.user-tile:active{transform:scale(0.96);}
.avatar{
  width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
}
.avatar.oga{background:var(--marigold);color:var(--ink-text);}
.user-tile .uname{font-size:12.5px;font-weight:700;color:var(--ink-text);}
.user-tile .urole{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.pinpad button{
  padding:16px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:20px;font-weight:800;color:var(--ink-text);
}
.pinpad button:active{background:var(--paper-dim);}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);}
.pin-dot.filled{background:var(--ink);}

/* ---------- main shell ---------- */
.topbar{
  background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;
  gap:10px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow);
}
.topbar .brand-mark{width:32px;height:32px;font-size:15px;}
.shop-switch{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;
  border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;flex:1;
}
.topbar .icon-btn{
  background:rgba(255,255,255,0.1);border:none;color:#fff;width:36px;height:36px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.badge-dot{position:relative;}
.badge-dot::after{
  content:attr(data-count);position:absolute;top:-4px;right:-4px;background:var(--red);
  color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.badge-dot[data-count="0"]::after{display:none;}

/* Small always-visible sync-health dot in the topbar — quiet by default
   (nothing to see when sync is healthy), only draws attention when there's
   something waiting or stuck. Status is written in from window.__zeeshopSyncStatus. */
.sync-dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#4CAF50;
  box-shadow:0 0 0 2px rgba(255,255,255,0.15);transition:background .2s;
}
.sync-dot[data-state="pending"]{background:#F2A93B;}
.sync-dot[data-state="error"]{background:var(--red);}
.sync-dot[data-state="offline"]{background:#666;}

main{flex:1;padding:14px 14px 90px;max-width:640px;margin:0 auto;width:100%;}
.screen-title{font-size:20px;margin-bottom:14px;}
.subtle{color:var(--text-dim);font-size:13px;}

.bottomnav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px 8px;z-index:30;
  box-shadow:0 -2px 12px rgba(0,0,0,0.06);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;
  color:var(--text-dim);font-size:10px;font-weight:700;padding:6px 8px;border-radius:10px;flex:1;
}
.nav-item .ic{font-size:19px;display:flex;align-items:center;justify-content:center;}
.nav-item.active{color:var(--marigold-dark);}

/* ---------- cards / receipt motif ---------- */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.receipt-card{
  background:#fff;border:1px solid var(--line);border-radius:12px 12px 0 0;
  padding:18px;position:relative;margin-bottom:22px;
}
.receipt-card::after{
  content:"";position:absolute;left:0;right:0;bottom:-11px;height:11px;
  background:
    linear-gradient(-45deg, transparent 60%, #fff 60%) 0 0/12px 12px repeat-x,
    linear-gradient(45deg, transparent 60%, #fff 60%) 0 0/12px 12px repeat-x;
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:700;}
.stat-box .val{font-size:22px;font-weight:900;color:var(--ink-text);margin-top:4px;}
.stat-box.accent{background:var(--ink);}
.stat-box.accent .lbl{color:rgba(255,255,255,0.6);}
.stat-box.accent .val{color:var(--marigold);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
.section-head h3{font-size:15px;}
.pill{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.02em;}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-red{background:var(--red-bg);color:var(--red);}
.pill-amber{background:var(--amber-bg);color:var(--marigold-dark);}
.pill-gray{background:var(--paper-dim);color:var(--text-dim);}

.list-row{
  display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none;}
.list-row .thumb{
  width:42px;height:42px;border-radius:10px;background:var(--paper-dim);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-dim);
}
.list-row .info{flex:1;min-width:0;}
.list-row .info .t1{font-weight:700;font-size:14px;color:var(--ink-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row .info .t2{font-size:12px;color:var(--text-dim);}
.list-row .right{text-align:right;flex-shrink:0;}

.fab{
  position:fixed;bottom:82px;right:18px;width:58px;height:58px;border-radius:50%;
  background:var(--marigold);color:var(--ink-text);border:none;font-size:26px;font-weight:900;
  box-shadow:0 8px 22px rgba(242,169,59,0.45);z-index:29;display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(0.94);}

.empty{
  text-align:center;padding:36px 18px;color:var(--text-dim);
}
.empty .ic{font-size:34px;margin-bottom:8px;}
.empty b{color:var(--ink-text);display:block;margin-bottom:3px;font-size:14.5px;}

/* modal / sheet */
.overlay{
  position:fixed;inset:0;background:rgba(18,20,25,0.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.overlay.center{align-items:center;padding:20px;}
.sheet{
  background:var(--paper);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;padding:20px 18px 26px;animation:slideup .18s ease-out;
}
.overlay.center .sheet{border-radius:18px;max-height:85vh;}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-head h3{font-size:17px;}
.close-x{background:var(--paper-dim);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--text-dim);}

/* new sale */
.goods-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.good-tile{
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.good-tile .gic{width:40px;height:40px;border-radius:9px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:17px;}
.good-tile .gname{font-size:11.5px;font-weight:700;color:var(--ink-text);line-height:1.2;}
.good-tile .gprice{font-size:11px;color:var(--text-dim);font-weight:700;}
.good-tile.instock0{opacity:0.4;}
.cart-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;z-index:35;
}
.cart-bar .total{font-weight:900;font-size:16px;color:var(--marigold);}
.qty-stepper{display:flex;align-items:center;gap:10px;}
.qty-stepper button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:16px;}

.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:99;box-shadow:var(--shadow);
  animation:toastin .2s ease-out;max-width:90%;text-align:center;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translate(-50%,0);}}

.expiry-flag{width:4px;border-radius:3px;flex-shrink:0;align-self:stretch;}
.locked-msg{background:var(--red-bg);color:var(--red);padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin-top:8px;}

.contact-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.contact-btns a,.contact-btns button{
  flex:1;min-width:70px;text-align:center;padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);
  font-size:12px;font-weight:800;color:var(--ink-text);text-decoration:none;background:#fff;
}

/* ============================================================
   DARK MODE (a.k.a. "Market Mode" internally — battery saver +
   dark theme). Applied via body.market-mode, toggled in Settings.

   Text colors are handled by redefining the CSS variables
   themselves (--ink-text, --text, --text-dim, --line), NOT by
   overriding individual selectors. This matters because a lot of
   the app's text color comes from inline style="color:var(--ink)"
   attributes written directly into generated HTML — no class-level
   CSS override, however specific, can beat an inline style, but a
   redefined variable resolves correctly wherever it's referenced,
   inline or in the stylesheet. --ink itself is left alone because
   it also doubles as a background color (topbar, avatar, accent
   stat box) that should stay dark in both themes.
   ============================================================ */
body.market-mode{
  background:#000;color:#eee;color-scheme:dark;
  --ink-text:#fff; --text:#eee; --text-dim:#9a9a9a; --line:#2a2a2a;
  --paper-dim:#1a1a1a; --green-bg:#123420; --red-bg:#3a1414; --amber-bg:#3a2a10;
}
body.market-mode *{animation:none !important;transition:none !important;box-shadow:none !important;}
body.market-mode main{color:#eee;}

/* surfaces (cards, sheets, tiles, panels) — these use literal #fff rather
   than var(--paper), so they still need explicit overrides here. */
body.market-mode .card,body.market-mode .stat-box,body.market-mode .list-row,body.market-mode .good-tile,
body.market-mode .receipt-card,body.market-mode .sheet,body.market-mode .auth-card,
body.market-mode .user-tile,body.market-mode .pinpad button,body.market-mode .contact-btns a,
body.market-mode .contact-btns button,body.market-mode .qty-stepper button{
  background:#0a0a0a;border-color:#2a2a2a;
}
body.market-mode .stat-box.accent{background:var(--ink);border-color:var(--ink);}
body.market-mode .topbar,body.market-mode .bottomnav{background:#000;border-color:#2a2a2a;}
body.market-mode .receipt-card::after{
  background:
    linear-gradient(-45deg, transparent 60%, #0a0a0a 60%) 0 0/12px 12px repeat-x,
    linear-gradient(45deg, transparent 60%, #0a0a0a 60%) 0 0/12px 12px repeat-x;
}

/* form fields — literal #fff backgrounds, not variable-driven */
body.market-mode .field input,body.market-mode .field select,body.market-mode .field textarea{
  background:#111;border-color:#2a2a2a;
}
body.market-mode .field input::placeholder,body.market-mode .field textarea::placeholder{color:#777;}

/* buttons — outline/ghost borders use literal var(--line)/transparent, need explicit dark border */
body.market-mode .btn-outline{border-color:#3a3a3a;background:transparent;}
body.market-mode .btn-ghost{color:var(--marigold);}
body.market-mode .pin-dot{border-color:#666;}

body.market-mode .pin-dot.filled{background:#fff;border-color:#fff;}

/* misc small elements */
body.market-mode .close-x{color:#ccc;}
body.market-mode .slider-tog{background:#333;}
body.market-mode .code-display{background:#0a0a0a;border:1px solid #2a2a2a;}
body.market-mode ::selection{background:var(--marigold);color:#000;}

.switch{position:relative;width:44px;height:25px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider-tog{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:25px;transition:.2s;}
.slider-tog::before{content:"";position:absolute;height:19px;width:19px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider-tog{background:var(--marigold);}
input:checked + .slider-tog::before{transform:translateX(19px);}
.settings-row{display:flex;align-items:center;justify-content:between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);}
.settings-row .info{flex:1;}
.settings-row .info .t1{font-weight:700;font-size:14px;}
.settings-row .info .t2{font-size:12px;color:var(--text-dim);}

.divider{height:1px;background:var(--line);margin:14px 0;}
.code-display{
  background:var(--ink);color:var(--marigold);font-size:32px;font-weight:900;letter-spacing:.15em;
  text-align:center;padding:20px;border-radius:12px;margin:14px 0;
}
.progress-bar{height:6px;background:var(--paper-dim);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-bar .fill{height:100%;background:var(--marigold);border-radius:4px;}

@media(min-width:560px){.userselect-grid{grid-template-columns:repeat(4,1fr);}}
</style>

<script>
/* =====================================================================
   ZEESHOP — client-side prototype implementing the core flows from the
   ZeeShop Global Micro-Retailer OS spec. Runs fully offline in localStorage.
   Real deployment would sync this local store to a Postgres backend,
   run ML recognition on-device, and route push/SMS through native APIs —
   those server/native pieces can't run inside a browser file, so they
   are represented here with honest UI stubs and simulated flows.
   ===================================================================== */

const DB_KEY = "zeeshop_state_v1";
const DB_KEY_LEGACY = "dukapro_state_v1"; // old brand name — migrated below, then left alone

/* ==== UI icon set (SVG, replaces emoji placeholders) ==== */
const ICON_CALCULATOR = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="8" y1="18" x2="8" y2="18.01"/><line x1="12" y1="18" x2="12" y2="18.01"/><line x1="16" y1="18" x2="16" y2="18.01"/></svg>`;
const ICON_BELL = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;

// Normalizes any phone input into international digits with no leading + or 0,
// using the business's country calling code as a fallback for local-format numbers.
// This is required for wa.me links (WhatsApp rejects local-format numbers) and keeps
// tel:/sms: links consistent too.
function toIntlDigits(phone, countryName){
  if(!phone) return '';
  let p = String(phone).trim();
  const hadPlus = p.startsWith('+');
  p = p.replace(/[^\d]/g,'');
  if(hadPlus) return p; // already had a + so digits already include country code
  const cc = COUNTRY_CALLING_CODES[countryName || business()?.country] || '';
  if(cc && p.startsWith(cc)) return p; // already includes country code
  if(cc && p.startsWith('0')) return cc + p.slice(1); // local format like 0802...
  if(cc && p.length <= 10) return cc + p; // bare local number, no leading 0
  return p; // unknown shape — pass through rather than mangle it further
}
function toTelHref(phone, countryName){ const d = toIntlDigits(phone, countryName); return d ? '+'+d : ''; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// One-time migration: fix any phone numbers already saved in local-format so old
// customers (added before this fix) work with WhatsApp/Call/SMS too.
function migratePhoneNumbers(){
  let changed = false;
  (state.customers||[]).forEach(c=>{
    if(c.phoneE164 && !c.phoneE164.startsWith('+')){ c.phoneE164 = '+'+toIntlDigits(c.phoneE164); changed = true; }
    if(c.whatsappNumber && !c.whatsappNumber.startsWith('+')){ c.whatsappNumber = '+'+toIntlDigits(c.whatsappNumber); changed = true; }
  });

}

// Generates a real RFC-4122 UUID (required — Supabase's id columns are
// typed `uuid`, and Postgres rejects anything else, e.g. "biz_abc123",
// with a 22P02 "invalid input syntax for type uuid" error). The `p` prefix
// argument is kept for compatibility with existing call sites but is no
// longer used in the id itself.
function uid(p){
  if(crypto.randomUUID) return crypto.randomUUID();
  // Fallback UUID v4 for older browsers without crypto.randomUUID().
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function todayISO(){return new Date().toISOString().slice(0,10);}
function daysBetween(d1,d2){return Math.round((new Date(d2)-new Date(d1))/86400000);}
function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtMoney(n){
  const c = state.business ? (CCY[state.business.currency]||state.business.currency+" ") : "₦";
  return c + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
}
// Canvas text rendering on some Android devices doesn't reliably render currency
// glyphs like ₦ (they can overlap adjacent digits and look like a strike-through).
// The rest of the app (DOM UI, WhatsApp/SMS text) renders ₦ fine, so this variant
// is used only for text drawn inside <canvas>, using the plain currency code instead.
function fmtMoneyCanvas(n){
  const code = state.business ? state.business.currency : 'NGN';
  return code + ' ' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
}

function load(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  // One-time migration from the old "dukapro" key so existing accounts
  // and data aren't lost when this device first loads the renamed key.
  const legacyRaw = localStorage.getItem(DB_KEY_LEGACY);
  if(legacyRaw){
    try{
      const migrated = JSON.parse(legacyRaw);
      localStorage.setItem(DB_KEY, JSON.stringify(migrated));
      return migrated;
    }catch(e){}
  }
  return { business:null, users:[], shops:[], currentShopId:null, currentUserId:null,
    sessionUserId:null, /* who is actually logged in on this device right now */
    goods:[], customerGroups:[], customers:[], sales:[], dayClosures:[],
    auditLog:[], communicationLog:[], shopNotes:[], expenses:[], suppliers:[], supplierPurchases:[],
    employmentRecords:[], salaryPayments:[], recordOnlyStaff:[], rooms:[], lodgingBookings:[],
    joinCode:null, marketMode:false, pinAttempts:{},
    dismissedHandoverIds:[], /* local-only — per-device "got it" acks, never synced */

}

function currentUser(){ return state.users.find(u=>u.id===state.sessionUserId); }
function currentShop(){ return state.shops.find(s=>s.id===state.currentShopId); }
function isMaster(){ const u=currentUser(); return u && u.role==='master'; }
function isStaff(){ const u=currentUser(); return u && u.role==='staff'; }
function isViewer(){ const u=currentUser(); return u && u.role==='viewer'; }
// Super Admin: a staff member the Owner has promoted to manage other staff's roles/
// permissions. Only the Owner can grant or revoke this status, and a Super Admin can
// never manage the Owner's account or another Super Admin's status — only Master can.
function isSuperAdmin(){ const u=currentUser(); return u && u.role==='staff' && !!u.isSuperAdmin; }
// Whether the current user is allowed into Staff management at all.
function canManageStaff(){ return isMaster() || isSuperAdmin(); }
// Whether the current user (Master or a Super Admin) is allowed to manage a specific
// other user's permissions/status. A Super Admin can manage regular staff/viewers, but
// never the Owner's own account, and never another Super Admin's account.
function canManageThisUser(targetUser){
  if(isMaster()) return targetUser.role!=='master';
  if(isSuperAdmin()) return targetUser.role!=='master' && !targetUser.isSuperAdmin;
  return false;
}
// Granular staff permissions, revocable by the Owner. canSell/canSellCredit/canRecordCash
// default to allowed (true) unless explicitly turned off, so existing staff accounts
// aren't suddenly locked out by this feature. canAddGoods stays opt-in (default false),
// matching its original behavior.
function canDo(perm){
  const u = currentUser();
  if(!u) return false;
  if(u.role==='master') return true;
  if(u.role==='viewer') return false;
  if(perm==='canAddGoods' || perm==='canVoidReturn') return !!u[perm];
  return u[perm] !== false;
}
function logAudit(action,details){
  const entry = {id:uid('log'),businessId:business()?.id,userId:state.sessionUserId,
    action, details, timestamp:new Date().toISOString()};
  state.auditLog.unshift(entry);
  // Audit entries need to sync like everything else — a staff activity feed
  // for the owner is pointless if it only shows what happened on the
  // owner's own device.
  if(entry.businessId){
    enqueueSync('audit_log','insert', {
      id: entry.id, business_id: entry.businessId, user_id: entry.userId,
      action: entry.action, details: entry.details
    });
  }
  save();
}

    // an admin-side suspension, or the owner's own deletion request — the

  }
  if(!state.sessionUserId){

    }

// Reflects window.__zeeshopSyncStatus (written by sync-engine.js) as a small
// dot in the topbar — green when caught up, amber while something's
// queued, red if a push keeps failing, gray if this device is offline.
// Checked on every render plus a light interval, since sync happens in
// the background independent of any particular screen being open.
function updateSyncDot(){
  const dot = document.getElementById('sync-dot');
  if(!dot) return;
  const st = window.__zeeshopSyncStatus;
  if(!navigator.onLine){ dot.dataset.state = 'offline'; dot.title = 'Offline — will sync when back online'; return; }
  if(!st){ dot.dataset.state = ''; dot.title = 'Sync status unavailable'; return; }
  if(st.lastError && st.pendingCount > 0){ dot.dataset.state = 'error'; dot.title = st.lastError; return; }
  if(st.pendingCount > 0){ dot.dataset.state = 'pending'; dot.title = `${st.pendingCount} change(s) waiting to sync`; return; }
  dot.dataset.state = ''; dot.title = 'All changes synced';
}
if(typeof window !== 'undefined'){
  setInterval(updateSyncDot, 15000);
  window.addEventListener('online', updateSyncDot);
  window.addEventListener('offline', updateSyncDot);
}

/* Real "eye / eye-slash" visibility toggle for password inputs — the same

   slashed eye = currently revealed), not emoji. Call after rendering a form
   that contains password fields. Icons inherit currentColor so they follow
   both light and dark mode automatically. */
const EYE_ICON_OPEN =
  '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>'
  + '<circle cx="12" cy="12" r="3.2"/></svg>';
const EYE_ICON_CLOSED =
  '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M3 3l18 18"/>'
  + '<path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a13.9 13.9 0 0 1-3.15 4.15M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7a10.4 10.4 0 0 0 4.15-.85"/>'
  + '<path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/></svg>';

function bindPasswordToggles(){
  document.querySelectorAll('input[type="password"], input[type="text"][data-pw-revealed]').forEach(input=>{
    if(input.dataset.pwToggled) return; // already wired
    input.dataset.pwToggled = '1';
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:relative;';
    input.parentNode.insertBefore(wrapper, input);
    wrapper.appendChild(input);
    input.style.paddingRight = '44px';
    const eyeBtn = document.createElement('button');
    eyeBtn.type = 'button';
    eyeBtn.setAttribute('aria-label', 'Show password');
    eyeBtn.setAttribute('tabindex', '-1');
    eyeBtn.innerHTML = EYE_ICON_OPEN;
    eyeBtn.style.cssText = 'position:absolute;right:6px;top:50%;transform:translateY(-50%);'
      + 'background:none;border:none;cursor:pointer;padding:8px;line-height:0;'
      + 'display:flex;align-items:center;justify-content:center;color:var(--text-dim);border-radius:8px;';
    eyeBtn.addEventListener('click', ()=>{
      const revealed = input.type === 'text';
      if(revealed){
        input.type = 'password'; delete input.dataset.pwRevealed;
        eyeBtn.innerHTML = EYE_ICON_OPEN; eyeBtn.setAttribute('aria-label','Show password');
      } else {
        input.type = 'text'; input.dataset.pwRevealed = '1';
        eyeBtn.innerHTML = EYE_ICON_CLOSED; eyeBtn.setAttribute('aria-label','Hide password');
      }
      input.focus({preventScroll:true});
      const v = input.value; input.setSelectionRange(v.length, v.length);
    });
    wrapper.appendChild(eyeBtn);
  });
}

let forgotStep = 1; // 1: enter username/email, 2: enter emailed code, 3: set new password
let forgotUserId = null;
let forgotError = '';
let forgotEmail = null;
let forgotCode = null;
let forgotOtpSending = false;

/* ---- forgot-password email verification (Edge Functions do the actual send/verify) ---- */
async function sendResetOtp(email){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/send-reset-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email })
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || 'Could not send the reset code.');
  return data;
}
async function verifyResetOtp(email, code){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/verify-reset-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email, code })
  });
  const data = await res.json();
  if(!res.ok && !data) throw new Error('Could not verify the code right now.');
  return data; // { verified: true } or { verified: false, error }
}
// The only call actually authorized to change the password — re-checks the
// code server-side itself, updates Supabase Auth, and keeps app_users.password_hash
// in sync with what every device computes locally.
async function applyResetPassword(email, code, newPassword){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/apply-reset-password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email, code, newPassword })
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || 'Could not reset the password right now.');
  return data;
}

function bindForgotPasswordEvents(){
  const go = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click', fn); };
  go('go-login-from-forgot', e=>{e.preventDefault(); authMode = state.business ? '' : 'login'; forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError=''; render();});
  go('btn-forgot-next', async ()=>{
    if(forgotOtpSending) return;
    const idf = document.getElementById('fp-user').value.trim().toLowerCase();
    const u = state.users.find(x=> (x.username.toLowerCase()===idf || (x.email||'').toLowerCase()===idf) && x.role==='master');
    let emailToUse;
    if(u){
      if(!u.email){ forgotError='This account has no email on file. Password recovery is not available for it.'; render(); return; }
      forgotUserId = u.id; emailToUse = u.email;
    } else {
      // Not on this device — could still be a real account on another device.
      // We can't resolve a username without a local record, so require an email here.
      if(!/^\S+@\S+\.\S+$/.test(idf)){ forgotError='Enter the email on file for this account (a username only works on the device it was created on).'; render(); return; }
      forgotUserId = null; emailToUse = idf;
    }
    forgotEmail = emailToUse; forgotOtpSending = true; forgotError=''; render();
    try{
      await sendResetOtp(emailToUse);
      forgotOtpSending = false; forgotStep = 2; render();
    }catch(err){
      forgotOtpSending = false;
      forgotError = err.message || "Couldn't send the code right now. Check your internet connection.";
      render();
    }
  });
  go('fp-resend-otp', async e=>{
    e.preventDefault();
    if(forgotOtpSending || !forgotEmail) return;
    try{ await sendResetOtp(forgotEmail); toast('New code sent ✅'); }
    catch(err){ forgotError = err.message; render(); }
  });
  go('btn-forgot-verify', async ()=>{
    const code = document.getElementById('fp-code').value.trim();
    if(!code){ forgotError = 'Enter the 6-digit code.'; render(); return; }
    const btn = document.getElementById('btn-forgot-verify');
    if(btn){ btn.disabled = true; btn.textContent = 'Verifying…'; }
    try{
      const result = await verifyResetOtp(forgotEmail, code);
      if(!result.verified){ forgotError = result.error || 'Incorrect code.'; render(); return; }
      forgotCode = code;
      forgotStep = 3; forgotError=''; render();
    }catch(err){
      forgotError = err.message || "Couldn't verify right now. Check your internet connection.";
      render();
    }
  });
  go('btn-forgot-save', async ()=>{
    const p1 = document.getElementById('fp-newpass').value;
    const p2 = document.getElementById('fp-newpass2').value;
    if(p1.length<6){ forgotError='Password must be at least 6 characters.'; render(); return; }
    if(p1!==p2){ forgotError="Passwords don't match."; render(); return; }
    const btn = document.getElementById('btn-forgot-save');
    if(btn){ btn.disabled = true; btn.textContent = 'Resetting…'; }
    try{
      await applyResetPassword(forgotEmail, forgotCode, p1);
    }catch(err){
      forgotError = err.message || "Couldn't reset the password right now. Check your internet connection.";
      render(); return;
    }
    const u = state.users.find(x=>x.id===forgotUserId);
    if(u){
      // Already on this device — update the local copy too, so login works offline right away.
      u.passwordHash = hash(p1);
      logAudit('password_reset', 'Password reset via emailed code');
      authMode='login'; forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError='';
      toast('Password reset ✅ — log in with your new password.');
      render();
    } else {
      // Never been on this device before — bootstrap it now, same as a
      // first-time cross-device login, so they land straight on the dashboard
      // instead of being sent back to type the same new password into Login.
      try{
        await loginOwnerToSupabase(forgotEmail, p1);
        forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError='';
      }catch(err){
        // Password was reset successfully server-side even if this device-setup
        // step failed (e.g. offline right after) — send them to Login to try normally.
        authMode='login'; forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError='';
        toast('Password reset ✅ — log in with your new password.');
        render();
      }
    }
  });
}

// ilike() treats % and _ as wildcards — escape both so an email containing
// an underscore (very common) can't accidentally match a different account.
function escapeIlike(s){ return s.replace(/[%_]/g, c => '\\'+c); }

// First-time (or account-not-on-this-device) login: authenticates directly
// against Supabase, then bootstraps this device's local copy of the
// business, the owner's own user record, and shops — enough to get to the
// dashboard — before handing off to pullSync() for everything else
// (goods, customers, sales, etc). See sync-engine.js's pullSync for the
// "Known limitation" this closes. Used by both Login (with the existing
// password) and Forgot Password (with the just-reset one).
// Shared by password login AND Google OAuth login — once ANY Supabase Auth
// session exists (however it was obtained), this is what actually pulls the
// business, staff record, and shops down and makes the app usable. Splitting
// this out means the Google path isn't a second, divergent copy of this logic.
async function loadOwnerBusinessData(accessToken, authUserId, emailForLookup){
  const headers = { 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+accessToken };

  const bizRes = await fetch(`${SITE_CONTENT_URL}/rest/v1/businesses?select=*&owner_auth_user_id=eq.${authUserId}`, { headers });
  const bizRows = bizRes.ok ? await bizRes.json() : [];
  if(!bizRows[0]){
    throw new Error("We couldn't find a business linked to this account.");
  }
  const b = bizRows[0];
  state.business = {
    id: b.id, name: b.name, businessType: b.business_type||'', registrationNumber: b.registration_number||'',
    country: b.country, currency: b.currency, timezone: b.timezone, language: b.language||'en',
    taxName: b.tax_name||'VAT', taxPercent: b.tax_percent||0, subscriptionPlan: b.subscription_plan||'free',
    subscriptionExpiresAt: b.subscription_expires_at||null, autoRenewEnabled: b.auto_renew_enabled||false,
    autoRenewPlan: b.auto_renew_plan||null, autoRenewInterval: b.auto_renew_interval||null,
    connectCode: b.connect_code||null, deletionRequestedAt: b.deletion_requested_at||null,
    logoDataUrl: b.logo_data_url||null, createdAt: b.created_at
  };

  const [usersRes, shopsRes] = await Promise.all([
    fetch(`${SITE_CONTENT_URL}/rest/v1/app_users?select=*&business_id=eq.${b.id}&email=ilike.${encodeURIComponent(escapeIlike(emailForLookup))}`, { headers }),
    fetch(`${SITE_CONTENT_URL}/rest/v1/shops?select=*&business_id=eq.${b.id}`, { headers })
  ]);
  const userRows = usersRes.ok ? await usersRes.json() : [];
  const shopRows = shopsRes.ok ? await shopsRes.json() : [];
  if(!userRows[0]){
    throw new Error("We couldn't find your staff record for this business.");
  }
  const r = userRows[0];
  const localUser = {
    id: r.id, businessId: r.business_id, username: r.username, email: r.email, phone: r.phone||'',
    firstName: r.first_name, lastName: r.last_name||'', role: r.role, isActive: r.is_active, canAddGoods: r.can_add_goods,
    passwordHash: r.password_hash||null, pinHash: r.pin_hash||null, pinLength: r.pin_length||null
  };
  if(!state.users.some(x=>x.id===localUser.id)) state.users.push(localUser);

  shopRows.forEach(sr=>{
    if(!state.shops.some(x=>x.id===sr.id)){
      state.shops.push({ id:sr.id, businessId:sr.business_id, name:sr.name, address:sr.address||'', phone:sr.phone||'', email:sr.email||'' });
    }
  });

  state.sessionUserId = localUser.id;
  forceFullLogin = false;
  state.currentShopId = shopRows[0] ? shopRows[0].id : (state.shops[0] ? state.shops[0].id : null);
  return localUser;
}

async function loginOwnerToSupabase(email, pass){
  const { data: signInData, error: signInErr } = await window.sb.auth.signInWithPassword({ email, password: pass });
  if(signInErr || !signInData.session){
    throw new Error('Incorrect username/email or password.');
  }
  const localUser = await loadOwnerBusinessData(signInData.session.access_token, signInData.user.id, email);
  logAudit('login', 'Master logged in on a new device');
  toast(`Welcome back, ${localUser.firstName}!`);
  render();
  if(typeof pullSync === 'function') pullSync();
}

// Google OAuth already established a real Supabase session by the time this
// runs — no signInWithPassword call needed (there's no password), just the
// same business/staff lookup as the normal login path.
async function loginOwnerViaGoogleSession(session){
  const localUser = await loadOwnerBusinessData(session.access_token, session.user.id, session.user.email);
  logAudit('login', 'Master logged in with Google');
  toast(`Welcome back, ${localUser.firstName}!`);
  render();
  if(typeof pullSync === 'function') pullSync();
}

// Fired once, right after the Google OAuth redirect lands back on this page.
// Distinguishes "just came back from Google" from every OTHER reason
// onAuthStateChange can fire (a normal signInWithPassword() elsewhere in
// this file also fires SIGNED_IN) by checking, once, whether the URL that
// was loaded actually contained OAuth callback params — normal logins never
// arrive via a URL redirect, so this never fires for those.
// Called explicitly right after window.sb is created (further down this
// file) — NOT run as a bare top-level statement here, since window.sb
// doesn't exist yet at this point in the script.
const arrivedViaGoogleRedirect = window.location.hash.includes('access_token') || new URLSearchParams(window.location.search).has('code');
let googleRedirectHandled = false;
function initGoogleRedirectListener(){
  if(!arrivedViaGoogleRedirect) return;
  window.sb.auth.onAuthStateChange(async (event, session) => {
    if(event !== 'SIGNED_IN' || googleRedirectHandled || !session) return;
    googleRedirectHandled = true;
    const authUser = session.user;
    const meta = authUser.user_metadata || {};
    const firstName = meta.given_name || (meta.full_name||meta.name||'').split(' ')[0] || 'there';
    const lastName = meta.family_name || (meta.full_name||meta.name||'').split(' ').slice(1).join(' ');

    try{
      await loginOwnerViaGoogleSession(session);
    }catch(e){
      // No business found for this Google account yet — treat it as a
      // brand new signup, skipping straight to business details since
      // Google already verified who they are.
      pendingGoogleAuth = { authUserId: authUser.id, email: authUser.email, firstName, lastName };
      authMode = 'signup';
      render();
      toast("Signed in with Google — just finish your business details.");
    }
  });
}

function bindAuthEvents(){
  const go = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click', fn); };
  go('google-auth-btn', handleGoogleSignIn);
  // Coming back here right after Google auth, with no existing business
  // found for that account — lock the email (it's already verified by
  // Google, no need to ask again) and pre-fill the name from their profile.
  if(pendingGoogleAuth){
    const emailEl = document.getElementById('su-email');
    const fnEl = document.getElementById('su-fn');
    const lnEl = document.getElementById('su-ln');
    const passField = document.getElementById('su-pass');
    if(emailEl){ emailEl.value = pendingGoogleAuth.email; emailEl.disabled = true; }
    if(fnEl && !fnEl.value) fnEl.value = pendingGoogleAuth.firstName;
    if(lnEl && !lnEl.value) lnEl.value = pendingGoogleAuth.lastName;
    // No password to set — Google already authenticated this session, and
    // there's nothing to sign up again with. Hide the field entirely
    // rather than ask for one that won't be used.
    if(passField){
      const passFieldWrap = passField.closest('.field');
      if(passFieldWrap) passFieldWrap.style.display = 'none';

  }
  go('go-signup', e=>{e.preventDefault(); authMode='signup'; authError=''; render();});
  go('go-login', e=>{e.preventDefault(); authMode='login'; authError=''; render();});
  go('go-forgot', e=>{e.preventDefault(); authMode='forgot'; forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError=''; render();});
  go('go-join-shop', e=>{e.preventDefault(); authMode='join-shop'; joinShopCodeInput=''; authError=''; render();});
  go('go-login-from-join', e=>{e.preventDefault(); authMode='login'; authError=''; render();});
  go('btn-join-shop', ()=>joinShopSubmit());
  go('btn-reconnect-shop', ()=>reconnectStaffDevice());
  const codeInput = document.getElementById('join-any-code-input');
  if(codeInput){
    codeInput.addEventListener('input', ()=>{
      joinShopCodeInput = codeInput.value.trim();
      const cursorPos = codeInput.selectionStart;
      render();
      // Re-render rebuilds the input — restore focus and cursor position so
      // typing doesn't get interrupted every time the field set below changes.
      const freshInput = document.getElementById('join-any-code-input');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }

  go('btn-login', async ()=>{
    const idf = document.getElementById('li-user').value.trim().toLowerCase();
    const pass = document.getElementById('li-pass').value;
    const u = state.users.find(x=> (x.username.toLowerCase()===idf || (x.email||'').toLowerCase()===idf) && x.role==='master');

    if(u){
      // Fast, fully-offline path — account already lives on this device.
      if(u.passwordHash !== hash(pass)){ authError='Incorrect username/email or password.'; render(); return; }
      state.sessionUserId = u.id;
      forceFullLogin = false;
      if(!state.currentShopId && state.shops[0]) state.currentShopId = state.shops[0].id;
      logAudit('login', 'Master logged in');
      toast(`Welcome back, ${u.firstName}!`);
      render();
      // Background refresh of the Supabase Auth session so the sync engine
      // has a valid token to push queued changes with. Silently no-ops offline.
      if(u.email){
        window.sb.auth.signInWithPassword({ email: u.email, password: pass })
          .then(({ error })=>{ if(!error){ flushSyncQueue(); pullSync(); } })
          .catch(()=>{});
      }
      return;
    }

    // Not found on this device — this could be a brand-new device/browser
    // for an account that already exists in Supabase. That path needs a
    // real email (Supabase Auth doesn't know usernames) and a network call.
    if(!/^\S+@\S+\.\S+$/.test(idf)){
      authError='Incorrect username/email or password.';
      render(); return;
    }
    if(!navigator.onLine){
      authError="This account isn't set up on this device yet. Connect to the internet to sign in here for the first time.";
      render(); return;
    }
    const btn = document.getElementById('btn-login');
    if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
    try{
      await loginOwnerToSupabase(idf, pass);
    }catch(err){
      authError = err.message || 'Incorrect username/email or password.';
      render();
    }
  });

  go('btn-signup', async ()=>{
    const biz = document.getElementById('su-biz').value.trim();
    const country = document.getElementById('su-country').value;
    const ccy = document.getElementById('su-ccy').value;
    const fn = document.getElementById('su-fn').value.trim();
    const ln = document.getElementById('su-ln').value.trim();
    const username = document.getElementById('su-username').value.trim();
    const phone = document.getElementById('su-phone').value.trim();
    const email = pendingGoogleAuth ? pendingGoogleAuth.email : document.getElementById('su-email').value.trim();
    const pass = pendingGoogleAuth ? null : document.getElementById('su-pass').value;
    const consent = document.getElementById('su-consent').checked;
    if(!biz||!fn||!ln||!username||!email||(!pendingGoogleAuth && !pass)){ authError='Please fill in every field.'; render(); return; }
    if(!pendingGoogleAuth && pass.length<6){ authError='Password must be at least 6 characters.'; render(); return; }
    if(!consent){ authError='Please accept the data consent checkbox to continue.'; render(); return; }
    const uLower = username.toLowerCase(), eLower = email.toLowerCase();
    const dupe = state.users.find(x=> x.username.toLowerCase()===uLower || (x.email||'').toLowerCase()===eLower);
    if(dupe){
      authError = dupe.email && dupe.email.toLowerCase()===eLower
        ? 'An account with that email already exists. Try logging in, or use Forgot Password.'
        : 'That username is already taken. Please choose another.';
      render(); return;
    }

    if(signupOtpSending) return;
    signupOtpSending = true;
    const btn = document.getElementById('btn-signup');
    if(btn){ btn.disabled = true; btn.textContent = 'Creating…'; }

    if(pendingGoogleAuth){
      // Already authenticated by Google — no email to verify (Google
      // already proved it) and no password to check, so this skips OTP
      // entirely and goes straight to creating the business.
      try{
        await completeGoogleSignupAccount({ biz, country, ccy, fn, ln, username, phone, email }, pendingGoogleAuth.authUserId);
        toast('Account created with Google ✅');
      }catch(err){
        authError = err.message || "Couldn't create the account. Please try again.";
      }
      signupOtpSending = false;
      render();
      return;
    }

    if(SKIP_SIGNUP_OTP_TEMP){
      // Termii SMTP not approved yet — skip straight to account creation.
      pendingSignupData = { biz, country, ccy, fn, ln, username, phone, email, pass };
      try{
        await completeSignupAccount(pendingSignupData);
        toast('Account created (email verification temporarily skipped) ✅');
      }catch(err){
        authError = err.message || "Couldn't create the account. Please try again.";
      }
      signupOtpSending = false;
      render();
      return;
    }

    try{
      await sendSignupOtp(email);
      pendingSignupData = { biz, country, ccy, fn, ln, username, phone, email, pass };
      signupOtpError = '';
      authMode = 'signup-verify';
      authError = '';
    }catch(err){
      authError = err.message || "Couldn't send the verification code. Check your internet connection and try again.";
    }
    signupOtpSending = false;
    render();
  });
}

/* ---- signup email verification, via Termii (Edge Functions do the actual send/verify) ---- */
async function sendSignupOtp(email){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/send-signup-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email })
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || 'Could not send the verification code.');
  return data;
}
async function verifySignupOtp(email, code){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/verify-signup-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email, code })
  });
  const data = await res.json();
  if(!res.ok && !data) throw new Error('Could not verify the code right now.');
  return data; // { verified: true } or { verified: false, error }
}
function bindSignupVerifyEvents(){
  const go = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click', fn); };
  go('back-to-signup', e=>{ e.preventDefault(); authMode='signup'; signupOtpError=''; render(); });
  go('resend-otp', async e=>{
    e.preventDefault();
    if(!pendingSignupData) return;
    try{ await sendSignupOtp(pendingSignupData.email); toast('New code sent ✅'); }
    catch(err){ signupOtpError = err.message; render(); }
  });
  go('btn-verify-otp', async ()=>{
    const code = document.getElementById('su-otp-code').value.trim();
    if(!code){ signupOtpError = 'Enter the 6-digit code.'; render(); return; }
    const btn = document.getElementById('btn-verify-otp');
    if(btn){ btn.disabled = true; btn.textContent = 'Verifying…'; }
    try{
      const result = await verifySignupOtp(pendingSignupData.email, code);
      if(!result.verified){ signupOtpError = result.error || 'Incorrect code.'; render(); return; }
      await completeSignupAccount(pendingSignupData);
    }catch(err){
      signupOtpError = err.message || "Couldn't verify right now. Check your internet connection.";
      render();
    }
  });
}async function completeSignupAccount(data){
  const { biz, country, ccy, fn, ln, username, phone, email, pass } = data;
  const bizId = uid('biz');
  const userId = uid('user');
  const shopId = uid('shop');
  state.business = { id:bizId, name:biz, businessType:'', registrationNumber:'', country, currency:ccy, timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    language:'en', taxName:'VAT', taxPercent:0, subscriptionPlan:'free', createdAt:new Date().toISOString() };
  state.users.push({ id:userId, businessId:bizId, username, email, emailVerified:true, phone, firstName:fn, lastName:ln,
    passwordHash: hash(pass),
    role:'master', isActive:true, canAddGoods:true });
  state.shops.push({ id:shopId, businessId:bizId, name: biz+" — Main Shop", address:'', phone, email,
    receiptFooter:'Thank you for your business!', receiptTerms:'Goods sold in good condition. No refund after payment.', auctionDiscountDefault:30 });
  const groupRetail = {id:uid('grp'),businessId:bizId,name:'Retail'};
  const groupWholesale = {id:uid('grp'),businessId:bizId,name:'Wholesale'};
  const groupVip = {id:uid('grp'),businessId:bizId,name:'VIP'};
  state.customerGroups.push(groupRetail, groupWholesale, groupVip);
  state.currentShopId = shopId;
  state.sessionUserId = userId;
  logAudit('signup','Business created: '+biz);
  pendingSignupData = null;

  // Create the matching Supabase Auth account + database records
  try{
    const { data: authData, error: authErr } = await window.sb.auth.signUp({ email, password: pass });
    if(!authErr && authData.user){
      const ownerAuthId = authData.user.id;

      // 1. Insert business immediately
      await window.sb.from('businesses').insert({
        id: bizId,
        name: biz,
        business_type: '',
        registration_number: '',
        country,
        currency: ccy,
        timezone: state.business.timezone,
        language: 'en',
        tax_name: 'VAT',
        tax_percent: 0,
        subscription_plan: 'free',
        owner_auth_user_id: ownerAuthId
      });

      // 2. Insert shop
      await window.sb.from('shops').insert({
        id: shopId,
        business_id: bizId,
        name: biz + " — Main Shop",
        address: '',
        phone,
        email
      });

      // 3. Insert app_users (THIS WAS THE MISSING LINK)
      await window.sb.from('app_users').insert({
        id: userId,
        business_id: bizId,
        username,
        email,
        phone,
        first_name: fn,
        last_name: ln,
        role: 'master',
        is_active: true,
        can_add_goods: true,
        can_sell: true,
        can_sell_credit: true,
        can_record_cash: true,
        can_void_return: true,
        can_share: true,
        password_hash: hash(pass),
        auth_user_id: ownerAuthId          // ← This was missing before
      });

      // 4. Insert customer groups
      for (const g of [groupRetail, groupWholesale, groupVip]) {
        await window.sb.from('customer_groups').insert({
          id: g.id,
          business_id: g.businessId,
          name: g.name
        });
      }
    }
  }catch(e){
    console.error('Signup sync error:', e);
    // Local account still works even if Supabase fails
  }

  render();
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31 + s.charCodeAt(i))|0;} return 'h'+h; }

// Same shape as completeSignupAccount, for the Google path specifically:
// no signUp() call (the session already exists — that's the whole point of
// arriving here), no password anywhere (passwordHash stays null on purpose,
// so a stale/fake local check can never accidentally "succeed" — if this
// person ever wants password login too, that's what Forgot Password is for).
// Unlike manual signup, failures here are NOT swallowed silently: manual
// signup has a legitimate offline-first fallback (local account still works
// even if the sync fails), but a Google account with no server-side business
// row would be unrecoverable — no other device, and not even a local-storage
// clear on this one, could ever get back to it. So this throws on failure
// and lets the signup form show the real error instead.
async function completeGoogleSignupAccount(data, ownerAuthId){
  const { biz, country, ccy, fn, ln, username, phone, email } = data;
  const bizId = uid('biz');
  const userId = uid('user');
  const shopId = uid('shop');

  const { error: bizErr } = await window.sb.from('businesses').insert({
    id: bizId, name: biz, business_type: '', registration_number: '', country, currency: ccy,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, language: 'en', tax_name: 'VAT', tax_percent: 0,
    subscription_plan: 'free', owner_auth_user_id: ownerAuthId
  });
  if(bizErr) throw new Error("Couldn't create the business: " + bizErr.message);

  const { error: shopErr } = await window.sb.from('shops').insert({
    id: shopId, business_id: bizId, name: biz + " — Main Shop", address: '', phone, email
  });
  if(shopErr) throw new Error("Couldn't create the shop: " + shopErr.message);

  const { error: userErr } = await window.sb.from('app_users').insert({
    id: userId, business_id: bizId, username, email, phone, first_name: fn, last_name: ln,
    role: 'master', is_active: true, can_add_goods: true, can_sell: true, can_sell_credit: true,
    can_record_cash: true, can_void_return: true, can_share: true, password_hash: null, auth_user_id: ownerAuthId
  });
  if(userErr) throw new Error("Couldn't create your staff record: " + userErr.message);

  const groupRetail = {id:uid('grp'),businessId:bizId,name:'Retail'};
  const groupWholesale = {id:uid('grp'),businessId:bizId,name:'Wholesale'};
  const groupVip = {id:uid('grp'),businessId:bizId,name:'VIP'};
  for(const g of [groupRetail, groupWholesale, groupVip]){
    await window.sb.from('customer_groups').insert({ id: g.id, business_id: g.businessId, name: g.name });
  }

  state.business = { id:bizId, name:biz, businessType:'', registrationNumber:'', country, currency:ccy,
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone, language:'en', taxName:'VAT', taxPercent:0,
    subscriptionPlan:'free', createdAt:new Date().toISOString() };
  state.users.push({ id:userId, businessId:bizId, username, email, phone, firstName:fn, lastName:ln,
    passwordHash: null, role:'master', isActive:true, canAddGoods:true });
  state.shops.push({ id:shopId, businessId:bizId, name: biz+" — Main Shop", address:'', phone, email,
    receiptFooter:'Thank you for your business!', receiptTerms:'Goods sold in good condition. No refund after payment.', auctionDiscountDefault:30 });
  state.customerGroups.push(groupRetail, groupWholesale, groupVip);
  state.currentShopId = shopId;
  state.sessionUserId = userId;
  logAudit('signup', 'Business created with Google: '+biz);
  pendingGoogleAuth = null;
  render();
  if(typeof pullSync === 'function') pullSync();
}

/* ============================================================
   BUSINESS LOGO — uploaded once, shrunk down before storing so
   it doesn't bloat localStorage, then drawn onto every receipt.
   ============================================================ */
// Reads an uploaded image file, shrinks it to a small square-ish max size,
// and returns a compact PNG data URL (keeps transparency for real logos).
function resizeLogoFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Not a valid image'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// Caches the loaded logo Image object per data URL, so repeated receipt/letter
// draws don't reload it every time. Returns null if the business has no logo.
let __logoImgCache = { dataUrl:null, img:null };
function getLogoImage(){
  const dataUrl = business() && business().logoDataUrl;
  if(!dataUrl) return Promise.resolve(null);
  if(__logoImgCache.dataUrl === dataUrl && __logoImgCache.img) return Promise.resolve(__logoImgCache.img);
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ __logoImgCache = { dataUrl, img }; resolve(img); };
    img.onerror = ()=> resolve(null);
    img.src = dataUrl;
  });
}

          toast(`Too many tries. Locked for ${Math.ceil((att.lockedUntil-Date.now())/60000)} more min.`);

        }
        openPinScreen(u);
      }
    });
  });

function openPinScreen(u){
  pendingPinUser = u; pinBuffer='';
  document.getElementById('app').innerHTML = renderPinPad(u);
  bindPinEvents(u);
}

function bindPinEvents(u){
  document.getElementById('back-select').addEventListener('click', e=>{e.preventDefault(); pendingPinUser=null; render();});
  if(u.role==='master'){
    document.getElementById('pp-master-login').addEventListener('click', ()=>{
      const pass = document.getElementById('pp-pass').value;
      if(u.passwordHash !== hash(pass)){ toast('Wrong password.'); return; }
      state.sessionUserId = u.id;
      if(!state.currentShopId && state.shops[0]) state.currentShopId = state.shops[0].id;
      logAudit('login','Master unlocked device');
      render();
    });
    const ppForgot = document.getElementById('pp-go-forgot');
    if(ppForgot) ppForgot.addEventListener('click', e=>{ e.preventDefault(); authMode='forgot'; forgotStep=1; forgotUserId=null; forgotEmail=null; forgotCode=null; forgotError=''; render(); });
    return;
  }
  updatePinDots(u);
  document.querySelectorAll('#pinpad-grid button[data-k]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k=b.dataset.k;
      if(k==='del'){ pinBuffer = pinBuffer.slice(0,-1); }
      else if(k!=='' && pinBuffer.length < (u.pinLength||4)){ pinBuffer += k; }
      updatePinDots(u);
      if(pinBuffer.length === (u.pinLength||4)){ setTimeout(()=>submitPin(u),120); }
    });
  });
}
function updatePinDots(u){
  const dots = document.getElementById('pin-dots');
  if(!dots) return;
  const len = u.pinLength||4;
  dots.innerHTML = Array.from({length:len}).map((_,i)=>`<div class="pin-dot ${i<pinBuffer.length?'filled':''}"></div>`).join('');
}
function submitPin(u){
  if(hash(pinBuffer) === u.pinHash){
    state.pinAttempts[u.id] = {count:0, lockedUntil:0};
    state.sessionUserId = u.id;
    if(!state.currentShopId && state.shops[0]) state.currentShopId = state.shops[0].id;
    logAudit('login', u.firstName+' logged in via PIN');
    pendingPinUser=null;
    toast(`Welcome, ${u.firstName}!`);
    render();
  } else {
    const att = state.pinAttempts[u.id] || {count:0, lockedUntil:0};
    att.count = (att.count||0)+1;
    if(att.count>=5){ att.lockedUntil = Date.now()+15*60000; att.count=0; toast('Wrong PIN 5 times. Locked 15 min.'); }
    else toast(`Wrong PIN (${5-att.count} tries left)`);
    state.pinAttempts[u.id]=att; save();
    pinBuffer='';
    updatePinDots(u);
  }
}

/**
 * The NEW way a staff member can join — on a completely fresh device,
 * with just the join code and their name, no owner login required on
 * that device at all. Calls join-business (server-side), which creates
 * an invisible Supabase Auth account for them, then this function signs
 * that session in and pulls the whole business down locally.
 */
async function joinShopSubmit(){
  const code = document.getElementById('join-any-code-input').value.trim();
  const fn = document.getElementById('join-fn-input').value.trim();
  const ln = document.getElementById('join-ln-input').value.trim();
  const phone = document.getElementById('join-phone-input').value.trim();
  const pin = document.getElementById('join-pin-input').value.trim();
  if(!/^\d{6}$/.test(code)){ authError = 'Enter the 6-digit code from your manager.'; render(); return; }
  if(!fn){ authError = 'Please enter your first name.'; render(); return; }
  if(!/^\d{4,6}$/.test(pin)){ authError = 'Set a 4-6 digit PIN for this device.'; render(); return; }
  if(!navigator.onLine){ authError = 'You need internet the first time you join a shop.'; render(); return; }

  authError = '';
  const btn = document.getElementById('btn-join-shop');
  if(btn){ btn.disabled = true; btn.textContent = 'Joining…'; }

  try{
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/join-business`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ code, first_name: fn, last_name: ln, phone })
    });
    const result = await res.json();
    if(!res.ok || result.error){
      authError = result.error || 'Could not join — please check the code and try again.';
      if(btn){ btn.disabled = false; btn.textContent = 'Join Shop'; }
      render();
      return;
    }

    // Sign in with the invisible synthetic account — this is what lets
    // the sync engine (push AND pull) work on this device from now on.
    const { error: signInErr } = await window.sb.auth.signInWithPassword({
      email: result.auth_email, password: result.auth_password
    });
    if(signInErr){
      authError = 'Joined, but could not start your session — please try logging in again with internet on.';
      render();
      return;
    }

    // Set a local PIN so this device works offline day-to-day from here on —
    // collected as a real form field above, not a follow-up prompt() that
    // could be dismissed and silently leave someone with a PIN they were
    // never shown.

    // Bootstrap local state from what the server gave us.
    state.business = {
      id: result.business.id, name: result.business.name, country: result.business.country,
      currency: result.business.currency, subscriptionPlan: result.business.subscriptionPlan,
      subscriptionExpiresAt: result.business.subscriptionExpiresAt
    };
    (result.shops||[]).forEach(s=>{
      state.shops.push({ id:s.id, businessId:s.business_id, name:s.name, address:s.address||'', phone:s.phone||'', email:s.email||'' });
    });
    state.currentShopId = result.shops && result.shops[0] ? result.shops[0].id : null;

    const u = { ...result.user, pinHash: hash(pin), pinLength: pin.length };
    state.users.push(u);
    state.sessionUserId = u.id;

    // Save the PIN hash server-side too, so this same staff member can
    // reconnect on another device later via "I already have an account"
    // (see reconnectStaffDevice) without creating a duplicate.
    const { data: sessionData } = await window.sb.auth.getSession();
    if(sessionData.session){
      await fetch(`${SITE_CONTENT_URL}/rest/v1/app_users?id=eq.${u.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+sessionData.session.access_token, 'apikey': SITE_CONTENT_ANON_KEY, 'Prefer':'return=minimal' },
        body: JSON.stringify({ pin_hash: u.pinHash, pin_length: u.pinLength })
      }).catch(()=>{});
    }

    save();
    logAudit('staff_joined_remote', fn+' '+ln+' joined remotely as staff');
    toast('Welcome, '+fn+'! Pulling in your shop\'s data…');
    render();

    // Pull everything else (goods, customers, sales, etc.) down onto
    // this device now that a valid session exists.
    if(typeof pullSync === 'function') pullSync();
  }catch(e){
    authError = 'Could not join — check your connection and try again.';
    if(btn){ btn.disabled = false; btn.textContent = 'Join Shop'; }
    render();
  }
}

/*
 * For an EXISTING staff member adding a second (or replacement) device.
 * Unlike joinShopSubmit, this does NOT create a new account — it verifies
 * the business's permanent Connect Code + the staff's own phone + PIN
 * against their existing app_users row (server-side, in staff-device-login),
 * then re-authenticates that same account on this device.
 */
async function reconnectStaffDevice(){
  const code = document.getElementById('join-any-code-input').value.trim();
  const phone = document.getElementById('reconnect-phone-input').value.trim();
  const pin = document.getElementById('reconnect-pin-input').value.trim();
  if(!/^\d{8}$/.test(code)){ authError = 'Enter the 8-digit Connect Code from your Owner.'; render(); return; }
  if(!phone){ authError = 'Enter the phone number on your account.'; render(); return; }
  if(!/^\d{4,6}$/.test(pin)){ authError = 'Enter your 4-6 digit PIN.'; render(); return; }
  if(!navigator.onLine){ authError = 'You need internet to sign in on a new phone.'; render(); return; }

  authError = '';
  const btn = document.getElementById('btn-reconnect-shop');
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }

  try{
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/staff-device-login`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ connect_code: code, phone, pin })
    });
    const result = await res.json();
    if(!res.ok || result.error){
      authError = result.error || 'Could not sign in — please check your details and try again.';
      if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
      render();
      return;
    }

    const { error: signInErr } = await window.sb.auth.signInWithPassword({
      email: result.auth_email, password: result.auth_password
    });
    if(signInErr){
      authError = 'Verified, but could not start your session — please try again.';
      if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
      render();
      return;
    }

    // Bootstrap local state from the SAME account — reuses the existing
    // PIN hash rather than prompting for a new one, since the PIN they
    // just typed already matched it.
    if(result.business) state.business = { ...result.business };
    (result.shops||[]).forEach(s=>{
      if(!state.shops.some(x=>x.id===s.id)){
        state.shops.push({ id:s.id, businessId:s.business_id, name:s.name, address:s.address||'', phone:s.phone||'', email:s.email||'' });
      }
    });
    state.currentShopId = result.shops && result.shops[0] ? result.shops[0].id : null;

    if(!state.users.some(x=>x.id===result.user.id)) state.users.push(result.user);
    state.sessionUserId = result.user.id;

    save();
    logAudit('staff_reconnected', result.user.firstName+' signed in on a new device');
    toast('Welcome back, '+result.user.firstName+'! Pulling in your shop\'s data…');
    render();

    if(typeof pullSync === 'function') pullSync();
  }catch(e){
    authError = 'Could not reach the server — check your connection and try again.';
    if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
    render();
  }
}

let joinFlowError = '';
async function submitOpenJoinFlow(){
  const code = document.getElementById('jf-code').value.trim();

  const phone = document.getElementById('jf-phone').value.trim();

  if(!/^\d{4,6}$/.test(pin)){ joinFlowError = 'PIN must be 4-6 digits.'; openJoinFlow(); return; }
  joinFlowError = '';

  const btn = document.getElementById('jf-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Joining…'; }
  try{
    const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/join-business`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SITE_CONTENT_ANON_KEY },
      body: JSON.stringify({ code: state.joinCode.code, first_name: fn, last_name: ln, phone })
    });

    if(!res.ok || result.error){
      joinFlowError = result.error || 'Could not join — please check the code and try again.';
      openJoinFlow();
      return;
    }

    // Real Supabase Auth session for this device — required for push/pull sync.
    const { error: signInErr } = await window.sb.auth.signInWithPassword({
      email: result.auth_email, password: result.auth_password
    });
    if(signInErr){
      toast('Joined, but could not start your session — please try again with internet on.');
      closeSheet();
      return;
    }

    const u = { ...result.user, pinHash: hash(pin), pinLength: pin.length };
    state.users.push(u);

    const { data: sessionData } = await window.sb.auth.getSession();
    if(sessionData.session){
      await fetch(`${SITE_CONTENT_URL}/rest/v1/app_users?id=eq.${u.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+sessionData.session.access_token, 'apikey': SITE_CONTENT_ANON_KEY, 'Prefer':'return=minimal' },
        body: JSON.stringify({ pin_hash: u.pinHash, pin_length: u.pinLength })

    save();
    closeSheet();
    render();

    openJoinFlow();
  }

function alertCounts(){
  const shopGoods = state.goods.filter(g=>g.shopId===state.currentShopId);
  let expiring=0;
  shopGoods.forEach(g=> g.batches.forEach(b=>{
    if(b.qtyRemaining<=0) return;
    const d = daysBetween(todayISO(), b.expiryDate);
    if(d<=14) expiring++;
  }));
  const lowStock = shopGoods.filter(g=>{ const s=totalStock(g); return s>0 && s<=(g.reorderLevel||5); }).length;
  const openCredit = state.sales.filter(s=>s.shopId===state.currentShopId && s.status!=='paid' && s.status!=='voided' && s.dueDate);
  const overdue = openCredit.filter(s=>daysBetween(todayISO(), s.dueDate) < 0).length;
  const dueSoon = openCredit.filter(s=>{ const d=daysBetween(todayISO(), s.dueDate); return d>=0 && d<=2; }).length;
  return {expiring, dueSoon, overdue, lowStock};
}

/**
 * Keeps the owner's real Supabase Auth password in sync whenever they
 * change it locally from Settings. Only applies to the master/owner
 * account — staff PINs are purely local and were never part of Supabase
 * Auth to begin with.
 * Best-effort: if offline, or there's no live Supabase session at this
 * exact moment, this silently does nothing — the local password
 * still works fine, it just won't match what Supabase Auth has on file
 * until the owner next logs in online with the new password... but since
 * app.html's own login only ever checks the LOCAL hash (never Supabase's),
 * that mismatch is invisible day-to-day. It only matters for the admin
 * dashboard / super admin login, which uses Supabase Auth directly.
 */
async function syncPasswordToSupabaseAuth(newPassword){
  if(!window.sb) return;
  try{
    const { data } = await window.sb.auth.getSession();
    if(!data.session) return; // no live session right now — nothing to sync against
    await window.sb.auth.updateUser({ password: newPassword });
  }catch(e){ /* offline or Supabase error — local password change still stands */ }
}

/**
 * Queues a newly-created sale, plus its line items, for sync.
 */
function syncSaleInsert(sale){
  enqueueSync('sales','insert', {
    id: sale.id, shop_id: sale.shopId, customer_id: sale.customerId || null,
    walk_in_name: sale.walkInName, walk_in_phone: sale.walkInPhone, note: sale.note,
    items_subtotal: sale.itemsSubtotal, discount: sale.discount, tax_amount: sale.taxAmount,
    tax_pct: sale.taxPct, subtotal: sale.subtotal, paid_amount: sale.paidAmount,
    balance: sale.balance, due_date: sale.dueDate || null, status: sale.status,
    sold_by_user_id: sale.soldByUserId, receipt_sent: sale.receiptSent, date: sale.date
  });
  sale.items.forEach(item=>{
    // The id is generated here and ALSO written back onto the local item
    // (not just the push payload) — without that, nothing later (like
    // processing a return) has any way to reference this specific
    // sale_items row again, since the server-side id was never known
    // locally to begin with.
    item.saleItemId = uid('saleitem');
    enqueueSync('sale_items','insert', {
      id: item.saleItemId, sale_id: sale.id, good_id: item.goodId, batch_id: item.batchId || null,
      variant_id: item.variantId || null, variant_label: item.variantLabel, qty: item.qty,
      price_used: item.priceUsed, note: item.note
    });
  });
}
