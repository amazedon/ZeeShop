<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Zed — Your Shop, In Your Pocket</title>
<style>
:root{
  --ink:#12213B;
  --ink-2:#1B2F52;
  --teal:#0F3D3E;
  --marigold:#F2A93B;
  --marigold-dark:#D98E1E;
  --paper:#FBFAF7;
  --paper-dim:#F1EEE6;
  --line:#E4E0D6;
  --text:#242B38;
  --text-dim:#6B7280;
  --green:#2E7D32;
  --green-bg:#E7F3E8;
  --red:#C0392B;
  --red-bg:#FBEAE8;
  --amber-bg:#FDF1DC;
  --radius:14px;
  --shadow:0 2px 10px rgba(18,33,59,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper);
  color:var(--text);
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.01em;color:var(--ink);}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--marigold);color:var(--ink);}

/* ---------- layout shells ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none !important;}
.center-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:
    radial-gradient(circle at 15% 15%, rgba(242,169,59,0.16), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(15,61,62,0.14), transparent 45%),
    var(--ink);
}
.auth-card{
  width:100%;max-width:400px;background:var(--paper);border-radius:20px;
  padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.35);
  position:relative;overflow:hidden;
}
.auth-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--marigold),var(--teal));
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;background:var(--ink) url('/icon-192.png') center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:transparent;
  font-weight:900;font-size:18px;flex-shrink:0;
}
.brand-name{font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-0.02em;}
.tagline{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;background:#fff;color:var(--text);outline:none;transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--marigold-dark);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:10px;border:none;font-weight:800;font-size:14.5px;
  transition:transform .08s, box-shadow .15s; letter-spacing:.01em;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--marigold);color:var(--ink);width:100%;box-shadow:0 6px 16px rgba(242,169,59,0.35);}
.btn-primary:hover{background:var(--marigold-dark);}
.btn-dark{background:var(--ink);color:#fff;width:100%;}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text);}
.btn-ghost{background:transparent;color:var(--ink);text-decoration:underline;padding:6px;font-weight:700;}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.link-row{text-align:center;margin-top:16px;font-size:13.5px;color:var(--text-dim);}
.err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;font-weight:600;}

/* ---------- user select / pin ---------- */
.userselect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0;}
.user-tile{
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
}
.user-tile:active{transform:scale(0.96);}
.avatar{
  width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
}
.avatar.oga{background:var(--marigold);color:var(--ink);}
.user-tile .uname{font-size:12.5px;font-weight:700;color:var(--ink);}
.user-tile .urole{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.pinpad button{
  padding:16px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:20px;font-weight:800;color:var(--ink);
}
.pinpad button:active{background:var(--paper-dim);}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);}
.pin-dot.filled{background:var(--ink);}

/* ---------- main shell ---------- */
.topbar{
  background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;
  gap:10px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow);
}
.topbar .brand-mark{width:32px;height:32px;font-size:15px;}
.shop-switch{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;
  border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;flex:1;
}
.topbar .icon-btn{
  background:rgba(255,255,255,0.1);border:none;color:#fff;width:36px;height:36px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.badge-dot{position:relative;}
.badge-dot::after{
  content:attr(data-count);position:absolute;top:-4px;right:-4px;background:var(--red);
  color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.badge-dot[data-count="0"]::after{display:none;}

main{flex:1;padding:14px 14px 90px;max-width:640px;margin:0 auto;width:100%;}
.screen-title{font-size:20px;margin-bottom:14px;}
.subtle{color:var(--text-dim);font-size:13px;}

.bottomnav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px 8px;z-index:30;
  box-shadow:0 -2px 12px rgba(0,0,0,0.06);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;
  color:var(--text-dim);font-size:10px;font-weight:700;padding:6px 8px;border-radius:10px;flex:1;
}
.nav-item .ic{font-size:19px;display:flex;align-items:center;justify-content:center;}
.nav-item.active{color:var(--marigold-dark);}

/* ---------- cards / receipt motif ---------- */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.receipt-card{
  background:#fff;border:1px solid var(--line);border-radius:12px 12px 0 0;
  padding:18px;position:relative;margin-bottom:22px;
}
.receipt-card::after{
  content:"";position:absolute;left:0;right:0;bottom:-11px;height:11px;
  background:
    linear-gradient(-45deg, transparent 60%, #fff 60%) 0 0/12px 12px repeat-x,
    linear-gradient(45deg, transparent 60%, #fff 60%) 0 0/12px 12px repeat-x;
}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:700;}
.stat-box .val{font-size:22px;font-weight:900;color:var(--ink);margin-top:4px;}
.stat-box.accent{background:var(--ink);}
.stat-box.accent .lbl{color:rgba(255,255,255,0.6);}
.stat-box.accent .val{color:var(--marigold);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
.section-head h3{font-size:15px;}
.pill{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.02em;}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-red{background:var(--red-bg);color:var(--red);}
.pill-amber{background:var(--amber-bg);color:var(--marigold-dark);}
.pill-gray{background:var(--paper-dim);color:var(--text-dim);}

.list-row{
  display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none;}
.list-row .thumb{
  width:42px;height:42px;border-radius:10px;background:var(--paper-dim);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-dim);
}
.list-row .info{flex:1;min-width:0;}
.list-row .info .t1{font-weight:700;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row .info .t2{font-size:12px;color:var(--text-dim);}
.list-row .right{text-align:right;flex-shrink:0;}

.fab{
  position:fixed;bottom:82px;right:18px;width:58px;height:58px;border-radius:50%;
  background:var(--marigold);color:var(--ink);border:none;font-size:26px;font-weight:900;
  box-shadow:0 8px 22px rgba(242,169,59,0.45);z-index:29;display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(0.94);}

.empty{
  text-align:center;padding:36px 18px;color:var(--text-dim);
}
.empty .ic{font-size:34px;margin-bottom:8px;}
.empty b{color:var(--ink);display:block;margin-bottom:3px;font-size:14.5px;}

/* modal / sheet */
.overlay{
  position:fixed;inset:0;background:rgba(18,20,25,0.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.overlay.center{align-items:center;padding:20px;}
.sheet{
  background:var(--paper);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;padding:20px 18px 26px;animation:slideup .18s ease-out;
}
.overlay.center .sheet{border-radius:18px;max-height:85vh;}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-head h3{font-size:17px;}
.close-x{background:var(--paper-dim);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--text-dim);}

/* new sale */
.goods-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.good-tile{
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.good-tile .gic{width:40px;height:40px;border-radius:9px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:17px;}
.good-tile .gname{font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.2;}
.good-tile .gprice{font-size:11px;color:var(--text-dim);font-weight:700;}
.good-tile.instock0{opacity:0.4;}
.cart-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;z-index:35;
}
.cart-bar .total{font-weight:900;font-size:16px;color:var(--marigold);}
.qty-stepper{display:flex;align-items:center;gap:10px;}
.qty-stepper button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:16px;}

.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:99;box-shadow:var(--shadow);
  animation:toastin .2s ease-out;max-width:90%;text-align:center;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translate(-50%,0);}}

.expiry-flag{width:4px;border-radius:3px;flex-shrink:0;align-self:stretch;}
.locked-msg{background:var(--red-bg);color:var(--red);padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin-top:8px;}

.contact-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.contact-btns a,.contact-btns button{
  flex:1;min-width:70px;text-align:center;padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);
  font-size:12px;font-weight:800;color:var(--ink);text-decoration:none;background:#fff;
}

/* market mode (battery saver) */
body.market-mode{background:#000;}
body.market-mode *{animation:none !important;transition:none !important;box-shadow:none !important;}
body.market-mode main{color:#eee;}
body.market-mode .card,body.market-mode .stat-box,body.market-mode .list-row,body.market-mode .good-tile,
body.market-mode .receipt-card,body.market-mode .sheet{background:#0a0a0a;border-color:#2a2a2a;color:#eee;}
body.market-mode .topbar,body.market-mode .bottomnav{background:#000;}
body.market-mode h1,body.market-mode h2,body.market-mode h3,body.market-mode h4{color:#fff;}
body.market-mode .stat-box .val{color:var(--marigold);}
body.market-mode .subtle,body.market-mode .t2,body.market-mode .lbl{color:#999;}

.switch{position:relative;width:44px;height:25px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider-tog{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:25px;transition:.2s;}
.slider-tog::before{content:"";position:absolute;height:19px;width:19px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider-tog{background:var(--marigold);}
input:checked + .slider-tog::before{transform:translateX(19px);}
.settings-row{display:flex;align-items:center;justify-content:between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);}
.settings-row .info{flex:1;}
.settings-row .info .t1{font-weight:700;font-size:14px;}
.settings-row .info .t2{font-size:12px;color:var(--text-dim);}

.divider{height:1px;background:var(--line);margin:14px 0;}
.code-display{
  background:var(--ink);color:var(--marigold);font-size:32px;font-weight:900;letter-spacing:.15em;
  text-align:center;padding:20px;border-radius:12px;margin:14px 0;
}
.progress-bar{height:6px;background:var(--paper-dim);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-bar .fill{height:100%;background:var(--marigold);border-radius:4px;}

@media(min-width:560px){.userselect-grid{grid-template-columns:repeat(4,1fr);}}
</style>

  if(map[bt]) return map[bt];

// Normalizes any phone input into international digits with no leading + or 0,
// using the business's country calling code as a fallback for local-format numbers.
// This is required for wa.me links (WhatsApp rejects local-format numbers) and keeps
// tel:/sms: links consistent too.
function toIntlDigits(phone, countryName){
  if(!phone) return '';
  let p = String(phone).trim();
  const hadPlus = p.startsWith('+');
  p = p.replace(/[^\d]/g,'');
  if(hadPlus) return p; // already had a + so digits already include country code
  const cc = COUNTRY_CALLING_CODES[countryName || business()?.country] || '';
  if(cc && p.startsWith(cc)) return p; // already includes country code
  if(cc && p.startsWith('0')) return cc + p.slice(1); // local format like 0802...
  if(cc && p.length <= 10) return cc + p; // bare local number, no leading 0
  return p; // unknown shape — pass through rather than mangle it further
}
function toTelHref(phone, countryName){ const d = toIntlDigits(phone, countryName); return d ? '+'+d : ''; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// One-time migration: fix any phone numbers already saved in local-format so old
// customers (added before this fix) work with WhatsApp/Call/SMS too.
function migratePhoneNumbers(){
  let changed = false;
  (state.customers||[]).forEach(c=>{
    if(c.phoneE164 && !c.phoneE164.startsWith('+')){ c.phoneE164 = '+'+toIntlDigits(c.phoneE164); changed = true; }
    if(c.whatsappNumber && !c.whatsappNumber.startsWith('+')){ c.whatsappNumber = '+'+toIntlDigits(c.whatsappNumber); changed = true; }
  });
  if(changed) save();
}

function fmtDate(d){return new Date(d+"T00:00:00").toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtMoney(n){

function isMaster(){ const u=currentUser(); return u && u.role==='master'; }
function isStaff(){ const u=currentUser(); return u && u.role==='staff'; }
function isViewer(){ const u=currentUser(); return u && u.role==='viewer'; }
// Super Admin: a staff member the Owner has promoted to manage other staff's roles/
// permissions. Only the Owner can grant or revoke this status, and a Super Admin can
// never manage the Owner's account or another Super Admin's status — only Master can.
function isSuperAdmin(){ const u=currentUser(); return u && u.role==='staff' && !!u.isSuperAdmin; }
// Whether the current user is allowed into Staff management at all.
function canManageStaff(){ return isMaster() || isSuperAdmin(); }
// Whether the current user (Master or a Super Admin) is allowed to manage a specific
// other user's permissions/status. A Super Admin can manage regular staff/viewers, but
// never the Owner's own account, and never another Super Admin's account.
function canManageThisUser(targetUser){
  if(isMaster()) return targetUser.role!=='master';
  if(isSuperAdmin()) return targetUser.role!=='master' && !targetUser.isSuperAdmin;
  return false;
}
// Granular staff permissions, revocable by the Owner. canSell/canSellCredit/canRecordCash
// default to allowed (true) unless explicitly turned off, so existing staff accounts
// aren't suddenly locked out by this feature. canAddGoods stays opt-in (default false),
// matching its original behavior.
function canDo(perm){
  const u = currentUser();
  if(!u) return false;
  if(u.role==='master') return true;
  if(u.role==='viewer') return false;
  if(perm==='canAddGoods' || perm==='canVoidReturn') return !!u[perm];
  return u[perm] !== false;
}

const GOOGLE_CLIENT_ID = '972386732120-jeflemnhcm58cgr49mpk4vekp647p2k4.apps.googleusercontent.com';

function decodeGoogleJwt(token){
  // Reads the payload of the JWT Google returns — no server verification,
  // fine for pre-filling signup/login by email in this local-only app.
  const payload = token.split('.')[1];
  const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/'))
    .split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}
function handleGoogleCredentialResponse(response){
  let profile;
  try{ profile = decodeGoogleJwt(response.credential); }
  catch(e){ toast("Couldn't read Google's response. Please try again."); return; }
  const email = profile.email;
  const firstName = profile.given_name || profile.name || 'there';
  const lastName = profile.family_name || '';
  // Look for an existing account with this email, across all businesses on this device.
  const existingUser = state.users.find(u=>u.email && u.email.toLowerCase()===email.toLowerCase());
  if(existingUser){
    const biz = state.business && state.business.id===existingUser.businessId ? state.business : null;
    if(!biz){ toast("This Google account is linked to a different business than what's set up on this device."); return; }
    state.sessionUserId = existingUser.id;
    logAudit('google_login', 'Logged in with Google: '+email);
    toast('Welcome back, '+firstName+' 👋');
    render();
  } else {
    // No account yet — jump to signup with the fields pre-filled.
    authMode = 'signup';
    render();
    setTimeout(()=>{
      const emailEl = document.getElementById('su-email');
      const fnEl = document.getElementById('su-fn');
      const lnEl = document.getElementById('su-ln');
      if(emailEl) emailEl.value = email;
      if(fnEl) fnEl.value = firstName;
      if(lnEl) lnEl.value = lastName;
      toast("We've filled in your details from Google — just add your business info to finish.");
    }, 50);
  }
}

function bindForgotPasswordEvents(){
  const go = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click', fn); };

  go('btn-forgot-next', ()=>{

    const u = state.users.find(x=> (x.username.toLowerCase()===idf || (x.email||'').toLowerCase()===idf) && x.role==='master');
    if(!u){ forgotError='No owner account found with that username or email.'; render(); return; }
    if(!u.recoveryCodeHash){ forgotError='This account has no recovery code on file. Password recovery is not available for it.'; render(); return; }
    forgotUserId = u.id; forgotStep = 2; forgotError=''; render();
  });
  go('btn-forgot-verify', ()=>{
    const u = state.users.find(x=>x.id===forgotUserId);
    const code = document.getElementById('fp-code').value.trim().toUpperCase();
    if(hash(code) !== u.recoveryCodeHash){ forgotError='That recovery code is incorrect.'; render(); return; }
    forgotStep = 3; forgotError=''; render();

  go('btn-forgot-save', ()=>{
    const p1 = document.getElementById('fp-newpass').value;
    const p2 = document.getElementById('fp-newpass2').value;
    if(p1.length<6){ forgotError='Password must be at least 6 characters.'; render(); return; }
    if(p1!==p2){ forgotError="Passwords don't match."; render(); return; }
    const u = state.users.find(x=>x.id===forgotUserId);
    u.passwordHash = hash(p1);
    logAudit('password_reset', 'Password reset via recovery code');
    authMode='login'; forgotStep=1; forgotUserId=null; forgotError='';
    toast('Password reset ✅ — log in with your new password.');
    render();
  });
}

    // purely a background refresh of the Supabase Auth session, so the sync
    // engine has a valid token to push queued changes with. If there's no
    // internet right now, this silently fails and nothing about the login
    // the owner just experienced changes.
    if(u.email){
      window.sb.auth.signInWithPassword({ email: u.email, password: pass })
        .then(({ error })=>{ if(!error) flushSyncQueue(); })
        .catch(()=>{});

  });

/* ---- signup email verification, via Termii (Edge Functions do the actual send/verify) ---- */
async function sendSignupOtp(email){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/send-signup-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email })
  });
  const data = await res.json();
  if(!res.ok || data.error) throw new Error(data.error || 'Could not send the verification code.');
  return data;
}
async function verifySignupOtp(email, code){
  const res = await fetch(`${SITE_CONTENT_URL}/functions/v1/verify-signup-otp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SITE_CONTENT_ANON_KEY, 'Authorization': 'Bearer '+SITE_CONTENT_ANON_KEY },
    body: JSON.stringify({ email, code })
  });
  const data = await res.json();
  if(!res.ok && !data) throw new Error('Could not verify the code right now.');
  return data; // { verified: true } or { verified: false, error }
}
function bindSignupVerifyEvents(){
  const go = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click', fn); };
  go('back-to-signup', e=>{ e.preventDefault(); authMode='signup'; signupOtpError=''; render(); });
  go('resend-otp', async e=>{
    e.preventDefault();
    if(!pendingSignupData) return;
    try{ await sendSignupOtp(pendingSignupData.email); toast('New code sent ✅'); }
    catch(err){ signupOtpError = err.message; render(); }
  });
  go('btn-verify-otp', async ()=>{
    const code = document.getElementById('su-otp-code').value.trim();
    if(!code){ signupOtpError = 'Enter the 6-digit code.'; render(); return; }
    const btn = document.getElementById('btn-verify-otp');
    if(btn){ btn.disabled = true; btn.textContent = 'Verifying…'; }
    try{
      const result = await verifySignupOtp(pendingSignupData.email, code);
      if(!result.verified){ signupOtpError = result.error || 'Incorrect code.'; render(); return; }
      await completeSignupAccount(pendingSignupData);
    }catch(err){
      signupOtpError = err.message || "Couldn't verify right now. Check your internet connection.";
      render();
    }
  });
}
async function completeSignupAccount(data){
  const { biz, country, ccy, fn, ln, username, phone, email, pass } = data;
  const bizId = uid('biz');
  const userId = uid('user');
  const shopId = uid('shop');
  const recoveryCode = genRecoveryCode();
  state.business = { id:bizId, name:biz, businessType:'', registrationNumber:'', country, currency:ccy, timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    language:'en', taxName:'VAT', taxPercent:0, subscriptionPlan:'free', createdAt:new Date().toISOString() };
  state.users.push({ id:userId, businessId:bizId, username, email, emailVerified:true, phone, firstName:fn, lastName:ln,
    passwordHash: hash(pass), recoveryCodeHash: hash(recoveryCode),
    role:'master', isActive:true, canAddGoods:true });
  state.shops.push({ id:shopId, businessId:bizId, name: biz+" — Main Shop", address:'', phone, email,
    receiptFooter:'Thank you for your business!', receiptTerms:'Goods sold in good condition. No refund after payment.', auctionDiscountDefault:30 });
  state.customerGroups.push({id:uid('grp'),businessId:bizId,name:'Retail'},{id:uid('grp'),businessId:bizId,name:'Wholesale'},{id:uid('grp'),businessId:bizId,name:'VIP'});
  state.currentShopId = shopId;
  state.sessionUserId = userId;
  logAudit('signup','Business created: '+biz);
  pendingSignupData = null;

  // Create the matching Supabase Auth account for the owner (needs internet —
  // signup already required internet for the OTP step, so this is no new
  // requirement). If this fails, the local account still works fully offline;
  // it just won't sync to Supabase until the owner logs in with internet later
  // (see loginOwnerToSupabase, called from the normal login flow).
  try{
    const { data: authData, error: authErr } = await window.sb.auth.signUp({ email, password: pass });
    if(!authErr && authData.user){
      const ownerAuthId = authData.user.id;
      enqueueSync('businesses','insert', {
        id: bizId, name: biz, business_type:'', registration_number:'',
        country, currency:ccy, timezone: state.business.timezone, language:'en',
        tax_name:'VAT', tax_percent:0, subscription_plan:'free',
        owner_auth_user_id: ownerAuthId
      });
      enqueueSync('shops','insert', {
        id: shopId, business_id: bizId, name: biz+" — Main Shop", address:'', phone, email
      });
      enqueueSync('app_users','insert', {
        id: userId, business_id: bizId, username, email, phone,
        first_name: fn, last_name: ln, role:'master', is_active:true, can_add_goods:true
      });
    }
  }catch(e){ /* offline or Supabase error — local account still works; queue nothing yet */ }

  render();
  showRecoveryCodeSheet(recoveryCode);
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31 + s.charCodeAt(i))|0;} return 'h'+h; }
// Generates a readable one-time recovery code like "K4P9-X2QW-7RTN".
// The plaintext is only ever shown once, right after it's generated — only
// its hash is stored, same as a password.
function genRecoveryCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid confusion
  const group = ()=>Array.from({length:4}).map(()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  return `${group()}-${group()}-${group()}`;
}

/* ============================================================
   BUSINESS LOGO — uploaded once, shrunk down before storing so
   it doesn't bloat localStorage, then drawn onto every receipt.
   ============================================================ */
// Reads an uploaded image file, shrinks it to a small square-ish max size,
// and returns a compact PNG data URL (keeps transparency for real logos).
function resizeLogoFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Not a valid image'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
// Caches the loaded logo Image object per data URL, so repeated receipt/letter
// draws don't reload it every time. Returns null if the business has no logo.
let __logoImgCache = { dataUrl:null, img:null };
function getLogoImage(){
  const dataUrl = business() && business().logoDataUrl;
  if(!dataUrl) return Promise.resolve(null);
  if(__logoImgCache.dataUrl === dataUrl && __logoImgCache.img) return Promise.resolve(__logoImgCache.img);
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ __logoImgCache = { dataUrl, img }; resolve(img); };
    img.onerror = ()=> resolve(null);
    img.src = dataUrl;
  });
}

  updatePinDots(u);
  document.querySelectorAll('#pinpad-grid button[data-k]').forEach(b=>{

      if(k==='del'){ pinBuffer = pinBuffer.slice(0,-1); }
      else if(k!=='' && pinBuffer.length < (u.pinLength||4)){ pinBuffer += k; }

function updatePinDots(u){
  const dots = document.getElementById('pin-dots');
  if(!dots) return;
  const len = u.pinLength||4;
  dots.innerHTML = Array.from({length:len}).map((_,i)=>`<div class="pin-dot ${i<pinBuffer.length?'filled':''}"></div>`).join('');
}
function submitPin(u){
  if(hash(pinBuffer) === u.pinHash){
    state.pinAttempts[u.id] = {count:0, lockedUntil:0};
    state.sessionUserId = u.id;
    if(!state.currentShopId && state.shops[0]) state.currentShopId = state.shops[0].id;
    logAudit('login', u.firstName+' logged in via PIN');
    pendingPinUser=null;
    toast(`Welcome, ${u.firstName}!`);
    render();
  } else {
    const att = state.pinAttempts[u.id] || {count:0, lockedUntil:0};
    att.count = (att.count||0)+1;
    if(att.count>=5){ att.lockedUntil = Date.now()+15*60000; att.count=0; toast('Wrong PIN 5 times. Locked 15 min.'); }
    else toast(`Wrong PIN (${5-att.count} tries left)`);
    state.pinAttempts[u.id]=att; save();
    pinBuffer='';
    updatePinDots(u);
  }
}

function alertCounts(){
  const shopGoods = state.goods.filter(g=>g.shopId===state.currentShopId);
  let expiring=0;
  shopGoods.forEach(g=> g.batches.forEach(b=>{
    if(b.qtyRemaining<=0) return;
    const d = daysBetween(todayISO(), b.expiryDate);
    if(d<=14) expiring++;
  }));
  const lowStock = shopGoods.filter(g=>{ const s=totalStock(g); return s>0 && s<=(g.reorderLevel||5); }).length;
  const dueSoon = state.sales.filter(s=>s.shopId===state.currentShopId && s.status!=='paid' && s.status!=='voided' && s.dueDate &&
    daysBetween(todayISO(), s.dueDate) <= 2).length;
  return {expiring, dueSoon, lowStock};
}

  const visibleShops = isSuperAdmin() ? state.shops.filter(s=>(u.managesShopIds||[]).includes(s.id)) : state.shops;

  return `
    <div class="topbar">
      <div class="brand-mark">Z</div>
      <select class="shop-switch" id="shop-switcher">
        ${visibleShops.length? visibleShops.map(s=>`<option value="${s.id}" ${s.id===state.currentShopId?'selected':''}>${s.name}</option>`).join('')
          : `<option value="">No shops assigned yet</option>`}
      </select>
      ${isMaster() ? `<button class="icon-btn" id="add-shop-btn" title="Add shop">＋</button>`:''}
      <button class="icon-btn badge-dot" data-count="${alerts.expiring+alerts.dueSoon+alerts.lowStock}" id="alerts-btn">🔔</button>
    </div>
    <main id="main-content">${renderRoute()}</main>
    <div class="bottomnav">
      ${navItems.map(n=>`
        <button class="nav-item ${route===n.id?'active':''}" data-route="${n.id}">
          <div class="ic">${n.ic}</div><div>${n.label}</div>
        </button>`).join('')}
    </div>
    ${route==='goods' && (isMaster()|| (isStaff() && u.canAddGoods)) ? `<button class="fab" id="fab-add-good">＋</button>` : ''}
    ${route==='customers' ? `<button class="fab" id="fab-add-customer">＋</button>` : ''}
  `;
}

function renderRoute(){
  switch(route){
    case 'dashboard': return screenDashboard();
    case 'sale': return screenNewSale();
    case 'goods': return screenGoods();
    case 'customers': return screenCustomers();
    case 'more': return screenMore();
    case 'credit': return screenCredit();
    case 'closeday': return screenCloseDay();
    case 'reports': return screenReports();
    case 'staff': return screenStaff();
    case 'settings': return screenSettings();
    case 'audit': return screenAudit();
    case 'notes': return screenNotes();
    case 'history': return screenHistory();
    case 'expenses': return screenExpenses();
    case 'suppliers': return screenSuppliers();
    case 'lodging': return screenLodging();
    case 'faq': return screenFAQ();
    case 'about-us': return screenAboutUs();
    case 'contact-us': return screenContactUs();
    case 'profile': return screenProfile();
    default: return screenDashboard();
  }
}

function bindShellEvents(){
  const ss = document.getElementById('shop-switcher');
  if(ss) ss.addEventListener('change', ()=>{ state.currentShopId = ss.value; cart=[]; render(); });
  const addShop = document.getElementById('add-shop-btn');
  if(addShop) addShop.addEventListener('click', handleAddShop);
  const alertsBtn = document.getElementById('alerts-btn');
  if(alertsBtn) alertsBtn.addEventListener('click', ()=>{ route='goods'; render(); toast('Showing stock needing attention'); });

  document.querySelectorAll('.nav-item[data-route]').forEach(b=>{
    b.addEventListener('click', ()=>{ route=b.dataset.route; cart = route==='sale'?cart:cart; render(); });
  });
  const fabG = document.getElementById('fab-add-good'); if(fabG) fabG.addEventListener('click', openAddGoodModal);
  const fabC = document.getElementById('fab-add-customer'); if(fabC) fabC.addEventListener('click', openAddCustomerModal);

  bindRouteEvents();
}

function handleAddShop(){
  const plan = business().subscriptionPlan;
  const limit = plan==='free'?1: (plan==='pro'?3:9999);
  if(state.shops.length >= limit){
    toast(`Free plan allows ${limit} shop. Upgrade to Pro for more shops.`);
    return;
  }
  const name = prompt('New shop name:');
  if(!name) return;
  const s = {id:uid('shop'), businessId:business().id, name, address:'', phone:'', email:'', receiptFooter:'Thank you for your business!', receiptTerms:'Goods sold in good condition. No refund after payment.', auctionDiscountDefault:30};
  state.shops.push(s);
  state.currentShopId = s.id;
  logAudit('shop_added', 'Added shop: '+name);
  render();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function screenDashboard(){
  const u = currentUser();
  const shopSales = state.sales.filter(s=>s.shopId===state.currentShopId && s.date===todayISO() && s.status!=='voided');
  const todayTotal = shopSales.reduce((a,s)=>a+s.subtotal,0);
  const todayCash = shopSales.filter(s=>s.status!=='credit').reduce((a,s)=>a+s.paidAmount,0);
  const alerts = alertCounts();
  const goods = state.goods.filter(g=>g.shopId===state.currentShopId);
  const lowStock = goods.filter(g=>totalStock(g)<=5 && totalStock(g)>0);
  const outStock = goods.filter(g=>totalStock(g)<=0);

  let profitBlock = '';
  if(isMaster()){
    const cogs = shopSales.reduce((a,s)=> a + s.items.reduce((b,it)=>{
      const g = state.goods.find(x=>x.id===it.goodId);
      return b + (g?g.costPrice:0)*netQty(it);
    },0), 0);
    profitBlock = `
      <div class="stat-box accent">
        <div class="lbl">Today's Profit</div>
        <div class="val">${fmtMoney(todayTotal-cogs)}</div>
      </div>`;
  }

  return `
    <h2 class="screen-title">${greeting()}, ${u.firstName} 👋</h2>
    <p class="subtle" style="margin-bottom:14px;">${currentShop()?.name} · ${fmtDate(todayISO())}</p>

    <div class="stat-grid">
      <div class="stat-box"><div class="lbl">Sales Today</div><div class="val">${fmtMoney(todayTotal)}</div></div>
      ${profitBlock || `<div class="stat-box"><div class="lbl">Cash In</div><div class="val">${fmtMoney(todayCash)}</div></div>`}
    </div>

    ${(alerts.expiring>0 || alerts.dueSoon>0 || alerts.lowStock>0 || outStock.length>0) ? `
      <div class="section-head"><h3>Needs Attention</h3></div>
      ${alerts.expiring>0?`<div class="card" style="display:flex;align-items:center;gap:10px;" data-goto="goods">
        <div style="font-size:20px;">⏰</div><div style="flex:1;"><b>${alerts.expiring} item(s)</b> expiring within 14 days</div>
      </div>`:''}
      ${alerts.lowStock>0?`<div class="card" style="display:flex;align-items:center;gap:10px;" data-goto="goods">
        <div style="font-size:20px;">📉</div><div style="flex:1;"><b>${alerts.lowStock} item(s)</b> running low — worth restocking soon</div>
      </div>`:''}
      ${outStock.length>0?`<div class="card" style="display:flex;align-items:center;gap:10px;" data-goto="goods">
        <div style="font-size:20px;">📭</div><div style="flex:1;"><b>${outStock.length} item(s)</b> out of stock</div>
      </div>`:''}
      ${alerts.dueSoon>0 && isMaster()?`<div class="card" style="display:flex;align-items:center;gap:10px;" data-goto="credit">
        <div style="font-size:20px;">💳</div><div style="flex:1;"><b>${alerts.dueSoon} customer(s)</b> owe you, due within 2 days</div>
      </div>`:''}
    ` : `<div class="empty"><div class="ic">✅</div><b>All clear</b>No urgent alerts right now.</div>`}

    <div class="section-head"><h3>Quick Actions</h3></div>
    <div style="display:flex;gap:10px;">
      ${!isViewer() && canDo('canSell')?`<button class="btn btn-dark" style="flex:1;" data-goto="sale">🧾 New Sale</button>`:''}
      ${isMaster()?`<button class="btn btn-outline" style="flex:1;" data-goto="closeday">🔒 Close Day</button>`:''}
      ${isStaff() && canDo('canRecordCash')?`<button class="btn btn-outline" style="flex:1;" data-goto="closeday">🔒 Close My Shift</button>`:''}
    </div>
  `;
}
function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function subHeader(title){
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
    <button data-goto="more" style="background:var(--paper-dim);border:none;width:34px;height:34px;border-radius:10px;font-size:17px;color:var(--ink);flex-shrink:0;">←</button>
    <h2 class="screen-title" style="margin:0;">${title}</h2>
  </div>`;
}
function totalStock(g){
  if(g.hasVariants) return (g.variants||[]).reduce((a,v)=>a+Math.max(0,v.qty),0);
  return g.batches.reduce((a,b)=>a+Math.max(0,b.qtyRemaining),0);
}
function netQty(it){ return Math.max(0, it.qty - (it.returnedQty||0)); }

let saleWalkInName = '';

      <div id="credit-fields" class="${saleMode==='credit' && canDo('canSellCredit')?'':'hidden'}" style="margin-top:10px;">
        <div class="row2">
          <div class="field"><label>Amount Paid Now</label><input id="ns-paid" type="number" min="0" value="0"></div>
          <div class="field"><label>Due Date</label><input id="ns-due" type="date" value="${defaultDueDate()}"></div>
        </div>

    </div>

    ${cart.length? `
    <div class="section-head"><h3>Items in This Sale — set quantity here</h3></div>
    ${cart.map(c=>{

      const batch = fifoBatch(g);

      const stockForLine = c.variantId ? variantStock(g, c.variantId) : totalStock(g);

      <div class="list-row">
        <div class="thumb">${g.emoji||'🛍️'}</div>
        <div class="info">

          <button data-item-note="${key}" style="background:none;border:none;text-align:left;padding:2px 0;font-size:11px;font-weight:700;${c.note?'color:var(--marigold-dark);':'color:var(--text-dim);text-decoration:underline;'}">

        return `
        <button class="good-tile ${stock<=0?'instock0':''}" data-add-good="${g.id}" ${stock<=0?'disabled':''}>

    <div class="cart-bar">

        <div class="total">${fmtMoney(bd.grand)}</div>
      </div>
      <button class="btn btn-primary" id="confirm-sale" style="width:auto;padding:12px 22px;">Complete Sale →</button>
    </div>` : ''}

}
function lineKey(goodId, variantId){ return variantId ? goodId+'::'+variantId : goodId; }
function variantStock(g, variantId){ const v=(g.variants||[]).find(x=>x.id===variantId); return v ? Math.max(0,v.qty) : 0; }
function openVariantPickerModal(goodId){
  const g = state.goods.find(x=>x.id===goodId);
  openSheet(`
    <div class="sheet-head"><h3>${g.name} — Pick One</h3><button class="close-x" id="sheet-close">✕</button></div>
    ${(g.variants||[]).map(v=>{
      const stock = Math.max(0,v.qty);
      const inCartLine = cart.find(c=>c.goodId===g.id && c.variantId===v.id);
      return `<button class="list-row" data-pick-variant="${v.id}" style="width:100%;text-align:left;border:none;background:none;padding:12px 0;" ${stock<=0?'disabled':''}>
        <div class="thumb" style="${stock<=0?'opacity:0.4;':''}">${g.emoji||'🛍️'}</div>
        <div class="info"><div class="t1" style="${stock<=0?'color:var(--text-dim);':''}">${escapeHtml(v.label)}${inCartLine?` (${inCartLine.qty} in cart)`:''}</div>
        <div class="t2">${stock<=0?'Out of stock':stock+' in stock'}</div></div>
      </button>`;
    }).join('') || '<p class="subtle">No sizes/colors set up for this item yet.</p>'}
  `);
  document.querySelectorAll('[data-pick-variant]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const variantId = b.dataset.pickVariant;
      const stock = variantStock(g, variantId);
      const existing = cart.find(c=>c.goodId===g.id && c.variantId===variantId);
      if(existing){
        if(existing.qty+1 > stock){ toast('Not enough stock.'); return; }
        existing.qty++;
      } else {
        cart.push({goodId:g.id, variantId, qty:1, note:''});
      }
      closeSheet(); refreshMain();
    });
  });
}
function activePrice(g){
  if(saleCustomerId){
    const c = state.customers.find(x=>x.id===saleCustomerId);
    if(c && c.groupId){
      const gp = (g.groupPrices||[]).find(p=>p.groupId===c.groupId);
      if(gp) return gp.price;
    }
  }
  const b = fifoBatch(g);
  return g.basePrice; // base price; auction price applied at cart line level via batch
}
function fifoBatch(g){
  const valid = g.batches.filter(b=>b.qtyRemaining>0 && !isExpired(b)).sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  return valid[0];
}
function isExpired(b){ return daysBetween(todayISO(), b.expiryDate) < 0; }
function cartTotal(){
  return cart.reduce((sum,c)=>{
    const g = state.goods.find(x=>x.id===c.goodId);
    const batch = fifoBatch(g);
    const price = (batch && batch.auctionActive) ? batch.auctionPrice : activePrice(g);
    return sum + price*c.qty;
  },0);
}
function cartBreakdown(){
  const sub = cartTotal();
  const disc = Math.min(Number(saleDiscount||0), sub);
  const taxable = sub - disc;
  const taxPct = business()?.taxPercent || 0;
  const tax = taxPct>0 ? Math.round(taxable*taxPct/100) : 0;
  return { sub, disc, tax, taxPct, grand: taxable + tax };
}

function bindRouteEvents(){
  if(route==='sale'){
    const search = document.getElementById('sale-search');
    if(search) search.addEventListener('input', e=>{ saleSearch=e.target.value; refreshMain(); });
    const custSel = document.getElementById('ns-customer');
    if(custSel) custSel.addEventListener('change', e=>{
      const v = e.target.value;
      if(v===''){ saleCustomerId = null; openWalkInModal(); }
      else { saleCustomerId = v; saleWalkInName=''; saleWalkInPhone=''; refreshMain(); }
    });
    const ewb = document.getElementById('edit-walkin-btn');
    if(ewb) ewb.addEventListener('click', openWalkInModal);
    const noteInput = document.getElementById('ns-note');
    if(noteInput) noteInput.addEventListener('input', e=>{ saleNote = e.target.value; });
    const discInput = document.getElementById('ns-discount');
    if(discInput) discInput.addEventListener('change', e=>{ saleDiscount = Number(e.target.value||0); refreshMain(); });
    const mc = document.getElementById('mode-cash'); if(mc) mc.addEventListener('click', ()=>{ saleMode='cash'; refreshMain(); });
    const md = document.getElementById('mode-credit'); if(md) md.addEventListener('click', ()=>{ saleMode='credit'; refreshMain(); });
    document.querySelectorAll('[data-add-good]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const gid = b.dataset.addGood;
        const g = state.goods.find(x=>x.id===gid);
        if(g.hasVariants){ openVariantPickerModal(gid); return; }
        const stock = totalStock(g);
        const existing = cart.find(c=>c.goodId===gid && !c.variantId);
        if(existing){
          if(existing.qty+1 > stock){ toast('Not enough stock.'); return; }
          existing.qty++;
        } else {
          cart.push({goodId:gid, variantId:null, qty:1, note:''});
        }
        refreshMain();
      });
    });
    const parseKey = k=>{ const [goodId,variantId] = k.split('::'); return {goodId, variantId: variantId||null}; };
    document.querySelectorAll('[data-qty-inc]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const {goodId,variantId} = parseKey(b.dataset.qtyInc);
        const g = state.goods.find(x=>x.id===goodId);
        const line = cart.find(c=>c.goodId===goodId && c.variantId===variantId);
        if(!line) return;
        const stock = variantId ? variantStock(g, variantId) : totalStock(g);
        if(line.qty+1 > stock){ toast('Not enough stock.'); return; }
        line.qty++; refreshMain();
      });
    });
    document.querySelectorAll('[data-qty-dec]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const {goodId,variantId} = parseKey(b.dataset.qtyDec);
        const line = cart.find(c=>c.goodId===goodId && c.variantId===variantId);
        if(!line) return;
        line.qty--;
        if(line.qty<=0) cart = cart.filter(c=>!(c.goodId===goodId && c.variantId===variantId));
        refreshMain();
      });
    });
    document.querySelectorAll('[data-remove-item]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const {goodId,variantId} = parseKey(b.dataset.removeItem);
        cart = cart.filter(c=>!(c.goodId===goodId && c.variantId===variantId));
        refreshMain();
      });
    });
    document.querySelectorAll('[data-item-note]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const {goodId,variantId} = parseKey(b.dataset.itemNote);
        const line = cart.find(c=>c.goodId===goodId && c.variantId===variantId);
        const g = state.goods.find(x=>x.id===goodId);
        if(!line) return;
        const val = prompt(`Detail for ${g.name} (size, color, part no., dimensions, etc.):`, line.note||'');
        if(val!==null){ line.note = val.trim(); refreshMain(); }
      });
    });
    const co = document.getElementById('confirm-sale');
    if(co) co.addEventListener('click', confirmSale);
  }
  if(route==='goods') bindGoodsEvents();
  if(route==='customers') bindCustomersEvents();
  if(route==='more') bindMoreEvents();
  if(route==='credit') bindCreditEvents();

function confirmSale(){
  if(!canDo('canSell')){ toast('You no longer have permission to make sales.'); return; }
  if(cart.length===0){ toast('Add at least one item before completing the sale.'); return; }
  const bd = cartBreakdown();
  const total = bd.grand;
  let paid = total, due=null, status='paid';
  if(saleMode==='credit'){
    if(!canDo('canSellCredit')){ toast('You no longer have permission to sell on credit.'); return; }
    paid = Number(document.getElementById('ns-paid').value||0);
    due = document.getElementById('ns-due').value;
    status = paid>=total ? 'paid' : (paid>0?'partial':'credit');
    if(!saleCustomerId){ toast('Credit sales need a buyer selected above (not walk-in).'); return; }
  }
  const items = cart.map(c=>{
    const g = state.goods.find(x=>x.id===c.goodId);
    const price = activePrice(g);
    let batchId = null;
    let variantLabel = '';
    if(c.variantId){
      const v = (g.variants||[]).find(x=>x.id===c.variantId);
      if(v){ v.qty = Math.max(0, v.qty - c.qty); variantLabel = v.label; }
    } else {
      const batch = fifoBatch(g);
      const auctionPrice = (batch && batch.auctionActive) ? batch.auctionPrice : null;
      batchId = batch ? batch.id : null;
      // deduct FIFO
      let remainingQty = c.qty;
      for(const b of g.batches.sort((a,b2)=>new Date(a.expiryDate)-new Date(b2.expiryDate))){
        if(remainingQty<=0) break;
        if(b.qtyRemaining<=0 || isExpired(b)) continue;
        const take = Math.min(b.qtyRemaining, remainingQty);
        b.qtyRemaining -= take;
        remainingQty -= take;
      }
      if(auctionPrice!=null) return {goodId:g.id, batchId, variantId:null, variantLabel:'', qty:c.qty, priceUsed:auctionPrice, note:c.note||''};
    }
    return {goodId:g.id, batchId, variantId:c.variantId||null, variantLabel, qty:c.qty, priceUsed:price, note:c.note||''};
  });
  const sale = {
    id: uid('sale'), shopId: state.currentShopId, customerId: saleCustomerId,
    walkInName: !saleCustomerId ? saleWalkInName : '', walkInPhone: !saleCustomerId ? saleWalkInPhone : '',
    note: saleNote, itemsSubtotal: bd.sub, discount: bd.disc, taxAmount: bd.tax, taxPct: bd.taxPct,
    date: todayISO(), subtotal: total, paidAmount: paid, balance: Math.max(0,total-paid),
    dueDate: due, status, soldByUserId: state.sessionUserId, receiptSent:false, items,
    createdAt: new Date().toISOString()
  };
  state.sales.push(sale);
  logAudit('sale_created', `Sale ${fmtMoney(total)} (${status})`);
  cart=[]; saleCustomerId=null; saleMode='cash'; saleWalkInName=''; saleWalkInPhone=''; saleNote=''; saleDiscount=0;
  closeSheet();
  render(); // clears the completed sale off the New Sale screen so its button can't be tapped again
  toast('Sale saved ✅');
  openReceiptSheet(sale.id);
}

// A faint diagonal repeating watermark across the receipt background — a
// classic security-document technique, and embedding the receipt ID in it
// makes an altered/photocopied receipt visibly harder to pass off as clean.
function drawSecurityTint(ctx, W, H, text){
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = '#12213B';
  ctx.font = '700 10.5px Arial,Helvetica,sans-serif';
  ctx.textAlign = 'left';
  const textWidth = ctx.measureText(text).width;
  const stepX = textWidth + 22; // smallest gap that still keeps same-row copies from touching
  const stepY = 24; // tight row spacing so there's no clean blank strip anywhere on the page
  ctx.translate(W/2, H/2);
  ctx.rotate(-Math.PI/7);
  const cols = Math.ceil((W*2)/stepX) + 2;
  const rows = Math.ceil((H*2)/stepY) + 2;
  for(let r=-rows; r<=rows; r++){
    const rowOffset = (r % 2 === 0) ? 0 : stepX/2; // stagger alternate rows so the pattern fills in, brick-style
    for(let c=-cols; c<=cols; c++){
      ctx.fillText(text, c*stepX + rowOffset, r*stepY);
    }
  }
  ctx.restore();
}
function drawDashedLine(ctx,x1,y1,x2,y2){
  ctx.save(); ctx.strokeStyle='#E4E0D6'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
// Same canvas ₦-glyph rendering issue as receipts can also hit free-typed text
// (settlement terms, notes) if someone types the symbol themselves — so any text
// drawn on a canvas document should pass through this first.
function canvasSafeText(s){ return String(s||'').replace(/₦/g, 'NGN '); }
function wrapPlainText(text, maxChars){
  const words = text.split(' ');
  let lines = [], line = '';
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(test.length > maxChars && line){ lines.push(line); line = w; } else { line = test; }
  });
  if(line) lines.push(line);
  return lines;
}
// Draws the receipt (or just measures it, when ctx is null) using one shared layout
// pass. This guarantees the canvas is always exactly tall enough — no separate height
// formula to keep in sync, which is what caused content to be clipped before.
function layoutAndDrawReceipt(s, shop, cust, seller, ctx, logoImg){
  const W = 380, PAD = 22, LINE_H = 22, SN_W = 22;
  const noteLines = s.note ? wrapPlainText(canvasSafeText(s.note), 50) : [];
  const itemNoteLines = s.items.map(it => it.note ? wrapPlainText(canvasSafeText(it.note), 46) : []);
  let y = 30;
  const T = (text, x, align, font, color) => {
    if(!ctx) return;
    ctx.textAlign = align;
    if(font) ctx.font = font;
    if(color) ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  };
  const L = (x1,y1,x2,y2) => { if(ctx) drawDashedLine(ctx,x1,y1,x2,y2); };

  if(logoImg){
    const logoSize = 50;
    if(ctx) ctx.drawImage(logoImg, PAD, y-20, logoSize, logoSize);
  }
  T(shop.name, W/2, 'center', '800 17px Arial,Helvetica,sans-serif', '#12213B'); y += 18;
  if(business().businessType){
    T(business().businessType.toUpperCase(), W/2, 'center', '700 10.5px Arial,Helvetica,sans-serif', '#F2A93B'); y += 15;
  }
  T(shop.address, W/2, 'center', '400 11px Arial,Helvetica,sans-serif', '#6B7280');
  if(shop.address) y += 14;
  if(shop.phone || shop.email){ T([shop.phone,shop.email].filter(Boolean).join('  ·  '), W/2, 'center'); y += 14; }
  if(business().registrationNumber){ T('Reg. No: '+business().registrationNumber, W/2, 'center', '400 10px Arial,Helvetica,sans-serif', '#9AA0AB'); y += 13; }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T('Receipt #'+s.id.slice(-6).toUpperCase(), PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#242B38');
  T(fmtDate(s.date), W-PAD, 'right', '400 12px Arial,Helvetica,sans-serif'); y += 17;
  T('Sold by: '+seller.firstName+' '+seller.lastName, PAD, 'left', '400 12px Arial,Helvetica,sans-serif', '#6B7280'); y += 16;
  T('Txn ID: '+s.id, PAD, 'left', '400 9px Arial,Helvetica,sans-serif', '#B0B5BD'); y += 13;
  T('Buyer: '+(cust ? cust.fullName : (s.walkInName || 'Walk-in customer')), PAD, 'left', '700 12.5px Arial,Helvetica,sans-serif', '#12213B');
  const buyerPhone = cust ? cust.phoneE164 : s.walkInPhone;
  if(buyerPhone){ y += 15; T(buyerPhone, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280'); }
  y += 14;
  L(PAD, y, W-PAD, y); y += 18;

  s.items.forEach((it,idx)=>{
    const g = state.goods.find(x=>x.id===it.goodId);
    const itemLabel = it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name;
    T(`${itemLabel} × ${it.qty}`, PAD, 'left', '400 12.5px Arial,Helvetica,sans-serif', '#242B38');
    T(fmtMoneyCanvas(it.priceUsed*it.qty), W-PAD, 'right');
    y += LINE_H;
    if(itemNoteLines[idx].length){
      itemNoteLines[idx].forEach(line=>{ T(line, PAD, 'left', 'italic 400 10.5px Arial,Helvetica,sans-serif', '#8A8F99'); y += 13; });
    }
  });
  L(PAD, y, W-PAD, y); y += 22;

  if(noteLines.length){
    noteLines.forEach(line=>{ T(line, PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#242B38'); y += 15; });
    y += 6;
    L(PAD, y, W-PAD, y); y += 20;
  }

  const hasBreakdown = (s.discount>0) || (s.taxAmount>0);
  if(hasBreakdown){
    T('Subtotal', PAD, 'left', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
    T(fmtMoneyCanvas(s.itemsSubtotal!=null?s.itemsSubtotal:s.subtotal), W-PAD, 'right'); y += 15;
    if(s.discount>0){
      T('Discount', PAD, 'left'); T('-'+fmtMoneyCanvas(s.discount), W-PAD, 'right'); y += 15;
    }
    if(s.taxAmount>0){
      T((business().taxName||'Tax')+' ('+s.taxPct+'%)', PAD, 'left'); T(fmtMoneyCanvas(s.taxAmount), W-PAD, 'right'); y += 15;
    }
    y += 4;
  }
  T('TOTAL', PAD, 'left', '800 15px Arial,Helvetica,sans-serif', '#12213B');
  T(fmtMoneyCanvas(s.subtotal), W-PAD, 'right'); y += 20;

  if(s.status!=='paid'){
    T('PAID', PAD, 'left', '700 12px Arial,Helvetica,sans-serif', '#2E7D32');
    T(fmtMoneyCanvas(s.paidAmount), W-PAD, 'right'); y += 18;
    T('BALANCE DUE '+fmtDate(s.dueDate), PAD, 'left', '800 12.5px Arial,Helvetica,sans-serif', '#C0392B');
    T(fmtMoneyCanvas(s.balance), W-PAD, 'right'); y += 18;
  }
  y += 8;
  L(PAD, y, W-PAD, y); y += 20;

  T(shop.receiptFooter||'Thank you for your business!', W/2, 'center', '400 11.5px Arial,Helvetica,sans-serif', '#6B7280');
  y += 16;
  const terms = shop.receiptTerms!=null ? shop.receiptTerms : 'Goods sold in good condition. No refund after payment.';
  if(terms){
    wrapPlainText(canvasSafeText(terms), 56).forEach(line=>{
      T(line, W/2, 'center', 'italic 400 9.5px Arial,Helvetica,sans-serif', '#9AA0AB'); y += 12;
    });
  }
  y += 12; // bottom padding
  return y; // total height needed
}
async function drawReceiptToCanvas(canvas, s, shop, cust, seller){
  const logoImg = await getLogoImage();
  const W = 380, scale = 2;
  const h = layoutAndDrawReceipt(s, shop, cust, seller, null, logoImg); // measure pass — no drawing yet
  canvas.width = W*scale; canvas.height = h*scale;
  canvas.style.width = W+'px'; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle = '#FFF7EA'; ctx.fillRect(0,0,W,h);
  drawSecurityTint(ctx, W, h, shop.name.toUpperCase());
  layoutAndDrawReceipt(s, shop, cust, seller, ctx, logoImg); // real draw pass, now sized correctly
}
function receiptText(s,shop,cust){
  let t = `${shop.name}${business().businessType?' ('+business().businessType+')':''}\n${shop.address?shop.address+'\n':''}${business().registrationNumber?'Reg. No: '+business().registrationNumber+'\n':''}Receipt #${s.id.slice(-6).toUpperCase()} — ${fmtDate(s.date)}\nTxn ID: ${s.id}\nBuyer: ${cust?cust.fullName:(s.walkInName||'Walk-in customer')}\n`;
  s.items.forEach((it,idx)=>{ const g=state.goods.find(x=>x.id===it.goodId); const itemLabel = it.variantLabel ? `${g.name} (${it.variantLabel})` : g.name; t+=`${idx+1}. ${itemLabel} x${it.qty} — ${fmtMoney(it.priceUsed*it.qty)}\n`; if(it.note) t+=`   (${it.note})\n`; });
  if(s.note) t += `${s.note}\n`;
  if((s.discount>0) || (s.taxAmount>0)){
    t += `Subtotal: ${fmtMoney(s.itemsSubtotal!=null?s.itemsSubtotal:s.subtotal)}\n`;
    if(s.discount>0) t += `Discount: -${fmtMoney(s.discount)}\n`;
    if(s.taxAmount>0) t += `${business().taxName||'Tax'} (${s.taxPct}%): ${fmtMoney(s.taxAmount)}\n`;
  }
  t += `Total: ${fmtMoney(s.subtotal)}\n`;
  if(s.status!=='paid') t += `Paid: ${fmtMoney(s.paidAmount)} | Balance: ${fmtMoney(s.balance)} due ${fmtDate(s.dueDate)}\n`;
  const terms = shop.receiptTerms!=null ? shop.receiptTerms : 'Goods sold in good condition. No refund after payment.';
  if(terms) t += `${terms}\n`;
  t += `- ${shop.name}`;
  return t;
}

      ${rows.valid.slice(0,8).map(r=>`<div class="t2">• ${r.name} — ${fmtMoney(r.price)} × ${r.qty}</div>`).join('')}
      ${rows.valid.length>8?`<div class="t2">...and ${rows.valid.length-8} more</div>`:''}
      ${rows.errors.length?`<p class="subtle" style="margin-top:8px;color:var(--red);">Skipped: ${rows.errors.join('; ')}</p>`:''}
      <button class="btn btn-primary" id="bulk-confirm-btn" style="margin-top:14px;">Add ${rows.valid.length} Item(s)</button>
    `;
    document.getElementById('bulk-confirm-btn').addEventListener('click', ()=>{
      rows.valid.forEach(r=>{
        state.goods.push({
          id: uid('good'), shopId: state.currentShopId, name:r.name, basePrice:r.price, costPrice:r.cost,
          emoji:'🛍️', groupPrices:[], barcode:null, reorderLevel:5,
          batches:[{id:uid('batch'), qtyRemaining:r.qty, expiryDate:r.expiry||'2099-12-31', costPrice:r.cost,
            batchNo:'B'+Math.floor(Math.random()*9000+1000), auctionActive:false, auctionPrice:null, auctionDiscount:null}]
        });
      });
      logAudit('bulk_goods_added', `Bulk-added ${rows.valid.length} items via CSV`);
      toast(`${rows.valid.length} item(s) added ✅`); closeSheet(); render();
    });
  });
}
function parseBulkCSV(raw){
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const valid = []; const errors = [];
  lines.forEach((line,i)=>{
    const parts = line.split(',').map(p=>p.trim());
    const [name, priceStr, costStr, qtyStr, expiry] = parts;
    const price = Number(priceStr), cost = Number(costStr||0), qty = Number(qtyStr);
    if(!name || !priceStr || !qtyStr || isNaN(price) || isNaN(qty) || price<=0 || qty<=0){
      errors.push(`line ${i+1}`); return;
    }
    valid.push({ name, price, cost: isNaN(cost)?0:cost, qty, expiry: expiry && /^\d{4}-\d{2}-\d{2}$/.test(expiry) ? expiry : null });
  });
  return { valid, errors };
}

function saveNewGood(profile){
  const name = document.getElementById('ag-name').value.trim();
  const price = Number(document.getElementById('ag-price').value||0);
  const cost = Number(document.getElementById('ag-cost').value||0);
  const barcode = document.getElementById('ag-barcode')?.value.trim() || null;
  const reorderLevel = Number(document.getElementById('ag-reorder')?.value||5);
  const emoji = document.getElementById('ag-emoji').value;
  if(!name || price<=0){ toast('Please fill in name and selling price.'); return; }
  if(barcode && state.goods.some(x=>x.shopId===state.currentShopId && x.barcode===barcode)){ toast('That barcode is already used by another item.'); return; }

  if(profile==='variants'){
    syncPendingVariantsFromDOM();
    const validVariants = pendingVariants.filter(v=>v.size||v.color).map(v=>({
      id: uid('var'), size:v.size, color:v.color, qty: Math.max(0, v.qty),

    }));

      emoji, groupPrices:[], barcode, reorderLevel, hasVariants:true, variants: validVariants, batches:[] };
    state.goods.push(g);

    closeSheet(); toast('Item added ✅'); render(); return;
  }

  const qty = Number(document.getElementById('ag-qty')?.value||0);

  const expiry = document.getElementById('ag-expiry')?.value || '2099-12-31';
  const batch = document.getElementById('ag-batch')?.value || ('B'+Math.floor(Math.random()*9000+1000));
  const g = { id: uid('good'), shopId: state.currentShopId, name, basePrice:price, costPrice:cost,
    emoji, groupPrices:[], barcode, reorderLevel, hasVariants:false,
    batches:[{id:uid('batch'), qtyRemaining:qty, expiryDate:expiry, costPrice:cost, batchNo:batch, auctionActive:false, auctionPrice:null, auctionDiscount:null}] };
  if(profile==='specs'){
    g.spec = document.getElementById('ag-spec').value.trim();
    g.specLabel = findBizTypeMapping(SPEC_LABELS) || 'Specification';

    g.dimension = { value: document.getElementById('ag-dim-value').value.trim(), unit: document.getElementById('ag-dim-unit').value };
  }

  logAudit('good_added', 'Added '+qty+' x '+name);

      const d = daysBetween(todayISO(), b.expiryDate);
      const expired = d<0;
      return `<div class="list-row">
        <div class="thumb">${expired?'🚫':d<=7?'⚠️':'📦'}</div>
        <div class="info">
          <div class="t1">${b.batchNo} · ${b.qtyRemaining} left</div>
          <div class="t2">${expired?'EXPIRED':'Expires '+fmtDate(b.expiryDate)+' ('+d+'d)'} ${b.auctionActive?' · Auction -'+b.auctionDiscount+'%':''}</div>
        </div>
        ${(isMaster() && !expired && d<=7 && b.qtyRemaining>0) ? `<button class="btn btn-sm ${b.auctionActive?'btn-outline':'btn-dark'}" data-toggle-auction="${b.id}">${b.auctionActive?'Stop Auction':'Start 30% Auction'}</button>` : ''}
        ${expired ? `<span class="pill pill-red">DO NOT SELL</span>` : ''}
      </div>`;
    }).join('')}
    `}
  `);
  const savePrice = document.getElementById('save-price');
  if(savePrice) savePrice.addEventListener('click', ()=>{
    g.basePrice = Number(document.getElementById('edit-price').value||g.basePrice);
    g.costPrice = Number(document.getElementById('edit-cost').value||g.costPrice);
    logAudit('price_edit', g.name+' price set to '+fmtMoney(g.basePrice));
    toast('Saved ✅'); closeSheet(); render();
  });
  const tryEdit = document.getElementById('try-edit-price');
  if(tryEdit) tryEdit.addEventListener('click', ()=>{
    logAudit('locked_price_attempt', u.firstName+' tried to edit price of '+g.name);
    document.getElementById('lock-msg').innerHTML = `<div class="locked-msg">🔒 Price locked. Only your Owner can change prices. This attempt was logged.</div>`;
  });
  document.querySelectorAll('[data-toggle-auction]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const b = g.batches.find(x=>x.id===btn.dataset.toggleAuction);
      b.auctionActive = !b.auctionActive;
      if(b.auctionActive){ b.auctionDiscount = currentShop().auctionDiscountDefault||30; b.auctionPrice = Math.round(g.basePrice*(1-b.auctionDiscount/100)); }
      logAudit('auction_toggled', (b.auctionActive?'Started':'Stopped')+' auction on '+g.name+' batch '+b.batchNo);
      openGoodDetail(gid);
    });
  });
  document.querySelectorAll('[data-add-variant-stock]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = g.variants.find(x=>x.id===btn.dataset.addVariantStock);
      const add = Number(prompt(`Add how many units to "${v.label}"?`, '0')||0);

      toast('Stock added ✅'); openGoodDetail(gid);

  });
  const addVariantBtn = document.getElementById('add-new-variant-btn');
  if(addVariantBtn) addVariantBtn.addEventListener('click', ()=>{
    const size = prompt('Size (e.g. Large):','') || '';
    const color = prompt('Color (optional):','') || '';

    const qty = Number(prompt('Starting quantity:','0')||0);
    g.variants.push({ id: uid('var'), size, color, qty: Math.max(0,qty), label: [size,color].filter(Boolean).join(' / ') });

    toast('Variant added ✅'); openGoodDetail(gid);

function saveCustomerFromForm(existingId){
  const fullName = document.getElementById('ac-name').value.trim();
  if(!fullName){ toast('Name is required.'); return; }
  const country = document.getElementById('ac-country').value;
  const phoneRaw = document.getElementById('ac-phone').value.trim();
  const waRaw = document.getElementById('ac-wa').value.trim();
  const data = {
    groupId: document.getElementById('ac-group').value,
    fullName, country,
    phoneE164: phoneRaw ? '+'+toIntlDigits(phoneRaw, country) : '',
    whatsappNumber: waRaw ? '+'+toIntlDigits(waRaw, country) : '',
    email: document.getElementById('ac-email').value.trim(),
    notes: document.getElementById('ac-notes').value.trim(),
    consentGiven: document.getElementById('ac-consent').checked
  };
  if(existingId){
    const c = state.customers.find(x=>x.id===existingId);
    Object.assign(c, data);
    logAudit('customer_edited', 'Edited customer '+fullName);

function bindCreditEvents(){

    const s = state.sales.find(x=>x.id===a.dataset.remind);
    state.communicationLog.unshift({id:uid('log'),businessId:business().id,customerId:s.customerId,userId:state.sessionUserId,type:'reminder',timestamp:new Date().toISOString()});

let reportsRange = '7d'; // today | 7d | 30d | month
function getRangeDates(range){
  const today = new Date();
  let start;
  if(range==='today') start = new Date(today);
  else if(range==='30d'){ start = new Date(today); start.setDate(start.getDate()-29); }
  else if(range==='month') start = new Date(today.getFullYear(), today.getMonth(), 1);
  else { start = new Date(today); start.setDate(start.getDate()-6); } // 7d default
  const days = [];
  let d = new Date(start);
  while(d<=today){ days.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return days;
}
function screenReports(){
  const shopSales = state.sales.filter(s=>s.shopId===state.currentShopId && s.status!=='voided');
  const days = getRangeDates(reportsRange);
  const rangeSales = shopSales.filter(s=>days.includes(s.date));
  const rangeExpenses = state.expenses.filter(e=>e.shopId===state.currentShopId && days.includes(e.date));
  const totalExpenses = rangeExpenses.reduce((a,e)=>a+e.amount,0);

  const rows = days.map(day=>{
    const daySales = shopSales.filter(s=>s.date===day);
    const rev = daySales.reduce((a,s)=>a+s.subtotal,0);
    const cogs = daySales.reduce((a,s)=>a+s.items.reduce((b,it)=>{const g=state.goods.find(x=>x.id===it.goodId);return b+(g?g.costPrice:0)*netQty(it);},0),0);
    return {day, rev, profit: rev-cogs};
  });
  const totalRev = rows.reduce((a,r)=>a+r.rev,0);
  const grossProfit = rows.reduce((a,r)=>a+r.profit,0);
  const netProfit = grossProfit - totalExpenses;
  const maxVal = Math.max(1,...rows.map(r=>r.rev));

  const staffPerf = {};
  rangeSales.forEach(s=>{
    const key = s.soldByUserId;
    staffPerf[key] = staffPerf[key] || {total:0, count:0};
    staffPerf[key].total += s.subtotal;
    staffPerf[key].count++;
  });
  const staffRows = Object.entries(staffPerf).map(([uid,d])=>{
    const u = state.users.find(x=>x.id===uid);
    return { name: u ? u.firstName+' '+u.lastName : 'Unknown', ...d };
  }).sort((a,b)=>b.total-a.total);

  const rangeLabels = {today:'Today', '7d':'7 Days', '30d':'30 Days', month:'This Month'};
  return `
    ${subHeader("Profit Reports")}
    <div style="display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;">
      ${Object.keys(rangeLabels).map(r=>`<button class="btn btn-sm ${reportsRange===r?'btn-dark':'btn-outline'}" data-rrange="${r}">${rangeLabels[r]}</button>`).join('')}
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="lbl">${rangeLabels[reportsRange]} Revenue</div><div class="val">${fmtMoney(totalRev)}</div></div>
      <div class="stat-box accent"><div class="lbl">Net Profit</div><div class="val">${fmtMoney(netProfit)}</div></div>
    </div>
    ${totalExpenses>0?`<p class="subtle" style="margin-bottom:14px;">Gross profit ${fmtMoney(grossProfit)} minus ${fmtMoney(totalExpenses)} in expenses this period. <span data-goto="expenses" style="color:var(--marigold-dark);font-weight:700;text-decoration:underline;">View expenses</span></p>`:''}
    <div class="card">
      <div style="display:flex;align-items:flex-end;gap:${rows.length>14?'2px':'8px'};height:130px;overflow-x:${rows.length>20?'auto':'visible'};">
        ${rows.map(r=>`
          <div style="flex:${rows.length>20?'0 0 10px':'1'};display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;background:var(--paper-dim);border-radius:6px 6px 0 0;height:${Math.max(4,r.rev/maxVal*100)}px;position:relative;">
              <div style="position:absolute;bottom:0;left:0;right:0;background:var(--marigold);border-radius:6px 6px 0 0;height:${r.rev? (r.profit/r.rev*100) : 0}%;"></div>
            </div>
            ${rows.length<=14?`<div style="font-size:9.5px;color:var(--text-dim);">${new Date(r.day).toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)}</div>`:''}
          </div>`).join('')}
      </div>
      <div class="subtle" style="margin-top:8px;font-size:11px;">Bar = revenue · Marigold fill = gross profit share</div>
    </div>
    <div class="section-head"><h3>Top Items</h3></div>
    ${topItems(rangeSales).map(t=>`
      <div class="list-row"><div class="thumb">${t.emoji}</div>
        <div class="info"><div class="t1">${t.name}</div><div class="t2">${t.qty} sold</div></div>
        <div class="right"><b>${fmtMoney(t.rev)}</b></div>
      </div>`).join('') || '<p class="subtle">No sales in this period.</p>'}
    ${staffRows.length>1 || (staffRows.length===1) ? `
    <div class="section-head"><h3>Staff Performance</h3></div>
    ${staffRows.map(sr=>`
      <div class="list-row"><div class="thumb">👤</div>
        <div class="info"><div class="t1">${sr.name}</div><div class="t2">${sr.count} sale(s)</div></div>
        <div class="right"><b>${fmtMoney(sr.total)}</b></div>
      </div>`).join('')}` : ''}
  `;
}
function bindReportsEvents(){
  document.querySelectorAll('[data-rrange]').forEach(b=>b.addEventListener('click', ()=>{ reportsRange=b.dataset.rrange; refreshMain(); }));

function topItems(sales){
  const map = {};
  sales.forEach(s=>s.items.forEach(it=>{
    const g = state.goods.find(x=>x.id===it.goodId); if(!g) return;
    map[g.id] = map[g.id] || {name:g.name, emoji:g.emoji||'🛍️', qty:0, rev:0};
    map[g.id].qty += it.qty; map[g.id].rev += it.qty*it.priceUsed;
  }));
  return Object.values(map).sort((a,b)=>b.rev-a.rev).slice(0,5);
}

/* ============================================================
   EMPLOYMENT RECORDS — resumption date, salary, and (for
   apprentices/"nwa boi") a settlement/freedom date. Owner-only
   to create or edit. Editing never deletes anything: the
   original record and every prior version stay visible forever
   in the history log, so staff can trust their record can't be
   quietly rewritten. Salary payments are permanent once logged
   and automatically added to Expenses.
   ============================================================ */
const EMPLOYMENT_TYPES = [
  {id:'staff', label:'Salaried Staff'},
  {id:'apprentice', label:'Apprentice (Nwa Boi)'}
];
// Looks up a person by id whether they're a real app user or a record-only
// person (someone with no app access, tracked purely for employment records).
function personById(id){
  return state.users.find(x=>x.id===id) || state.recordOnlyStaff.find(x=>x.id===id);
}
function employmentRecordFor(userId){ return state.employmentRecords.find(r=>r.userId===userId); }
function salaryPaymentsFor(userId){ return state.salaryPayments.filter(p=>p.userId===userId).sort((a,b)=>new Date(b.date)-new Date(a.date)); }

function openEmploymentRecordModal(userId){
  const target = personById(userId);
  if(!target || !canManageThisUser(target)){ toast("You don't have permission to manage this account."); return; }
  const rec = employmentRecordFor(userId);
  if(!rec) openEmploymentSetupForm(userId);
  else renderEmploymentRecordView(userId);
}

function openEmploymentSetupForm(userId){
  const u = personById(userId);
  if(!u || !canManageThisUser(u)){ toast("You don't have permission to manage this account."); return; }
  openSheet(`
    <div class="sheet-head"><h3>Set Up Employment Record</h3><button class="close-x" id="sheet-close">✕</button></div>
    <p class="subtle" style="margin-bottom:14px;">For ${u.firstName} ${u.lastName}. Once saved, this record can be edited later, but never deleted — the original stays visible forever.</p>
    <div class="field"><label>Employment Type</label>
      <select id="er-type">${EMPLOYMENT_TYPES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Date of Resumption</label><input id="er-resume" type="date"></div>
    <div class="row2">
      <div class="field"><label>Salary Amount <span class="subtle">(0 if none)</span></label><input id="er-salary" type="number" min="0" value="0"></div>
      <div class="field"><label>Frequency</label>
        <select id="er-freq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="none">No fixed salary</option></select>
      </div>
    </div>
    <div class="field"><label>Settlement / Freedom Date <span class="subtle">(optional — mainly for apprentices)</span></label><input id="er-settle-date" type="date"></div>
    <div class="field"><label>Settlement Terms <span class="subtle">(optional — what they'll receive)</span></label><textarea id="er-settle-terms" rows="2" placeholder="e.g. ₦500,000 capital + a set of tools"></textarea></div>
    <div class="field"><label>Notes</label><textarea id="er-notes" rows="2"></textarea></div>
    <button class="btn btn-primary" id="save-er-btn">Save Record</button>
  `);
  document.getElementById('save-er-btn').addEventListener('click', ()=>{
    const resume = document.getElementById('er-resume').value;
    if(!resume){ toast('Date of resumption is required.'); return; }
    const fields = {
      employmentType: document.getElementById('er-type').value,
      resumptionDate: resume,
      salaryAmount: Number(document.getElementById('er-salary').value||0),
      salaryFrequency: document.getElementById('er-freq').value,
      settlementDate: document.getElementById('er-settle-date').value || null,
      settlementTerms: document.getElementById('er-settle-terms').value.trim(),
      notes: document.getElementById('er-notes').value.trim()
    };
    const now = new Date().toISOString();
    state.employmentRecords.push({
      id: uid('emp'), userId, businessId: business().id,
      ...fields,
      original: { ...fields, createdAt: now, createdBy: state.sessionUserId },
      history: []
    });
    logAudit('employment_record_created', `Created employment record for ${u.firstName} ${u.lastName}`);
    toast('Employment record saved ✅'); closeSheet(); renderEmploymentRecordView(userId);
  });
}

/* ============================================================
